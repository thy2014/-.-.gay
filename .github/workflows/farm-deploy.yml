name: farm-deploy
on:
  push:
    paths:
      - '.github/workflows/farm-deploy.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download zip
        run: |
          curl -sL --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 15 -o /tmp/x.zip "https://aka.doubaocdn.com/s/oGtVzTZgXx"
      - name: Verify zip hash
        run: |
          echo "5c02e086da7ffbd44b38ad1cd4422f170a02af66250fe4b9057b661cf6b37f63  /tmp/x.zip" | sha256sum -c
      - name: Unzip into workspace
        run: |
          unzip -oq /tmp/x.zip -d "$GITHUB_WORKSPACE"
      - name: Verify file hashes
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "e523f6be8c69f15a6722ded6494d6eea3632c34d1ac78ef25a91cf15326bd94d  games/farm-story.html" | sha256sum -c
          echo "ce44fc79c4ead38b6f32164c33729a30cb5429fec4530b21e97c06328728ba25  games/games.json" | sha256sum -c
          echo "5db05b362de95640f2b7a014caa8e8c695c94429873ccd0470b6b6849a4f7b9e  index.html" | sha256sum -c
      - name: Commit and push
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "mobfit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feat: add farm story game and fix sleep"
            git push origin HEAD:main
          fi
