name: sync-mcbonk
on:
  push:
    paths:
      - '.github/workflows/sync-mcbonk.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          curl -sL -o /tmp/mcbonk.html https://aka.doubaocdn.com/s/2eCQZEBz5d
          echo "dbd538759cbefac39f93ec3c2590f6dc98d6ec8ca26b3b50e2abafa69928ea07  /tmp/mcbonk.html" | sha256sum -c
          cp /tmp/mcbonk.html games/mcbonk.html
          git config user.name "thy2014"
          git config user.email "1925690533@qq.com"
          git add games/mcbonk.html
          git commit -m "feat: 上线 MCBonk 复刻版" || echo "no change"
          git push
