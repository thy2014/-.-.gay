name: sync-terraria-phys
on:
  push:
    paths:
      - ".github/workflows/sync-terraria-phys.yml"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch-and-verify
        run: |
          curl -sL -o /tmp/t.html "https://aka.doubaocdn.com/s/VSIPaD4yPK"
          echo "692d784826acbbbd201ee01e8ac0304807761da74fa7b04feb048d1f79288a16  /tmp/t.html" | sha256sum -c -
          cp /tmp/t.html games/terraria.html
          git config user.name thy2014
          git config user.email 1925690533@qq.com
          git add games/terraria.html
          git commit -m "fix: 玩家物理分步吸附消除抽动、天空露天判定、受伤反馈"
          git push
