name: sync-eto
on:
  push:
    paths:
      - '.github/workflows/sync-eto.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify bundle
        run: |
          set -euo pipefail
          curl -sL "https://aka.doubaocdn.com/s/fW9ed1TlTh" -o /tmp/eto.zip
          echo "71df9710de43d292f1201abbe4c4b45343e1fdfc81a9e6ea95995ef0726a4a4a  /tmp/eto.zip" | sha256sum -c -
          unzip -oq /tmp/eto.zip -d "${{ github.workspace }}"
      - name: Commit files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html games/games.json games/earth-three-body
          git diff --cached --quiet || git commit -m "feat: 接入 ETO 地球三体运动（原样移植）"
          git push
