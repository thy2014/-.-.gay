name: sync-terraria
on:
  push:
    paths:
      - .github/workflows/sync-terraria.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pull-and-commit
        run: |
          curl -fsSL -o /tmp/f "https://aka.doubaocdn.com/s/VkxyrBOQ7w"
          echo "25a23acca0a260f88c368ba4ea25932ef7d1f59f4fb8af7ddb25d5f216e8c187  /tmp/f" | sha256sum -c -
          cp /tmp/f games/terraria.html
          git config user.name "thy2014"
          git config user.email "1925690533@qq.com"
          git add games/terraria.html
          git commit -m "add terraria open world" || echo "no change"
          git push
