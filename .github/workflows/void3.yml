name: void-deploy3
on:
  push:
    paths:
      - '.github/workflows/void3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: curl -sL --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 15 -o /tmp/v.zip "https://aka.doubaocdn.com/s/IDnEZv0na7"
      - run: echo "012103efdd22e440e2ca581aa102a4b0f0f46fc14b4b627e3c682079c065dd51  /tmp/v.zip" | sha256sum -c
      - run: unzip -oq /tmp/v.zip -d "$GITHUB_WORKSPACE"
      - run: |
          cd "$GITHUB_WORKSPACE"
          echo "877d09c41a5f3e13043c7d89a44cc95f8104f45811b8e4b35d3aa7024219fd96  games/void-survivors/index.html" | sha256sum -c
      - run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "mobfit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo none || (git commit -m "fix: manual aim drives weapon fire, trail follows nose" && git push origin HEAD:main)
