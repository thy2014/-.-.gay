name: sync-kart2
on:
  push:
    paths:
      - ".github/workflows/sync-kart2.yml"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify
        run: |
          mkdir -p /tmp/sync games
          curl -fsSL "https://aka.doubaocdn.com/s/80zraSWWgi" -o /tmp/sync/kart.html
          echo "e6b69b6fcd8eb8d577a436b705b28c3d38f9ab5b6b11813e5dd368d0aeca4ff1  /tmp/sync/kart.html" > /tmp/sync/SHA256
          sha256sum -c /tmp/sync/SHA256
      - name: Place and commit
        run: |
          cp /tmp/sync/kart.html games/kart.html
          git config user.name "thy2014"
          git config user.email "thy2014@users.noreply.github.com"
          git add games/kart.html
          git diff --cached --quiet || git commit -m "perf: 卡丁车整体提速，AI 同步加快"
          git push
