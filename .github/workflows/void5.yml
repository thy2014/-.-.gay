name: void-deploy5
on:
  push:
    paths:
      - '.github/workflows/void5.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: curl -sL --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 15 -o /tmp/v.zip "https://aka.doubaocdn.com/s/VfgtAgYHsb"
      - run: echo "e7417702329b2f6068a5440ae8bbb51a1d7e4970d4b24a47917b672946b7eb9a  /tmp/v.zip" | sha256sum -c
      - run: unzip -oq /tmp/v.zip -d "$GITHUB_WORKSPACE"
      - run: |
          cd "$GITHUB_WORKSPACE"
          echo "a1bda8fb03970892f25fdcb841648fa325373e94a2ef630622837f2370d3be7a  games/void-survivors/index.html" | sha256sum -c
      - run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "mobfit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo none || (git commit -m "fix: phone rules keyed on mob-touch class, back link to top" && git push origin HEAD:main)
