name: sync-index
on:
  push:
    paths:
      - '.github/workflows/sync-index.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch verify and commit
        run: |
          curl -sL -o /tmp/index.html https://aka.doubaocdn.com/s/V74BCXqclx
          echo "f8c8f97baf14650b0fe285fa6160328b13945dcb69b0098a3b838cf42d1210b2  /tmp/index.html" | sha256sum -c
          cp /tmp/index.html index.html
          git config user.name "thy2014"
          git config user.email "1925690533@qq.com"
          git add index.html
          git commit -m "feat: 校验码改为固定文字加当前时间" || echo "no change"
          git push
