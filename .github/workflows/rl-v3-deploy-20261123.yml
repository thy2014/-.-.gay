name: rl-v3-deploy
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: fetch-and-verify
        run: |
          curl -sL --retry 4 -o /tmp/rl3.zip https://aka.doubaocdn.com/s/f9GeHOiiOS
          echo "00c6a2de38a03119d50a679417bd0ed60041f900baed8f0f4f2d5220345c0b25  /tmp/rl3.zip" | sha256sum -c -
          unzip -oq /tmp/rl3.zip -d "$GITHUB_WORKSPACE"
          echo "1a1224295876662e9488d9f91eb4c48b85a103eedef071b6f486e71b07fee890  index.html" | sha256sum -c -
          echo "bbf8091f17b3a436dbe2fdab84e0600a586be513611bb68e4f97bd8d7a6146c2  games/roguelike.html" | sha256sum -c -
          echo "2ac38f117e37bf64ff6b25844d8884f2dd32faee8419b7d5856cd455a30e0df8  games/games.json" | sha256sum -c -
      - name: commit
        run: |
          git config user.name mobfit-bot
          git config user.email bot@users.noreply.github.com
          git add index.html games/roguelike.html games/games.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "fix: 游戏库卡片改用 萤原潮生 新名与新描述"
          git push origin HEAD:main
