name: rl3b-deploy
on:
  push:
    paths:
      - '.github/workflows/rl3b-deploy.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download zip
        run: |
          curl -sL --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 15 -o /tmp/x.zip "https://aka.doubaocdn.com/s/yqKwGlcHwz"
      - name: Verify zip hash
        run: |
          echo "7c5451382df62c2d2de7a0188cc6bccce6c765ae209dee571b1f818ab9121fce  /tmp/x.zip" | sha256sum -c
      - name: Unzip into workspace
        run: |
          unzip -oq /tmp/x.zip -d "$GITHUB_WORKSPACE"
      - name: Verify file hashes
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "7dd2f6fad718f634c1535dfe5d5c6ae628a7d21caf2b3d62db328b5aee46837c  games/roguelike.html" | sha256sum -c
          echo "cbe8cec285e0e9651340bd48ff50e1c0a6b263241cf5a844128684ff91451eb7  games/games.json" | sha256sum -c
          echo "ae6c20f343e1990a72cca2428e08a868a13eeabaa3b79fc7f087f136c35a5905  index.html" | sha256sum -c
      - name: Commit and push
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "mobfit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fix: persist character selection on continue"
            git push origin HEAD:main
          fi
