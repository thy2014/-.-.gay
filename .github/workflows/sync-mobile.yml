name: sync-mobile-build
on:
  push:
    paths:
      - '.github/workflows/sync-mobile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact build
        run: |
          curl -fsSL -o /tmp/roguelike.html "https://aka.doubaocdn.com/s/Z90jLP5ly0"
          echo "e944386da96071a0814b701d9c6e76dca7306540395b22b10574e26c0f188bb5  /tmp/roguelike.html" | sha256sum -c -
          cp /tmp/roguelike.html games/roguelike.html
      - name: Commit
        run: |
          git config user.name "mobile-sync"
          git config user.email "actions@users.noreply.github.com"
          git add games/roguelike.html
          git commit -m "roguelike: restore complete mobile build" || echo "no change"
          git push
