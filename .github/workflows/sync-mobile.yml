name: sync-mobile-build
on:
  push:
    paths:
      - '.github/workflows/sync-mobile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact build
        run: |
          curl -fsSL -o /tmp/roguelike.html "https://aka.doubaocdn.com/s/A9O1oxpFD9"
          echo "7b66c8d5d006e9847be565aa3293ed17d7fab3c866c0ffe7ac18cd00d61e7582  /tmp/roguelike.html" | sha256sum -c -
          cp /tmp/roguelike.html games/roguelike.html
      - name: Commit
        run: |
          git config user.name "mobile-sync"
          git config user.email "actions@users.noreply.github.com"
          git add games/roguelike.html
          git commit -m "roguelike: intro mentions new weapons and domains" || echo "no change"
          git push
