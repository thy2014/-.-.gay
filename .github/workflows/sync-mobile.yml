name: sync-mobile-build
on:
  push:
    paths:
      - '.github/workflows/sync-mobile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact build
        run: |
          curl -fsSL -o /tmp/roguelike.html "https://aka.doubaocdn.com/s/9jdjYnBx8V"
          echo "81508c059ee9268959063be26bb74690e9fe6981b04a5d6007c82feb3d8bab3c  /tmp/roguelike.html" | sha256sum -c -
          cp /tmp/roguelike.html games/roguelike.html
      - name: Commit
        run: |
          git config user.name "mobile-sync"
          git config user.email "actions@users.noreply.github.com"
          git add games/roguelike.html
          git commit -m "roguelike: aim mode setting" || echo "no change"
          git push
