name: sync-mobile-build
on:
  push:
    paths:
      - '.github/workflows/sync-mobile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact build
        run: |
          curl -fsSL -o /tmp/roguelike.html "https://aka.doubaocdn.com/s/za7Hcf5UBy"
          echo "b9dc44b0514d201c40ea6921edb7beef3113233a54d186867461d212b2afc39f  /tmp/roguelike.html" | sha256sum -c -
          cp /tmp/roguelike.html games/roguelike.html
      - name: Commit
        run: |
          git config user.name "mobile-sync"
          git config user.email "actions@users.noreply.github.com"
          git add games/roguelike.html
          git commit -m "roguelike: smart target + perf + enemy ttl" || echo "no change"
          git push
