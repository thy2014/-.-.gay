name: sync-mobile-build
on:
  push:
    paths:
      - '.github/workflows/sync-mobile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: |
          curl -fsSL -o /tmp/mc.html "https://aka.doubaocdn.com/s/zmEtMBdUJr"
          curl -fsSL -o /tmp/index.html "https://aka.doubaocdn.com/s/Hi8YVr4ZUF"
          curl -fsSL -o /tmp/games.json "https://aka.doubaocdn.com/s/suatMRFAlM"
          echo "302684467091c93ddca7f4ce7dc299b972ea33a27ba982d42546727694e9010d  /tmp/mc.html" | sha256sum -c -
          echo "3645efe15a75c03de8f3a521fd7f3f5e546f9cf790a91187cb0ff61da215728f  /tmp/index.html" | sha256sum -c -
          echo "3e948789d6a2cd9c6c27df0598eb549471e2d8ee425fdb488ed1dc87cfb7afb1  /tmp/games.json" | sha256sum -c -
          mkdir -p games
          cp /tmp/mc.html games/mc-id-check.html
          cp /tmp/games.json games/games.json
          cp /tmp/index.html index.html
      - name: Commit
        run: |
          git config user.name "mobile-sync"
          git config user.email "actions@users.noreply.github.com"
          git add games/mc-id-check.html games/games.json index.html
          git commit -m "add mc id check game" || echo "no change"
          git push
