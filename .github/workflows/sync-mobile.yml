name: sync-mobile-build
on:
  push:
    paths:
      - '.github/workflows/sync-mobile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact build
        run: |
          curl -fsSL -o /tmp/roguelike.html "https://aka.doubaocdn.com/s/gRMoXBb2Dq"
          echo "be1c458b650a66cf1489259e561d89ac9bf1db6f835355026e046d511ea19b5a  /tmp/roguelike.html" | sha256sum -c -
          cp /tmp/roguelike.html games/roguelike.html
      - name: Commit
        run: |
          git config user.name "mobile-sync"
          git config user.email "actions@users.noreply.github.com"
          git add games/roguelike.html
          git commit -m "roguelike: weapons + intro restored" || echo "no change"
          git push
