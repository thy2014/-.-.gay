name: sync-kart
on:
  push:
    paths:
      - ".github/workflows/sync-kart.yml"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts and verify
        run: |
          mkdir -p /tmp/sync games
          curl -fsSL "https://aka.doubaocdn.com/s/rUTDfx5pFP" -o /tmp/sync/index.html
          curl -fsSL "https://aka.doubaocdn.com/s/TwscXUl7J3" -o /tmp/sync/kart.html
          curl -fsSL "https://aka.doubaocdn.com/s/Ckt1E7w1yj" -o /tmp/sync/games.json
          echo "a48c7966074081f4e329c4d6bcb849205bd7463f9a68006dbe1d402a4014a272  /tmp/sync/index.html" > /tmp/sync/SHA256
          echo "7ce1a9b1218c7607f550ad10ba8cab5c8828cac644edcc3e9be6bbbe5215cf79  /tmp/sync/kart.html" >> /tmp/sync/SHA256
          echo "a65e48e2968c4073920aa9dc2ae4288d67f36d966f360aad4714b0f5ef194508  /tmp/sync/games.json" >> /tmp/sync/SHA256
          sha256sum -c /tmp/sync/SHA256
      - name: Place files
        run: |
          cp /tmp/sync/index.html index.html
          cp /tmp/sync/kart.html games/kart.html
          cp /tmp/sync/games.json games/games.json
      - name: Commit and push
        run: |
          git config user.name "thy2014"
          git config user.email "thy2014@users.noreply.github.com"
          git add index.html games/kart.html games/games.json
          git diff --cached --quiet || git commit -m "feat: 卡丁车选车选图/提速/AI 强化与文案更新"
          git push
