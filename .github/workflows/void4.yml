name: void-deploy4
on:
  push:
    paths:
      - '.github/workflows/void4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: curl -sL --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 15 -o /tmp/v.zip "https://aka.doubaocdn.com/s/WC6VCFBkqX"
      - run: echo "dfa9161699a6da744cc7a2c54144101ae9b5bb89503ea0da7d2ec4f144c39e25  /tmp/v.zip" | sha256sum -c
      - run: unzip -oq /tmp/v.zip -d "$GITHUB_WORKSPACE"
      - run: |
          cd "$GITHUB_WORKSPACE"
          echo "bfc5aa1008eabe8e5c16aebfca3bbbe3f73213eaf7deb16835f3d93ad098bbe8  games/void-survivors/index.html" | sha256sum -c
      - run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "mobfit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo none || (git commit -m "polish: phone layout for menus, buttons, draft cards" && git push origin HEAD:main)
