name: sync-econ
on:
  push:
    paths:
      - ".github/workflows/sync-econ.yml"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts and verify
        run: |
          mkdir -p /tmp/sync games
          curl -fsSL "https://aka.doubaocdn.com/s/6T09gxZSUV" -o /tmp/sync/index.html
          curl -fsSL "https://aka.doubaocdn.com/s/7a8ViPWP1d" -o /tmp/sync/kart.html
          curl -fsSL "https://aka.doubaocdn.com/s/mSzzKkmsSB" -o /tmp/sync/games.json
          echo "b79fd4e7e30e34442f7d6f6bd7e01770aae4ef9c4d6fbd054b0767b63d1b0ae6  /tmp/sync/index.html" > /tmp/sync/SHA256
          echo "3c136e614c331d37dc052b67fe92258034ea179f4579d19635c041d5cf25fc3c  /tmp/sync/kart.html" >> /tmp/sync/SHA256
          echo "d265b0b196d946f4587ee31293a504dfb7fc90472f9fa1bf1bf733f8ae988ce0  /tmp/sync/games.json" >> /tmp/sync/SHA256
          sha256sum -c /tmp/sync/SHA256
      - name: Place files
        run: |
          cp /tmp/sync/index.html index.html
          cp /tmp/sync/kart.html games/kart.html
          cp /tmp/sync/games.json games/games.json
      - name: Commit and push
        run: |
          git config user.name "thy2014"
          git config user.email "thy2014@users.noreply.github.com"
          git add index.html games/kart.html games/games.json
          git diff --cached --quiet || git commit -m "feat: 账号币值/称号/商城系统 + 卡丁赛车游戏"
          git push
