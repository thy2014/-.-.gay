name: sync-port
on:
  push:
    paths:
      - '.github/workflows/sync-port.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify bundle
        run: |
          set -euo pipefail
          curl -sL "https://aka.doubaocdn.com/s/ZvkU8WUtXp" -o /tmp/port.zip
          echo "5afff21ec056af9bd3481c4cd04150612685d31ae1bc2c5476422748124b741c  /tmp/port.zip" | sha256sum -c -
          unzip -oq /tmp/port.zip -d "${{ github.workspace }}"
      - name: Commit files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games/ip-please games/night-survivors games/paper-hero games/void-survivors games/games.json index.html
          git diff --cached --quiet || git commit -m "feat: 搬运 IP 检查站、暗夜/深空幸存者、纸片勇者四款游戏并接入清单"
          git push
