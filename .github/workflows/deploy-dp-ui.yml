name: deploy-dp-ui
on:
  push:
    branches: [main]
    paths: [".github/workflows/deploy-dp-ui.yml"]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify bundle
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 15 "https://aka.doubaocdn.com/s/1EDJt6e3vB" -o /tmp/dp.zip
          echo "f8cb1c18e9fabedbaa5d22bddd589c17a483947ef15d281d02ce9d886350fdc4  /tmp/dp.zip" | sha256sum -c -
          unzip -oq /tmp/dp.zip -d "${{ github.workspace }}"
          echo "ffb5d405852786243c4ca58ce136ac94d1bac51dc600cf565c44a16fd0438347  games/deepspace-pawn.html" | sha256sum -c -
      - name: Commit files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games/deepspace-pawn.html
          git diff --cached --quiet || git commit -m "deploy: refresh deepspace-pawn UI to original-style layout"
          git push
