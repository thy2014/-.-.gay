name: sync-dp
on:
  push:
    paths:
      - '.github/workflows/sync-dp.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify bundle
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 15 "https://aka.doubaocdn.com/s/y2z4rpAXNX" -o /tmp/dp.zip
          echo "12ce0928cd4ac2255a5d629e78f0cbf45ba12a4e26094d379eb72efca3faea2b  /tmp/dp.zip" | sha256sum -c -
          unzip -oq /tmp/dp.zip -d "${{ github.workspace }}"
      - name: Commit files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games/deepspace-pawn.html games/games.json index.html
          git diff --cached --quiet || git commit -m "feat: 深空当铺按原作口径重做并接入清单"
          git push
