name: sync-dp
on:
  push:
    paths:
      - '.github/workflows/sync-dp.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify bundle
        run: |
          set -euo pipefail
          curl -sL "https://aka.doubaocdn.com/s/5TtSpg4gbb" -o /tmp/dp.zip
          echo "7409229d42c7999527f5e2ede27deb786fa1aa6a54ed1acfd70af67cf052792a  /tmp/dp.zip" | sha256sum -c -
          unzip -oq /tmp/dp.zip -d "${{ github.workspace }}"
      - name: Commit files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games/deepspace-pawn.html games/games.json index.html
          git diff --cached --quiet || git commit -m "feat: 新增深空当铺并接入清单"
          git push
