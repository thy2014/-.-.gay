name: sync-kart8
on:
  push:
    paths:
      - '.github/workflows/sync-kart8.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify bundle
        run: |
          set -euo pipefail
          curl -sL "https://aka.doubaocdn.com/s/tmCjFVQ8o6" -o /tmp/kart8.zip
          echo "2f86e3de4964c14e48ed488e4faf395e0cb54394d5e541a5ca91b18e06025343  /tmp/kart8.zip" | sha256sum -c -
          unzip -oq /tmp/kart8.zip -d "${{ github.workspace }}"
      - name: Commit files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html games/games.json games/super-kart-8
          git diff --cached --quiet || git commit -m "feat: 移植超级卡丁车8并优化渲染管线"
          git push
