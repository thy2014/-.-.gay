name: sync-kart3
on:
  push:
    paths:
      - ".github/workflows/sync-kart3.yml"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify
        run: |
          mkdir -p /tmp/sync games
          curl -fsSL "https://aka.doubaocdn.com/s/4G2QVDtyU4" -o /tmp/sync/kart.html
          echo "f4f535eaf96fa8b50bdd53a1043eba4900ad8c30222e3caafc8f92c17caaf7cb  /tmp/sync/kart.html" > /tmp/sync/SHA256
          sha256sum -c /tmp/sync/SHA256
      - name: Place and commit
        run: |
          cp /tmp/sync/kart.html games/kart.html
          git config user.name "thy2014"
          git config user.email "thy2014@users.noreply.github.com"
          git add games/kart.html
          git diff --cached --quiet || git commit -m "perf: 卡丁车再次大幅提速"
          git push
