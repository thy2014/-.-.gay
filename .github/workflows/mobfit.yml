name: mobfit-deploy
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mobfit.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download zip
        run: |
          curl -sL --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 15 -o /tmp/x.zip "https://aka.doubaocdn.com/s/5RyiV4vpnI"
      - name: Verify zip hash
        run: |
          echo "2fcdde57b71990c34d305e3b0533cc4ac1f8eee4e2f0623bdf83e9232480448b  /tmp/x.zip" | sha256sum -c
      - name: Unzip into workspace
        run: |
          unzip -oq /tmp/x.zip -d "$GITHUB_WORKSPACE"
      - name: Verify file hashes
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "a3a474a352d9e91e3148839cdfd39810b182d0067693175ced69454cb6d786e4  games/roguelike.html" | sha256sum -c
          echo "9533b5cf1570f01010f7f67ee2b0759a259a15e74ef810913b3257f5a21d19a4  games/mcbonk.html" | sha256sum -c
          echo "a2d5cc988bce5ec4f9a948596cecbd932a2b0caa292545edb500d4a2accf1845  games/night-survivors/index.html" | sha256sum -c
          echo "c2c44b263536432d26dd2fc33a54efeef2ec17f03092d6d71518809b2bcc4528  games/void-survivors/index.html" | sha256sum -c
      - name: Commit and push
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "mobfit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feat: mobile adaptation for all roguelike games"
            git push origin HEAD:main
          fi
