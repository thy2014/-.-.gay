name: void-deploy
on:
  push:
    paths:
      - '.github/workflows/void.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: curl -sL --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 15 -o /tmp/v.zip "https://aka.doubaocdn.com/s/NUH7oZVXCI"
      - run: echo "dcb2dc17c702ba1e7de680001418d335330006e8b79ad2d8201ad3bae6e902fa  /tmp/v.zip" | sha256sum -c
      - run: unzip -oq /tmp/v.zip -d "$GITHUB_WORKSPACE"
      - run: |
          cd "$GITHUB_WORKSPACE"
          echo "7db2e1dae8d5198ba4b62c118d7fa4995e34e3854c432b5e2b9c1b9b086ae5bd  games/void-survivors/index.html" | sha256sum -c
      - run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "mobfit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo none || (git commit -m "feat: void-survivors floating sticks like roguelike" && git push origin HEAD:main)
