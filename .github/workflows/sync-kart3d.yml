name: sync-kart3d
on:
  push:
    branches: [main]
    paths: [".github/workflows/sync-kart3d.yml"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download and verify
        run: |
          mkdir -p /tmp/sync
          curl -sL "https://aka.doubaocdn.com/s/U06izMxsJ3" -o /tmp/sync/kart.html
          curl -sL "https://aka.doubaocdn.com/s/lnLcIMEMpD" -o /tmp/sync/games.json
          printf "%s  %s\n" "7befc597e8884a7a1aaa8d8a93d22aa6aca9bfa899396b4dc4930a3a4501e210" "/tmp/sync/kart.html" > /tmp/sync/sha.txt
          printf "%s  %s\n" "a9687ff002c5510ce4de14f13ccaf35bf2238ee7ad976dccf159ac5151379081" "/tmp/sync/games.json" >> /tmp/sync/sha.txt
          sha256sum -c /tmp/sync/sha.txt
          cp /tmp/sync/kart.html games/kart.html
          cp /tmp/sync/games.json games/games.json
      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games/kart.html games/games.json
          git commit -m "kart: 3D 程序化赛道重做" || echo "no changes"
          git push
