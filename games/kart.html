<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卡丁赛车 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='32' height='32' rx='7' fill='%230d1412'/%3E%3Ccircle cx='12' cy='12' r='7' fill='%233ddc84'/%3E%3C/svg%3E">
<style>
  :root{--bg:#070b0a;--panel:#0d1412;--line:#1c2a24;--green:#3ddc84;--teal:#2bd4c0;--text:#d7f5e4;--muted:#7f9a8d;--amber:#ffc75f;--danger:#ff5d6c}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  #wrap{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  .hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;z-index:5}
  .hud-card{background:rgba(10,16,13,.82);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.7}
  .hud-card b{color:var(--green)}
  .hud-right{text-align:right}
  .bar{width:120px;height:8px;background:#1c2a24;border-radius:5px;overflow:hidden;margin-top:4px}
  .bar>i{display:block;height:100%;background:var(--teal);border-radius:5px}
  .overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(5,9,8,.78);padding:16px;overflow-y:auto}
  .overlay.hidden{display:none}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 22px;max-width:560px;width:100%}
  .panel h1{font-size:22px;margin-bottom:6px}
  .panel .sub{color:var(--muted);font-size:13px;line-height:1.8;margin-bottom:16px}
  .group-label{font-size:12px;color:var(--muted);margin:14px 0 8px;letter-spacing:.5px}
  .opt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .opt{background:#111a17;border:1px solid var(--line);border-radius:12px;padding:12px 10px;cursor:pointer;text-align:center;min-height:70px}
  .opt.sel{border-color:var(--green);background:rgba(61,220,132,.1)}
  .opt .name{font-size:14px;font-weight:700;margin-bottom:3px}
  .opt .desc{font-size:11px;color:var(--muted);line-height:1.5}
  .panel .rank{font-size:30px;font-weight:800;color:var(--amber);margin:6px 0}
  .panel p.detail{color:var(--muted);font-size:13px;line-height:1.8;margin-bottom:16px}
  .btn{height:44px;padding:0 22px;border:none;border-radius:10px;background:var(--green);color:#06231a;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);margin-left:8px}
  .touch{position:fixed;bottom:18px;left:0;right:0;display:none;justify-content:space-between;padding:0 18px;z-index:6;pointer-events:none}
  .touch .cluster{display:flex;gap:12px;pointer-events:auto}
  .tbtn{width:60px;height:60px;border-radius:14px;background:rgba(10,16,13,.8);border:1px solid var(--line);color:var(--text);font-size:20px;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}
  .tbtn.on{background:rgba(61,220,132,.25);border-color:var(--green)}
  .tbtn.big{width:72px;height:60px}
  @media (pointer:coarse){.touch{display:flex}}
  .count{position:fixed;top:38%;left:50%;transform:translateX(-50%);font-size:64px;font-weight:800;color:var(--green);z-index:7;pointer-events:none}
  @media(max-width:520px){.hud-card{font-size:12px;padding:8px 10px}.bar{width:90px}.opt-grid{gap:8px}}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<div class="hud">
  <div class="hud-card">
    圈数 <b id="hudLap">1/3</b>　名次 <b id="hudRank">1/4</b><br>
    金币 <b id="hudCoin">0</b>　用时 <b id="hudTime">0:00</b>
  </div>
  <div class="hud-card hud-right">
    氮气
    <div class="bar"><i id="nitroBar" style="width:100%"></i></div>
    速度 <b id="hudSpeed">0</b>
  </div>
</div>

<div class="touch">
  <div class="cluster">
    <div class="tbtn" id="tLeft">◀</div>
    <div class="tbtn" id="tRight">▶</div>
  </div>
  <div class="cluster">
    <div class="tbtn big" id="tBoost">🔥</div>
    <div class="tbtn big" id="tGas">▲</div>
  </div>
</div>

<div class="count hidden" id="count"></div>

<div class="overlay" id="startOverlay">
  <div class="panel">
    <h1>卡丁赛车 3D</h1>
    <div class="sub">算法生成的透视赛道，三圈定名次。W/↑ 油门，S/↓ 刹车，A/D 或 ←/→ 转向，空格氮气。吃金币加分，踩青色板回氮气。</div>
    <div class="group-label">选择赛车</div>
    <div class="opt-grid" id="kartGrid"></div>
    <div class="group-label">选择赛道</div>
    <div class="opt-grid" id="trackGrid"></div>
    <div style="margin-top:20px">
      <button class="btn" id="startBtn">开始比赛</button>
      <button class="btn ghost" id="backBtn">返回游戏库</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="finishOverlay">
  <div class="panel">
    <h1>比赛结束</h1>
    <div class="rank" id="finRank">第 1 名</div>
    <p class="detail" id="finDetail"></p>
    <button class="btn" id="againBtn">再来一局</button>
    <button class="btn ghost" id="backBtn2">返回游戏库</button>
  </div>
</div>

<script>
(function(){
var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var VW=0,VH=0,DPR=1;
function resize(){
  DPR=Math.min(1.5,window.devicePixelRatio||1);
  VW=window.innerWidth; VH=window.innerHeight;
  cv.width=VW*DPR; cv.height=VH*DPR;
  cv.style.width=VW+"px"; cv.style.height=VH+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize); resize();

var sessionUser=localStorage.getItem("gstation_session")||"";
var qp=new URLSearchParams(location.search).get("user");
if(qp) sessionUser=qp;
function loadAll(){ try{return JSON.parse(localStorage.getItem("gstation_profiles")||"{}");}catch(e){return{};} }
var allProf=loadAll();
var myProf=sessionUser?allProf[sessionUser]:null;
var hasNitro=!!(myProf&&myProf.perks&&myProf.perks.nitro);
var rainbow=!!(myProf&&myProf.perks&&myProf.skinRainbow);
var petLv=(myProf&&myProf.pet&&myProf.pet.level)?myProf.pet.level:1;
var petSpeedMul=1+0.015*(petLv-1);
var petAccelMul=1+0.012*(petLv-1);
var petNitro=Math.min(100,50+6*(petLv-1));

var KARTS=[
  {name:"疾风号", desc:"均衡稳健", accel:34, maxSp:46, turn:3.2, color:"#3ddc84"},
  {name:"闪电号", desc:"转向灵活", accel:38, maxSp:42, turn:4.2, color:"#2bd4c0"},
  {name:"重装号", desc:"极速更高", accel:30, maxSp:50, turn:2.6, color:"#ffc75f"}
];
var TRACKS=[
  {name:"青绿环线", seed:11, grass:"#15231a", road:"#3d4540", edge:"#2b322e"},
  {name:"荒漠弯道", seed:47, grass:"#231b10", road:"#52483a", edge:"#3a3126"},
  {name:"雪原坡道", seed:83, grass:"#131f28", road:"#43515e", edge:"#2c3844"}
];
var AI_DEF=[
  {name:"红蜂",color:"#ff5d6c",speed:40},
  {name:"蓝隼",color:"#5d9bff",speed:42},
  {name:"紫电",color:"#b07bff",speed:38}
];
var selKart=0, selTrack=0;

var SEG_LEN=22, ROWS=240, HW=9, CAM_H=10, CAM_DEPTH=0.84, DRAW=110;
var SEG=[], PAL={}, LAPS=3;
function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; var t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function buildTrack(seed){
  var rnd=mulberry(seed);
  SEG=[];
  var curve=0, y=0;
  for(var i=0;i<ROWS;i++){
    var t=i/ROWS;
    var targetCurve=Math.sin(t*Math.PI*2*2+seed)*1.5+(rnd()-0.5)*0.7;
    curve+=(targetCurve-curve)*0.06;
    var targetY=Math.sin(t*Math.PI*2*3+seed)*30;
    y+=(targetY-y)*0.05;
    SEG.push({curve:curve,y:y,alt:i%2,coins:[],pads:[],trees:[]});
  }
  for(var c=0;c<18;c++){ var si=Math.floor(rnd()*ROWS); SEG[si].coins.push(rnd()>0.5?20:-20); }
  SEG[Math.floor(ROWS*0.25)].pads.push(0); SEG[Math.floor(ROWS*0.7)].pads.push(0);
  for(var tr=0;tr<70;tr++){ var ti=Math.floor(rnd()*ROWS); SEG[ti].trees.push(rnd()>0.5?HW+12+rnd()*34:-(HW+12+rnd()*34)); }
  buildProfile();
}
function segY(idx){ return SEG[((idx%ROWS)+ROWS)%ROWS].y; }

/* 曲率限速剖面：弯前就收油，反向传播保证来得及刹住 */
var PROF=[];
function buildProfile(){
  PROF=[];
  var base=42, gripK=16, minV=22;
  for(var i=0;i<ROWS;i++){
    var k=Math.abs(SEG[i].curve);
    PROF.push(Math.max(minV, base-k*gripK));
  }
  for(var p=0;p<3;p++){
    for(var j=ROWS-1;j>=0;j--){
      var nx=PROF[(j+1)%ROWS];
      if(PROF[j]>nx+5) PROF[j]=nx+5;
    }
  }
}

var karts=[];
function makeKart(z,x,color,name,isPlayer,ai,veh){
  return {z:z,x:x,speed:0,color:color,name:name,isPlayer:!!isPlayer,veh:veh||null,
    lap:1,finished:false,finishTime:0,nitro:hasNitro&&isPlayer?100:(isPlayer?petNitro:60),coins:0,ai:ai||null,steer:0};
}
function resetRace(){
  buildTrack(TRACKS[selTrack].seed);
  karts=[];
  var v=KARTS[selKart];
  karts.push(makeKart(0,0,v.color,"你",true,null,v));
  AI_DEF.forEach(function(d,k){
    karts.push(makeKart(-2-k*2,-20-k*16,d.color,d.name,false,{base:d.speed,wp:0,corner:0.94+k*0.02,bias:(k-1)*2,stuck:0,rev:0},null));
  });
  state="countdown"; countT=3.0; raceTime=0; particles=[];
}

var keys={};
var KEYMAP={ArrowUp:"up",KeyW:"up",ArrowDown:"down",KeyS:"down",ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right",Space:"boost",ShiftLeft:"boost",ShiftRight:"boost"};
window.addEventListener("keydown",function(e){ var k=KEYMAP[e.code]; if(k){keys[k]=true;e.preventDefault();} });
window.addEventListener("keyup",function(e){ var k=KEYMAP[e.code]; if(k){keys[k]=false;e.preventDefault();} });
function bindTouch(id,key){
  var el=document.getElementById(id);
  var on=function(e){e.preventDefault();keys[key]=true;el.classList.add("on");};
  var off=function(e){e.preventDefault();keys[key]=false;el.classList.remove("on");};
  el.addEventListener("pointerdown",on); el.addEventListener("pointerup",off);
  el.addEventListener("pointerleave",off); el.addEventListener("pointercancel",off);
}
bindTouch("tLeft","left"); bindTouch("tRight","right"); bindTouch("tGas","up"); bindTouch("tBoost","boost");

var state="idle", countT=0, raceTime=0, last=0, particles=[];

function rankOf(k){
  var sorted=karts.slice().sort(function(a,b){ return (b.lap*ROWS+b.z)-(a.lap*ROWS+a.z); });
  return sorted.indexOf(k)+1;
}
function curveAhead(z){
  var s=0;
  for(var i=1;i<9;i++){ var seg=SEG[(((Math.floor(z+i))%ROWS)+ROWS)%ROWS]; s+=Math.abs(seg.curve); }
  return s/8;
}

function updateKart(k,dt){
  var steer=0,throttle=0,brake=0,boost=false;
  var veh=k.veh||{accel:24,maxSp:32,turn:3,color:"#fff"};
  var maxSp, accel;
  if(k.isPlayer){
    steer=(keys.left?-1:0)+(keys.right?1:0);
    throttle=keys.up?1:0; brake=keys.down?1:0; boost=keys.boost;
    maxSp=veh.maxSp*petSpeedMul; accel=veh.accel*petAccelMul;
  } else {
    var player=karts[0];
    var gap=(player.lap*ROWS+player.z)-(k.lap*ROWS+k.z);
    k.ai.base+=(gap>400?0.25:gap<-400?-0.18:0)*dt;
    k.ai.base=Math.max(34,Math.min(44,k.ai.base));
    if(k.speed<2.5) k.ai.stuck+=dt; else k.ai.stuck=Math.max(0,k.ai.stuck-dt*0.5);
    if(k.ai.stuck>1.0){ k.ai.rev=0.7; k.ai.stuck=0; }
    if(k.ai.rev>0){
      k.ai.rev-=dt; throttle=0; brake=1;
      steer=Math.max(-1,Math.min(1,-k.x*0.12));
      maxSp=14;
    } else {
      var ahead=6+k.speed*0.15;
      var li=(((Math.floor(k.z+ahead))%ROWS)+ROWS)%ROWS;
      var lineOff=-SEG[li].curve*5+k.ai.bias;
      var offAi=Math.abs(k.x)>HW-4;
      if(offAi) lineOff=0;
      var diff=lineOff-k.x;
      steer=Math.max(-1,Math.min(1,diff*0.075));
      var si=(((Math.floor(k.z))%ROWS)+ROWS)%ROWS;
      var target=Math.min(k.ai.base,PROF[si]*k.ai.corner);
      if(offAi) target*=0.65;
      if(k.speed>target+2.2){ brake=1; throttle=0; }
      else if(k.speed>target+0.4){ throttle=0.3; }
      else throttle=1;
      maxSp=target;
    }
    accel=28;
  }
  if(boost&&k.nitro>0&&k.speed>1){ maxSp=58; k.nitro=Math.max(0,k.nitro-26*dt); }
  if(throttle) k.speed+=accel*dt;
  if(brake) k.speed-=accel*dt;
  var offRoad=Math.abs(k.x)>HW-4;
  k.speed*=Math.pow(offRoad?0.55:0.8,dt);
  k.speed=Math.max(0,Math.min(maxSp,k.speed));
  var turnRate=k.ai?3.4:veh.turn;
  k.steer+=(steer-k.steer)*Math.min(1,dt*8);
  k.x+=k.steer*turnRate*Math.min(1,k.speed/20)*dt*22;
  if(k.x>HW-4) k.x=HW-4; if(k.x<-(HW-4)) k.x=-(HW-4);
  k.z+=k.speed*dt/SEG_LEN;
  if(k.z>=ROWS){ k.z-=ROWS; k.lap++; if(k.lap>LAPS&&!k.finished){k.finished=true;k.finishTime=raceTime;} }
  if(k.isPlayer){
    var si=((Math.floor(k.z)%ROWS)+ROWS)%ROWS;
    var seg=SEG[si];
    seg.coins=seg.coins.filter(function(off){
      if(Math.abs(off-k.x)<14){ k.coins++; k.speed=Math.min(maxSp,k.speed+2); return false; }
      return true;
    });
    seg.pads=seg.pads.filter(function(){
      k.nitro=Math.min(100,k.nitro+45); return false;
    });
    if(k.speed>30){
      particles.push({x:VW/2-k.steer*40,y:VH-120,vy:1,k:boost?"#ffc75f":"#9fb8ac",life:0.4,max:0.4});
    }
  }
}

function project(z,worldY,worldX,camX,camY){
  var scale=CAM_DEPTH/Math.max(1,z);
  return { x:VW/2+scale*(worldX-camX)*VW/2, y:VH*0.55+scale*(camY-worldY)*VH*0.16, s:scale };
}

var vis=[];
function drawRoad(){
  var base=Math.floor(karts[0].z);
  var camX=karts[0].x, camY=segY(base)+CAM_H;
  var x=0; vis=[];
  for(var n=1;n<=DRAW;n++){
    var li=base+n, seg=SEG[((li%ROWS)+ROWS)%ROWS];
    var z1=n, z2=n+1;
    var p1=project(z1,seg.y,x,camX,camY);
    x+=seg.curve;
    var seg2=SEG[(((li+1)%ROWS)+ROWS)%ROWS];
    var p2=project(z2,seg2.y,x,camX,camY);
    vis[n]={cx:p1.x,s:p1.s,y:p1.y};
    var lw1=p1.x-HW*p1.s*VW/2, rw1=p1.x+HW*p1.s*VW/2;
    var lw2=p2.x-HW*p2.s*VW/2, rw2=p2.x+HW*p2.s*VW/2;
    ctx.fillStyle=PAL.grass;
    ctx.fillRect(0,p2.y,VW,p1.y-p2.y);
    ctx.fillStyle=PAL.edge;
    ctx.beginPath(); ctx.moveTo(lw1,p1.y); ctx.lineTo(rw1,p1.y); ctx.lineTo(rw2,p2.y); ctx.lineTo(lw2,p2.y); ctx.closePath(); ctx.fill();
    var roadIn=10;
    ctx.fillStyle=seg.alt?"#414a45":"#38413c";
    ctx.beginPath();
    ctx.moveTo(lw1+roadIn*p1.s*VW/2,p1.y); ctx.lineTo(rw1-roadIn*p1.s*VW/2,p1.y);
    ctx.lineTo(rw2-roadIn*p2.s*VW/2,p2.y); ctx.lineTo(lw2+roadIn*p2.s*VW/2,p2.y); ctx.closePath(); ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.16)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  }
}

function drawSprites(){
  var list=[];
  for(var n=DRAW;n>=1;n--){
    var li=Math.floor(karts[0].z)+n, seg=SEG[((li%ROWS)+ROWS)%ROWS];
    seg.trees.forEach(function(off){ list.push({n:n,kind:"tree",off:off}); });
    seg.coins.forEach(function(off){ list.push({n:n,kind:"coin",off:off}); });
    seg.pads.forEach(function(off){ list.push({n:n,kind:"pad",off:off}); });
  }
  karts.forEach(function(k){
    if(k.isPlayer) return;
    var rel=k.z-karts[0].z;
    var n=Math.round(rel);
    if(n<1||n>DRAW) return;
    list.push({n:n,kind:"kart",kart:k,off:k.x});
  });
  list.sort(function(a,b){ return b.n-a.n; });
  list.forEach(function(it){
    var v=vis[it.n]; if(!v||v.s<=0.01) return;
    var s=v.s, q=Math.min(s,0.3), x=v.cx+it.off*s*VW/2, y=v.y;
    if(it.kind==="tree"){
      var h=38*q*VH*0.12;
      ctx.fillStyle="rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(x,y,h*0.4,h*0.16,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#1f3a26"; ctx.beginPath(); ctx.arc(x,y-h*0.5,h*0.42,0,Math.PI*2); ctx.fill();
    } else if(it.kind==="coin"){
      ctx.fillStyle="#ffc75f"; ctx.beginPath(); ctx.arc(x,y-10*q*VH*0.12,15*q*VH*0.12,0,Math.PI*2); ctx.fill();
    } else if(it.kind==="pad"){
      ctx.fillStyle="rgba(43,212,192,.3)"; ctx.beginPath(); ctx.ellipse(x,y,20*q*VW*0.12,8*q*VH*0.12,0,0,Math.PI*2); ctx.fill();
    } else if(it.kind==="kart"){
      drawKartSprite(it.kart,x,y,Math.min(1.1,Math.max(0.15,v.s*1.8)));
    }
  });
}

function drawKartSprite(k,x,y,s){
  var w=VW*0.15*s, h=VH*0.11*s;
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle="rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(0,2,w*0.9,h*0.35,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#151817";
  ctx.fillRect(-w*0.45,-h*0.5,w*0.22,h*0.28); ctx.fillRect(w*0.23,-h*0.5,w*0.22,h*0.28);
  ctx.fillRect(-w*0.45,h*0.22,w*0.22,h*0.28); ctx.fillRect(w*0.23,h*0.22,w*0.22,h*0.28);
  var body=k.color;
  if(k.isPlayer&&rainbow){ body="hsl("+((performance.now()/6)%360)+",70%,60%)"; }
  ctx.fillStyle=body; roundRect(-w/2,-h/2,w,h,h*0.25); ctx.fill();
  ctx.fillStyle="#20302a"; ctx.beginPath(); ctx.arc(0,-h*0.1,w*0.18,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawPlayer(){
  var p=karts[0];
  var x=VW/2-p.steer*30, y=VH-70;
  drawKartSprite(p,x,y,1);
  particles.forEach(function(pt){
    ctx.globalAlpha=Math.max(0,pt.life/pt.max);
    ctx.fillStyle=pt.k; ctx.beginPath(); ctx.arc(pt.x,pt.y,4,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

function fmt(t){ var m=Math.floor(t/60), s=Math.floor(t%60); return m+":"+(s<10?"0":"")+s; }

function frame(ts){
requestAnimationFrame(frame);
  var dt=Math.min(0.05,(ts-last)/1000||0.016); last=ts;
  var player=karts[0];

  if(state==="countdown"){
    countT-=dt;
    var cEl=document.getElementById("count");
    if(countT<=0){ state="race"; cEl.classList.add("hidden"); }
    else { cEl.classList.remove("hidden"); cEl.textContent=Math.ceil(countT); }
  } else if(state==="race"){
    raceTime+=dt;
    karts.forEach(function(k){ updateKart(k,dt); });
    if(player.finished) finishRace();
  }
  particles=particles.filter(function(p){ p.life-=dt; p.y+=40*dt; return p.life>0; });

  var sky=ctx.createLinearGradient(0,0,0,VH);
  sky.addColorStop(0,"#0b1420"); sky.addColorStop(0.55,PAL.grass); sky.addColorStop(1,PAL.grass);
  ctx.fillStyle=sky; ctx.fillRect(0,0,VW,VH);

  drawRoad();
  drawSprites();
  drawPlayer();

  if(player){
    document.getElementById("hudLap").textContent=Math.min(LAPS,player.lap)+"/"+LAPS;
    document.getElementById("hudRank").textContent=rankOf(player)+"/"+karts.length;
    document.getElementById("hudCoin").textContent=player.coins;
    document.getElementById("hudTime").textContent=fmt(raceTime);
    document.getElementById("nitroBar").style.width=player.nitro+"%";
    document.getElementById("hudSpeed").textContent=Math.round(player.speed*22);
  }
}

function finishRace(){
  state="finished";
  var player=karts[0], rank=rankOf(player);
  var bonus=rank===1?15:rank===2?10:rank===3?6:3;
  var earned=bonus+player.coins;
  if(sessionUser){
    var all=loadAll();
    if(all[sessionUser]){ all[sessionUser].coins=(all[sessionUser].coins||0)+earned; localStorage.setItem("gstation_profiles",JSON.stringify(all)); }
  }
  document.getElementById("finRank").textContent="第 "+rank+" 名";
  document.getElementById("finDetail").textContent="用时 "+fmt(player.finishTime||raceTime)+"，金币 "+player.coins+"，结算 +"+earned+" gay币";
  document.getElementById("finishOverlay").classList.remove("hidden");
}

function renderSetup(){
  var kg=document.getElementById("kartGrid"); kg.innerHTML="";
  KARTS.forEach(function(v,i){
    var d=document.createElement("div"); d.className="opt"+(i===selKart?" sel":"");
    d.innerHTML='<div class="name">'+v.name+'</div><div class="desc">'+v.desc+'</div>';
    d.addEventListener("click",function(){ selKart=i; renderSetup(); });
    kg.appendChild(d);
  });
  var tg=document.getElementById("trackGrid"); tg.innerHTML="";
  TRACKS.forEach(function(t,i){
    var d=document.createElement("div"); d.className="opt"+(i===selTrack?" sel":"");
    d.innerHTML='<div class="name">'+t.name+'</div><div class="desc">算法生成赛道</div>';
    d.addEventListener("click",function(){ selTrack=i; PAL={grass:t.grass,road:t.road,edge:t.edge}; buildTrack(t.seed); renderSetup(); });
    tg.appendChild(d);
  });
}

document.getElementById("startBtn").addEventListener("click",function(){ resetRace(); document.getElementById("startOverlay").classList.add("hidden"); });
document.getElementById("againBtn").addEventListener("click",function(){ document.getElementById("finishOverlay").classList.add("hidden"); resetRace(); });
function back(){ location.href="index.html?user="+encodeURIComponent(sessionUser||""); }
document.getElementById("backBtn").addEventListener("click",back);
document.getElementById("backBtn2").addEventListener("click",back);

PAL={grass:TRACKS[0].grass,road:TRACKS[0].road,edge:TRACKS[0].edge};
buildTrack(TRACKS[0].seed);
renderSetup();
resetRace();
state="idle";
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
