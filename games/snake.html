<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>贪吃蛇</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%233ddc84' d='M4 5c4 0 4 3 8 3s4-3 8-3 1 2 1 3-2 1-4 1-4-2-8-2S4 8 4 8V5z'/%3E%3Cpath fill='%233ddc84' d='M6 10c-1 0-2 1-2 2s1 2 2 2 2-1 2-2-1-2-2-2zM18 13c-1 0-2 1-2 2s1 2 2 2 2-1 2-2-1-2-2-2z'/%3E%3C/svg%3E">
<style>
  :root{--bg:#070b0a;--panel:#0d1412;--line:#1c2a24;--green:#3ddc84;--teal:#2bd4c0;--text:#d7f5e4;--muted:#7f9a8d;--amber:#ffc75f;--danger:#ff5d6c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
  .top{width:100%;max-width:400px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .top h1{font-size:24px;background:linear-gradient(90deg,var(--green),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
  .scores{display:flex;gap:10px}
  .score-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;text-align:center}
  .score-box .k{font-size:10px;color:var(--muted)}.score-box .v{font-size:16px;font-weight:700;color:var(--green)}
  .wrap{width:100%;max-width:400px;position:relative;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:6px}
  canvas{display:block;width:100%;aspect-ratio:1;background:#0a120e;border-radius:10px;touch-action:none}
  .msg{position:absolute;inset:0;background:rgba(5,9,8,.78);border-radius:14px;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:5}
  .msg.show{display:flex}
  .msg h2{font-size:28px;color:var(--danger)}
  .msg button{height:46px;padding:0 26px;border:none;border-radius:10px;background:var(--green);color:#06231a;font-size:15px;font-weight:700;cursor:pointer}
  .hint{color:var(--muted);font-size:12px;margin-top:12px}.hint b{color:var(--teal)}
</style>
</head>
<body>
  <div class="top">
    <h1>贪吃蛇</h1>
    <div class="scores">
      <div class="score-box"><div class="k">长度</div><div class="v" id="score">1</div></div>
      <div class="score-box"><div class="k">最佳</div><div class="v" id="best">0</div></div>
    </div>
  </div>
  <div class="wrap">
    <canvas id="cv"></canvas>
    <div class="msg" id="msg"><h2>游戏结束</h2><button id="again">再来一局</button></div>
  </div>
  <div class="hint">方向键 / WASD 移动 · 手机滑动</div>

<script>
(function(){
var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var N=20; // 网格
var user=(location.search.match(/user=([^&]*)/)||[])[1]?decodeURIComponent(location.search.match(/user=([^&]*)/)[1]):(localStorage.getItem("gstation_session")||"guest");
var HS_KEY="gsnake_hs_"+user;
var best=parseInt(localStorage.getItem(HS_KEY)||"0",10);
var snake,dir,nextDir,food,score,alive,over,acc;
function reset(){
  snake=[{x:Math.floor(N/2),y:Math.floor(N/2)},{x:Math.floor(N/2)-1,y:Math.floor(N/2)},{x:Math.floor(N/2)-2,y:Math.floor(N/2)}];
  dir={x:1,y:0}; nextDir={x:1,y:0}; score=0; alive=true; acc=0;
  document.getElementById("msg").classList.remove("show");
  placeFood();
}
function placeFood(){
  var free=[];
  for(var x=0;x<N;x++)for(var y=0;y<N;y++){ if(!snake.some(function(s){return s.x===x&&s.y===y;})) free.push({x:x,y:y}); }
  if(!free.length) return;
  food=free[Math.floor(Math.random()*free.length)];
}
var speed=110; // ms每格
function step(dt){
  if(!alive) return;
  acc+=dt;
  var interval=speed*Math.max(0.45,1-score*0.02);
  if(acc>=interval){
    acc=0;
    dir=nextDir;
    var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(head.x<0||head.x>=N||head.y<0||head.y>=N){ die(); return; }
    if(snake.some(function(s){return s.x===head.x&&s.y===head.y;})){ die(); return; }
    snake.unshift(head);
    if(food && head.x===food.x && head.y===food.y){
      score++; if(score>best){best=score; localStorage.setItem(HS_KEY,String(score));}
      placeFood();
    } else snake.pop();
  }
}
function die(){
  alive=false; over=true;
  document.getElementById("msg").classList.add("show");
}
function draw(){
  var size=cv.width/N;
  ctx.clearRect(0,0,cv.width,cv.height);
  // 网格
  ctx.strokeStyle="rgba(61,220,132,0.05)"; ctx.lineWidth=1;
  for(var i=1;i<N;i++){ ctx.beginPath(); ctx.moveTo(i*size,0); ctx.lineTo(i*size,cv.height); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i*size); ctx.lineTo(cv.width,i*size); ctx.stroke(); }
  // 食物
  if(food){ ctx.fillStyle="#ffc75f"; ctx.shadowColor="#ffc75f"; ctx.shadowBlur=10; round(food.x*size+size/2,food.y*size+size/2,size*0.32); ctx.fill(); ctx.shadowBlur=0; }
  // 蛇
  for(var j=0;j<snake.length;j++){
    var s=snake[j];
    ctx.fillStyle = j===0?"#3ddc84":"#25b06a";
    if(j===0){ ctx.shadowColor="#3ddc84"; ctx.shadowBlur=12; }
    round(s.x*size+size/2,s.y*size+size/2,size*0.42);
    ctx.fill();
    ctx.shadowBlur=0;
  }
  // 眼睛
  var h=snake[0];
  ctx.fillStyle="#06231a";
  var ex=h.x*size+size/2+dir.x*size*0.16, ey=h.y*size+size/2+dir.y*size*0.16;
  ctx.beginPath(); ctx.arc(ex,ey,size*0.09,0,7); ctx.fill();
  document.getElementById("score").textContent=score;
  document.getElementById("best").textContent=Math.max(best,score);
}
function round(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,7); }
function resize(){ cv.width=cv.clientWidth*1; cv.height=cv.clientWidth*1; draw(); }
window.addEventListener("resize",resize);

var keys={
  "arrowup":{x:0,y:-1},"arrowdown":{x:0,y:1},"arrowleft":{x:-1,y:0},"arrowright":{x:1,y:0},
  "w":{x:0,y:-1},"s":{x:0,y:1},"a":{x:-1,y:0},"d":{x:1,y:0}
};
document.addEventListener("keydown",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key.toLowerCase();
  if(k in keys){
    var nd=keys[k];
    if(nd.x!==-dir.x || nd.y!==-dir.y){ nextDir=nd; }
    e.preventDefault();
  }
});
// 触屏滑动
var sx=0,sy=0,on=false;
cv.addEventListener("touchstart",function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; on=true; },{passive:true});
cv.addEventListener("touchmove",function(e){ e.preventDefault(); },{passive:false});
cv.addEventListener("touchend",function(e){
  if(!on) return; on=false;
  var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)<24&&Math.abs(dy)<24) return;
  var nd;
  if(Math.abs(dx)>Math.abs(dy)) nd={x:dx>0?1:-1,y:0}; else nd={x:0,y:dy>0?1:-1};
  if(nd.x!==-dir.x || nd.y!==-dir.y) nextDir=nd;
});
document.getElementById("again").addEventListener("click",reset);

var last=performance.now();
function loop(now){
  var dt=now-last; last=now;
  step(dt); draw();
  requestAnimationFrame(loop);
}
reset(); resize(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
