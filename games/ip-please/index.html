<style>
  html, body { margin: 0; height: 100%; background: #161313; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  canvas {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  @media (pointer: fine) { canvas { cursor: none; } }
  .ui { position: fixed; top: 6px; right: 8px; display: flex; gap: 6px; z-index: 2; }
  .ui button {
    font: 12px system-ui, sans-serif; color: #968f87; background: rgba(22, 19, 19, 0.7);
    border: 1px solid #4a4440; border-radius: 3px; padding: 3px 8px; cursor: pointer;
  }
  .ui button:hover { color: #e4dfd4; }
  @media (max-height: 500px) { .ui { top: 2px; right: 2px; opacity: 0.55; } .ui button { font-size: 10px; padding: 1px 5px; } }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 3; background: rgba(22, 19, 19, 0.92);
    color: #e89c74; font-size: 16px; text-align: center; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; padding: 24px;
  }
  #rotate small { color: #968f87; font-size: 13px; }
  @media (orientation: portrait) and (max-width: 700px) { #rotate.show { display: flex; } }
  noscript { color: #e4dfd4; }
  /* 游戏厅返回入口 */
  .arcade-back {
    position: fixed; top: 6px; left: 8px; z-index: 4;
    font: 12px system-ui, sans-serif; color: #968f87;
    background: rgba(22, 19, 19, 0.7); border: 1px solid #4a4440; border-radius: 3px;
    padding: 3px 8px; text-decoration: none; opacity: .5;
    transition: opacity .15s, color .15s;
  }
  .arcade-back:hover { opacity: 1; color: #e4dfd4; }
  @media (max-height: 500px) { .arcade-back { top: 2px; left: 2px; opacity: .3; font-size: 10px; padding: 1px 5px; } }

/* mobfit: 手机手感与横屏提醒 */
html.mob-touch{-webkit-tap-highlight-color:transparent}
html.mob-touch body{overscroll-behavior:none;overscroll-behavior-y:contain;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#mobfit-rot{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9998;background:rgba(12,16,20,.88);color:#eaf5ee;border:1px solid rgba(130,205,170,.45);border-radius:10px;padding:7px 13px;font:12px/1.45 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;display:none;pointer-events:none;max-width:88vw;text-align:center;backdrop-filter:blur(6px);box-shadow:0 4px 18px rgba(0,0,0,.35)}
#mobfit-rot.on{display:block;animation:mobfitFade 6.2s ease forwards}
@keyframes mobfitFade{0%{opacity:0;transform:translate(-50%,-6px)}8%{opacity:1;transform:translate(-50%,0)}78%{opacity:1}100%{opacity:0}}
</style>

<body>
<canvas id="game" width="640" height="360" aria-label="IP, PLEASE 游戏画面"></canvas>
<a class="arcade-back" href="../../">← 游戏厅</a>
<div class="ui">
  <button id="mute" type="button">声音：开</button>
  <button id="full" type="button">全屏</button>
</div>
<div id="rotate" class="show">
  <div>把手机横过来玩</div>
  <small>竖屏也能玩，但字会很小</small>
  <button type="button" onclick="this.parentNode.classList.remove('show')" style="margin-top:8px;padding:6px 14px">先竖着玩</button>
</div>
<noscript>这个游戏需要开启 JavaScript。</noscript>

<script src="data.js"></script>
<script src="booth.js"></script>

<script src="screens.js"></script>
<script src="main.js"></script>
<script>
  document.getElementById('mute').addEventListener('click', () => toggleMute());
  const fullBtn = document.getElementById('full');
  const root = document.documentElement;
  if (!root.requestFullscreen && !root.webkitRequestFullscreen) fullBtn.style.display = 'none';
  fullBtn.addEventListener('click', () => {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      return;
    }
    const p = (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    if (p && p.then) p.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {});
  });
</script>
<script id="mobfit-js">
(function(){
  var coarse = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
  if(!coarse) return;
  document.documentElement.classList.add('mob-touch');
  function tip(){
    if(window.innerWidth > window.innerHeight) return;
    var best = null;
    document.querySelectorAll('canvas').forEach(function(c){
      if(c.offsetWidth < 120) return;
      var r = c.width / (c.height || 1);
      if(r > 1.45 && c.offsetWidth >= window.innerWidth * 0.55 && (!best || c.offsetWidth > best.offsetWidth)) best = c;
    });
    if(!best) return;
    var el = document.getElementById('mobfit-rot');
    if(!el){ el = document.createElement('div'); el.id = 'mobfit-rot'; document.body.appendChild(el); }
    if(el.classList.contains('on')) return;
    el.textContent = '横屏玩，画面更大 ⟳';
    el.classList.add('on');
    setTimeout(function(){ el.classList.remove('on'); }, 6400);
  }
  function run(){ setTimeout(tip, 700); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
  window.addEventListener('orientationchange', function(){ setTimeout(tip, 900); });
})();
</script>
</body>
