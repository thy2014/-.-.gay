<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCBonk · 青苔裂谷</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d120f'/%3E%3Cpath d='M8 20l8-12 8 12z' fill='%237ef0a0'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0f0d; --panel:rgba(17,23,19,.94); --panel2:rgba(24,32,26,.96);
  --line:#2c3a30; --ink:#e7eae4; --dim:#8b978d; --exp:#7ef0a0; --gold:#e8c06a;
  --red:#e4645c; --steel:#9fb6a8; --grass:#5f8f5c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 800px at 50% 30%,#121a15 0%,#0a0e0c 70%),var(--bg);
  color:var(--ink);font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif;
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;
}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ===== HUD ===== */
#hud{
  position:absolute;left:0;right:0;top:0;padding:10px 14px 0;pointer-events:none;
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
}
.hudL{display:flex;flex-direction:column;gap:6px}
.hudR{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.bar{width:min(210px,34vw);height:9px;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:1px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;transition:width .18s linear}
#hpFill{background:linear-gradient(90deg,#b6483f,#e4645c)}
#xpFill{background:linear-gradient(90deg,#2f8f5c,#7ef0a0)}
.stat{font-size:13px;letter-spacing:.06em;color:var(--dim)}
.stat b{color:var(--ink);font-weight:600}
.tagline{font-size:12px;color:var(--dim);letter-spacing:.14em}
#clockBox{font-size:20px;letter-spacing:.08em;color:#dfe6dd}
#clockBox small{font-size:11px;color:var(--dim);letter-spacing:.1em;margin-left:6px}
#guardDots{display:flex;gap:5px;justify-content:flex-end}
.gd{width:9px;height:9px;border:1px solid var(--line);background:rgba(0,0,0,.4)}
.gd.on{background:var(--red);border-color:var(--red)}
.gd.done{background:#3a4a3e;border-color:#3a4a3e}

/* 技能栏 */
#skills{
  position:absolute;left:50%;transform:translateX(-50%);bottom:14px;
  display:flex;gap:8px;pointer-events:none;
}
.slot{
  width:52px;height:52px;border:1px solid var(--line);background:var(--panel);
  position:relative;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--dim);letter-spacing:.02em;
}
.slot .nm{position:absolute;bottom:-15px;left:0;right:0;text-align:center;font-size:10px;color:var(--dim)}
.slot .cd{position:absolute;inset:0;background:rgba(0,0,0,.6);transform-origin:bottom}
.slot.ready{border-color:rgba(126,240,160,.5)}
.slot .ico{font-size:16px;color:var(--ink)}
#ultSlot{border-color:rgba(232,192,106,.55)}
#ultSlot .cd{background:rgba(0,0,0,.66)}

/* ===== 启动 / 结算 ===== */
.overlay{
  position:absolute;inset:0;background:radial-gradient(700px 500px at 50% 40%,rgba(20,30,23,.86),rgba(6,9,7,.96));
  display:flex;align-items:center;justify-content:center;padding:22px;z-index:40;
}
.overlay.off{display:none}
.card{
  width:min(880px,100%);max-height:92vh;overflow:auto;background:var(--panel2);
  border:1px solid var(--line);padding:28px 30px;
  box-shadow:0 24px 70px rgba(0,0,0,.6);
}
.kicker{font-size:11px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase}
h1{font-size:clamp(30px,5vw,46px);letter-spacing:.06em;line-height:1.1;margin:8px 0 4px}
h1 em{font-style:normal;color:var(--exp)}
.sub{font-size:13px;color:var(--dim);letter-spacing:.06em}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.pick{
  border:1px solid var(--line);background:rgba(255,255,255,.02);padding:14px 12px 12px;cursor:pointer;
  text-align:left;color:var(--ink);font-family:inherit;transition:border-color .15s,background .15s,transform .15s;
}
.pick:hover{background:rgba(126,240,160,.06);border-color:rgba(126,240,160,.4);transform:translateY(-2px)}
.pick.on{border-color:var(--exp);background:rgba(126,240,160,.1)}
.pick .pnm{font-size:17px;letter-spacing:.05em;margin-bottom:4px}
.pick .ptag{font-size:11px;color:var(--exp);letter-spacing:.1em;margin-bottom:6px}
.pick .pds{font-size:12px;color:var(--dim);line-height:1.55}
.keys{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--dim);margin-top:14px}
.keys kbd{
  font-family:inherit;display:inline-block;border:1px solid var(--line);background:rgba(255,255,255,.05);
  padding:1px 6px;margin-right:5px;border-radius:2px;color:var(--ink);font-size:11px;
}
.btn{
  font-family:inherit;font-size:16px;letter-spacing:.1em;padding:13px 30px;cursor:pointer;
  background:linear-gradient(180deg,#2f8f5c,#226b45);color:#eaffe0;border:1px solid #3cad72;
}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--dim);font-size:13px;padding:10px 18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* 升级选卡 */
#lvOverlay{z-index:45;background:rgba(6,9,7,.82)}
#lvCards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lvcard{
  border:1px solid var(--line);background:rgba(255,255,255,.03);padding:16px;cursor:pointer;color:var(--ink);
  font-family:inherit;text-align:left;transition:.15s;position:relative;overflow:hidden;
}
.lvcard:hover{border-color:var(--exp);background:rgba(126,240,160,.07);transform:translateY(-3px)}
.lvcard .k{font-size:10px;letter-spacing:.24em;color:var(--dim)}
.lvcard .n{font-size:18px;margin:6px 0 2px;letter-spacing:.04em}
.lvcard .lvl{font-size:11px;color:var(--gold);letter-spacing:.08em}
.lvcard .d{font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:8px}
.lvcard .bar2{height:3px;background:rgba(255,255,255,.08);margin-top:10px}
.lvcard .bar2>i{display:block;height:3px;background:var(--exp);width:0}

/* 暂停 */
#pause .card{width:min(620px,100%)}
.setrow{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.setrow .lab{color:var(--dim);letter-spacing:.04em}
.seg{display:flex;gap:6px}
.seg button{
  font-family:inherit;font-size:12px;padding:6px 11px;cursor:pointer;color:var(--dim);
  background:transparent;border:1px solid var(--line);
}
.seg button.on{color:#eaffe0;border-color:#3cad72;background:rgba(47,143,92,.28)}

/* 触屏 */
#touch{position:absolute;inset:0;pointer-events:none;z-index:30}
#stickBase{
  position:absolute;left:22px;bottom:22px;width:126px;height:126px;border-radius:50%;
  border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.28);display:none;
}
#stickKnob{
  position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:rgba(126,240,160,.28);border:1px solid rgba(126,240,160,.55);
}
#tbtns{position:absolute;right:16px;bottom:34px;display:none;flex-direction:column;gap:12px;align-items:flex-end}
.tbtn{
  width:66px;height:66px;border-radius:50%;border:1px solid rgba(255,255,255,.2);
  background:rgba(20,28,22,.8);color:var(--ink);font-family:inherit;font-size:14px;pointer-events:auto;
}
.tbtn:active{background:rgba(126,240,160,.28)}
#toast{
  position:absolute;left:50%;top:70px;transform:translateX(-50%);padding:7px 16px;
  background:rgba(0,0,0,.7);border:1px solid var(--line);font-size:13px;color:var(--ink);
  letter-spacing:.06em;opacity:0;transition:opacity .2s;pointer-events:none;z-index:35;
}
#toast.on{opacity:1}
@media (max-width:640px){
  .picks{grid-template-columns:repeat(2,1fr)}
  #lvCards{grid-template-columns:1fr}
  .stat{font-size:12px}
  #clockBox{font-size:17px}
  .slot{width:46px;height:46px}
  #skills{bottom:8px}
  .card{padding:20px 18px}
}
@media (max-width: 560px){
  #hud{font-size:12px;gap:6px}
  #hud .bar{width:min(150px,40vw);height:8px}
  #clockBox{font-size:12px;gap:2px}
  #clockBox .cn, #clockBox .phase{display:none}
  #guardDots{display:none}
  #skills{gap:5px;bottom:10px}
  #skills .slot{width:46px;height:46px}
  #lvOverlay{padding:10px}
  #lvCards{grid-template-columns:1fr;gap:8px;max-height:64vh;overflow:auto}
  #lvCards .lvcard{padding:12px 14px}
  #lvCards .lvcard h4{font-size:17px}
  #lvCards .lvcard p{font-size:12px;margin:4px 0 8px}
}
#pauseBtn{
  position:fixed;left:12px;top:66px;z-index:40;
  width:42px;height:42px;border-radius:10px;
  background:rgba(12,20,15,.82);border:1px solid rgba(150,220,175,.22);
  color:#cfe4d4;font:600 14px/1 "Times New Roman",serif;letter-spacing:.04em;
  touch-action:none;cursor:pointer;
}
#pauseBtn:active{background:rgba(30,48,36,.9)}
@media (min-width: 900px){ #pauseBtn{display:none} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="hudL">
      <div class="bar"><i id="hpFill"></i></div>
      <div class="bar" style="width:min(240px,36vw)"><i id="xpFill"></i></div>
      <div class="stat">生命 <b id="hpTxt">100</b> · 等级 <b id="lvTxt">1</b> · 击杀 <b id="killTxt">0</b></div>
    </div>
    <div class="hudR">
<div id="clockBox">05:00<small id="phaseTxt">遗迹·一</small></div>
      <div class="tagline" id="charTxt">苦力怕</div>
      <div id="guardDots"></div>
    </div>
  </div>

  <div id="skills"></div>

  <div id="touch">
    <div id="stickBase"><div id="stickKnob"></div></div>
    <div id="tbtns">
      <button class="tbtn" id="tUlt">终极</button>
      <button class="tbtn" id="tDash">滑步</button>
      <button class="tbtn" id="tJump">跳</button>
    </div>
  </div>

  <div id="toast"></div>
  <button id="pauseBtn" aria-label="暂停">II</button>

  <!-- 开始界面 -->
  <div class="overlay" id="menu">
    <div class="card">
      <div class="kicker">MCBONK · 青苔裂谷</div>
      <h1>选一个<em>生物</em>，守住这五分钟</h1>
      <div class="sub">九分钟太长了。这里缩到五分钟：三波守卫、四个自动招式、一块会吃掉你的裂谷。</div>
      <div class="picks" id="picks"></div>
      <div class="keys">
        <div><kbd>W A S D</kbd>移动</div>
        <div><kbd>空格</kbd>跳跃（高处落地砸击）</div>
        <div><kbd>Shift</kbd>滑步</div>
        <div><kbd>E</kbd>终极技</div>
        <div><kbd>Esc</kbd>暂停</div>
      </div>
      <hr>
      <div class="row">
        <button class="btn" id="startBtn">进入裂谷</button>
        <button class="btn ghost" id="bestBtn">本机最佳：—</button>
      </div>
    </div>
  </div>

  <!-- 升级 -->
  <div class="overlay off" id="lvOverlay">
    <div class="card">
      <div class="kicker" id="lvKicker">LEVEL UP</div>
      <h1 style="font-size:26px">挑一件带走</h1>
      <div id="lvCards"></div>
    </div>
  </div>

  <!-- 暂停 -->
  <div class="overlay off" id="pause">
    <div class="card">
      <div class="kicker">已暂停</div>
      <h1 style="font-size:30px">青苔裂谷</h1>
      <div class="sub" id="pauseSub">—</div>
      <hr>
      <div class="setrow"><span class="lab">特效时长</span>
        <div class="seg" id="fxSeg">
          <button data-fx="0.6">短</button><button data-fx="1" class="on">中</button><button data-fx="1.6">长</button>
        </div>
      </div>
      <div class="setrow"><span class="lab">伤害数字</span>
        <div class="seg" id="numSeg"><button data-num="1" class="on">开</button><button data-num="0">关</button></div>
      </div>
      <div class="setrow"><span class="lab">自动瞄准</span>
        <div class="seg" id="aimSeg"><button data-aim="auto" class="on">自动</button><button data-aim="manual">手动</button></div>
      </div>
      <hr>
      <div class="row">
        <button class="btn" id="resumeBtn">继续</button>
        <button class="btn ghost" id="quitBtn">退出本局</button>
      </div>
    </div>
  </div>

  <!-- 结算 -->
  <div class="overlay off" id="end">
    <div class="card">
      <div class="kicker" id="endKicker">结束了</div>
      <h1 id="endTitle">裂谷闭合</h1>
      <div class="sub" id="endSub">—</div>
      <hr>
      <div class="row">
        <button class="btn" id="againBtn">再来一局</button>
        <button class="btn ghost" id="menuBtn">换个生物</button>
      </div>
    </div>
  </div>
</div>
<script>
/* =========================================================
   MCBonk · 青苔裂谷 — 单文件复刻
   ========================================================= */
var cv = document.getElementById("cv");
var cx = cv.getContext("2d");

var W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
}
window.addEventListener("resize", resize);
resize();

/* ---------- 世界 ---------- */
var WORLD = 2900;                 // 世界边长
var ZONES = [                     // 三层台地（矩形，z 越高越"高"）
  { x: 0,    y: 0,    w: 2900, h: 2900, z: 0, name: "低谷" },
  { x: 780,  y: 720,  w: 1340, h: 1400, z: 1, name: "台地" },
  { x: 1180, y: 1080, w: 640,  h: 640,  z: 2, name: "上层" }
];
function zoneAt(x, y){
  var z = 0;
  for (var i = 1; i < ZONES.length; i++){
    var r = ZONES[i];
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) z = r.z;
  }
  return z;
}

/* ---------- 角色 ---------- */
var CHARS = {
  creeper: {
    name: "苦力怕", tag: "近身爆破", hp: 112, color: "#6fbf73",
    desc: "贴近就炸。自己的爆炸不会伤到自己，气浪把追兵推开。",

  }

/* ---------- 技能池 ---------- */
var SKILLS = {

  arrow:    { n: "骨弓射击", k: "贯穿", d: "朝最近的敌人射出一支穿透骨箭。",   cd: 0.72, r: 0,   dmg: 21 },

  poison:   { n: "毒液弹",   k: "毒伤", d: "抛射毒液，留下一小片毒区。",       cd: 2.4,  r: 0,   dmg: 12 },
  boom:     { n: "火药团",   k: "连爆", d: "抛出一团火药，落点爆炸。",         cd: 2.0,  r: 88,  dmg: 28 },
  quake:    { n: "重压蓄势", k: "余震", d: "砸击追加一圈余震，外环不重复命中。", cd: 3.2,  r: 150, dmg: 26 }
};
var PASSIVES = {
  power:  { n: "力量", d: "全部伤害 +12%",        max: 6 },
  haste:  { n: "急迫", d: "自动招式冷却 -7%",      max: 6 },
  reach:  { n: "延展", d: "招式范围 +10%",        max: 5 },

  spider:  { n: "蜘蛛",     hp: 18,  spd: 78, r: 16, dmg: 6,  exp: 4,  color: "#6a7080" },

var BOSSES = [
  { key: "golem",  n: "铁傀儡", hp: 900,  spd: 34, r: 40, dmg: 22, color: "#b9c3bd", t: 100, tag: "遗迹·一" },
  { key: "warden", n: "监守者", hp: 1500, spd: 40, r: 42, dmg: 30, color: "#3f6f7a", t: 200, tag: "遗迹·二" },
  { key: "wither", n: "凋零",   hp: 2200, spd: 46, r: 46, dmg: 34, color: "#5b5560", t: 300, tag: "遗迹·三" }
];

/* ---------- 运行状态 ---------- */
var G = {
  mode: "menu",        // menu / play / pause / level / end
  t: 0, dur: 300,      // 五分钟
  char: "creeper",
  p: null,
  foes: [], orbs: [], parts: [], nums: [], shots: [], zones: [], bolts: [],
  cam: { x: WORLD / 2, y: WORLD / 2 },
  kill: 0, level: 1, xp: 0, xpNeed: 12,
  guardIdx: 0, guardDead: 0, bosses: [],
  fxDur: 1, showNum: 1, aimMode: "auto",
  shake: 0, light: 1, hitFlash: 0,
  spawnAcc: 0, waveNo: 0, levelling: false
};
window.__G = G;
var keys = {};
var pointer = { x: 0, y: 0, down: false };

/* ---------- 工具 ---------- */
function rnd(a, b){ return a + Math.random() * (b - a); }
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function dist2(ax, ay, bx, by){ var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function fmt(t){
  t = Math.max(0, Math.ceil(t));
  var m = Math.floor(t / 60), s = t % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function worldToScreen(x, y){
  return { x: (x - G.cam.x) + W / 2, y: (y - G.cam.y) + H / 2 };
}

/* ---------- 玩家 ---------- */
function makePlayer(key){
  var c = CHARS[key];
  return {
    x: WORLD / 2, y: WORLD / 2 + 470, r: 18, z: 0,
    hp: c.hp, maxhp: c.hp, spd: 176,
    face: -Math.PI / 2,
    skills: [{ id: c.auto, lv: 1, cd: 0 }],
    ult: { id: c.ult, cd: 0, need: 100, charge: 0 },
    pas: {},
    dmgMul: 1, cdMul: 1, rngMul: 1, pickR: 74,
    airborne: 0, airH: 0, airFrom: 0, jumpFromZone: 0, airT: 0, vx: 0, vy: 0, hasOrbit: false, dashT: 0, invT: 0, iFrameCd: 0,
    bob: 0, hitT: 0
  };
}

/* =========================================================
   主循环
   ========================================================= */
var last = 0;
function loop(ts){
  if (!last) last = ts;
  var dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  update(dt);
  render(dt);
  requestAnimationFrame(loop);
}

/* =========================================================
   战斗与更新
   ========================================================= */
G.friends = [];

function nearestFoe(maxD){
  var p = G.p, best = null, bd = maxD ? maxD * maxD : 1e9;
  for (var i = 0; i < G.foes.length; i++){
    var f = G.foes[i];
    var d = dist2(p.x, p.y, f.x, f.y);
    if (d < bd){ bd = d; best = f; }
  }
  return best;
}
function nearestFoes(n, maxD){
  var p = G.p, arr = [];
  for (var i = 0; i < G.foes.length; i++){
    var f = G.foes[i];
    var d = dist2(p.x, p.y, f.x, f.y);
    if (!maxD || d <= maxD * maxD) arr.push({ f: f, d: d });
  }
  arr.sort(function(a, b){ return a.d - b.d; });
  return arr.slice(0, n).map(function(o){ return o.f; });
}

/* ---- 伤害 ---- */
function hurtFoe(f, amount, color, big){
  var p = G.p;
  var dmg = Math.round(amount * (p ? p.dmgMul : 1));
  f.hp -= dmg;
  if (G.showNum){
    G.nums.push({ x: f.x + rnd(-6, 6), y: f.y - f.r - 4, v: "" + dmg, c: color || "#ffe6a4", life: 0.75 * G.fxDur, max: 0.75 * G.fxDur, big: !!big });
  }
  if (f.hp <= 0) killFoe(f);
}
function killFoe(f){
  var p = G.p;
  f.dead = true;
  G.kill++;
  for (var i = 0; i < (f.boss ? 26 : 7); i++){
    G.parts.push({
      x: f.x + rnd(-f.r, f.r), y: f.y + rnd(-f.r, f.r),
      s: rnd(3, f.boss ? 9 : 6), c: f.boss ? "rgba(232,192,106,.85)" : "rgba(150,220,150,.62)",
      vx: rnd(-70, 70), vy: rnd(-70, 70), life: rnd(.4, .9) * G.fxDur, max: .9 * G.fxDur
    });
  }
  // 经验
  var n = f.boss ? 14 : 1;
  for (var k = 0; k < n; k++){
    G.orbs.push({ x: f.x + rnd(-10, 10), y: f.y + rnd(-10, 10), v: f.boss ? 24 : (FOES[f.key] ? FOES[f.key].exp : 6), life: 16, ph: 0 });
  }
  if (f.boss){
    G.guardDead++;
    updateGuardDots();
    toast(f.n + " 倒下了");
    G.shake = 12;
    G.p.ult.charge = Math.min(100, G.p.ult.charge + 30);
    if (G.guardDead >= 3) endGame(true);
  }
}
function hurtPlayer(amount){
  var p = G.p;
  if (!p || p.invT > 0 || p.iFrameCd > 0) return;
  p.hp -= amount;
  p.invT = 0.42;
  G.hitFlash = 1;
  G.shake = 7;
  if (G.showNum){
    G.nums.push({ x: p.x + rnd(-6, 6), y: p.y - 26, v: "-" + Math.round(amount), c: "#ff9a8d", life: .7 * G.fxDur, max: .7 * G.fxDur, big: false });
  }
  if (p.hp <= 0){ p.hp = 0; endGame(false); }
  refreshHud();
}

/* ---- 技能施放 ---- */
function skillMul(s, extra){
  return { dmg: (SKILLS[s.id].dmg + (s.lv - 1) * 0.35 * SKILLS[s.id].dmg) * (1 + (extra || 0)) };
}
function castSkill(s){
  var p = G.p, def = SKILLS[s.id];
  var rng = def.r * p.rngMul;
  var lvlMul = 1 + (s.lv - 1) * 0.32;

  if (s.id === "blast"){
    var near = nearestFoe(rng + 26);
    if (!near) return false;
    boomAt(p.x, p.y, rng, def.dmg * lvlMul, "rgba(255,190,120,.85)");
    G.shake = Math.max(G.shake, 5);
    return true;
  }
  if (s.id === "arrow"){
    var t1 = nearestFoe(700);
    if (!t1) return false;
    fireShot(p.x, p.y, t1, def.dmg * lvlMul, 0, 3);
    return true;
  }
  if (s.id === "slam"){
    var t2 = nearestFoe(340);
    var ang = t2 ? Math.atan2(t2.y - p.y, t2.x - p.x) : p.face;
    var power = 260;
    p.vx = Math.cos(ang) * power; p.vy = Math.sin(ang) * power;
    doJump();
    return true;
  }
  if (s.id === "claw"){
    var t3 = nearestFoe(320);
    if (!t3) return false;
    var a3 = Math.atan2(t3.y - p.y, t3.x - p.x);
    p.x = t3.x - Math.cos(a3) * (t3.r + p.r + 6);
    p.y = t3.y - Math.sin(a3) * (t3.r + p.r + 6);
    p.face = a3;
    hurtFoe(t3, def.dmg * lvlMul * 1.5, "#d9c6ff", true);
    p.hp = Math.min(p.maxhp, p.hp + 4);
    slashFx(p.x, p.y, 46);
    return true;
  }
  if (s.id === "bolt"){
    var ts = nearestFoes(3, 420 * p.rngMul);
    if (!ts.length) return false;
    var from = { x: p.x, y: p.y };
    for (var i = 0; i < ts.length; i++){
      G.bolts.push({ x1: from.x, y1: from.y, x2: ts[i].x, y2: ts[i].y, t: 0.22 * G.fxDur, max: 0.22 * G.fxDur });
      hurtFoe(ts[i], def.dmg * lvlMul, "#bfeaff", false);
      from = { x: ts[i].x, y: ts[i].y };
    }
    return true;
  }
  if (s.id === "frost"){
    var t4 = nearestFoe(620);
    if (!t4) return false;
    fireShot(p.x - 6, p.y, t4, def.dmg * lvlMul, { slow: 2.2 }, 2);
    fireShot(p.x + 6, p.y, t4, def.dmg * lvlMul * .8, { slow: 2.2 }, 2);
    return true;
  }
  if (s.id === "poison"){
    var t5 = nearestFoe(560);
    if (!t5) return false;
    G.zones.push({ x: t5.x, y: t5.y, r: 62 * p.rngMul, kind: "poison", t: 4.2, max: 4.2, dmg: def.dmg * lvlMul, tick: 0 });
    return true;
  }
  if (s.id === "boom"){
    var t6 = nearestFoe(520);
    if (!t6) return false;
    boomAt(t6.x, t6.y, rng, def.dmg * lvlMul, "rgba(255,160,110,.85)");
    return true;
  }
  if (s.id === "quake"){
    boomAt(p.x, p.y, rng * .55, def.dmg * .8 * lvlMul, "rgba(200,220,255,.7)");
    G.zones.push({ x: p.x, y: p.y, r: rng, kind: "shock", t: .5, max: .5, dmg: def.dmg * lvlMul, tick: 99 });
    return true;
  }
  return false;
}

function boomAt(x, y, r, dmg, color){
  for (var i = 0; i < G.foes.length; i++){
    var f = G.foes[i];
    if (dist2(x, y, f.x, f.y) < (r + f.r) * (r + f.r)) hurtFoe(f, dmg, color, false);
  }
  for (var k = 0; k < 16; k++){
    var a = Math.random() * Math.PI * 2, sp = rnd(60, 180);
    G.parts.push({ x: x, y: y, s: rnd(2, 6), c: color, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .5 * G.fxDur, max: .5 * G.fxDur });
  }
  G.zones.push({ x: x, y: y, r: r, kind: "shock", t: .32 * G.fxDur, max: .32 * G.fxDur, dmg: 0, tick: 99 });
}
function slashFx(x, y, r){
  G.zones.push({ x: x, y: y, r: r, kind: "shock", t: .2, max: .2, dmg: 0, tick: 99 });
}
function fireShot(x, y, target, dmg, opt, pierce){
  var a = Math.atan2(target.y - y, target.x - x);
  G.shots.push({
    x: x, y: y, vx: Math.cos(a) * 460, vy: Math.sin(a) * 460,
    dmg: dmg, pierce: pierce || 1, hit: [], life: 1.1, slow: opt && opt.slow, bad: false
  });
}

/* ---- 终极技 ---- */
function castUlt(){
  var p = G.p;
  if (p.ult.charge < p.ult.need) return;
  p.ult.charge = 0;
  var id = p.ult.id;
  if (id === "overload"){
    for (var i = 0; i < 4; i++){
      var ts = nearestFoes(1, 420);
      var tx = ts.length ? ts[0].x : p.x + rnd(-60, 60);
      var ty = ts.length ? ts[0].y : p.y + rnd(-60, 60);
      G.zones.push({ x: tx, y: ty, r: 150 * p.rngMul, kind: "boomdelay", t: .5 + i * .22, max: .5 + i * .22, dmg: 0, tick: 99, dmg2: 120, delayBoom: 0.5 + i * .22 });
    }
    G.shake = 10;
  } else if (id === "arrowRain"){
    for (var k = 0; k < 18; k++){
      var a = k / 18 * Math.PI * 2;
      var tx2 = p.x + Math.cos(a) * 260, ty2 = p.y + Math.sin(a) * 260;
      G.shots.push({ x: p.x, y: p.y, vx: Math.cos(a) * 380, vy: Math.sin(a) * 380, dmg: 40, pierce: 2, hit: [], life: 1.2, bad: false });
    }
  } else if (id === "split"){
    for (var m = 0; m < 3; m++){
      var am = m / 3 * Math.PI * 2;
      G.friends.push({ x: p.x + Math.cos(am) * 34, y: p.y + Math.sin(am) * 34, r: 12, t: 8, cd: .6, ph: m });
    }
  } else if (id === "blinkSlash"){
    var tgt = nearestFoes(1, 500);
    for (var n = 0; n < 3; n++){
      var tf = nearestFoe(700);
      if (!tf) break;
      var ang = Math.atan2(tf.y - p.y, tf.x - p.x);
      p.x = tf.x - Math.cos(ang) * (tf.r + p.r + 8);
      p.y = tf.y - Math.sin(ang) * (tf.r + p.r + 8);
      hurtFoe(tf, 78, "#e0cdff", true);
      slashFx(p.x, p.y, 52);
      p.hp = Math.min(p.maxhp, p.hp + 6);
    }
    G.shake = 8;
  }
  toast("终极技 · " + (CHARS[G.char].ultDesc.split("：")[0]));
  refreshHud();
}

/* ---- 敌人 ---- */
function spawnFoe(kind){
  var p = G.p;
  var def = FOES[kind];
  var a = Math.random() * Math.PI * 2;
  var rad = Math.hypot(W / 2, H / 2);
  var d = rnd(rad * .60, rad * .86);
  var x = clamp(p.x + Math.cos(a) * d, 40, WORLD - 40);
  var y = clamp(p.y + Math.sin(a) * d, 40, WORLD - 40);
  var scale = 1 + G.t / 300 * .85;
  G.foes.push({
    key: kind, x: x, y: y, r: def.r, spd: def.spd,
    hp: def.hp * scale, maxhp: def.hp * scale, dmg: def.dmg,
    color: def.color, ranged: def.ranged, suicide: def.suicide,
    atk: 0, slow: 0, dead: false, z: zoneAt(x, y)
  });
}
function spawnBoss(i){
  var b = BOSSES[i], p = G.p;
  var z0 = ZONES[2];
  var x = z0.x + z0.w / 2 + rnd(-90, 90), y = z0.y + z0.h / 2 + rnd(-90, 90);
  G.foes.push({
    key: b.key, n: b.n, x: x, y: y, r: b.r, spd: b.spd,
    hp: b.hp, maxhp: b.hp, dmg: b.dmg, color: b.color, boss: true,
    atk: 1.2, slow: 0, dead: false, z: 2, phase: 0, tele: 0
  });
  toast(b.n + " 出现在上层");
  G.shake = 9;
}

/* ---- 输入 ---- */
function inputDir(){
  var dx = 0, dy = 0;
  if (keys["w"] || keys["arrowup"]) dy -= 1;
  if (keys["s"] || keys["arrowdown"]) dy += 1;
  if (keys["a"] || keys["arrowleft"]) dx -= 1;
  if (keys["d"] || keys["arrowright"]) dx += 1;
  if (stick.active){
    dx += stick.x; dy += stick.y;
  }
  var len = Math.hypot(dx, dy);
  if (len > 1){ dx /= len; dy /= len; }
  return { x: dx, y: dy, len: Math.min(1, len) };
}

/* ---- 主更新 ---- */
function update(dt){
  // 特效寿命（任何模式都推进，便于暂停时也冻住）
  if (G.mode === "play"){
    G.t += dt;
    G.statTick = (G.statTick || 0) + dt;
  }
  updateFx(dt);
  if (G.mode !== "play" || !G.p) return;

  var p = G.p;

  // 时间 / 守卫
  if (G.guardIdx < 3 && G.t >= [60, 160, 255][G.guardIdx]){
    spawnBoss(G.guardIdx);
    G.guardIdx++;
    updateGuardDots();
  }
  if (G.t >= G.dur){ endGame(G.guardDead >= 3); return; }

  // 移动
  var dir = inputDir();
  if (dir.len > 0.01){
    p.face = Math.atan2(dir.y, dir.x);
    p.bob += dt * (6 + dir.len * 8);
  }
  var sp = p.spd * (1 + (p.pas.swift || 0) * .07);
  if (p.dashT > 0) sp *= 3.1;
  var mx = dir.x * sp * dt, my = dir.y * sp * dt;
  mx += (p.vx || 0) * dt; my += (p.vy || 0) * dt;
  p.vx = (p.vx || 0) * Math.pow(0.0015, dt);
  p.vy = (p.vy || 0) * Math.pow(0.0015, dt);
  p.x = clamp(p.x + mx, 24, WORLD - 24);
  p.y = clamp(p.y + my, 24, WORLD - 24);

  // 跳跃 / 落地
  if (p.airborne > 0){
    p.airH += dt * 2.6;
    if (p.airH >= 1){ p.airH = 1; }
    p.airT -= dt;
    if (p.airT <= 0) land();
  }
  // 计时器
  p.invT = Math.max(0, p.invT - dt);
  p.dashT = Math.max(0, p.dashT - dt);
  p.iFrameCd = Math.max(0, p.iFrameCd - dt);

  // 技能冷却与自动释放
  var cdMul = 1 / (1 + (p.pas.haste || 0) * .07);
  for (var i = 0; i < p.skills.length; i++){
    var s = p.skills[i];
    s.cd -= dt;
    if (s.cd <= 0){
      var ok = castSkill(s);
      s.cd = SKILLS[s.id].cd * cdMul + (ok ? 0 : 0.18);
    }
  }
  // 终极充能
  p.ult.charge = Math.min(p.ult.need, p.ult.charge + dt * 3.6);

  // 环绕
  if (p.hasOrbit){
    for (var oi = 0; oi < 2; oi++){
      var a = G.t * 2.1 + oi * Math.PI;
      var ox = p.x + Math.cos(a) * 52 * p.rngMul, oy = p.y + Math.sin(a) * 52 * p.rngMul;
      for (var fi = 0; fi < G.foes.length; fi++){
        var ff = G.foes[fi];
        if (dist2(ox, oy, ff.x, ff.y) < (12 + ff.r) * (12 + ff.r)){
          if ((ff._orbT || 0) <= 0){
            hurtFoe(ff, SKILLS.orbit.dmg * (1 + (p.skills[0].lv - 1) * .3), "#cdb6ff", false);
            ff._orbT = 0.5;
            var ang = Math.atan2(ff.y - p.y, ff.x - p.x);
            ff.x += Math.cos(ang) * 14; ff.y += Math.sin(ang) * 14;
          }
        }
      }
    }
  }

  // 伙伴
  for (var q = G.friends.length - 1; q >= 0; q--){
    var fr = G.friends[q];
    fr.t -= dt; fr.cd -= dt;
    if (fr.t <= 0){ G.friends.splice(q, 1); continue; }
    var tf2 = nearestFoe(400);
    if (tf2){
      var ang2 = Math.atan2(tf2.y - fr.y, tf2.x - fr.x);
      fr.x += Math.cos(ang2) * 130 * dt; fr.y += Math.sin(ang2) * 130 * dt;
      if (fr.cd <= 0 && dist2(fr.x, fr.y, tf2.x, tf2.y) < (150) * (150)){
        fr.cd = 0.9;
        boomAt(fr.x, fr.y, 54, 22, "rgba(150,230,140,.8)");
      }
    }
  }

  // 敌人
  updateFoes(dt);

  // 子弹
  updateShots(dt);

  // 经验珠
  var pick = p.pickR + (p.pas.magnet || 0) * 34;
  for (var k = G.orbs.length - 1; k >= 0; k--){
    var ob = G.orbs[k];
    ob.life -= dt;
    if (ob.life <= 0){ G.orbs.splice(k, 1); continue; }
    var dd = Math.hypot(p.x - ob.x, p.y - ob.y);
    if (dd < pick){
      var a3 = Math.atan2(p.y - ob.y, p.x - ob.x);
      var mv = 260 * dt * (1 + (pick - dd) / pick * 1.6);
      ob.x += Math.cos(a3) * mv; ob.y += Math.sin(a3) * mv;
    }
    if (dd < 18){
      gainXp(ob.v); G.orbs.splice(k, 1);
    }
  }

  // 区域伤害
  for (var zi = G.zones.length - 1; zi >= 0; zi--){
    var z = G.zones[zi];
    z.t -= dt;
    if (z.kind === "poison" && z.dmg > 0){
      z.tick -= dt;
      if (z.tick <= 0){
        z.tick = 0.45;
        boomAt(z.x, z.y, z.r, z.dmg * .42, "rgba(150,225,110,.65)");
      }
    }
    if (z.t <= 0){
      if (z.kind === "boomdelay"){
        boomAt(z.x, z.y, z.r, 120, "rgba(255,170,110,.9)");
        G.shake = 8;
      }
      G.zones.splice(zi, 1);
    }
  }

  // 相机
  var lead = Math.min(W, H) * .06;
  var tcx = p.x + Math.cos(p.face) * lead, tcy = p.y + Math.sin(p.face) * lead;
  G.cam.x += (tcx - G.cam.x) * Math.min(1, dt * 7);
  G.cam.y += (tcy - G.cam.y) * Math.min(1, dt * 7);

  // 刷新 HUD
  G.hudAcc = (G.hudAcc || 0) + dt;
  if (G.hudAcc > 0.12){ G.hudAcc = 0; refreshHud(); }
}

function updateFoes(dt){
  var p = G.p;
  var cap = 130;
  // 生成
  if (G.foes.length < cap && G.guardDead < 3){
    G.spawnAcc += dt;
    var interval = Math.max(0.26, 0.95 - G.t / 300 * .65);
    if (G.spawnAcc > interval){
      G.spawnAcc = 0;
      var n = G.t > 150 ? 2 : 1;
      var pool = ["zombie", "spider"];
      if (G.t > 70) pool.push("boneshot");
      if (G.t > 130) pool.push("husk");
      if (G.t > 190) pool.push("bomber");
      for (var i = 0; i < n; i++) spawnFoe(pool[Math.floor(Math.random() * pool.length)]);
    }
  }

  for (var i = G.foes.length - 1; i >= 0; i--){
    var f = G.foes[i];
    if (f.dead){ G.foes.splice(i, 1); continue; }
    f.slow = Math.max(0, f.slow - dt);
    f._orbT = Math.max(0, (f._orbT || 0) - dt);
    var spd = f.spd * (f.slow > 0 ? .45 : 1);
    var dx = p.x - f.x, dy = p.y - f.y;
    var d = Math.hypot(dx, dy);
    if (d > 0.01){
      var ux = dx / d, uy = dy / d;
      if (f.ranged && d < 320){
        // 保持距离
        if (d < 210){ f.x -= ux * spd * dt; f.y -= uy * spd * dt; }
        f.atk -= dt;
        if (f.atk <= 0 && d < 420){
          f.atk = 1.6;
          G.shots.push({ x: f.x, y: f.y, vx: ux * 300, vy: uy * 300, dmg: f.dmg, pierce: 1, hit: [], life: 1.6, bad: true });
        }
      } else {
        if (d > f.r + p.r - 6){ f.x += ux * spd * dt; f.y += uy * spd * dt; }
        f.atk -= dt;
        if (f.atk <= 0 && d < f.r + p.r + 8){
          f.atk = 1.05;
          hurtPlayer(f.dmg);
          if (f.suicide){ boomAt(f.x, f.y, 66, 0, "rgba(255,150,110,.8)"); killFoe(f); }
        }
      }
    }
    // boss 阶段技
    if (f.boss){
      f.tele -= dt;
      if (f.tele <= 0){
        f.tele = f.key === "warden" ? 3.4 : 4.4;
        // 震荡波
        G.zones.push({ x: f.x, y: f.y, r: 120, kind: "shock", t: .5, max: .5, dmg: 0, tick: 99 });
        if (dist2(f.x, f.y, p.x, p.y) < 130 * 130 && p.airH < .35) hurtPlayer(f.dmg * .8);
        if (f.hp / f.maxhp < .4){
          // 狂暴：召唤小怪
          for (var s2 = 0; s2 < 3; s2++) spawnFoe("zombie");
        }
      }
    }
  }
}

function updateShots(dt){
  var p = G.p;
  for (var i = G.shots.length - 1; i >= 0; i--){
    var s = G.shots[i];
    s.life -= dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.life <= 0){ G.shots.splice(i, 1); continue; }
    if (s.bad){
      if (dist2(s.x, s.y, p.x, p.y) < (p.r + 6) * (p.r + 6)){
        hurtPlayer(s.dmg);
        G.shots.splice(i, 1); continue;
      }
    } else {
      for (var j = 0; j < G.foes.length; j++){
        var f = G.foes[j];
        if (s.hit.indexOf(f) >= 0) continue;
        if (dist2(s.x, s.y, f.x, f.y) < (f.r + 6) * (f.r + 6)){
          hurtFoe(f, s.dmg, "#ffe6a4", false);
          if (s.slow) f.slow = Math.max(f.slow, s.slow);
          s.hit.push(f);
          s.pierce--;
          if (s.pierce <= 0){ G.shots.splice(i, 1); break; }
        }
      }
    }
  }
}

function updateFx(dt){
  // 粒子
  for (var i = G.parts.length - 1; i >= 0; i--){
    var p = G.parts[i];
    p.life -= dt;
    if (p.life <= 0){ G.parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.pow(.12, dt); p.vy *= Math.pow(.12, dt);
  }
  // 数字
  for (var j = G.nums.length - 1; j >= 0; j--){
    var n = G.nums[j];
    n.life -= dt;
    n.y -= 26 * dt;
    if (n.life <= 0) G.nums.splice(j, 1);
  }
  // 电弧
  for (var k = G.bolts.length - 1; k >= 0; k--){
    G.bolts[k].t -= dt;
    if (G.bolts[k].t <= 0) G.bolts.splice(k, 1);
  }
  // 屏幕衰减
  G.shake *= Math.pow(.02, dt);
  if (G.shake < .4) G.shake = 0;
  G.hitFlash = Math.max(0, G.hitFlash - dt * 2.2);
}

function land(){
  var p = G.p;
  p.airT = 0;
  var from = p.jumpFromZone, to = zoneAt(p.x, p.y);
  var drop = Math.max(0, from - to);
  var r = 96 * p.rngMul;
  var dmg = 34 + drop * 34;
  // 砸击
  for (var i = 0; i < G.foes.length; i++){
    var f = G.foes[i];
    if (dist2(p.x, p.y, f.x, f.y) < (r + f.r) * (r + f.r)) hurtFoe(f, dmg, drop > 0 ? "#fff0b0" : "#ffe6a4", drop > 0);
  }
  G.zones.push({ x: p.x, y: p.y, r: r, kind: "shock", t: .3 * G.fxDur, max: .3 * G.fxDur, dmg: 0, tick: 99 });
  for (var k = 0; k < 12; k++){
    var a = Math.random() * Math.PI * 2;
    G.parts.push({ x: p.x, y: p.y, s: rnd(2, 5), c: "rgba(180,220,180,.55)", vx: Math.cos(a) * rnd(60, 150), vy: Math.sin(a) * rnd(60, 150), life: .45, max: .45 });
  }
  if (drop > 0) G.shake = 8;
  p.airborne = 0; p.airH = 0;
}

function doJump(){
  var p = G.p;
  if (p.airborne > 0) return;
  p.airborne = 1;
  p.airT = 0.46;
  p.airH = 0;
  p.jumpFromZone = zoneAt(p.x, p.y);

function doDash(){
  var p = G.p;
  if (p.dashT > 0) return;
  p.dashT = 0.22;
  p.invT = Math.max(p.invT, 0.3);
  if (G.char === "enderman"){
    var tf = nearestFoe(300);
    if (tf){
      var a = Math.atan2(tf.y - p.y, tf.x - p.x);
      p.x = tf.x - Math.cos(a) * (tf.r + p.r + 10);
      p.y = tf.y - Math.sin(a) * (tf.r + p.r + 10);
      slashFx(p.x, p.y, 44);
      hurtFoe(tf, 26, "#d9c6ff", false);
      return;
    }
  }
  var dir = inputDir();
  var a2 = dir.len > .1 ? Math.atan2(dir.y, dir.x) : p.face;
  p.vx = Math.cos(a2) * 520; p.vy = Math.sin(a2) * 520;
}

function buildChoices(){
  var p = G.p, out = [];
  // 1. 已有技能升级
  var ups = [];
  p.skills.forEach(function(s){
    if (s.lv < 5) ups.push({ type: "up", id: s.id });
  });
  // 2. 新技能（未持有）
  var pool = ["orbit", "bolt", "frost", "poison", "boom", "quake"].filter(function(id){
    return !p.skills.some(function(s){ return s.id === id; });
  });
  // 3. 被动
  var pas = Object.keys(PASSIVES).filter(function(k){ return (p.pas[k] || 0) < PASSIVES[k].max; });

  // 三类各抽一张，保证每次都有得选
  function draw(arr, n){
    var out = [];
    for (var i = 0; i < n && arr.length; i++){
      var k = Math.floor(Math.random() * arr.length);
      out.push(arr.splice(k, 1)[0]);
    }
    return out;
  }
  var picked = [];
  picked = picked.concat(draw(ups, 1));
  picked = picked.concat(draw(pool, 1));
  picked = picked.concat(draw(pas, 1));
  // 不足三张就补任意
  while (picked.length < 3){
    var extra = ups.length ? draw(ups, 1) : (pool.length ? draw(pool, 1) : (pas.length ? draw(pas, 1) : null));
    if (!extra) break;
    picked = picked.concat(extra);
  }
  if (!picked.length) picked = ["heal"];

  picked.forEach(function(item){
    if (typeof item === "string" && item === "heal"){
      out.push({ k: "补给", n: "回满血", lvText: "恢复", d: "把血补满，接着打。", pct: 100, apply: function(){ p.hp = p.maxhp; } });
      return;
    }
    var kind;
    if (typeof item === "string") kind = PASSIVES[item] ? "pas" : "new";
    else kind = item.type;
    if (kind === "up"){
      var sid = item.id || item;
      var sk = p.skills.find(function(x){ return x.id === sid; });
      if (!sk) return;
      out.push({
        k: "招式强化", n: SKILLS[sid].n, lvText: "Lv " + sk.lv + " → " + (sk.lv + 1),
        d: "伤害与效果再上一层，冷却同步收紧。", pct: sk.lv / 5,
        apply: function(){ sk.lv++; }
      });
    } else if (kind === "new"){
      var nid = item.id || item;
      out.push({
        k: "新招式", n: SKILLS[nid].n, lvText: SKILLS[nid].k,
        d: SKILLS[nid].d, pct: 0,
        apply: function(){
          if (p.skills.length < 4) p.skills.push({ id: nid, lv: 1, cd: 0 });
          else {
            var weakest = p.skills.reduce(function(a, b){ return a.lv <= b.lv ? a : b; });
            weakest.lv++;
          }
          if (nid === "orbit") p.hasOrbit = true;
          renderSkills();
        }
      });
    } else {
      var pk = item.key || item;
      var cur = p.pas[pk] || 0;
      out.push({
        k: "被动", n: PASSIVES[pk].n, lvText: "Lv " + cur + " → " + (cur + 1),
        d: PASSIVES[pk].d, pct: cur / PASSIVES[pk].max,
        apply: function(){
          p.pas[pk] = cur + 1;
          if (pk === "guard"){ p.maxhp += 22; p.hp += 22; }
          else if (pk === "swift"){ /* 移动时读取 */ }
          else if (pk === "magnet"){ /* 读取 p.pickR */ }
        }
      });
    }
  });
  return out;
}

var stick = { active: false, x: 0, y: 0, id: null };
(function bindStick(){
  var base = document.getElementById("stickBase"), knob = document.getElementById("stickKnob");
  function isTouch(){ return ("ontouchstart" in window) || navigator.maxTouchPoints > 0; }
  if (isTouch()){
    base.style.display = "block";
    document.getElementById("tbtns").style.display = "flex";
  }
  function setBy(clientX, clientY){
    var rect = base.getBoundingClientRect();
    var cx0 = rect.left + rect.width / 2, cy0 = rect.top + rect.height / 2;
    var dx = clientX - cx0, dy = clientY - cy0;
    var r = rect.width / 2;
    var len = Math.hypot(dx, dy);
    if (len > r) { dx = dx / len * r; dy = dy / len * r; }
    knob.style.transform = "translate(" + dx + "px," + dy + "px)";
    stick.x = dx / r; stick.y = dy / r;
  }
  function onStart(e){
    e.preventDefault();
    stick.active = true;
    var t = e.changedTouches ? e.changedTouches[0] : e;
    stick.id = t.identifier;
    setBy(t.clientX, t.clientY);
  }
  function onMove(e){
    if (!stick.active) return;
    e.preventDefault();
    var t = e.changedTouches ? e.changedTouches[0] : e;
    setBy(t.clientX, t.clientY);
  }
  function onEnd(e){
    stick.active = false;
    knob.style.transform = "translate(0,0)";
    stick.x = 0; stick.y = 0;
  }
  base.addEventListener("touchstart", onStart, { passive: false });
  base.addEventListener("touchmove", onMove, { passive: false });
  base.addEventListener("touchend", onEnd);
  base.addEventListener("touchcancel", onEnd);
  base.addEventListener("mousedown", onStart);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onEnd);

  document.getElementById("tJump").onclick = function(){ if (G.mode === "play") doJump(); };
  document.getElementById("tDash").onclick = function(){ if (G.mode === "play") doDash(); };
  document.getElementById("tUlt").onclick = function(){ if (G.mode === "play") castUlt(); };
})();

var TILE = 70;

/* 离屏噪声纹理，给地面一点"苔藓"的密度 */
function makeTex(base, dots, n, mossy){
  var c = document.createElement("canvas");
  c.width = 128; c.height = 128;
  var g = c.getContext("2d");
  g.fillStyle = base;
  g.fillRect(0, 0, 128, 128);
  for (var i = 0; i < n; i++){
    var x = Math.random() * 128, y = Math.random() * 128;
    g.fillStyle = dots;
    g.globalAlpha = Math.random() * .5 + .12;
    if (mossy){
      g.fillRect(x, y, Math.random() * 5 + 1, Math.random() * 2 + 1);
    } else {
      g.fillRect(x, y, 1 + Math.random() * 2, 1 + Math.random() * 2);
    }
  }
  g.globalAlpha = 1;
  return c;
}
var TEXLOW = null, TEXMID = null, TEXHIGH = null;
function initTex(){
  if (TEXLOW) return;
  TEXLOW  = cx.createPattern(makeTex("#142119", "rgba(110,175,140,.4)", 240, true), "repeat");
  TEXMID  = cx.createPattern(makeTex("#1a2e23", "rgba(165,230,175,.6)", 320, true), "repeat");
  TEXHIGH = cx.createPattern(makeTex("#25402e", "rgba(190,245,200,.65)", 300, true), "repeat");
}

function drawGround(){
  initTex();
  var bx = Math.floor((G.cam.x - W / 2 - TILE) / TILE) * TILE;
  var by = Math.floor((G.cam.y - H / 2 - TILE) / TILE) * TILE;
  var bw = Math.ceil((W + TILE * 2) / TILE + 1) * TILE;
  var bh = Math.ceil((H + TILE * 2) / TILE + 1) * TILE;

  // 低地底色铺满可见区
  cx.fillStyle = "#1a2a20";
  cx.fillRect(bx, by, bw, bh);
  cx.fillStyle = TEXLOW;
  cx.fillRect(bx, by, bw, bh);
  cx.fillStyle = "rgba(0,0,0,.06)";
  cx.fillRect(bx, by, bw, bh);

  // 低地格子（苔藓地）
  for (var x = bx; x < bx + bw; x += TILE){
    for (var y = by; y < by + bh; y += TILE){
      if (x < 0 || y < 0 || x > WORLD || y > WORLD) continue;
      if (zoneAt(x + TILE / 2, y + TILE / 2) > 0) continue;
      var gx = x / TILE, gy = y / TILE;
      var hv = ((gx * 73856093) ^ (gy * 19349663)) % 3;
      cx.fillStyle = hv === 0 ? "#1a291f" : (hv === 1 ? "#19281e" : "#1b2a20");
      cx.fillRect(x, y, TILE, TILE);
      if (((gx + gy) % 2) === 0){
        cx.fillStyle = "rgba(150,220,175,.028)";
        cx.fillRect(x, y, TILE, TILE);
      }
      cx.strokeStyle = "rgba(150,220,175,.045)";
      cx.lineWidth = 1;
      cx.strokeRect(x + .5, y + .5, TILE, TILE);
    }
  }

  // 台地 1
  var z1 = ZONES[1];
  cx.fillStyle = "#182b21";
  cx.fillRect(z1.x, z1.y, z1.w, z1.h);
  cx.fillStyle = TEXMID;
  cx.fillRect(z1.x, z1.y, z1.w, z1.h);
  cx.fillStyle = "rgba(120,235,155,.07)";
  cx.fillRect(z1.x, z1.y, z1.w, z1.h);
  cx.fillStyle = "rgba(0,0,0,.4)";
  cx.fillRect(z1.x, z1.y + z1.h, z1.w, 14);
  cx.fillRect(z1.x + z1.w, z1.y, 14, z1.h);
  cx.strokeStyle = "rgba(180,240,195,.34)";
  cx.lineWidth = 3;
  cx.beginPath();
  cx.moveTo(z1.x, z1.y + z1.h); cx.lineTo(z1.x, z1.y); cx.lineTo(z1.x + z1.w, z1.y);
  cx.stroke();
  cx.strokeStyle = "rgba(4,8,6,.5)";
  cx.lineWidth = 5;
  cx.beginPath();
  cx.moveTo(z1.x + z1.w, z1.y); cx.lineTo(z1.x + z1.w, z1.y + z1.h); cx.lineTo(z1.x, z1.y + z1.h);
  cx.stroke();

  // 台地 2
  var z2 = ZONES[2];
  cx.fillStyle = "#22382b";
  cx.fillRect(z2.x, z2.y, z2.w, z2.h);
  cx.fillStyle = TEXHIGH;
  cx.fillRect(z2.x, z2.y, z2.w, z2.h);
  cx.fillStyle = "rgba(150,245,180,.11)";
  cx.fillRect(z2.x, z2.y, z2.w, z2.h);
  cx.fillStyle = "rgba(0,0,0,.42)";
  cx.fillRect(z2.x, z2.y + z2.h, z2.w, 16);
  cx.fillRect(z2.x + z2.w, z2.y, 16, z2.h);
  cx.strokeStyle = "rgba(205,250,220,.42)";
  cx.lineWidth = 3;
  cx.beginPath();
  cx.moveTo(z2.x, z2.y + z2.h); cx.lineTo(z2.x, z2.y); cx.lineTo(z2.x + z2.w, z2.y);
  cx.stroke();
  cx.strokeStyle = "rgba(4,8,6,.55)";
  cx.lineWidth = 5;
  cx.beginPath();
  cx.moveTo(z2.x + z2.w, z2.y); cx.lineTo(z2.x + z2.w, z2.y + z2.h); cx.lineTo(z2.x, z2.y + z2.h);
  cx.stroke();

  // 上层信标
  var scx = z2.x + z2.w / 2, scy = z2.y + z2.h / 2;
  cx.fillStyle = "rgba(126,240,160,.09)";
  cx.beginPath(); cx.arc(scx, scy, 64, 0, Math.PI * 2); cx.fill();
  cx.strokeStyle = "rgba(126,240,160,.3)";
  cx.lineWidth = 1.5;
  cx.stroke();
  cx.fillStyle = "rgba(126,240,160,.5)";
  cx.fillRect(scx - 4, scy - 4, 8, 8);

  // 世界边界
  cx.strokeStyle = "rgba(232,192,106,.18)";
  cx.lineWidth = 3;
  cx.strokeRect(0, 0, WORLD, WORLD);
}

function drawZonesFx(){
  for (var i = 0; i < G.zones.length; i++){
    var z = G.zones[i];
    var a = Math.min(1, z.t / 0.6) * (z.kind === "poison" ? .18 : .10);
    cx.fillStyle = z.kind === "poison" ? "rgba(140,220,90," + a + ")" : "rgba(126,240,160," + a + ")";
    cx.beginPath(); cx.arc(z.x, z.y, z.r, 0, Math.PI * 2); cx.fill();
    cx.strokeStyle = z.kind === "poison" ? "rgba(160,230,110,.30)" : "rgba(126,240,160,.22)";
    cx.lineWidth = 1.5;
    cx.stroke();
  }
}

function drawOrbs(){
  for (var i = 0; i < G.orbs.length; i++){
    var o = G.orbs[i];
    if (!inView(o.x, o.y, 30)) continue;
    o.ph = (o.ph || 0) + 0.09;
    var s = 1 + Math.sin(o.ph) * .16;
    cx.save();
    cx.globalAlpha = Math.min(1, o.life * 6);
    cx.fillStyle = "rgba(126,240,160,.28)";
    cx.beginPath(); cx.arc(o.x, o.y, 11 * s, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = "#a6ffc4";
    cx.fillRect(o.x - 3.5, o.y - 3.5, 7, 7);
    cx.restore();
  }
}

function drawArrow(s){
  var ang = Math.atan2(s.vy, s.vx);
  cx.save();
  cx.translate(s.x, s.y); cx.rotate(ang);
  cx.strokeStyle = s.bad ? "rgba(255,150,140,.9)" : "rgba(235,240,225,.9)";
  cx.lineWidth = 2.4;
  cx.beginPath(); cx.moveTo(-9, 0); cx.lineTo(7, 0); cx.stroke();
  cx.fillStyle = s.bad ? "rgba(255,150,140,.95)" : "rgba(235,240,225,.95)";
  cx.beginPath(); cx.moveTo(11, 0); cx.lineTo(5, -3.2); cx.lineTo(5, 3.2); cx.closePath(); cx.fill();
  cx.restore();
}

function drawPlayer(dt){
  var p = G.p;
  if (!p) return;
  var lift = p.airH * 26;
  var y = p.y - lift;
  var bob = Math.sin(p.bob) * 2.2;

  // 光环
  var gl = cx.createRadialGradient(p.x, p.y, 4, p.x, p.y, 58);
  gl.addColorStop(0, "rgba(126,240,160,.16)");
  gl.addColorStop(1, "rgba(126,240,160,0)");
  cx.fillStyle = gl;
  cx.beginPath(); cx.arc(p.x, p.y, 58, 0, Math.PI * 2); cx.fill();

  // 影子
  cx.fillStyle = "rgba(0,0,0,.34)";
  cx.beginPath();
  cx.ellipse(p.x, p.y + 6, p.r * .92 * (1 - p.airH * .25), p.r * .46 * (1 - p.airH * .25), 0, 0, Math.PI * 2);
  cx.fill();

  cx.save();
  cx.translate(p.x, y + bob);
  var c = CHARS[G.char];

  if (G.char === "creeper"){
    cx.fillStyle = "#79c97d";
    roundRect(-16, -16, 32, 36, 6);
    cx.strokeStyle = "rgba(20,50,25,.6)"; cx.lineWidth = 1.5;
    roundRect(-16, -16, 32, 36, 6, true);
    cx.fillStyle = "#16241b";
    cx.fillRect(-9, -7, 6, 6); cx.fillRect(3, -7, 6, 6);
    cx.fillRect(-3, 4, 6, 10);
  } else if (G.char === "skeleton"){
    cx.fillStyle = "#e2ded1";
    roundRect(-11, -18, 22, 22, 5);
    cx.fillStyle = "#171a16";
    cx.fillRect(-7, -11, 5, 5); cx.fillRect(2, -11, 5, 5);
    cx.fillRect(-2, -2, 4, 4);
    cx.fillStyle = "#cfcab8";
    roundRect(-8, 4, 16, 18, 4);
  } else if (G.char === "slime"){
    var sq = 1 + Math.sin(p.bob * 1.6) * .06;
    cx.fillStyle = "rgba(138,216,106,.92)";
    cx.beginPath();
    cx.ellipse(0, 2, 20 * sq, 16 / sq, 0, 0, Math.PI * 2);
    cx.fill();
    cx.fillStyle = "rgba(230,255,220,.9)";
    cx.fillRect(-9, -2, 5, 5); cx.fillRect(5, -2, 5, 5);
  } else {
    cx.fillStyle = "#272031";
    roundRect(-9, -26, 18, 34, 3);
    cx.fillStyle = "#9a7fd6";
    cx.fillRect(-7, -6, 5, 6); cx.fillRect(3, -6, 5, 6);
    cx.fillStyle = "rgba(200,170,255,.55)";
    cx.fillRect(-3, -40, 6, 16);
  }
  cx.restore();

  // 无敌闪烁
  if (p.invT > 0){
    cx.strokeStyle = "rgba(255,255,255," + (0.18 + 0.18 * Math.sin(G.t * 30)) + ")";
    cx.lineWidth = 2;
    cx.beginPath(); cx.arc(p.x, y + bob, p.r + 5, 0, Math.PI * 2); cx.stroke();
  }
  // 瞄准线
  if (G.aimMode === "manual"){
    cx.strokeStyle = "rgba(126,240,160,.25)";
    cx.lineWidth = 1.5;
    cx.beginPath();
    cx.moveTo(p.x, y + bob);
    cx.lineTo(p.x + Math.cos(p.face) * 80, y + bob + Math.sin(p.face) * 80);
    cx.stroke();
  }
}

/* 僵尸类通用身形 */
function that_mob(r, col){
  var dark = "rgba(0,0,0,.35)";
  cx.fillStyle = col;
  cx.fillRect(-r * .5, r * .28, r * .32, r * .62);
  cx.fillRect(r * .18, r * .28, r * .32, r * .62);
  cx.fillStyle = col;
  cx.fillRect(-r * .6, -r * .5, r * 1.2, r * .85);
  cx.fillStyle = "rgba(255,255,255,.12)";
  cx.fillRect(-r * .6, -r * .5, r * 1.2, r * .18);
  cx.fillStyle = col;
  cx.fillRect(-r * .92, -r * .35, r * .3, r * .8);
  cx.fillRect(r * .62, -r * .35, r * .3, r * .8);
  cx.fillStyle = col;
  roundRect(-r * .55, -r * 1.4, r * 1.1, r * .95, 3);
  cx.fillStyle = "rgba(24,30,20,.92)";
  cx.fillRect(-r * .34, -r * 1.12, r * .22, r * .2);
  cx.fillRect(r * .12, -r * 1.12, r * .22, r * .2);
  cx.fillStyle = "rgba(0,0,0,.35)";
  cx.fillRect(-r * .55, -r * .52, r * 1.1, r * .1);
}

function drawFoe(f){
  var lift = (f.z - zoneAt(f.x, f.y)) * 0;
  if (f.boss){
    cx.save();
    cx.fillStyle = "rgba(0,0,0,.42)";
    cx.beginPath(); cx.ellipse(f.x, f.y + 14, f.r * 1.1, f.r * .48, 0, 0, Math.PI * 2); cx.fill();
    cx.translate(f.x, f.y);
    var R = f.r;
    if (f.key === "golem"){
      // 铁傀儡：宽肩、长臂、粗腿
      cx.fillStyle = "#c6cdc8";
      cx.fillRect(-R * 1.15, -R * .2, R * .34, R * 1.9);   // 左臂
      cx.fillRect(R * .81, -R * .2, R * .34, R * 1.9);     // 右臂
      cx.fillRect(-R * .62, R * .5, R * .46, R * 1.1);     // 左腿
      cx.fillRect(R * .16, R * .5, R * .46, R * 1.1);      // 右腿
      cx.fillStyle = "#aeb7b1";
      cx.fillRect(-R, -R * 1.1, R * 2, R * 1.6);
      cx.fillStyle = "#98a39d";
      cx.fillRect(-R * .34, -R * .28, R * .68, R * .5);    // 胸口
      cx.fillStyle = "#e4645c";
      cx.fillRect(-R * .62, -R * .82, R * .36, R * .2);
      cx.fillRect(R * .26, -R * .82, R * .36, R * .2);
      cx.strokeStyle = "rgba(60,70,66,.5)"; cx.lineWidth = 2;
      cx.strokeRect(-R, -R * 1.1, R * 2, R * 1.6);
    } else if (f.key === "warden"){
      // 监守者：触角 + 胸口核心
      cx.fillStyle = "#2d4f57";
      roundRect(-R * .85, -R * .7, R * 1.7, R * 2.4, 10);
      cx.fillStyle = "#3f7280";
      cx.beginPath();
      cx.moveTo(-R * .8, -R * .7); cx.lineTo(-R * 1.15, -R * 1.9);
      cx.lineTo(-R * .55, -R * 1.1); cx.closePath(); cx.fill();
      cx.beginPath();
      cx.moveTo(R * .8, -R * .7); cx.lineTo(R * 1.15, -R * 1.9);
      cx.lineTo(R * .55, -R * 1.1); cx.closePath(); cx.fill();
      var core = cx.createRadialGradient(0, -R * .1, 2, 0, -R * .1, R * .55);
      core.addColorStop(0, "rgba(130,255,235,.95)");
      core.addColorStop(1, "rgba(60,190,180,0)");
      cx.fillStyle = core;
      cx.beginPath(); cx.arc(0, -R * .1, R * .55, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = "rgba(150,255,240,.9)";
      cx.fillRect(-R * .55, -R * .62, R * .34, R * .16);
      cx.fillRect(R * .21, -R * .62, R * .34, R * .16);
    } else {
      // 凋零：三头剪影 + 悬浮
      cx.fillStyle = "#3a3440";
      roundRect(-R * .7, -R * .55, R * 1.4, R * 2.1, 6);
      cx.fillStyle = "#57505f";
      cx.beginPath(); cx.arc(-R * .55, -R * 1.0, R * .45, 0, Math.PI * 2); cx.fill();
      cx.beginPath(); cx.arc(R * .55, -R * 1.0, R * .45, 0, Math.PI * 2); cx.fill();
      cx.beginPath(); cx.arc(0, -R * 1.35, R * .5, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = "rgba(255,150,110,.95)";
      cx.fillRect(-R * .72, -R * 1.12, R * .16, R * .12);
      cx.fillRect(R * .56, -R * 1.12, R * .16, R * .12);
      cx.fillRect(-R * .16, -R * 1.5, R * .16, R * .12);
      cx.fillRect(R * .0, -R * 1.5, R * .16, R * .12);
    }
    cx.restore();
    // 血条
    var bw = f.r * 2.2, bx = f.x - bw / 2, by = f.y - f.r * 1.45 - 12;
    cx.fillStyle = "rgba(0,0,0,.6)";
    cx.fillRect(bx, by, bw, 5);
    cx.fillStyle = "#e4645c";
    cx.fillRect(bx, by, bw * Math.max(0, f.hp / f.maxhp), 5);
    return;
  }

  cx.save();
  cx.fillStyle = "rgba(0,0,0,.3)";
  cx.beginPath(); cx.ellipse(f.x, f.y + 4, f.r * .9, f.r * .42, 0, 0, Math.PI * 2); cx.fill();
  cx.translate(f.x, f.y);
  cx.fillStyle = f.color;
  cx.shadowColor = "rgba(0,0,0,.55)";
  cx.shadowBlur = 0;
  if (f.key === "spider"){
    cx.beginPath(); cx.ellipse(0, 0, f.r, f.r * .72, 0, 0, Math.PI * 2); cx.fill();
    cx.strokeStyle = f.color; cx.lineWidth = 2;
    for (var i = 0; i < 4; i++){
      var a = Math.PI / 5 + i * Math.PI / 6;
      cx.beginPath(); cx.moveTo(0, 0);
      cx.lineTo(Math.cos(a) * f.r * 1.5, Math.sin(a) * f.r * 1.2); cx.stroke();
      cx.beginPath(); cx.moveTo(0, 0);
      cx.lineTo(-Math.cos(a) * f.r * 1.5, Math.sin(a) * f.r * 1.2); cx.stroke();
    }
  } else if (f.key === "boneshot"){
    // 骷髅弓手：头骨 + 弓
    cx.fillStyle = "#e3ded0";
    roundRect(-f.r * .55, -f.r * 1.35, f.r * 1.1, f.r * 1.05, 6);
    cx.fillStyle = "#241f19";
    cx.fillRect(-f.r * .34, -f.r * 1.1, f.r * .22, f.r * .24);
    cx.fillRect(f.r * .12, -f.r * 1.1, f.r * .22, f.r * .24);
    cx.fillStyle = "#cfc9b8";
    cx.fillRect(-f.r * .45, -f.r * .28, f.r * .9, f.r * .34);
    cx.fillRect(-f.r * .62, -f.r * .2, f.r * .22, f.r * .9);
    cx.fillStyle = "#8a6b3e";
    cx.strokeStyle = "#8a6b3e"; cx.lineWidth = 2.4;
    cx.beginPath(); cx.arc(f.r * .78, -f.r * .1, f.r * .62, -Math.PI * .55, Math.PI * .55); cx.stroke();
  } else if (f.key === "bomber"){
    // 爆破僵尸：僵尸 + 头顶引信
    that_mob(f.r, f.color);
    cx.fillStyle = "#d15c4a";
    cx.fillRect(-f.r * .12, -f.r * 1.95, f.r * .24, f.r * .3);
    cx.fillStyle = "rgba(255,180,90,.9)";
    cx.beginPath(); cx.arc(0, -f.r * 1.98, 2.6, 0, Math.PI * 2); cx.fill();
  } else {
    that_mob(f.r, f.color);
    if (f.key === "husk"){
      cx.fillStyle = "rgba(60,45,30,.55)";
      cx.fillRect(-f.r * .58, -f.r * 1.05, f.r * 1.16, f.r * .2);
    }
  }
  cx.restore();

  // 血量小条
  if (f.hp < f.maxhp){
    cx.fillStyle = "rgba(0,0,0,.5)";
    cx.fillRect(f.x - 12, f.y - f.r - 10, 24, 3);
    cx.fillStyle = "rgba(228,100,92,.9)";
    cx.fillRect(f.x - 12, f.y - f.r - 10, 24 * (f.hp / f.maxhp), 3);
  }
  // 减速标记
  if (f.slow > 0){
    cx.strokeStyle = "rgba(150,220,255,.65)";
    cx.lineWidth = 1.4;
    cx.beginPath(); cx.arc(f.x, f.y, f.r + 4, 0, Math.PI * 2); cx.stroke();
  }
}

function drawBolts(){
  for (var i = 0; i < G.bolts.length; i++){
    var b = G.bolts[i];
    var a = Math.min(1, b.t * 4);
    cx.strokeStyle = "rgba(180,235,255," + (0.9 * a) + ")";
    cx.lineWidth = 2.6;
    cx.beginPath();
    var n = 7;
    cx.moveTo(b.x1, b.y1);
    for (var k = 1; k < n; k++){
      var t = k / n;
      var jx = rnd(-9, 9), jy = rnd(-9, 9);
      cx.lineTo(b.x1 + (b.x2 - b.x1) * t + jx, b.y1 + (b.y2 - b.y1) * t + jy);
    }
    cx.lineTo(b.x2, b.y2);
    cx.stroke();
    cx.strokeStyle = "rgba(255,255,255," + (0.55 * a) + ")";
    cx.lineWidth = 1;
    cx.stroke();
  }
}

function drawParts(dt){
  for (var i = 0; i < G.parts.length; i++){
    var p = G.parts[i];
    cx.globalAlpha = Math.max(0, p.life / p.max);
    cx.fillStyle = p.c;
    cx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
  }
  cx.globalAlpha = 1;
}

function drawNums(){
  cx.textAlign = "center";
  for (var i = 0; i < G.nums.length; i++){
    var n = G.nums[i];
    var a = Math.max(0, n.life / n.max);
    cx.globalAlpha = a;
    cx.font = "600 " + (n.big ? 20 : 15) + "px Georgia, serif";
    cx.fillStyle = n.c;
    cx.fillText(n.v, n.x, n.y);
  }
  cx.globalAlpha = 1;
  cx.textAlign = "left";
}

function drawOrbit(){
  var p = G.p;
  if (!p || !p.hasOrbit) return;
  for (var i = 0; i < 2; i++){
    var a = G.t * 2.1 + i * Math.PI;
    var r = 52 * G.p.rngMul;
    var x = p.x + Math.cos(a) * r, y = p.y + Math.sin(a) * r - p.airH * 26;
    cx.fillStyle = "rgba(154,127,214,.9)";
    cx.beginPath(); cx.arc(x, y, 7, 0, Math.PI * 2); cx.fill();
    cx.strokeStyle = "rgba(200,170,255,.45)"; cx.lineWidth = 1;
    cx.stroke();
  }
}

function render(dt){
  viewBounds();
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx.clearRect(0, 0, W, H);

  var sh = G.shake > 0 ? rnd(-G.shake, G.shake) : 0;
  cx.save();
  cx.translate(W / 2 + sh, H / 2 + sh * .7);
  cx.translate(-G.cam.x, -G.cam.y);

  drawGround();
  drawZonesFx();
  drawOrbs();

  // 敌人
  for (var i = 0; i < G.foes.length; i++){
    var f = G.foes[i];
    if (inView(f.x, f.y, 90)) drawFoe(f);
  }
  // 玩家
  drawPlayer(dt);
  drawOrbit();
  // 子弹
  for (var j = 0; j < G.shots.length; j++){
    var s = G.shots[j];
    if (inView(s.x, s.y, 30)) drawArrow(s);
  }
  // 电弧 / 粒子 / 数字
  drawBolts();
  drawParts(dt);
  drawNums();

  cx.restore();

  // 受击红边
  if (G.hitFlash > 0){
    var grd = cx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .72);
    grd.addColorStop(0, "rgba(180,40,40,0)");
    grd.addColorStop(1, "rgba(180,40,40," + (0.34 * G.hitFlash) + ")");
    cx.fillStyle = grd;
    cx.fillRect(0, 0, W, H);
  }
  // 暗角
  var vig = cx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .30, W / 2, H / 2, Math.max(W, H) * .78);
  vig.addColorStop(0, "rgba(0,0,0,0)");
  vig.addColorStop(1, "rgba(0,0,0,.3)");
  cx.fillStyle = vig;
  cx.fillRect(0, 0, W, H);
}

function roundRect(x, y, w, h, r, strokeOnly){
  cx.beginPath();
  cx.moveTo(x + r, y);
  cx.lineTo(x + w - r, y); cx.quadraticCurveTo(x + w, y, x + w, y + r);
  cx.lineTo(x + w, y + h - r); cx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  cx.lineTo(x + r, y + h); cx.quadraticCurveTo(x, y + h, x, y + h - r);
  cx.lineTo(x, y + r); cx.quadraticCurveTo(x, y, x + r, y);
  if (strokeOnly) cx.stroke(); else cx.fill();
}
requestAnimationFrame(loop);
</script>
