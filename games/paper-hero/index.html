<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#2A1F1A" />
<title>纸片勇者 · 红肠王国大冒险</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FCF6E6'/%3E%3Cpath d='M16 26S6 19.4 6 13.2A5.2 5.2 0 0 1 16 10.1a5.2 5.2 0 0 1 10 3.1C26 19.4 16 26 16 26z' fill='%23E2574C'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
<style id="mobfit-css">
/* mobfit: 手机手感与横屏提醒 */
html.mob-touch{-webkit-tap-highlight-color:transparent}
html.mob-touch body{overscroll-behavior:none;overscroll-behavior-y:contain;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#mobfit-rot{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9998;background:rgba(12,16,20,.88);color:#eaf5ee;border:1px solid rgba(130,205,170,.45);border-radius:10px;padding:7px 13px;font:12px/1.45 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;display:none;pointer-events:none;max-width:88vw;text-align:center;backdrop-filter:blur(6px);box-shadow:0 4px 18px rgba(0,0,0,.35)}
#mobfit-rot.on{display:block;animation:mobfitFade 6.2s ease forwards}
@keyframes mobfitFade{0%{opacity:0;transform:translate(-50%,-6px)}8%{opacity:1;transform:translate(-50%,0)}78%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
  <a class="arcade-back" id="arcadeBack" href="../../" hidden>← 游戏厅</a>
  <script>
    // 只有挂在游戏厅里（/games/paper-hero/）才显示返回入口
    if (/\/games\//.test(location.pathname)) document.getElementById('arcadeBack').hidden = false;
  </script>
  <div id="stage">
    <canvas id="game" width="960" height="544"></canvas>
    <div id="touch" aria-hidden="true">
      <div class="pad left">
        <button class="tbtn" data-key="left" aria-label="左">◀</button>
        <button class="tbtn" data-key="right" aria-label="右">▶</button>
      </div>
      <div class="pad right">
        <button class="tbtn small" data-key="ice" aria-label="冰">冰</button>
        <button class="tbtn small" data-key="gun" aria-label="枪">枪</button>
        <button class="tbtn small" data-key="egg" aria-label="蛋">蛋</button>
        <button class="tbtn jump" data-key="jump" aria-label="跳">跳</button>
      </div>
      <button class="tbtn small pausebtn" data-act="pause" aria-label="暂停">暂停</button>
    </div>
  </div>

  <div id="loader">
    <div class="paper">
      <h1>纸片勇者</h1>
      <p>正在剪贴纸片……</p>
      <div class="bar"><i id="barfill"></i></div>
    </div>
  </div>

  <!-- 玩家档案面板：和游戏厅主页共用账号，游戏内不注册 -->
  <div id="account" hidden>
    <div class="acc-backdrop"></div>
    <div class="acc-card" role="dialog" aria-modal="true" aria-labelledby="accTitle">
      <div class="acc-tape"></div>
      <button class="acc-close" id="accClose" aria-label="关闭">×</button>
      <h2 id="accTitle">玩家档案</h2>
      <p class="acc-lead">和游戏厅主页共用同一个账号，游戏里不注册。进度存在这台电脑上。</p>
      <div id="accBody"></div>
      <p class="acc-foot" id="accFoot"></p>
    </div>
  </div>

  <!-- 角色面板 -->
  <div id="skins" hidden>
    <div class="acc-backdrop"></div>
    <div class="acc-card skin-card" role="dialog" aria-modal="true" aria-labelledby="skinTitle">
      <div class="acc-tape"></div>
      <button class="acc-close" id="skinClose" aria-label="关闭">×</button>
      <h2 id="skinTitle">选个角色</h2>
      <p class="acc-lead">单人挑一个；双人同屏 P1、P2 各挑一个，选到同一个会自动换开。</p>
      <div id="skinBody"></div>
      <p class="acc-foot" id="skinFoot"></p>
    </div>
  </div>

  <!-- 关于：更新日志 + 创作者名单 -->
  <div id="about" hidden>
    <div class="acc-backdrop"></div>
    <div class="acc-card about-card" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
      <div class="acc-tape"></div>
      <button class="acc-close" id="aboutClose" aria-label="关闭">×</button>
      <h2 id="aboutTitle">关于纸片勇者</h2>
      <p class="acc-lead">一张张手绘蜡笔画，剪成了一个能跑能跳的小世界。</p>
      <div class="about-tabs">
        <button class="about-tab on" data-tab="log" id="aboutTabLog">更新日志</button>
        <button class="about-tab" data-tab="credits" id="aboutTabCredits">创作者名单</button>
      </div>
      <div class="about-body" id="aboutBody"></div>
      <p class="acc-foot" id="aboutFoot"></p>
    </div>
  </div>

  <!-- 联机面板 -->
  <div id="online" hidden>
    <div class="acc-backdrop"></div>
    <div class="acc-card on-card" role="dialog" aria-modal="true" aria-labelledby="onTitle">
      <div class="acc-tape"></div>
      <button class="acc-close" id="onClose" aria-label="关闭">×</button>
      <h2 id="onTitle">联机竞速</h2>
      <p class="acc-lead" id="onLead">两台设备跑同一张图</p>
      <div id="onBody"></div>
      <p class="acc-foot" id="onFoot"></p>
    </div>
  </div>

  <!-- 游戏厅账号（部署在 games/paper-hero/ 时才有；本地单机跑这里 404，正常） -->
    
  <script src="js/util.js"></script>
  <script src="js/config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/paper.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/oddity.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/profiles.js"></script>
  <script src="js/identity.js"></script>
  <script src="js/account.js"></script>
  <script src="js/hub.js"></script>
  <script src="js/net.js"></script>
  <script src="js/online.js"></script>
  <script src="js/skins.js"></script>
  <script src="js/about.js"></script>
  <script src="js/game.js"></script>
<script id="mobfit-js">
(function(){
  var coarse = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
  if(!coarse) return;
  document.documentElement.classList.add('mob-touch');
  function tip(){
    if(window.innerWidth > window.innerHeight) return;
    var best = null;
    document.querySelectorAll('canvas').forEach(function(c){
      if(c.offsetWidth < 120) return;
      var r = c.width / (c.height || 1);
      if(r > 1.45 && c.offsetWidth >= window.innerWidth * 0.55 && (!best || c.offsetWidth > best.offsetWidth)) best = c;
    });
    if(!best) return;
    var el = document.getElementById('mobfit-rot');
    if(!el){ el = document.createElement('div'); el.id = 'mobfit-rot'; document.body.appendChild(el); }
    if(el.classList.contains('on')) return;
    el.textContent = '横屏玩，画面更大 ⟳';
    el.classList.add('on');
    setTimeout(function(){ el.classList.remove('on'); }, 6400);
  }
  function run(){ setTimeout(tip, 700); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
  window.addEventListener('orientationchange', function(){ setTimeout(tip, 900); });
})();
</script>
</body>
</html>
