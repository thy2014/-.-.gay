'use strict';

/* ============================================================
   节日系统
   ============================================================ */
const FEST_NPC_SPOTS = [
  { id: 'lina', x: 16, y: 16, dir: 'down' },
  { id: 'mai', x: 24, y: 16, dir: 'down' },
  { id: 'you', x: 21, y: 17, dir: 'up' },
  { id: 'lan', x: 13, y: 15, dir: 'right' }
];

const EGG_SPOTS = [
  { x: 11, y: 10 }, { x: 15, y: 15 }, { x: 22, y: 14 },
  { x: 27, y: 12 }, { x: 30, y: 17 }, { x: 18, y: 18 }
];

function startFestival(def) {
  STATE.festival = {
    id: def.id, def, phase: 'intro', timer: 0, eggs: [], collected: 0,
    resultShown: false, ingredient: null
  };
  STATE.hour = 9; STATE.minute = 0;
  STATE.weather = 'sun';
  STATE.map = 'town';
  STATE.player.x = def.start.x * TS + 8;
  STATE.player.y = def.start.y * TS + 14;
  STATE.player.dir = 'up';
  const m = MAPS.town;
  STATE.camera.x = clamp(STATE.player.x - W / 2, 0, m.w * TS - W);
  STATE.camera.y = clamp(STATE.player.y - H / 2 - 8, 0, m.h * TS - H);
  // NPC 集合
  for (const n of NPCS) {
    const spot = FEST_NPC_SPOTS.find(s => s.id === n.id);
    n.hidden = !spot; n.map = 'town';
    if (spot) {
      n.px = spot.x * TS + 8; n.py = spot.y * TS + 14;
      n.tx = spot.x; n.ty = spot.y; n.dir = spot.dir; n.path = []; n.moving = false;
    }
  }
  UI.setArea('小镇 · ' + def.name);
  UI.updateHUD();
  UI.openFestivalIntro(def, () => beginFestivalPlay());
}

function beginFestivalPlay() {
  const f = STATE.festival;
  if (!f) return;
  UI.closeModal();
  f.phase = 'play';
  if (f.id === 'egg') {
    f.timer = 60;
    f.eggs = EGG_SPOTS.map((p, i) => ({ x: p.x, y: p.y, colorIdx: i % 6, taken: false }));
    UI.setFestivalStatus('找彩蛋！剩余 60 秒　0/6');
    toast('60 秒内把 6 颗彩蛋都找到！');
  } else if (f.id === 'dance') {
    UI.setFestivalStatus('找一位好感 ≥ 4 心的朋友跳舞（E 键对话）');
    toast('和朋友们聊聊吧，也许有人愿意和你跳舞。');
  } else if (f.id === 'luau') {
    UI.setFestivalStatus('往大锅里放一样食材（靠近锅按 E）');
    placeFestObj('pot', 16, 15);
  } else if (f.id === 'fair') {
    UI.setFestivalStatus('把最好的作物摆上展台（靠近展台按 E）');
    placeFestObj('stallB', 20, 18);
  } else if (f.id === 'winter') {
    UI.setFestivalStatus('打开礼物盒，看看谁给你准备了礼物');
    placeFestObj('gift', 18, 17);
  }
}

function placeFestObj(type, x, y) {
  if (type === 'stallB') return;
  const m = MAPS.town;
  const o = { type, x, y, solid: false, fest: true };
  m.objs.push(o);
  m.objAt[y][x] = o;
}

function updateFestival(dt) {
  const f = STATE.festival;
  if (!f || f.phase !== 'play') return;
  if (f.id === 'egg') {
    f.timer -= dt;
    const tx = Math.floor(STATE.player.x / TS);
    const ty = Math.floor((STATE.player.y - 2) / TS);
    for (const e of f.eggs) {
      if (!e.taken && e.x === tx && e.y === ty) {
        e.taken = true;
        f.collected++;
        Audio.sfx('coin');
        addParticles(e.x * TS + 8, e.y * TS + 8, '#f2e05a', 8, 9);
        UI.setFestivalStatus('找彩蛋！剩余 ' + Math.max(0, Math.ceil(f.timer)) + ' 秒　' + f.collected + '/6');
      }
    }
    if (f.collected >= 6 || f.timer <= 0) {
      finishEggHunt();
      return;
    }
    UI.setFestivalStatus('找彩蛋！剩余 ' + Math.max(0, Math.ceil(f.timer)) + ' 秒　' + f.collected + '/6');
  }
}

function finishEggHunt() {
  const f = STATE.festival;
  const n = f.collected;
  let reward = 0, extra = '';
  if (n >= 6) {
    reward = 200;
    invAdd('strawberry_seed', 5);
    extra = '，还获得 5 包草莓种子！';
  } else if (n >= 4) { reward = 120; extra = '。'; }
  else if (n >= 2) { reward = 60; extra = '。'; }
  else { reward = 20; extra = '，下次跑快点哦。'; }
  STATE.money += reward;
  STATE.stats.earned += reward;
  f.phase = 'result';
  UI.setFestivalStatus(null);
  UI.openResult('蛋蛋节 · 结束',
    `<p>你找到了 <b>${n}/6</b> 颗彩蛋，获得 <b>${reward}G</b>${extra}</p>`,
    () => finishFestival());
  UI.updateHUD();
}

/* ---------------- 节日互动入口 ---------------- */
function festivalInteract(tx, ty) {
  const f = STATE.festival;
  if (!f || f.phase !== 'play') return false;
  const pt = playerTile();
  const near = (x, y) => Math.abs(tx - x) <= 1 && Math.abs(ty - y) <= 1;
  const nearP = (x, y) => Math.abs(pt.x - x) <= 1 && Math.abs(pt.y - y) <= 1;
  const acted = f.id;
  if (acted === 'dance') {
    const n = npcAtTile(tx, ty);
    if (n) { festivalTalkDance(n); return true; }
    return false;
  }
  if (acted === 'luau') {
    if (near(16, 15) || nearP(16, 15)) { openLuauPicker(); return true; }
  }
  if (acted === 'fair') {
    if (near(20, 18) || nearP(20, 18)) { openFairDisplay(); return true; }
  }
  if (acted === 'winter') {
    if (near(18, 17) || nearP(18, 17)) { openWinterGift(); return true; }
  }
  return false;
}

function festivalTalkDance(n) {
  const hearts = heartsOf(n.id);
  if (hearts < 4) {
    UI.openDialogue(n.id, `朋友，我们还不算太熟呢（${hearts}/4 心）。多来聊聊天、送点礼物吧。`,
      [{ label: '好吧', cb: () => UI.closeModal() }], hearts);
    return;
  }
  // 跳舞
  const f = STATE.festival;
  f.phase = 'dance';
  f.partner = n.id;
  f.timer = 2.6;
  STATE.player.x = n.px - 18;
  STATE.player.y = n.py;
  STATE.player.dir = 'right';
  n.dir = 'left';
  addParticles(STATE.player.x, STATE.player.y - 12, '#f0a0b0', 12, 14);
  Audio.sfx('dance');
  UI.setFestivalStatus('和 ' + n.def.name + ' 跳着舞……');
  setTimeout(() => {
    if (!STATE.festival) return;
    const rel = ensureRel(n.id);
    rel.points = clamp(rel.points + 40, 0, 1000);
    STATE.festival.phase = 'result';
    UI.setFestivalStatus(null);
    UI.openResult('花舞节 · 结束',
      `<p>你和 <b>${n.def.name}</b> 跳了一支舞，好感度 <b>+40</b>。</p><p>现在 ${heartsOf(n.id)} 心。</p>`,
      () => finishFestival());
    UI.updateHUD();
  }, 2600);
}

function openLuauPicker() {
  const list = [];
  for (let i = 0; i < INV_SIZE; i++) {
    const s = STATE.inv[i];
    if (!s) continue;
    const def = ITEMS[s.id];
    if (!def || def.type === 'tool') continue;
    const edible = def.type === 'crop' || def.type === 'food' || def.type === 'forage' || (def.type === 'gift' && def.energy > 0);
    if (!edible) continue;
    list.push({ slot: i, id: s.id, count: s.count });
  }
  if (!list.length) { toast('背包里没有可以下锅的食材。'); return; }
  UI.openItemPicker('往锅里放什么？', list, (slot) => {
    const s = STATE.inv[slot];
    if (!s) return;
    const def = ITEMS[s.id];
    const score = (def.sell || 0) * 2 + ri(0, 20);
    invRemoveSlot(slot, 1);
    const reward = 100 + score;
    STATE.money += reward;
    STATE.stats.earned += reward;
    STATE.festival.phase = 'result';
    UI.setFestivalStatus(null);
    Audio.sfx('coin');
    UI.openResult('夏威夷宴 · 评分',
      `<p>你把 <b>${def.name}</b> 放进了大锅。</p><p>评分 <b>${score}</b> 分，获得 <b>${reward}G</b>。</p><p>老麦：这锅汤有你的功劳！</p>`,
      () => finishFestival());
    UI.updateHUD();
  });
}

function openFairDisplay() {
  const crops = [];
  for (const s of STATE.inv) {
    if (!s) continue;
    const def = ITEMS[s.id];
    if (def && def.type === 'crop') crops.push({ id: s.id, count: s.count, sell: def.sell });
  }
  if (!crops.length) { toast('背包里还没有作物可以参展。'); return; }
  crops.sort((a, b) => b.sell - a.sell);
  const best = crops.slice(0, 3);
  const score = best.reduce((sum, c) => sum + c.sell, 0) + 30;
  const reward = Math.round(120 + score * 1.2);
  STATE.money += reward;
  STATE.stats.earned += reward;
  STATE.festival.phase = 'result';
  UI.setFestivalStatus(null);
  Audio.sfx('coin');
  const names = best.map(c => `${ITEMS[c.id].name}（${c.sell}G）`).join('、');
  UI.openResult('丰收祭 · 评展',
    `<p>你摆出了：${names}。</p><p>总分 <b>${score}</b>，获得 <b>${reward}G</b>，还赢下了一枚丰收奖章。</p>`,
    () => finishFestival());
  UI.updateHUD();
}

function openWinterGift() {
  const n = pick(NPC_DEFS);
  const gifts = ['bread', 'egg', 'hazelnut', 'flower', 'parsnip_seed'];
  const giftId = pick(gifts);
  invAdd(giftId, 1);
  STATE.festival.phase = 'result';
  UI.setFestivalStatus(null);
  Audio.sfx('gift');
  UI.openResult('冬星节 · 交换礼物',
    `<p><b>${n.name}</b> 把一个小盒子塞到你手里：<b>${ITEMS[giftId].name}</b>。</p><p>「冬星节快乐，明年也一起过吧。」</p>`,
    () => finishFestival());
  UI.updateHUD();
}

function finishFestival() {
  const f = STATE.festival;
  if (!f) return;
  STATE.flags.festivalDone.push(f.id + '-Y' + STATE.year);
  STATE.festival = null;
  // 移除节日临时物件
  const m = MAPS.town;
  m.objs = m.objs.filter(o => !o.fest);
  for (const row of m.objAt) for (let i = 0; i < row.length; i++) if (row[i] && row[i].fest) row[i] = null;
  rebuildStatic(m);
  STATE.hour = 18; STATE.minute = 0;
  UI.setFestivalStatus(null);
  UI.closeModal();
  STATE.transition = null;
  STATE.fade = 0;
  travelTo('farm', 4, 7);
  toast('节日结束了，回到农场。', 2.5);
  UI.updateHUD();
}

/* ---------------- 节日绘制 ---------------- */
function drawFestivalDecor(ctx, cx, cy) {
  const f = STATE.festival;
  if (!f) return;
  // 气球
  const balloons = [[8, 12], [12, 11], [30, 12], [34, 13], [24, 11], [16, 10]];
  balloons.forEach(([x, y], i) => {
    const img = ART.objects.balloon[i % 4];
    const bob = Math.sin(performance.now() / 700 + i) * 1.5;
    ctx.drawImage(img, Math.round(x * TS - cx), Math.round(y * TS - 24 - cy + bob));
  });
  // 彩蛋
  if (f.id === 'egg' && f.eggs) {
    for (const e of f.eggs) {
      if (e.taken) continue;
      const img = ART.objects.eggs[e.colorIdx];
      const bob = Math.sin(performance.now() / 500 + e.x) * 1;
      ctx.drawImage(img, Math.round(e.x * TS + 3 - cx), Math.round(e.y * TS + 3 - cy + bob));
    }
  }
}

function drawFestPot(ctx, cx, cy) {
  const f = STATE.festival;
  if (!f) return;
  if (f.id === 'luau') {
    const img = ART.objects.pot;
    ctx.drawImage(img, Math.round(16 * TS + 8 - 12 - cx), Math.round(16 * TS - cy));
  }
  if (f.id === 'winter') {
    const img = ART.objects.gift;
    ctx.drawImage(img, Math.round(18 * TS + 8 - 8 - cx), Math.round(17 * TS + 2 - cy));
  }
}


/* ===== 11_ui.js ===== */
'use strict';

/* ============================================================
   UI：HUD、背包、商店、出货、对话、关系、菜单
   ============================================================ */
const UI = {
  modalOpen: false,
  locked: false,
  primaryBtn: null,
  _toastTimer: 0,
  _clockCache: '',

  /* ---------- 基础 ---------- */
  el(id) { return document.getElementById(id); },

  handleKey(code) {
    if (STATE && STATE.screen === 'title') return false;
    if (code === 'Escape') {
      if (this.modalOpen) {
        if (!this.locked) { this.closeModal(); return true; }
        return true;
      }
      return false;
    }
    if (this.modalOpen && (code === 'Space' || code === 'KeyE' || code === 'Enter' || code === 'NumpadEnter')) {
      if (this.dialogueOpen) { this.closeModal(); return true; }
      if (this.primaryBtn && !this.primaryBtn.disabled) { this.primaryBtn.click(); return true; }
      return true;
    }
    return false;
  },

  closeModal() {
    this.modalOpen = false;
    this.locked = false;
    this.primaryBtn = null;
    this.dialogueOpen = false;
    this.el('modal').classList.add('hidden');
    this.el('dialogue').classList.add('hidden');
    if (STATE) STATE.paused = false;
  },

  showBox(title, bodyHtml, buttons, opts = {}) {
    this.modalOpen = true;
    this.locked = !!opts.locked;
    this.el('dialogue').classList.add('hidden');
    this.dialogueOpen = false;
    this.el('modal-title').textContent = title;
    this.el('modal-body').innerHTML = bodyHtml;
    const foot = this.el('modal-foot');
    foot.innerHTML = '';
    this.primaryBtn = null;
    for (const b of buttons) {
      const btn = document.createElement('button');
      btn.className = 'btn ' + (b.cls || '');
      btn.textContent = b.label;
      if (b.disabled) btn.disabled = true;
      if (b.cls === 'primary') this.primaryBtn = btn;
      btn.addEventListener('click', () => b.cb && b.cb());
      foot.appendChild(btn);
    }
    this.el('modal-close').style.display = opts.hideClose ? 'none' : '';
    this.el('modal').classList.remove('hidden');
    if (STATE) STATE.paused = true;
    this.paintIconCanvases(this.el('modal-body'));
    // 滚回顶部
    this.el('modal-body').scrollTop = 0;
  },

  /* 用 canvas 画图标，避免某些 webview 拦截 data: 图片后快捷栏空白 */
  paintIconCanvases(root) {
    if (!root || typeof ART === 'undefined' || !ART) return;
    root.querySelectorAll('canvas.ico[data-icon]').forEach(cv => {
      const src = ART.icons[cv.dataset.icon] || ART.icons._unknown;
      const g = cv.getContext('2d');
      g.imageSmoothingEnabled = false;
      g.clearRect(0, 0, cv.width, cv.height);
      g.drawImage(src, 0, 0);
    });
    root.querySelectorAll('canvas.pico[data-portrait]').forEach(cv => {
      const src = ART.portraits[cv.dataset.portrait];
      if (!src) return;
      const g = cv.getContext('2d');
      g.imageSmoothingEnabled = false;
      g.clearRect(0, 0, cv.width, cv.height);
      g.drawImage(src, 0, 0);
    });
  },

  iconTag(id, cls) {
    return `<canvas class="${cls || 'ico'}" width="16" height="16" data-icon="${id}"></canvas>`;
  },

  /* ---------- HUD ---------- */
  updateHUD() {
    if (!STATE) return;
    this.el('hud-money-val').textContent = amountStr(STATE.money);
    const pct = Math.round(STATE.energy / STATE.maxEnergy * 100);
    const fill = this.el('energy-fill');
    fill.style.width = pct + '%';
    fill.classList.toggle('low', pct < 30);
    this.updateHotbar();
    this.updateClock(true);
  },

  updateHotbar() {
    const bar = this.el('hotbar');
    if (!bar || !STATE) return;
    bar.innerHTML = '';
    for (let i = 0; i < HOT_SIZE; i++) {
      const cell = document.createElement('div');
      cell.className = 'slot' + (i === STATE.hot ? ' sel' : '');
      const s = STATE.inv[i];
      if (!s) cell.classList.add('empty');
      const num = document.createElement('span');
      num.className = 'num'; num.textContent = String(i + 1);
      cell.appendChild(num);
      if (s) {
        const icon = document.createElement('canvas');
        icon.className = 'ico';
        icon.width = 16; icon.height = 16;
        const g = icon.getContext('2d');
        g.imageSmoothingEnabled = false;
        const src = ART.icons[s.id] || ART.icons._unknown;
        g.drawImage(src, 0, 0);
        cell.appendChild(icon);
        if (s.count > 1) {
          const c = document.createElement('span');
          c.className = 'cnt'; c.textContent = s.count > 99 ? '99+' : s.count;
          cell.appendChild(c);
        }
        cell.title = (ITEMS[s.id] ? ITEMS[s.id].name : '') + ' · ' + (ITEMS[s.id] ? ITEMS[s.id].desc || '' : '');
      }
      cell.addEventListener('click', () => {
        if (STATE.paused || UI.modalOpen) return;
        STATE.hot = i; this.updateHUD(); Audio.sfx('tick');
      });
      bar.appendChild(cell);
    }
  },

  updateClock(force) {
    if (!STATE) return;
    const dEl = this.el('hud-date'), tEl = this.el('hud-time'), wEl = this.el('hud-weather');
    if (!dEl) return;
    const wk = WEEKDAYS[(STATE.day - 1) % 7];
    const key = STATE.season + stateDayKey() + STATE.hour + ':' + Math.floor(STATE.minute / 10) + STATE.weather;
    if (!force && key === this._clockCache) return;
    this._clockCache = key;
    dEl.textContent = `${SEASONS[STATE.season].name} ${STATE.day}日 · ${wk}`;
    tEl.textContent = timeStr(STATE.hour, STATE.minute);
    wEl.textContent = weatherIcon(STATE.weather) + ' ' + weatherName(STATE.weather);
  },

  setArea(name) {
    const el = this.el('hud-area');
    if (!el) return;
    el.textContent = name;
    el.style.opacity = '0.92';
    clearTimeout(this._areaTimer);
    this._areaTimer = setTimeout(() => { el.style.opacity = '0'; }, 2600);
  },

  setFestivalStatus(text) {
    const el = this.el('hud-fest');
    if (!el) return;
    if (text) { el.textContent = text; el.style.display = 'block'; }
    else { el.style.display = 'none'; }
  },

  toast(msg, sec = 2.2) {
    const t = this.el('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => t.classList.remove('show'), sec * 1000);
  },

  /* ---------- 背包 ---------- */
  openInventory() {
    if (!STATE || STATE.paused) return;
    const render = () => {
      let grid = '<div class="grid-inv">';
      for (let i = 0; i < INV_SIZE; i++) {
        const s = STATE.inv[i];
        const def = s ? ITEMS[s.id] : null;
        grid += `<div class="inv-cell ${s ? '' : 'empty'}" data-slot="${i}" title="${def ? (def.desc || def.name) : '空格'}">`;
        if (s) {
          grid += `<span class="nm">${def ? def.name : s.id}</span>`;
          grid += this.iconTag(s.id);
          if (s.count > 1) grid += `<span class="n">${s.count}</span>`;
        }
        grid += '</div>';
      }
      grid += '</div>';
      const body = `
        <div class="hint-box">前 9 格显示在快捷栏。点击背包格可与当前手持格交换；点击快捷栏格可直接拿在手上。</div>
        ${grid}
        <div class="stat-line"><span>金币</span><b>${STATE.money} G</b></div>
        <div class="stat-line"><span>体力</span><b>${Math.round(STATE.energy)}/${STATE.maxEnergy}</b></div>
        <div class="stat-line"><span>累计收获</span><b>${STATE.stats.harvest} 个</b></div>
        <div class="stat-line"><span>播种次数</span><b>${STATE.stats.planted} 次</b></div>
        <div class="stat-line"><span>累计收入</span><b>${STATE.stats.earned} G</b></div>
        <div class="stat-line"><span>出货箱待结算</span><b>${STATE.shipped.length} 项</b></div>`;
      this.showBox('背包', body, [{ label: '关闭', cb: () => this.closeModal() }], { cls: '' });
      this.el('modal-body').querySelectorAll('.inv-cell').forEach(cell => {
        cell.addEventListener('click', () => {
          const i = Number(cell.dataset.slot);
          if (!STATE.inv[i]) return;
          if (i < HOT_SIZE) { STATE.hot = i; }
          else {
            const tmp = STATE.inv[STATE.hot];
            STATE.inv[STATE.hot] = STATE.inv[i];
            STATE.inv[i] = tmp;
            this.toast('已与快捷栏第 ' + (STATE.hot + 1) + ' 格交换。', 1.4);
          }
          this.updateHUD();
          render();
        });
      });
    };
    render();
  },

  /* ---------- 商店 ---------- */
  openShop() {
    if (!STATE) return;
    const render = () => {
      const stock = shopStock(STATE.season);
      let rows = '';
      for (const id of stock) {
        const def = ITEMS[id];
        const price = def.buy || 0;
        rows += `<div class="shop-row">
          ${this.iconTag(id)}
          <div class="info"><div class="nm">${def.name}</div><div class="ds">${def.desc || ''}</div></div>
          <div class="price">${price} G</div>
          <div class="btns">
            <button class="btn" data-buy="${id}" data-n="1" ${STATE.money < price ? 'disabled' : ''}>买1</button>
            <button class="btn" data-buy="${id}" data-n="5" ${STATE.money < price * 5 ? 'disabled' : ''}>买5</button>
          </div>
        </div>`;
      }
      const body = `
        <div class="hint-box">莉娜：“当季的种子才有好收成。买回去记得每天浇水。”</div>
        <div style="font-weight:700;margin-bottom:4px">${SEASONS[STATE.season].name}季种子</div>
        ${rows}
        <div class="stat-line" style="margin-top:8px"><span>你的金币</span><b>${STATE.money} G</b></div>`;
      this.showBox('种子商店', body, [
        { label: '关闭', cb: () => this.closeModal() }
      ]);
      this.el('modal-body').querySelectorAll('[data-buy]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.buy, n = Number(btn.dataset.n);
          const def = ITEMS[id];
          const total = (def.buy || 0) * n;
          if (STATE.money < total) { this.toast('金币不够。'); return; }
          const left = invAdd(id, n);
          const added = n - left;
          if (added <= 0) { this.toast('背包满了。'); return; }
          STATE.money -= (def.buy || 0) * added;
          if (left > 0) this.toast('背包满了，只买到 ' + added + ' 包。', 1.6);
          Audio.sfx('coin');
          this.updateHUD();
          render();
        });
      });
    };
    render();
  },

  /* ---------- 出货箱 ---------- */
  openMailbox() {
    if (!STATE) return;
    if (!STATE.flags.mailRead) {
      STATE.flags.mailRead = true;
      STATE.money += 100;
      STATE.stats.earned += 100;
      invAdd('parsnip_seed', 4);
      this.updateHUD();
      saveGame();
      Audio.sfx('coin');
      this.showBox('镇长来信', `
        <p>欢迎来到小镇，新农场主。</p>
        <p>这片地荒了很久，现在总算有人愿意接手了。随信附上 <b>100G</b> 和 <b>4 包防风草种子</b>，就当是见面礼。</p>
        <p>有空去小镇广场转转，公告板上写着今年的节日安排。<br>——镇长</p>
      `, [{ label: '收下', cls: 'primary', cb: () => this.closeModal() }]);
    } else {
      this.showBox('信箱', '<p>信箱里空空的，只有几片叶子。</p>', [{ label: '关上', cb: () => this.closeModal() }]);
    }
  },

  openNotice() {
    if (!STATE) return;
    const rows = FESTIVALS.map(f => {
      const done = STATE.flags.festivalDone.includes(f.id + '-Y' + STATE.year);

'use strict';

/* ============================================================
   WebAudio 音效与简单 BGM
   ============================================================ */
const Audio = {
  ctx: null,
  master: null,
  muted: false,
  bgmTimer: null,
  started: false,

  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.35;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },

  resume() {
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },

  beep(freq, dur = 0.08, type = 'square', gain = 0.08, slide = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },

  noise(dur = 0.12, gain = 0.06, filterFreq = 1200) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const buf = this.ctx.createBuffer(1, Math.ceil(this.ctx.sampleRate * dur), this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterFreq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
  },

  sfx(name) {
    this.resume();
    switch (name) {
      case 'tick': this.beep(880, 0.03, 'square', 0.04); break;
      case 'hoe': this.noise(0.1, 0.07, 500); this.beep(160, 0.06, 'triangle', 0.05, -40); break;
      case 'water': this.noise(0.22, 0.05, 900); this.beep(520, 0.14, 'sine', 0.03, -200); break;
      case 'plant': this.beep(420, 0.07, 'sine', 0.04, 120); break;
      case 'harvest': this.beep(660, 0.07, 'square', 0.05); setTimeout(() => this.beep(990, 0.1, 'square', 0.05), 70); break;
      case 'chop': this.noise(0.09, 0.08, 380); this.beep(120, 0.08, 'triangle', 0.06); break;
      case 'pick': this.beep(180, 0.05, 'square', 0.05); this.noise(0.07, 0.05, 700); break;
      case 'cut': this.noise(0.1, 0.04, 1600); break;
      case 'fall': this.noise(0.35, 0.08, 300); this.beep(90, 0.2, 'triangle', 0.05, -30); break;
      case 'door': this.beep(260, 0.09, 'triangle', 0.05, -60); break;
      case 'coin': this.beep(1040, 0.05, 'square', 0.05); setTimeout(() => this.beep(1560, 0.08, 'square', 0.04), 55); break;
      case 'gift': this.beep(660, 0.08, 'sine', 0.05); setTimeout(() => this.beep(880, 0.12, 'sine', 0.05), 80); break;
      case 'bad': this.beep(220, 0.14, 'square', 0.05, -80); break;
      case 'eat': this.beep(300, 0.06, 'sine', 0.04); setTimeout(() => this.beep(380, 0.06, 'sine', 0.04), 60); break;
      case 'sleep': this.beep(400, 0.3, 'sine', 0.04, -260); break;
      case 'morning': [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.beep(f, 0.16, 'sine', 0.05), i * 130)); break;
      case 'dance': [523, 659, 784, 1046, 784].forEach((f, i) => setTimeout(() => this.beep(f, 0.12, 'triangle', 0.05), i * 110)); break;
      default: this.beep(600, 0.05, 'square', 0.03);
    }
  },

  toggleMute() {
    this.muted = !this.muted;
    UI.toast(this.muted ? '已静音（按 M 恢复）' : '声音已开启', 1.4);
    if (this.muted) this.stopBGM(); else this.startBGM();
  },

  motifs: [
    [392, 440, 523, 440, 392, 349, 392, 523],
    [440, 523, 587, 523, 494, 440, 392, 494],
    [349, 392, 440, 523, 440, 392, 349, 294],
    [294, 349, 392, 349, 440, 392, 349, 262]
  ],
  bgmIndex: 0,

  startBGM() {
    if (!this.ctx || this.muted || this.bgmTimer) return;
    const playBar = () => {
      if (!STATE || STATE.screen !== 'play' || STATE.paused) return;
      const motif = this.motifs[STATE.season];
      const base = 0.028;
      motif.forEach((f, i) => {
        setTimeout(() => { if (!this.muted) this.beep(f, 0.22, 'triangle', base); }, i * 560);
      });
      this.bgmTimer = setTimeout(playBar, 4800);
    };
    playBar();
  },

  stopBGM() {
    if (this.bgmTimer) { clearTimeout(this.bgmTimer); this.bgmTimer = null; }
  }
};

'use strict';

/* ============================================================
   渲染
   ============================================================ */
let canvas, ctx, VIEW = { k: 1 };

function initRender() {
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
  ctx.imageSmoothingEnabled = false;
  resizeView();
  window.addEventListener('resize', resizeView);
}

function resizeView() {
  const kw = window.innerWidth / W;
  const kh = window.innerHeight / H;
  let k = Math.min(kw, kh);
  if (k >= 1) k = Math.floor(k * 100) / 100;
  if (k >= 1.5) k = Math.floor(k);
  k = Math.max(0.5, k);
  VIEW.k = k;
  const wrap = document.getElementById('stage-wrap');
  const stage = document.getElementById('stage');
  if (wrap) { wrap.style.width = (W * k) + 'px'; wrap.style.height = (H * k) + 'px'; }
  if (stage) stage.style.transform = 'scale(' + k + ')';
}

function cropStage(c) {
  if (c.ready) return 4;
  const grow = CROPS[c.id].growth;
  let acc = 0, st = 0;
  for (const d of grow) {
    acc += d;
    if ((c.g || 0) >= acc) st++; else break;
  }
  return Math.min(3, st);
}

function render(now) {
  if (!STATE) return;
  ctx.clearRect(0, 0, W, H);
  if (STATE.screen === 'title') { renderTitleScene(now); updateFadeEl(); return; }
  const cam = STATE.camera;
  ctx.save();
  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  const m = currentMap();
  if (m.staticDirty) buildStatic(m);
  if (m.staticCanvas) ctx.drawImage(m.staticCanvas, 0, 0);
  drawForageObjects();
  drawWater(now, cam);
  drawSoilAndCrops(cam);
  drawFestivalDecor(ctx, 0, 0);
  drawFestObjects(now, cam);
  drawCharacters();
  drawParticles();
  ctx.restore();
  drawLighting(cam);
  drawWeather(now);
  updateFadeEl();
}

function updateFadeEl() {
  const el = document.getElementById('fade');
  if (el) el.style.opacity = String(STATE.fade || 0);
}

/* ---------------- 采集物 ---------------- */
function drawForageObjects() {
  const m = currentMap();
  for (const o of m.objs) {
    if (o.dead || o.type !== 'forage') continue;
    const a = objectArt(o);
    if (a) ctx.drawImage(a.img, Math.round(o.x * TS + TS / 2 - a.ax), Math.round((o.y + 1) * TS - a.ay));
  }
}

/* ---------------- 水面 ---------------- */
function drawWater(now, cam) {
  const m = currentMap();
  const frame = Math.floor(now / 420) % 2;
  const x0 = Math.floor(cam.x / TS), x1 = Math.ceil((cam.x + W) / TS);
  const y0 = Math.floor(cam.y / TS), y1 = Math.ceil((cam.y + H) / TS);
  for (let y = Math.max(0, y0); y <= Math.min(m.h - 1, y1); y++) {
    for (let x = Math.max(0, x0); x <= Math.min(m.w - 1, x1); x++) {
      if (m.base[y][x] !== 'w') continue;
      ctx.drawImage(ART.ground[STATE.season].water[frame], x * TS, y * TS);
    }
  }
}

/* ---------------- 田地与作物 ---------------- */
function drawSoilAndCrops(cam) {
  if (STATE.map !== 'farm') return;
  const x0 = Math.floor(cam.x / TS), x1 = Math.ceil((cam.x + W) / TS);
  const y0 = Math.floor(cam.y / TS), y1 = Math.ceil((cam.y + H) / TS);
  for (const key of Object.keys(STATE.soil)) {
    const [sx, sy] = key.split(',').map(Number);
    if (sx < x0 - 1 || sx > x1 + 1 || sy < y0 - 1 || sy > y1 + 1) continue;
    const soil = STATE.soil[key];
    if (!soil || !soil.till) continue;
    const px = sx * TS, py = sy * TS;
    ctx.drawImage(soil.wet ? ART.soil.wet : ART.soil.dry, px, py);
    const crop = soil.crop;
    if (crop) {
      const st = cropStage(crop);
      const img = ART.crops[crop.id][st];
      if (crop.dead) {
        ctx.globalAlpha = 0.55;
        ctx.drawImage(img, px, py + 16 - 22);
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(90,70,40,0.45)';
        ctx.fillRect(px, py, 16, 16);
      } else {
        shadowEllipse(ctx, px + 8, py + 15, 5, 2);
        ctx.drawImage(img, px, py + 16 - 22);
        if (crop.ready) {
          const bob = Math.sin(performance.now() / 400 + sx + sy) * 1;
          ctx.fillStyle = 'rgba(255,240,160,0.85)';
          ctx.fillRect(px + 7, py - 2 + bob, 2, 2);
          ctx.fillRect(px + 4, py + bob, 1, 1);
          ctx.fillRect(px + 11, py + 1 + bob, 1, 1);
        }
      }
    }
  }
}

/* ---------------- 节日临时物 ---------------- */
function drawFestObjects(now, cam) {
  const f = STATE.festival;
  if (!f) return;
  if (f.id === 'luau') {
    const img = ART.objects.pot;
    ctx.drawImage(img, 16 * TS + 8 - 12, 16 * TS - 20 + 2);
    const bob = Math.sin(now / 500) * 1;
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(16 * TS + 6, 16 * TS - 26 + bob, 6, 1);
  }
  if (f.id === 'winter') {
    const img = ART.objects.gift;
    const bob = Math.sin(now / 600) * 1;
    ctx.drawImage(img, 18 * TS + 8 - 8, 17 * TS + 16 - 16 + bob);
  }
  if (f.id === 'dance') {
    const t = performance.now() / 300;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + t;
      const xx = 20 * TS + 8 + Math.cos(a) * 26;
      const yy = 14 * TS + 6 + Math.sin(a) * 10;
      ctx.fillStyle = i % 2 ? '#f2e05a' : '#f0a0b0';
      ctx.fillRect(Math.round(xx), Math.round(yy), 2, 2);
    }
  }
}

/* ---------------- 角色 ---------------- */
function drawCharacters() {
  const list = [];
  for (const n of NPCS) {
    if (n.hidden || n.map !== STATE.map) continue;
    list.push({ y: n.py, kind: 'npc', n });
  }
  list.push({ y: STATE.player.y, kind: 'player' });
  list.sort((a, b) => a.y - b.y);
  for (const it of list) {
    if (it.kind === 'npc') drawNPC(ctx, it.n);
    else drawPlayer();
  }
}

function drawPlayer() {
  const p = STATE.player;
  let img;
  if (p.busy > 0) {
    const f = p.actT < 0.1 ? 0 : p.actT < 0.2 ? 1 : 2;
    img = ART.chars.player.act[p.dir][f];
  } else {
    img = ART.chars.player.walk[p.dir][p.moving ? (p.frame % 3) + 1 : 0];
  }
  shadowEllipse(ctx, p.x, p.y - 1, 6, 3);
  ctx.drawImage(img, Math.round(p.x - 8), Math.round(p.y - 24));
  // 挥动工具的拖影
  if (p.busy > 0) {
    const f = facingTile();
    const tx = f.x * TS + 8, ty = f.y * TS + 8;
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    const dir = p.dir;
    if (dir === 'down') { ctx.fillRect(tx - 5, ty + 2, 10, 1); ctx.fillRect(tx - 3, ty + 4, 6, 1); }
    if (dir === 'up') { ctx.fillRect(tx - 5, ty - 4, 10, 1); }
    if (dir === 'left') { ctx.fillRect(tx - 8, ty - 2, 1, 8); }
    if (dir === 'right') { ctx.fillRect(tx + 7, ty - 2, 1, 8); }
  }
}

/* ---------------- 粒子 ---------------- */
function drawParticles() {
  for (const pt of STATE.particles) {
    const a = Math.max(0, pt.life / pt.maxLife);
    if (pt.text) {
      ctx.globalAlpha = Math.min(1, a * 1.4);
      ctx.font = '8px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#1a1008';
      ctx.fillText(pt.text, Math.round(pt.x + 1), Math.round(pt.y + 1));
      ctx.fillStyle = pt.color;
      ctx.fillText(pt.text, Math.round(pt.x), Math.round(pt.y));
      ctx.globalAlpha = 1;
      ctx.textAlign = 'left';
    } else {
      ctx.globalAlpha = a;
      ctx.fillStyle = pt.color;
      ctx.fillRect(Math.round(pt.x), Math.round(pt.y), pt.size, pt.size);
      ctx.globalAlpha = 1;
    }
  }
}

/* ---------------- 光照 ---------------- */
function drawLighting(cam) {
  const m = currentMap();
  const indoor = STATE.map === 'house' || STATE.map === 'shop';
  if (indoor) {
    ctx.fillStyle = 'rgba(255,210,150,0.05)';
    ctx.fillRect(0, 0, W, H);
    return;
  }
  const info = lightingInfo();
  ctx.fillStyle = info.color;
  ctx.fillRect(0, 0, W, H);
  // 灯光/角色光晕
  const night = STATE.hour >= 19 || STATE.hour < 5;
  if (night) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const lamps = m.objs.filter(o => !o.dead && (o.type === 'lamp' || (STATE.festival && o.type === 'stall')));
    for (const o of lamps) {
      const x = o.x * TS + 8 - cam.x, y = o.y * TS - cam.y;
      if (x < -80 || x > W + 80 || y < -80 || y > H + 80) continue;
      const g = ctx.createRadialGradient(x, y, 2, x, y, 54);
      g.addColorStop(0, 'rgba(255,214,140,0.42)');
      g.addColorStop(1, 'rgba(255,214,140,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - 54, y - 54, 108, 108);
    }
    const px = STATE.player.x - cam.x, py = STATE.player.y - 12 - cam.y;
    const g2 = ctx.createRadialGradient(px, py, 2, px, py, 48);
    g2.addColorStop(0, 'rgba(255,230,180,0.22)');
    g2.addColorStop(1, 'rgba(255,230,180,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(px - 48, py - 48, 96, 96);
    ctx.restore();
  }
}

/* ---------------- 天气 ---------------- */
let rainDrops = null;
let snowFlakes = null;

function updateWeatherFx(dt) {
  if (!STATE) return;
  if (!rainDrops) {
    rainDrops = [];
    for (let i = 0; i < 60; i++) rainDrops.push({ x: Math.random() * W, y: Math.random() * H, s: 260 + Math.random() * 220, l: 4 + Math.random() * 4 });
    snowFlakes = [];
    for (let i = 0; i < 46; i++) snowFlakes.push({ x: Math.random() * W, y: Math.random() * H, s: 30 + Math.random() * 40, p: Math.random() * 6 });
  }
  const indoor = STATE.map === 'house' || STATE.map === 'shop';
  if (indoor || STATE.screen !== 'play') return;
  if (STATE.weather === 'rain') {
    for (const d of rainDrops) {
      d.y += d.s * dt; d.x -= 30 * dt;
      if (d.y > H) { d.y = -6; d.x = Math.random() * (W + 40); }
      if (d.x < -10) d.x = W + 10;
    }
  } else if (STATE.weather === 'snow') {
    for (const f of snowFlakes) {
      f.y += f.s * dt;
      f.x += Math.sin((performance.now() / 900) + f.p) * 6 * dt;
      if (f.y > H) { f.y = -6; f.x = Math.random() * W; }
    }
  }
}

function drawWeather(now) {
  if (!STATE || STATE.screen !== 'play') return;
  const indoor = STATE.map === 'house' || STATE.map === 'shop';
  if (indoor) return;
  if (STATE.weather === 'rain' && rainDrops) {
    ctx.strokeStyle = 'rgba(180,215,240,0.55)';
    ctx.lineWidth = 1;
    for (const d of rainDrops) {
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x + 1, d.y + d.l);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(40,70,110,0.12)';
    ctx.fillRect(0, 0, W, H);
  } else if (STATE.weather === 'snow' && snowFlakes) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const f of snowFlakes) ctx.fillRect(Math.round(f.x), Math.round(f.y), 1, 1);
    ctx.fillStyle = 'rgba(200,225,245,0.08)';
    ctx.fillRect(0, 0, W, H);
  } else if (STATE.weather === 'cloud') {
    ctx.fillStyle = 'rgba(120,140,160,0.05)';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---------------- 标题场景 ---------------- */
function renderTitleScene(now) {
  const m = MAPS.farm;
  if (!m || !m.staticCanvas) { drawTitleBackdrop(now); return; }
  const maxX = Math.max(0, m.w * TS - W);
  const camX = (Math.sin(now / 14000) * 0.5 + 0.5) * Math.min(maxX, 150);
  const camY = 0;
  ctx.drawImage(m.staticCanvas, Math.round(-camX), Math.round(-camY));
  // 水面动画
  const frame = Math.floor(now / 420) % 2;
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
    if (m.base[y][x] === 'w') ctx.drawImage(ART.ground[STATE.season].water[frame], x * TS - Math.round(camX), y * TS - Math.round(camY));
  }
  // 飘落的光斑
  ctx.fillStyle = 'rgba(255,235,170,0.5)';
  for (let i = 0; i < 14; i++) {
    const x = (i * 97 + Math.sin(now / 4000 + i) * 30) % W;
    const y = (i * 53 + Math.cos(now / 5000 + i) * 20) % H;
    ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
  }
  ctx.fillStyle = 'rgba(20,14,10,0.18)';
  ctx.fillRect(0, 0, W, H);
}

function drawTitleBackdrop(now) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1c3226');
  g.addColorStop(0.55, '#294432');
  g.addColorStop(1, '#18251c');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(170,205,145,0.10)';
  for (let i = 0; i < 34; i++) {
    const x = (i * 71 + Math.sin(now / 3500 + i) * 22) % W;
    const y = (i * 47 + Math.cos(now / 4500 + i) * 18) % H;
    ctx.fillRect(Math.round(x), Math.round(y), 2, 2);
  }
  ctx.fillStyle = 'rgba(10,16,12,0.20)';
  ctx.fillRect(0, 0, W, H);
}


/* ===== 14_main.js ===== */
'use strict';

/* ============================================================
   启动、标题页、主循环、调试接口
   ============================================================ */
let lastTime = 0;
let worldHasPlayed = false;
let worldReady = false;
let worldInitQueued = false;

function ensureWorld() {
  if (worldReady) return;
  initArt();
  buildAllMaps();
  worldReady = true;
  if (MAPS.farm) buildStatic(MAPS.farm);
}

function queueWorldInit() {
  if (worldReady || worldInitQueued) return;
  worldInitQueued = true;
  const run = () => { worldInitQueued = false; ensureWorld(); };
  if (window.requestIdleCallback) window.requestIdleCallback(run, { timeout: 1000 });
  else setTimeout(run, 60);
}

function boot() {
  STATE = newState();
  initNPCs();
  initRender();
  bindInput();
  wireTitle();
  showTitle();
  requestAnimationFrame(loop);
  queueWorldInit();
}

function wireTitle() {
  document.getElementById('btn-new').addEventListener('click', () => {
    Audio.resume();
    if (hasSave()) {
      UI.openConfirm('新游戏', '已有存档，开始新游戏会覆盖旧进度。要继续吗？', () => {
        UI.closeModal(); startNewGame();
      });
    } else startNewGame();
  });
  document.getElementById('btn-continue').addEventListener('click', () => {
    Audio.resume();
    if (!continueGame()) UI.toast('没有找到存档。');
  });
  document.getElementById('btn-help-title').addEventListener('click', () => {
    UI.openHelp();
  });
  document.getElementById('modal-close').addEventListener('click', () => {
    if (!UI.locked) UI.closeModal();
  });
}

function showTitle() {
  if (!STATE) return;
  UI.closeModal();
  UI.setFestivalStatus(null);
  STATE.screen = 'title';
  STATE.paused = false;
  STATE.festival = null;
  const t = document.getElementById('title');
  if (t) t.classList.remove('hidden');
  UI.hideHUD(true);
  const cont = document.getElementById('btn-continue');
  if (cont) cont.disabled = !hasSave();
}

function preparePlay() {
  const m = currentMap();
  if (m.staticDirty) buildStatic(m);
  STATE.screen = 'play';
  STATE.paused = false;
  document.getElementById('title').classList.add('hidden');
  UI.hideHUD(false);
  placeNPCs(true);
  STATE.camera.x = clamp(STATE.player.x - W / 2, 0, Math.max(0, m.w * TS - W));
  STATE.camera.y = clamp(STATE.player.y - H / 2 - 8, 0, Math.max(0, m.h * TS - H));
  UI.setArea(m.name);
  UI.updateHUD();
  UI.updateClock(true);
  Audio.resume();
  Audio.startBGM();
}

function startNewGame() {
  ensureWorld();
  if (worldHasPlayed) buildAllMaps();
  worldHasPlayed = true;
  STATE = newState();
  initNPCs();
  spawnForage();
  STATE.player.x = 4 * TS + 8;
  STATE.player.y = 7 * TS + 14;
  STATE.player.dir = 'down';
  preparePlay();
  saveGame();
  UI.toast('欢迎来到小农场！按 H 查看操作。', 3.5);
}

function continueGame() {
  ensureWorld();
  if (worldHasPlayed) buildAllMaps();
  worldHasPlayed = true;
  const ok = loadGame();
  if (!ok) {
    STATE = newState();
    initNPCs();
    rebuildAllStatic();
    preparePlay();
    return false;
  }
  rebuildAllStatic();
  preparePlay();
  UI.toast('读档成功，欢迎回来。', 2.4);
  return true;
}

/* ---------------- 主循环 ---------------- */
function loop(t) {
  if (!lastTime) lastTime = t;
  let dt = (t - lastTime) / 1000;
  lastTime = t;
  if (dt > 0.06) dt = 0.06;
  update(dt);
  render(t);
  requestAnimationFrame(loop);
}

function update(dt) {
  if (!STATE) return;
  if (STATE.screen === 'play') {
    const frozen = STATE.transition || (STATE.festival && STATE.festival.phase !== 'play');
    if (!STATE.paused && !UI.modalOpen && !frozen) {
      updatePlayer(dt);
      updateNPCMovement(dt);
      updateFestival(dt);
    }
    updateClock(dt);
    updateWeatherFx(dt);
  }
  updateParticles(dt);
}

function updateParticles(dt) {
  if (!STATE || !STATE.particles) return;
  const f = dt * 60;
  for (const pt of STATE.particles) {
    pt.life -= f;
    if (pt.text) {
      pt.y += pt.vy * f;
    } else {
      pt.x += pt.vx * f;
      pt.y += pt.vy * f;
      pt.vy += 0.08 * f * 3;
    }
  }
  STATE.particles = STATE.particles.filter(p => p.life > 0);
}

/* ---------------- 调试接口（供自动化验证使用） ---------------- */
window.__farm = {
  audio: Audio,
  get state() { return STATE; },
  maps: MAPS,
  npcs: NPCS,
  ui: UI,
  art: ART,
  startNewGame,
  continueGame,
  showTitle,
  skipDay() { advanceDay(false); },
  sleepNow() { sleepNow(false); advanceDay(false); },
  setTime(h, m) { STATE.hour = h; STATE.minute = m || 0; updateNPCs(true); UI.updateHUD(); },
  setMoney(v) { STATE.money = v; UI.updateHUD(); },
  setEnergy(v) { STATE.energy = v; UI.updateHUD(); },
  addItem(id, n) { invAdd(id, n || 1); UI.updateHUD(); },
  teleport(map, x, y) {
    STATE.map = map; STATE.player.x = x * TS + 8; STATE.player.y = y * TS + 14;
    const m = currentMap(); if (m.staticDirty) buildStatic(m);
    placeNPCs(true); UI.setArea(m.name);
    STATE.camera.x = clamp(STATE.player.x - W / 2, 0, Math.max(0, m.w * TS - W));
    STATE.camera.y = clamp(STATE.player.y - H / 2 - 8, 0, Math.max(0, m.h * TS - H));
  },
  setSeason(s) { STATE.season = s; rebuildAllStatic(); UI.updateHUD(); },
  setDay(d) { STATE.day = d; UI.updateHUD(); },
  startFestivalById(id) {
    const f = FESTIVALS.find(x => x.id === id);
    if (f) { STATE.season = f.season; STATE.day = f.day; startFestival(f); }
  },
  growAll() {
    for (const key of Object.keys(STATE.soil)) {
      const s = STATE.soil[key];
      if (s.crop) { s.crop.g = 99; s.crop.ready = true; }
    }
  },
  waterAll() {
    for (const key of Object.keys(STATE.soil)) {
      const s = STATE.soil[key];
      if (s.till) { s.wet = true; if (s.crop) s.crop.watered = true; }
    }
  },
  interact() { interact(); },
  action() { doAction(); },
  closeModal() { UI.closeModal(); }
};

boot();

</script>
