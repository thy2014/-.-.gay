<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小农场物语</title>
<style>
  :root{
    --paper:#f6e9c8; --paper2:#efdfb6; --ink:#3a2a1a; --brown:#6b432a;
    --deep:#2a1a12; --green:#4f7f3e; --gold:#d9a94a; --red:#c05a4a;
    --shadow:rgba(0,0,0,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:#14100c;color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden;user-select:none;
  }
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage-wrap{position:relative;width:480px;height:270px;box-shadow:0 0 40px rgba(0,0,0,.55)}
  #stage{position:absolute;left:0;top:0;width:480px;height:270px;transform-origin:0 0}
  #game{display:block;width:480px;height:270px;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  #fade{position:absolute;left:0;top:0;width:480px;height:270px;background:#0d0a07;opacity:0;pointer-events:none}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;font-size:13px;line-height:1.35}
  #hud.hidden{display:none}
  .panel{
    background:linear-gradient(#f9efd4,#efdfb6);
    border:2px solid #5a3a24;
    box-shadow:0 3px 0 rgba(0,0,0,.32), inset 0 0 0 2px #fff6dd, inset 0 0 0 3px #d9c28f;
    border-radius:3px;color:var(--ink);
  }
  #hud-clock{position:absolute;left:10px;top:10px;padding:6px 10px 7px;min-width:112px}
  #hud-clock .row1{font-size:12px;letter-spacing:.5px;color:#6b4f36}
  #hud-clock .row2{display:flex;align-items:baseline;gap:6px}
  #hud-time{font-size:19px;font-weight:700;letter-spacing:1px}
  #hud-weather{font-size:12px;color:#4f7f3e}
  #hud-money{position:absolute;right:10px;top:10px;padding:6px 12px;font-size:16px;font-weight:700;letter-spacing:.5px}
  #hud-money span{color:#a37b2a;font-size:13px;margin-right:2px}
  #hud-area{
    position:absolute;left:50%;top:10px;transform:translateX(-50%);
    padding:4px 14px;font-size:13px;letter-spacing:2px;opacity:.92;
    background:rgba(42,26,18,.72);color:#f6e9c8;border:1px solid #8a6a4c;border-radius:2px;
    transition:opacity .4s;
  }
  #hud-fest{
    position:absolute;left:50%;top:44px;transform:translateX(-50%);
    padding:5px 12px;font-size:12px;background:rgba(42,26,18,.82);color:#ffe9b0;
    border:1px solid #b08a4e;border-radius:2px;display:none;max-width:80%;text-align:center;
  }
  #energy-wrap{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);width:236px;display:flex;align-items:center;gap:7px}
  #energy-label{font-size:12px;color:#f6e9c8;text-shadow:0 1px 0 #000;letter-spacing:2px}
  #energy-bar{flex:1;height:13px;background:#2a1a12;border:2px solid #5a3a24;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px #00000055}
  #energy-fill{display:block;height:100%;width:100%;background:linear-gradient(#a8d46a,#5f9a3a);transition:width .18s}
  #energy-fill.low{background:linear-gradient(#e8a04a,#c05a4a)}
  #hotbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;pointer-events:auto}
  .slot{
    width:38px;height:38px;background:linear-gradient(#f9efd4,#e8d5a8);
    border:2px solid #6b432a;border-radius:3px;position:relative;cursor:pointer;
    box-shadow:inset 0 0 0 1px #fff6dd, 0 2px 0 rgba(0,0,0,.3);
  }
  .slot canvas.ico{position:absolute;left:4px;top:4px;width:26px;height:26px;image-rendering:pixelated}
  .slot .cnt{position:absolute;right:2px;bottom:1px;font-size:10px;font-weight:700;color:#f6e9c8;text-shadow:0 1px 0 #000,0 0 3px #000}
  .slot .num{position:absolute;left:2px;top:1px;font-size:9px;color:#8a6a4c}
  .slot.sel{border-color:#f0d060;box-shadow:0 0 0 2px #f0d060, inset 0 0 0 1px #fff6dd;transform:translateY(-2px)}
  .slot.empty{opacity:1;background:linear-gradient(#dcc9a1,#cbb185);border-color:#8f6a48;box-shadow:inset 0 2px 3px rgba(0,0,0,.18)}
  #hud-hint{position:absolute;left:10px;bottom:56px;font-size:10px;color:#f6e9c8;text-shadow:0 1px 2px #000;opacity:.85;max-width:108px;line-height:1.4}
  #tooltip{position:absolute;pointer-events:none;background:#2a1a12ee;color:#f6e9c8;font-size:11px;padding:4px 7px;border:1px solid #8a6a4c;border-radius:2px;display:none;max-width:190px;z-index:5}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;top:24%;transform:translate(-50%,0);
    background:rgba(30,20,14,.9);color:#ffe9b0;padding:8px 18px;font-size:14px;
    border:2px solid #8a6a4c;border-radius:3px;opacity:0;pointer-events:none;
    transition:opacity .25s, top .25s;z-index:50;text-align:center;max-width:80vw;
  }
  #toast.show{opacity:1;top:27%}

  /* ---------- 弹窗 ---------- */
  #modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(16,10,6,.62);z-index:60;padding:16px}
  #modal.hidden{display:none}
  .box{
    width:min(600px,94vw);max-height:86vh;background:linear-gradient(#f9efd4,#f2e5c2);
    border:4px solid #6b432a;border-radius:4px;box-shadow:0 0 0 2px #22140c,0 12px 0 rgba(0,0,0,.35);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .box-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#6b432a;color:#ffe9b0}
  .box-head h2{margin:0;font-size:17px;letter-spacing:2px;font-weight:700}
  .box-close{background:none;border:none;color:#ffe9b0;font-size:20px;cursor:pointer;line-height:1;padding:0 4px}
  .box-body{padding:14px;overflow:auto;flex:1;font-size:14px;line-height:1.6}
  .box-foot{padding:10px 14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:#efe0bb;border-top:2px solid #d9c28f}
  .btn{
    font-family:inherit;font-size:14px;padding:7px 16px;cursor:pointer;color:#3a2a1a;
    background:linear-gradient(#fdf5de,#e8d5a8);border:2px solid #6b432a;border-radius:3px;
    box-shadow:0 2px 0 rgba(0,0,0,.3), inset 0 0 0 1px #fff8e3;transition:transform .08s;
  }
  .btn:hover{background:linear-gradient(#fffdf2,#f2e3bd)}
  .btn:active{transform:translateY(2px);box-shadow:none}
  .btn.primary{background:linear-gradient(#a8d46a,#6f9f46);color:#1e2c14;border-color:#3f6b32}
  .btn.danger{background:linear-gradient(#e8a08a,#c05a4a);color:#2a1210;border-color:#7d3a2c}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}

  /* ---------- 对话 ---------- */
  #dialogue{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;z-index:55;padding:0 14px 18px}
  #dialogue.hidden{display:none}
  #dialogue .dlg{
    width:min(720px,96vw);background:linear-gradient(#f9efd4,#efe0bb);
    border:4px solid #6b432a;border-radius:4px;box-shadow:0 0 0 2px #22140c,0 -6px 0 rgba(0,0,0,.25);
    display:flex;gap:14px;padding:14px;align-items:flex-start;
  }
  #dlg-portrait{width:84px;height:84px;image-rendering:pixelated;border:3px solid #6b432a;background:#e8d5a8;border-radius:2px;flex:none;display:block}
  #dlg-main{flex:1;min-width:0}
  #dlg-name{font-size:13px;color:#8a5c38;letter-spacing:1px;margin-bottom:4px}
  #dlg-name b{color:#3a2a1a;font-size:16px;letter-spacing:2px}
  #dlg-hearts{color:#c05a4a;font-size:13px;margin-left:6px;letter-spacing:1px}
  #dlg-text{font-size:15px;line-height:1.7;min-height:44px}
  #dlg-opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:flex-end}

  /* ---------- 列表 ---------- */
  .grid-inv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .inv-cell{
    position:relative;height:60px;background:#fff8e3;border:2px solid #b89a6a;border-radius:3px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:4px;
  }
  .inv-cell canvas.ico{width:36px;height:36px;image-rendering:pixelated}
  .inv-cell .n{position:absolute;right:4px;bottom:2px;font-size:11px;font-weight:700;color:#5a3a24}
  .inv-cell .nm{position:absolute;left:3px;top:2px;font-size:9px;color:#8a6a4c;max-width:90%;overflow:hidden;white-space:nowrap}
  .inv-cell:hover{border-color:#6b432a;background:#fffdf2}
  .inv-cell.empty{opacity:.35;cursor:default}
  .shop-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed #d0b98a}
  .shop-row canvas.ico{width:32px;height:32px;image-rendering:pixelated}
  .shop-row .info{flex:1;min-width:0}
  .shop-row .nm{font-weight:700}
  .shop-row .ds{font-size:12px;color:#7a6246}
  .shop-row .price{font-weight:700;color:#a3763f;white-space:nowrap}
  .shop-row .btns{display:flex;gap:5px}
  .shop-row .btn{padding:4px 9px;font-size:12px}
  .stat-line{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #d9c28f;font-size:13px}
  .rel-row{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px dashed #d9c28f}
  .rel-row canvas.pico{width:54px;height:54px;image-rendering:pixelated;border:2px solid #6b432a;border-radius:2px}
  .rel-row .who{width:92px}
  .rel-row .who b{display:block;font-size:15px}
  .rel-row .who span{font-size:11px;color:#8a6a4c}
  .hearts{font-size:15px;letter-spacing:1px;color:#c05a4a}
  .hearts .off{color:#cbb28a}
  .hearts .half{opacity:.5}
  .hint-box{background:#fff8e3;border:2px solid #d9c28f;border-radius:3px;padding:10px 12px;margin:8px 0;font-size:13px}
  .kbd{display:inline-block;background:#fffdf2;border:1px solid #b89a6a;border-bottom-width:2px;border-radius:2px;padding:0 5px;font-size:12px;font-weight:700;margin:0 2px}

  /* ---------- 标题 ---------- */
  #title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:40;background:linear-gradient(rgba(20,14,10,.55),rgba(20,14,10,.82))}
  #title.hidden{display:none}
  .title-logo{
    font-size:clamp(38px,7vw,72px);letter-spacing:.18em;color:#ffe9b0;font-weight:800;
    text-shadow:4px 4px 0 #6b432a, 8px 8px 0 rgba(0,0,0,.45), 0 0 30px rgba(255,220,140,.35);
    margin-left:.18em;
  }
  .title-sub{color:#c8b48a;font-size:clamp(11px,1.4vw,15px);letter-spacing:.5em;margin-top:10px;text-transform:uppercase}
  .title-menu{display:flex;flex-direction:column;gap:10px;margin-top:34px;width:220px}
  .title-menu .btn{font-size:16px;padding:10px 0;letter-spacing:4px}
  .title-tip{margin-top:18px;font-size:12px;color:#e8d9b8;opacity:.75;letter-spacing:1px}
  .title-foot{position:absolute;bottom:22px;font-size:12px;color:#9c8766;letter-spacing:2px}
  .title-hint{position:absolute;bottom:52px;font-size:11px;color:#7d6a4d;letter-spacing:1px}

  @media (max-width:760px){
    #hud{font-size:11px}
    .slot{width:32px;height:32px}
    .slot img{width:22px;height:22px;left:3px;top:3px}
    #hud-hint{display:none}
    #energy-wrap{width:190px;bottom:48px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage-wrap">
    <div id="stage">
      <canvas id="game" width="480" height="270"></canvas>
      <div id="fade"></div>
    </div>
    <div id="hud" class="hidden">
      <div id="hud-clock" class="panel">
        <div class="row1" id="hud-date">春 1日 · 周一</div>
        <div class="row2"><span id="hud-time">06:00</span><span id="hud-weather">☀ 晴</span></div>
      </div>
      <div id="hud-money" class="panel"><span>G</span><b id="hud-money-val">500</b></div>

</div>

<div id="toast"></div>

    <button class="btn primary" id="btn-new">新游戏</button>

      <div id="dlg-name"></div>
      <div id="dlg-text"></div>
      <div id="dlg-opts"></div>
    </div>
  </div>
</div>

<script>
/* ===== 00_util.js ===== */
'use strict';

/* ============================================================
   小农场物语 — 基础工具
   ============================================================ */
const W = 480, H = 270, TS = 16;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 0, b = 1) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function hash2(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return { c, g, w, h };
}

function pic(w, h) {
  const o = makeCanvas(w, h);
  return {
    c: o.c, g: o.g, w, h,
    r(x, y, ww, hh, col) { o.g.fillStyle = col; o.g.fillRect(Math.round(x), Math.round(y), ww, hh); return this; },
    dot(x, y, col) { o.g.fillStyle = col; o.g.fillRect(Math.round(x), Math.round(y), 1, 1); return this; }
  };
}

function hexToRgb(hex) {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const n = parseInt(hex, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function rgbToHex(r, g, b) {
  const f = (v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0');
  return '#' + f(r) + f(g) + f(b);
}
function shade(hex, amt) {
  const { r, g, b } = hexToRgb(hex);
  return rgbToHex(r + amt, g + amt, b + amt);
}
function mix(hexA, hexB, t) {
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  return rgbToHex(lerp(a.r, b.r, t), lerp(a.g, b.g, t), lerp(a.b, b.b, t));
}

function pad2(n) { return String(n).padStart(2, '0'); }
function timeStr(h, m) {
  const hh = ((h % 24) + 24) % 24;
  return pad2(hh) + ':' + pad2(Math.floor(m / 10) * 10);
}
function amountStr(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  return String(Math.floor(n));
}

/* 圆角像素块 */
function pxRound(p, x, y, w, h, col) {
  p.r(x + 1, y, w - 2, h, col);
  p.r(x, y + 1, w, h - 2, col);
}

/* 阴影椭圆 */
function shadowEllipse(g, cx, cy, rx, ry) {
  g.fillStyle = 'rgba(0,0,0,0.22)';
  for (let y = -ry; y <= ry; y++) {
    const t = 1 - Math.abs(y) / (ry + 0.001);
    const w = Math.round(rx * Math.sqrt(Math.max(0, t)));
    g.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2, 1);
  }
}

/* 像素文字（用于 canvas 内少量文字，如告示牌） */
const FONT5 = {
  '0': ['01110','10001','10001','10001','01110'],
  '1': ['00100','01100','00100','00100','00100'],
  '2': ['01110','10001','00100','01000','11111'],
  '3': ['01110','10001','00110','10001','01110'],
  '4': ['00010','00110','01110','11111','00100'],
  '5': ['11110','00001','01110','10001','01110'],
  '6': ['01110','10001','11111','10001','01110'],
  '7': ['11111','00010','00100','01000','10000'],
  '8': ['01110','10001','01110','10001','01110'],
  '9': ['01110','10001','00110','10001','01110'],
  'A': ['01110','10001','11111','10001','01110'],
  'B': ['11110','10001','11110','10001','11110'],
  'C': ['01110','10001','10001','10001','01110'],
  'D': ['11110','10001','10001','10001','11110'],
  'E': ['11111','10001','11110','10001','11111'],
  'F': ['11111','10001','11110','10001','10001'],
  'G': ['01110','10001','10111','10001','01110'],
  'H': ['10001','10001','11111','10001','10001'],
  'I': ['01110','00100','00100','00100','01110'],
  'J': ['00111','00100','00100','00100','01110'],
  'K': ['10001','10010','10100','11000','10001'],
  'L': ['10000','10000','10000','10000','11110'],
  'M': ['10001','10101','10101','10101','10001'],
  'N': ['10001','10001','10101','10101','10001'],
  'O': ['01110','10001','10001','10001','01110'],
  'P': ['11110','10001','11110','10001','10001'],
  'Q': ['01110','10001','10001','10101','01110'],
  'R': ['11110','10001','11110','10001','10010'],
  'S': ['01110','10001','00110','00001','01110'],
  'T': ['11111','00100','00100','00100','00100'],
  'U': ['10001','10001','10001','10001','01110'],
  'V': ['10001','10001','10001','01010','00100'],
  'W': ['10001','10101','10101','10101','10001'],
  'X': ['10001','01010','00100','01010','10001'],
  'Y': ['10001','01010','00100','00100','00100'],
  'Z': ['11111','00010','00100','01000','11111'],
  '-': ['00000','00000','11111','00000','00000'],
  '.': ['00000','00000','00000','00000','00100'],
  ' ': ['00000','00000','00000','00000','00000']
};
function pixelText(p, text, x, y, col, scale = 1) {
  let cx = x;
  for (const ch of text.toUpperCase()) {
    const rows = FONT5[ch] || FONT5[' '];
    for (let ry = 0; ry < 5; ry++) {
      for (let rx = 0; rx < 5; rx++) {
        if (rows[ry][rx] === '1') p.r(cx + rx * scale, y + ry * scale, scale, scale, col);
      }
    }
    cx += 6 * scale;
  }
}


/* ===== 01_art.js ===== */
'use strict';

/* ============================================================
   程序化像素美术：所有图形在启动时绘制到离屏画布
   ============================================================ */
const ART = {
  ground: [],          // [season] -> {grass:[], grassFlower:[], path:[], sand:[], water:[], snow:[]}
  soil: {},            // dry / wet
  interiors: {},
  trees: {},           // oak, pine, maple, stump, bush
  objects: {},         // rock, weed, flower, fence, bin, fountain, stall, pot, egg, gift, lamp
  buildings: {},       // house, shop, cabin, barn? 
  chars: {},           // player, npc
  portraits: {},
  icons: {},
  crops: {},
  ui: {}
};

const SEASON_NAMES = ['春', '夏', '秋', '冬'];
const SEASON_PAL = [
  { grass: '#5f8f45', speck: '#4e7c39', light: '#79a95c', blade: '#3f6b32', soilEdge: '#6b8f4a' },
  { grass: '#4e823c', speck: '#416f30', light: '#6d9c50', blade: '#355e28', soilEdge: '#5d7f3c' },
  { grass: '#8a7f3f', speck: '#75682f', light: '#a89552', blade: '#6a5c2a', soilEdge: '#8a7f3f' },

/* ---------- 基础形状 ---------- */
function blob(p, cx, cy, rx, ry, col) {
  for (let y = -ry; y <= ry; y++) {
    const t = 1 - Math.abs(y) / (ry + 0.0001);
    const w = Math.round(rx * Math.sqrt(Math.max(0, t)));
    p.r(cx - w, cy + y, w * 2, 1, col);
  }
}

function grassTile(pal, variant) {
  const p = pic(16, 16);
  p.r(0, 0, 16, 16, pal.grass);
  const seed = variant * 37;
  for (let i = 0; i < 16; i++) {
    const x = Math.floor(hash2(seed + i, 11) * 16);
    const y = Math.floor(hash2(seed + i, 23) * 16);
    p.dot(x, y, i % 3 === 0 ? pal.light : pal.speck);
  }
  // 草叶
  for (let i = 0; i < 3; i++) {
    const x = 2 + ((variant * 5 + i * 4) % 12);
    const y = 4 + ((variant * 3 + i * 5) % 10);
    p.r(x, y, 1, 2, pal.blade);
    p.dot(x + 1, y, pal.light);
    p.dot(x - 1, y + 1, pal.blade);
  }
  return p.c;
}

function flowerTile(pal, variant) {
  const p = pic(16, 16);
  p.r(0, 0, 16, 16, pal.grass);
  for (let i = 0; i < 8; i++) {
    p.dot(Math.floor(hash2(variant + i, 5) * 16), Math.floor(hash2(variant + i, 9) * 16), pal.speck);
  }
  const col = ['#f2e05a', '#e86f8a', '#d9d2f0', '#f6f0e4'][variant % 4];
  const xs = [3, 8, 12], ys = [4, 10, 7];
  for (let i = 0; i < 3; i++) {
    const x = xs[(i + variant) % 3], y = ys[(i + variant * 2) % 3];
    p.dot(x, y - 1, col); p.dot(x - 1, y, col); p.dot(x + 1, y, col); p.dot(x, y + 1, col);
    p.dot(x, y, '#f7d24a');
    p.r(x, y + 2, 1, 2, pal.blade);
  }
  return p.c;
}

function pathTile(variant) {
  const p = pic(16, 16);

  for (let i = 0; i < 22; i++) {
    const x = Math.floor(hash2(i + variant * 13, 3) * 16);
    const y = Math.floor(hash2(i + variant * 13, 17) * 16);
    p.dot(x, y, d[i % 3]);
  }
  for (let i = 0; i < 4; i++) {
    p.r(((variant * 3 + i * 5) % 14), ((i * 7 + variant) % 14), 2, 2, '#8a6c44');

  return p.c;
}

/* ---------- 树与植被 ---------- */
function treeSprite(kind, season) {
  const snow = season === 3;
  const p = pic(32, 48);
  const trunk = '#6a472c', trunkD = '#52361f', trunkL = '#84603e';
  if (kind === 'pine') {
    p.r(14, 34, 4, 14, trunk);
    p.r(14, 34, 1, 14, trunkL);
    p.r(17, 34, 1, 14, trunkD);
    const layers = [[8, 26, 10, 12], [10, 18, 12, 10], [12, 11, 8, 8], [14, 4, 4, 7]];
    const col = snow ? '#2f5a4a' : (season === 2 ? '#4f6b38' : '#2f5f3e');
    layers.forEach(([x, y, w, h], i) => {
      p.r(x - 2, y + h - 1, w + 4, 2, snow ? '#24503f' : '#27513a');
      for (let row = 0; row < h; row++) {
        const ww = w - Math.floor((row / h) * w * 0.55);
        p.r(x + Math.floor((w - ww) / 2), y + row, ww, 1, i === 0 ? col : shade(col, 4));
      }
    });
    if (snow) {
      p.r(9, 26, 14, 2, '#e8f2f8'); p.r(11, 18, 10, 2, '#e8f2f8'); p.r(14, 11, 5, 2, '#e8f2f8');
    } else {
      p.r(11, 25, 5, 2, shade(col, 18));
      p.r(13, 16, 4, 2, shade(col, 18));
    }
    return p.c;
  }
  // 阔叶树
  p.r(14, 32, 5, 16, trunk);
  p.r(14, 32, 1, 16, trunkL);
  p.r(18, 32, 1, 16, trunkD);
  p.r(11, 44, 3, 4, trunkD);
  p.r(18, 44, 3, 4, trunkD);
  const leaf = snow ? '#3e6b53' : (kind === 'maple' ? (season === 2 ? '#b8642f' : '#7a8f3f') : (season === 2 ? '#8a7a34' : '#2f6b3f'));
  const leafL = snow ? '#57876e' : shade(leaf, 22);
  const leafD = snow ? '#2f5744' : shade(leaf, -18);
  blob(p, 16, 22, 14, 13, leafD);
  blob(p, 15, 20, 13, 12, leaf);
  blob(p, 10, 17, 7, 7, leafL);
  blob(p, 22, 15, 6, 6, leafL);
  blob(p, 20, 27, 8, 6, shade(leaf, -8));
  blob(p, 9, 27, 7, 5, shade(leaf, -14));
  if (snow) {
    blob(p, 14, 13, 8, 3, '#eef6fb');
    blob(p, 22, 17, 5, 2, '#eef6fb');
  } else {
    blob(p, 13, 15, 5, 3, leafL);
  }
  p.r(15, 30, 3, 2, leafD);
  return p.c;
}

/* ---------- 作物 ---------- */
const CROP_STYLE = {
  parsnip: { type: 'root', fruit: '#e8d5a0', leaf: '#5f9349' },
  potato: { type: 'root', fruit: '#b08a5e', leaf: '#4f7f3e' },
  cauliflower: { type: 'head', fruit: '#f2eddc', leaf: '#3f7a3a' },
  blueberry: { type: 'berry', fruit: '#4a6fb0', leaf: '#3f7a3a' },
  melon: { type: 'fruit', fruit: '#8fb36a', leaf: '#4f7f3e' },
  pepper: { type: 'fruit', fruit: '#d94f3a', leaf: '#3f7a3a' },
  pumpkin: { type: 'fruit', fruit: '#d98a3a', leaf: '#4f7f3e' },
  corn: { type: 'tall', fruit: '#e8c25e', leaf: '#6b9a4a' },
  cranberry: { type: 'berry', fruit: '#c23c4a', leaf: '#3f6b32' },
  strawberry: { type: 'berry', fruit: '#e05a5a', leaf: '#4f8a3e' }
};

function cropSprite(id, stage) {
  const st = CROP_STYLE[id] || CROP_STYLE.parsnip;
  const p = pic(16, 22);
  const g1 = st.leaf, g2 = shade(g1, 18), g3 = shade(g1, -22);
  const fruit = st.fruit, fruitD = shade(fruit, -20), fruitL = shade(fruit, 22);
  const baseY = 21;
  if (stage === 0) {
    p.r(7, baseY - 3, 2, 3, g3);
    p.dot(6, baseY - 4, g2); p.dot(9, baseY - 4, g1);
    return p.c;
  }
  if (stage === 1) {
    p.r(7, baseY - 6, 2, 6, g3);
    p.r(4, baseY - 6, 3, 2, g1); p.r(9, baseY - 8, 4, 2, g2);
    p.dot(5, baseY - 7, g2); p.dot(11, baseY - 9, g1);
    return p.c;
  }
  if (stage === 2) {
    p.r(7, baseY - 10, 2, 10, g3);
    p.r(3, baseY - 9, 4, 3, g1); p.r(9, baseY - 11, 4, 3, g2);
    p.r(4, baseY - 6, 2, 3, g2); p.r(11, baseY - 8, 2, 3, g1);
    return p.c;
  }
  // 成株
  const tall = st.type === 'tall';
  const h = tall ? 16 : 12;
  p.r(7, baseY - h, 2, h, g3);
  p.r(7, baseY - h, 1, h, g1);
  for (let i = 0; i < 4; i++) {
    const y = baseY - h + 2 + i * 3;
    if (i % 2 === 0) { p.r(2, y, 5, 2, g1); p.r(1, y + 2, 3, 1, g2); }
    else { p.r(9, y, 5, 2, g2); p.r(12, y + 2, 3, 1, g1); }
  }
  if (stage === 3) {
    p.r(5, baseY - 5, 6, 4, g1);
    p.r(6, baseY - 6, 4, 2, g2);
    return p.c;
  }
  // 成熟
  if (tall) {
    p.r(4, baseY - 18, 3, 16, g3);
    p.r(10, baseY - 18, 3, 16, g3);
    p.r(5, baseY - 18, 1, 15, g1);
    p.r(3, baseY - 14, 2, 6, g1); p.r(12, baseY - 12, 2, 6, g2);
    p.r(7, baseY - 16, 2, 7, fruitD);
    p.r(8, baseY - 16, 2, 7, fruit);
    p.r(8, baseY - 15, 1, 2, fruitL);
    p.r(6, baseY - 18, 5, 2, g2);
    return p.c;
  }
  if (st.type === 'root') {
    // 地下根茎露头
    blob(p, 8, baseY - 3, 5, 4, fruitD);
    blob(p, 8, baseY - 4, 4, 3, fruit);
    p.r(6, baseY - 6, 2, 2, fruitL);
    p.r(3, baseY - 9, 4, 2, g1); p.r(10, baseY - 9, 4, 2, g2);
  } else if (st.type === 'head') {
    blob(p, 8, baseY - 7, 7, 6, g3);
    blob(p, 8, baseY - 8, 6, 5, g1);
    blob(p, 8, baseY - 9, 4, 3, fruit);
    p.dot(6, baseY - 10, fruitL);
    p.r(1, baseY - 8, 4, 3, g2); p.r(11, baseY - 9, 4, 3, g1);
  } else if (st.type === 'berry') {
    blob(p, 8, baseY - 8, 7, 6, g3);
    blob(p, 7, baseY - 9, 6, 5, g1);
    p.dot(4, baseY - 10, fruit); p.dot(10, baseY - 11, fruit); p.dot(7, baseY - 6, fruitD);
    p.dot(11, baseY - 6, fruit); p.dot(5, baseY - 5, fruitD);
    p.dot(9, baseY - 12, fruitL);
    p.r(2, baseY - 5, 4, 2, g2); p.r(10, baseY - 4, 4, 2, g1);
  } else {
    // 果实类
    blob(p, 8, baseY - 6, 6, 5, fruitD);
    blob(p, 7, baseY - 7, 5, 4, fruit);
    p.r(5, baseY - 9, 2, 2, fruitL);
    if (id === 'melon') { p.r(5, baseY - 8, 1, 5, fruitD); p.r(9, baseY - 8, 1, 5, fruitD); }
    if (id === 'pepper') { blob(p, 9, baseY - 9, 3, 3, fruit); p.r(9, baseY - 12, 1, 2, g2); }
    p.r(1, baseY - 7, 4, 3, g2); p.r(11, baseY - 8, 4, 3, g1);
  }
  return p.c;
}

/* ---------- 角色 ---------- */
function humanoid(pal, dir, frame, action) {
  const p = pic(16, 24);
  const skin = pal.skin || '#f0c8a2';
  const skinD = shade(skin, -30);
  const shirt = pal.shirt, shirtD = shade(shirt, -28), shirtL = shade(shirt, 20);
  const pants = pal.pants || '#3b4a63', pantsD = shade(pants, -22);
  const hair = pal.hair || '#5a3a22', hairD = shade(hair, -25);
  const boot = pal.boots || '#4a3320';
  const bob = frame === 1 || frame === 3 ? -1 : 0;
  const legA = frame === 1 ? -1 : frame === 3 ? 1 : 0;
  const legB = -legA;
  const y0 = bob;

  // 腿
  p.r(4, 18 + y0, 3, 4, pants);
  p.r(9, 18 + y0, 3, 4, pants);
  p.r(4, 22 + y0 + Math.max(0, legA), 3, 2, boot);
  p.r(9, 22 + y0 + Math.max(0, legB), 3, 2, boot);
  if (legA < 0) p.r(5, 20, 2, 2, pantsD);
  if (legB < 0) p.r(10, 20, 2, 2, pantsD);

  // 身体
  p.r(4, 10 + y0, 8, 8, shirt);
  p.r(4, 10 + y0, 8, 1, shirtL);
  p.r(4, 16 + y0, 8, 2, shirtD);
  p.r(7, 10 + y0, 2, 3, shirtD);
  // 手臂
  const armY = 11 + y0;
  p.r(2, armY, 2, 5, shirt);
  p.r(12, armY, 2, 5, shirt);
  p.r(2, armY + 5, 2, 2, skin);
  p.r(12, armY + 5, 2, 2, skin);
  if (pal.apron) p.r(5, 14, 6, 4, pal.apron);

  // 头
  if (dir === 'down') {
    p.r(4, 2, 8, 8, skin);
    p.r(4, 2, 8, 3, hair);
    p.r(3, 4, 1, 4, hair);
    p.r(12, 4, 1, 4, hair);
    p.r(4, 5, 8, 1, hairD);
    p.r(5, 6, 1, 1, '#2a1a12');
    p.r(10, 6, 1, 1, '#2a1a12');
    p.r(6, 8, 4, 1, skinD);
    p.r(3, 2, 3, 2, hairD);
  } else if (dir === 'up') {
    p.r(4, 1, 8, 9, hair);
    p.r(5, 3, 6, 6, hairD);
    p.r(5, 2, 6, 3, hair);
  } else if (dir === 'left') {
    p.r(4, 2, 8, 8, skin);
    p.r(3, 2, 8, 3, hair);
    p.r(9, 4, 3, 5, hair);
    p.r(11, 2, 2, 2, hairD);
    p.r(5, 6, 1, 1, '#2a1a12');
    p.r(4, 8, 3, 1, skinD);
  } else {
    p.r(4, 2, 8, 8, skin);
    p.r(5, 2, 8, 3, hair);
    p.r(4, 4, 3, 5, hair);
    p.r(3, 2, 2, 2, hairD);
    p.r(10, 6, 1, 1, '#2a1a12');
    p.r(9, 8, 3, 1, skinD);
  }
  // 帽子 / 发饰
  if (pal.hat) {
    p.r(2, 0, 12, 2, pal.hat);
    p.r(3, 2, 10, 1, shade(pal.hat, -25));
    p.r(2, 3, 12, 1, shade(pal.hat, 10));
  }
  if (pal.hatStraw) {
    p.r(1, 1, 14, 2, '#d9b86a');
    p.r(3, 0, 10, 1, '#c9a05e');
    p.r(1, 3, 14, 1, '#b08a4e');
  }
  if (pal.bun) {
    p.r(6, 0, 4, 2, hair);
    p.r(5, 1, 2, 1, hairD);
  }
  if (pal.band) {
    p.r(3, 3, 10, 1, pal.band);
    p.r(3, 3, 2, 2, shade(pal.band, -20));
  }
  if (pal.scarf) {
    p.r(4, 9, 8, 2, pal.scarf);
    p.r(4, 10, 3, 1, shade(pal.scarf, -20));
  }
  // 工具动作
  if (action) {
    const t = action; // 0..2
    if (dir === 'down') {
      p.r(12, 10 + y0 + t, 2, 2, skin);
      p.r(14, 9 + y0 + t, 2, 2, skin);
    } else if (dir === 'up') {
      p.r(12, 8 + y0, 2, 2, skin);
    } else if (dir === 'left') {
      p.r(0, 10 + y0 + t, 2, 2, skin);
      p.r(-1, 9 + y0 + t, 2, 2, skin);
    } else {
      p.r(14, 10 + y0 + t, 2, 2, skin);
      p.r(15, 9 + y0 + t, 2, 2, skin);
    }
  }
  return p.c;
}


function rugSprite(w, h, col) {
  const p = pic(w, h);
  const base = col || '#8f5a4e';
  p.r(0, 0, w, h, '#6d4238');
  p.r(2, 2, w - 4, h - 4, base);
  p.r(4, 4, w - 8, h - 8, shade(base, 10));
  p.r(6, 6, w - 12, h - 12, shade(base, -6));
  // 边框花纹
  p.r(2, 2, w - 4, 2, '#c9a05e');
  p.r(2, h - 4, w - 4, 2, '#c9a05e');
  p.r(2, 2, 2, h - 4, '#c9a05e');
  p.r(w - 4, 2, 2, h - 4, '#c9a05e');
  // 菱形点缀
  for (let x = 10; x < w - 8; x += 14) {
    const y = h / 2;
    p.r(x, y - 1, 3, 1, '#d9b86a');
    p.r(x + 1, y - 2, 1, 1, '#d9b86a');
    p.r(x + 1, y, 1, 1, '#d9b86a');
  }
  return p.c;
}

    p.dot(7, 5, '#f2e05a'); p.dot(9, 5, '#f2e05a');
  } else if (kind === 'hazelnut') {
    blob(p, 8, 9, 5, 5, '#8a5c34');
    blob(p, 8, 8, 4, 4, '#a9764c');
    p.r(5, 4, 6, 3, '#6b8f3f');
    p.dot(7, 7, '#c9a05e');
  } else if (kind === 'winterroot') {
    blob(p, 8, 10, 4, 5, '#c9b6a0');
    p.r(6, 5, 2, 4, '#e0d2c0');
    p.r(9, 6, 1, 3, '#b0a08e');
    p.dot(6, 9, '#8a7a68');

  return p.c;
}

function portrait(pal, kind) {
  const p = pic(40, 40);
  p.r(0, 0, 40, 40, pal.bg || '#efe3c4');
  p.r(0, 0, 40, 4, shade(pal.bg || '#efe3c4', -18));
  // 肩
  p.r(6, 30, 28, 10, pal.shirt);
  p.r(6, 30, 28, 2, shade(pal.shirt, 22));
  p.r(16, 30, 8, 6, pal.apron || shade(pal.shirt, -18));
  p.r(18, 26, 5, 6, pal.skin);
  p.r(18, 26, 5, 1, shade(pal.skin, -28));
  // 头
  p.r(9, 8, 22, 20, pal.skin);
  p.r(9, 8, 22, 3, shade(pal.skin, 14));
  p.r(9, 26, 22, 2, shade(pal.skin, -22));
  // 头发
  p.r(8, 4, 24, 8, pal.hair);
  p.r(8, 4, 24, 2, shade(pal.hair, 18));
  p.r(7, 9, 4, 12, pal.hair);
  p.r(29, 9, 4, 12, pal.hair);
  p.r(10, 11, 20, 2, shade(pal.hair, -18));
  // 眼睛
  p.r(14, 16, 3, 4, '#fffdf4');
  p.r(23, 16, 3, 4, '#fffdf4');
  p.r(15, 17, 2, 2, '#3a2a1a');
  p.r(24, 17, 2, 2, '#3a2a1a');
  p.dot(15, 17, '#000'); p.dot(24, 17, '#000');
  // 眉毛/腮红
  p.r(14, 14, 3, 1, shade(pal.hair, -20));
  p.r(23, 14, 3, 1, shade(pal.hair, -20));
  p.r(12, 21, 3, 1, '#e8a08a'); p.r(25, 21, 3, 1, '#e8a08a');
  // 嘴
  if (kind === 'smile') { p.r(18, 22, 4, 1, '#a04a4a'); p.dot(17, 21, '#a04a4a'); p.dot(22, 21, '#a04a4a'); }
  else if (kind === 'grin') { p.r(17, 22, 6, 2, '#a04a4a'); p.r(18, 23, 4, 1, '#e8d5d0'); }
  else { p.r(18, 22, 4, 1, '#8a4a42'); }
  // 帽子
  if (pal.hatStraw) { p.r(6, 1, 28, 3, '#c9a05e'); p.r(11, 0, 18, 2, '#d9b86a'); p.r(6, 4, 28, 1, '#a3763f'); }
  if (pal.hat) { p.r(8, 0, 24, 4, pal.hat); p.r(8, 4, 24, 1, shade(pal.hat, -25)); }
  if (pal.bun) { p.r(16, 0, 8, 4, pal.hair); p.r(17, 1, 6, 2, shade(pal.hair, 12)); }
  if (pal.band) { p.r(8, 10, 24, 2, pal.band); }
  if (pal.scarf) { p.r(10, 28, 20, 3, pal.scarf); p.r(10, 30, 6, 4, pal.scarf); }
  return p.c;
}

function initArt() {
  // ---------- 地面 ----------
  for (let s = 0; s < 4; s++) {
    const pal = SEASON_PAL[s];
    const set = { g: [], f: [], p: [], dirt: [], sand: [], water: [waterTile(0), waterTile(1)] };
    for (let v = 0; v < 3; v++) set.g.push(grassTile(pal, v + s * 3));
    for (let v = 0; v < 4; v++) set.f.push(flowerTile(pal, v + s * 4));
    for (let v = 0; v < 3; v++) set.p.push(pathTile(v + s));
    for (let v = 0; v < 2; v++) set.dirt.push(dirtTile(v + s));
    for (let v = 0; v < 2; v++) set.sand.push(sandTile(v + s));
    set.snow = [snowTile(0), snowTile(1), snowTile(2)];
    ART.ground.push(set);

'use strict';

/* ============================================================
   地图：农舍 / 农场 / 小镇 / 室内
   ============================================================ */
const MAPS = {};

function createMap(id, w, h, fill, name) {
  const base = [];
  const solid = [];
  for (let y = 0; y < h; y++) {
    base.push(new Array(w).fill(fill));
    solid.push(new Array(w).fill(false));
  }
  const m = {
    id, w, h, name, base, solid,
    objs: [], buildings: [], exits: [],
    objAt: [], acts: [],
    staticCanvas: null, staticDirty: true
  };
  for (let y = 0; y < h; y++) { m.objAt.push(new Array(w).fill(null)); m.acts.push(new Array(w).fill(null)); }
  MAPS[id] = m;
  return m;
}

function fillRect(m, x, y, w, h, ch, isSolid) {
  for (let yy = y; yy < y + h; yy++) {
    for (let xx = x; xx < x + w; xx++) {
      if (xx < 0 || yy < 0 || xx >= m.w || yy >= m.h) continue;
      m.base[yy][xx] = ch;
      if (isSolid) m.solid[yy][xx] = true;
    }
  }
}

function fillEllipse(m, cx, cy, rx, ry, ch, isSolid) {
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
    for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
      if (x < 0 || y < 0 || x >= m.w || y >= m.h) continue;
      const dx = (x - cx) / rx, dy = (y - cy) / ry;
      if (dx * dx + dy * dy <= 1) {
        m.base[y][x] = ch;
        if (isSolid) m.solid[y][x] = true;
      }
    }
  }
}

function addObj(m, type, x, y, opts = {}) {
  const o = Object.assign({ type, x, y }, opts);
  m.objs.push(o);
  if (x >= 0 && y >= 0 && x < m.w && y < m.h) m.objAt[y][x] = o;
  if (o.solid !== false) m.solid[y][x] = true;
  if (o.act) m.acts[y][x] = typeof o.act === 'string' ? { kind: o.act } : o.act;
  return o;
}

function addBuilding(m, type, x, y, w, h, door, opts = {}) {
  const b = Object.assign({ type, x, y, w, h, door }, opts);
  m.buildings.push(b);
  for (let yy = y - 1; yy < y + h; yy++) {
    for (let xx = x; xx < x + w; xx++) {
      if (xx < 0 || yy < 0 || xx >= m.w || yy >= m.h) continue;
      m.solid[yy][xx] = true;
    }
  }
  if (door) m.solid[door.y][door.x] = false;
  if (door) m.acts[door.y][door.x] = { kind: 'door', door };
  return b;
}

function addExit(m, x, y, w, h, to, tx, ty) {
  m.exits.push({ x, y, w, h, to, tx, ty });
}

/* ---------------- 农场 ---------------- */
function buildFarm() {
  const m = createMap('farm', 40, 30, 'g', '农场');
  // 草地碎花
  for (let y = 0; y < m.h; y++) {
    for (let x = 0; x < m.w; x++) {
      if (hash2(x * 7 + 3, y * 5 + 11) > 0.94) m.base[y][x] = 'f';
    }
  }
  // 农舍
  addBuilding(m, 'house', 2, 2, 5, 4, { x: 4, y: 5, to: 'house', tx: 15, ty: 10 });
  // 道路
  fillRect(m, 4, 6, 1, 9, 'p');
  fillRect(m, 4, 14, 17, 1, 'p');
  fillRect(m, 20, 14, 1, 15, 'p');
  fillRect(m, 6, 7, 4, 1, 'p');
  // 池塘
  fillEllipse(m, 32, 24.5, 6.2, 4.2, 's', false);
  fillEllipse(m, 32, 24.5, 5.2, 3.3, 'w', true);
  // 农舍前小花坛
  fillRect(m, 1, 6, 3, 1, 'f');
  // 出货箱与信箱
  addObj(m, 'bin', 6, 15, { act: 'ship', solid: true });
  addObj(m, 'mailbox', 7, 6, { act: 'mail', solid: true });
  // 树（沿边与池塘）
  const trees = [
    [0, 1, 'oak'], [1, 0, 'pine'], [31, 0, 'pine'], [35, 0, 'oak'], [38, 2, 'pine'],
    [0, 9, 'oak'], [0, 19, 'maple'], [1, 27, 'oak'], [4, 28, 'pine'], [9, 29, 'oak'],
    [26, 0, 'maple'], [39, 9, 'pine'], [39, 18, 'oak'], [37, 28, 'maple'], [29, 29, 'pine'],
    [24, 2, 'oak'], [20, 1, 'pine'], [33, 6, 'oak'],
    [26, 16, 'oak'], [29, 18, 'maple'], [36, 15, 'pine'], [25, 22, 'oak'],
    [10, 21, 'maple'], [15, 24, 'oak'], [22, 26, 'pine'], [8, 25, 'oak'], [1, 14, 'maple']
  ];
  for (const [x, y, kind] of trees) {
    if (m.solid[y][x]) continue;
    addObj(m, 'tree', x, y, { kind, hp: 3, solid: true });
    if (y > 0) m.solid[y - 1][x] = true;
  }
  // 石头与杂草
  const rocks = [[12, 19], [17, 20], [24, 8], [33, 12], [5, 22], [28, 5], [36, 21], [19, 25]];
  for (const [x, y] of rocks) if (!m.solid[y][x]) addObj(m, 'rock', x, y, { hp: 2, solid: true });
  const weeds = [[7, 9], [10, 9], [13, 10], [16, 8], [18, 11], [9, 12], [15, 12], [19, 9],
    [8, 18], [12, 17], [16, 16], [21, 20], [24, 15], [27, 12], [5, 20], [7, 24], [14, 27], [18, 22]];
  for (const [x, y] of weeds) if (!m.solid[y][x] && m.base[y][x] !== 'p') addObj(m, 'weed', x, y, { solid: false });
  // 花（装饰性对象）
  const flowers = [[22, 7], [23, 11], [10, 6], [3, 12], [25, 28], [30, 16], [18, 5], [7, 27], [35, 24]];
  flowers.forEach(([x, y], i) => { if (!m.solid[y][x]) addObj(m, 'flower', x, y, { v: i % 3, solid: false }); });
  // 出口：向南去小镇
  addExit(m, 18, 29, 5, 1, 'town', 20, 23);
  m.spawn = { x: 4, y: 7 };

}

const GROUND_ART_KEY = { g: 'g', f: 'f', p: 'p', d: 'dirt', s: 'sand', w: 'water', W: 'wood', S: 'stone', c: 'carpet', H: 'wall' };

function tileArt(map, x, y) {
  const ch = map.base[y][x];
  const season = (STATE && STATE.season) || 0;
  const g = ART.ground[season];
  const h = hash2(x * 13 + 7, y * 17 + 3);
  switch (ch) {
    case 'g': return g.g[Math.floor(h * 3) % 3];
    case 'f': return g.f[Math.floor(h * 4) % 4];
    case 'p': return g.p[Math.floor(h * 3) % 3];
    case 'd': return g.dirt[Math.floor(h * 2) % 2];
    case 's': return g.sand[Math.floor(h * 2) % 2];
    case 'w': return g.water[Math.floor(h * 2) % 2];
    case 'W': return ART.floor.wood[Math.floor(h * 2) % 2];
    case 'S': return ART.floor.stone[Math.floor(h * 2) % 2];
    case 'c': return ART.floor.carpet;
    case 'H': return ART.floor.wall[Math.floor(h * 2) % 2];
    default: return g.g[0];
  }
}

function objectArt(o) {
  if (o.dead) return null;
  const season = (STATE && STATE.season) || 0;
  if (o.type === 'tree') {
    if (o.dead) return null;
    const arr = ART.trees[o.kind] || ART.trees.oak;
    return { img: arr[season], ax: 16, ay: 48 };
  }
  if (o.type === 'rock') return { img: ART.objects.rock, ax: 10, ay: 14 };
  if (o.type === 'weed') return { img: ART.objects.weed, ax: 8, ay: 16 };
  if (o.type === 'flower') return { img: ART.objects.flower[o.v || 0], ax: 8, ay: 16 };
  if (o.type === 'bin') return { img: ART.objects.bin, ax: 8, ay: 20 };
  if (o.type === 'fountain') return { img: ART.objects.fountain, ax: 20, ay: 32 };
  if (o.type === 'lamp') return { img: ART.objects.lamp, ax: 8, ay: 32 };
  if (o.type === 'mailbox') return { img: ART.objects.mailbox, ax: 8, ay: 26 };
  if (o.type === 'notice') return { img: ART.objects.notice, ax: 16, ay: 30 };
  if (o.type === 'forage') return { img: ART.icons[o.item], ax: 8, ay: 16 };
  if (o.type === 'stump') return { img: ART.objects.stump, ax: 8, ay: 12 };
  if (o.type === 'stall') return { img: ART.objects.stall, ax: 20, ay: 40 };
  if (o.type === 'pot') return { img: ART.objects.pot, ax: 12, ay: 20 };
  if (o.type === 'egg') return { img: ART.objects.eggs[o.colorIdx || 0], ax: 5, ay: 12 };
  if (o.type === 'gift') return { img: ART.objects.gift, ax: 8, ay: 16 };
  if (o.type === 'bed') return { img: ART.buildings.bed, ax: 0, ay: 26 };
  if (o.type === 'door') return { img: ART.objects.door, ax: 0, ay: 26 };
  if (o.type === 'window') return { img: ART.objects.window, ax: 0, ay: 16 };
  if (o.type === 'stool') return { img: ART.objects.stool, ax: 0, ay: 12 };
  if (o.type === 'crate') return { img: ART.objects.crate, ax: 0, ay: 16 };
  if (o.type === 'plant') return { img: ART.objects.plant, ax: 0, ay: 24 };
  if (o.type === 'stove') return { img: ART.objects.stove, ax: 0, ay: 24 };
  if (o.type === 'rugHouse') return { img: ART.objects.rugHouse, ax: 0, ay: 64 };
  if (o.type === 'rugShop') return { img: ART.objects.rugShop, ax: 0, ay: 32 };
  if (o.type === 'counter') return { img: ART.buildings.counter, ax: 0, ay: 20 };
  if (o.type === 'shelf') return { img: ART.buildings.shelf, ax: 0, ay: 34 };
  if (o.type === 'balloon') return { img: ART.objects.balloon[o.v || 0], ax: 6, ay: 24 };
  if (o.type === 'bush') return { img: ART.objects.bush[season], ax: 12, ay: 18 };
  return null;
}

function buildingArt(b) {
  if (b.type === 'house') return { img: ART.buildings.house, ax: 0, ay: 76 };
  if (b.type === 'shop') return { img: ART.buildings.shop, ax: 0, ay: 80 };
  if (b.type === 'cabin') return { img: ART.buildings.cabin, ax: 0, ay: 60 };
  return null;
}

function buildStatic(map) {
  const c = makeCanvas(map.w * TS, map.h * TS);
  const g = c.g;
  // 地面（水面之外）
  for (let y = 0; y < map.h; y++) {
    for (let x = 0; x < map.w; x++) {
      if (map.base[y][x] === 'w') continue;
      g.drawImage(tileArt(map, x, y), x * TS, y * TS);
    }
  }
  // 收集绘制项，按底边排序
  const items = [];
  for (const b of map.buildings) {
    const a = buildingArt(b);
    if (!a) continue;
    items.push({ img: a.img, x: b.x * TS, y: (b.y + b.h) * TS - a.ay, sort: (b.y + b.h) * TS });
  }
  for (const o of map.objs) {
    if (o.type === 'forage') continue;
    const a = objectArt(o);
    if (!a) continue;
    items.push({ img: a.img, x: o.x * TS + TS / 2 - a.ax, y: (o.y + 1) * TS - a.ay, sort: (o.y + 1) * TS + (a.ay > 16 ? 4 : 0) });
  }
  items.sort((p, q) => p.sort - q.sort);
  for (const it of items) g.drawImage(it.img, Math.round(it.x), Math.round(it.y));
  map.staticCanvas = c.c;
  map.staticDirty = false;
}

function rebuildStatic(map) { map.staticDirty = true; }
function rebuildAllStatic() { for (const m of Object.values(MAPS)) m.staticDirty = true; }

/* ---------------- 采集物 ---------------- */
function spawnForage() {
  const ids = FORAGE_BY_SEASON[STATE.season] || [];
  if (!ids.length) return;
  for (const mapId of ['farm', 'town']) {
    const m = MAPS[mapId];
    let count = m.objs.filter(o => o.type === 'forage' && !o.dead).length;
    let placed = 0;
    for (let tries = 0; tries < 80 && placed < 2 && count < 5; tries++) {
      const x = ri(1, m.w - 2), y = ri(1, m.h - 2);
      if (m.solid[y][x] || m.objAt[y][x]) continue;
      const base = m.base[y][x];
      if (base === 'p' || base === 'w' || base === 'S' || base === 'H') continue;
      if (STATE.soil[x + ',' + y]) continue;
      addObj(m, 'forage', x, y, { item: pick(ids), solid: false });
      count++; placed++;
    }
  }
}

function pickupForage(o) {
  if (invAdd(o.item, 1) > 0) { toast('背包满了，先腾个格子吧。'); return; }
  const m = currentMap();
  o.dead = true;
  if (m.objAt[o.y]) m.objAt[o.y][o.x] = null;
  m.objs = m.objs.filter(x => x !== o);
  UI.updateHUD();
  Audio.sfx('pick');
  addParticles(o.x * TS + 8, o.y * TS + 10, '#e8d5a8', 6, 6);
  floatText(o.x * TS + 8, o.y * TS - 2, '+' + ITEMS[o.item].name, '#ffe9b0');
}


/* ===== 06_state.js ===== */
'use strict';

/* ============================================================
   游戏状态、背包、存档
   ============================================================ */
let STATE = null;

const INV_SIZE = 20;
const HOT_SIZE = 9;
const SAVE_KEY = 'little-farm-save-v1';

function emptyInv() { return new Array(INV_SIZE).fill(null); }

function newState() {
  const inv = emptyInv();
  inv[0] = { id: 'hoe', count: 1 };
  inv[1] = { id: 'can', count: 1 };
  inv[2] = { id: 'axe', count: 1 };
  inv[3] = { id: 'pick', count: 1 };
  inv[4] = { id: 'scythe', count: 1 };
  inv[5] = { id: 'rod', count: 1 };
  inv[6] = { id: 'parsnip_seed', count: 15 };
  inv[7] = { id: 'bread', count: 2 };
  return {
    version: 1,
    map: 'farm',
    player: { x: 4 * TS + 8, y: 7 * TS + 14, dir: 'down', frame: 0, animT: 0, moving: false, busy: 0, actT: 0 },
    camera: { x: 0, y: 0 },
    money: 500,
    energy: 100, maxEnergy: 100,
    inv, hot: 0,
    year: 1, season: 0, day: 1, hour: 6, minute: 0,
    weather: 'sun',
    soil: {},
    removed: {},
    npc: {},
    shipped: [],
    flags: { festivalDone: [], eggBest: 0 },
    stats: { harvest: 0, earned: 0, planted: 0, gifts: 0, talks: 0 },
    totalDays: 0,
    screen: 'play',
    paused: false,
    fade: 0,
    toastT: 0,
    particles: [],
    npcPos: {},
    festival: null,
    lastSave: 0
  };
}

/* ---------------- 背包 ---------------- */
function invAdd(id, count = 1) {
  const itemDef = ITEMS[id];
  if (!itemDef) return count;
  const stack = itemDef.stack || 99;
  let left = count;
  // 先叠加
  for (let i = 0; i < INV_SIZE && left > 0; i++) {
    const s = STATE.inv[i];
    if (s && s.id === id && s.count < stack) {
      const can = Math.min(stack - s.count, left);
      s.count += can; left -= can;
    }
  }
  // 再放空格
  for (let i = 0; i < INV_SIZE && left > 0; i++) {
    if (!STATE.inv[i]) {
      const can = Math.min(stack, left);
      STATE.inv[i] = { id, count: can };
      left -= can;
    }
  }
  return left;
}

function invCount(id) {
  let n = 0;
  for (const s of STATE.inv) if (s && s.id === id) n += s.count;
  return n;
}

function invRemove(id, count = 1) {
  let left = count;
  for (let i = 0; i < INV_SIZE && left > 0; i++) {
    const s = STATE.inv[i];
    if (s && s.id === id) {
      const take = Math.min(s.count, left);
      s.count -= take; left -= take;
      if (s.count <= 0) STATE.inv[i] = null;
    }
  }
  return left === 0;
}

function invRemoveSlot(i, count = 1) {
  const s = STATE.inv[i];
  if (!s) return false;
  s.count -= count;
  if (s.count <= 0) STATE.inv[i] = null;
  return true;
}

function selectedItem() { return STATE.inv[STATE.hot]; }

function addParticles(x, y, color, n = 6, spread = 8) {
  for (let i = 0; i < n; i++) {
    STATE.particles.push({
      x, y, vx: rnd(-spread, spread) / 20, vy: rnd(-38, -12) / 10,
      life: rnd(14, 28), maxLife: 28, color, size: Math.random() > 0.5 ? 2 : 1
    });
  }
}

/* ---------------- 存档 ---------------- */
function saveGame() {
  try {
    const snap = {
      v: 1, map: STATE.map, player: { x: STATE.player.x, y: STATE.player.y, dir: STATE.player.dir },
      money: STATE.money, energy: STATE.energy, inv: STATE.inv, hot: STATE.hot,
      year: STATE.year, season: STATE.season, day: STATE.day, hour: STATE.hour, minute: STATE.minute,
      weather: STATE.weather, soil: STATE.soil, removed: STATE.removed, npc: STATE.npc,
      shipped: STATE.shipped, flags: STATE.flags, stats: STATE.stats, totalDays: STATE.totalDays
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(snap));
    STATE.lastSave = Date.now();
    return true;
  } catch (e) {
    console.warn('存档失败', e);
    return false;
  }
}

function hasSave() {
  try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    STATE = newState();
    STATE.map = s.map || 'farm';
    STATE.player.x = s.player.x;
    STATE.player.y = s.player.y;
    STATE.player.dir = s.player.dir || 'down';
    STATE.money = s.money;
    STATE.energy = s.energy;
    STATE.inv = s.inv && s.inv.length ? s.inv : emptyInv();
    while (STATE.inv.length < INV_SIZE) STATE.inv.push(null);
    STATE.hot = clamp(s.hot || 0, 0, HOT_SIZE - 1);
    STATE.year = s.year; STATE.season = s.season; STATE.day = s.day;
    STATE.hour = s.hour; STATE.minute = s.minute;
    STATE.weather = s.weather || 'sun';
    STATE.soil = s.soil || {};
    STATE.removed = s.removed || {};
    STATE.npc = s.npc || {};
    STATE.shipped = s.shipped || [];
    STATE.flags = Object.assign(newState().flags, s.flags || {});
    STATE.stats = Object.assign(newState().stats, s.stats || {});
    STATE.totalDays = s.totalDays || 0;
    applyRemoved();
    placeNPCs(true);
    return true;
  } catch (e) {
    console.warn('读档失败', e);
    return false;
  }
}

function applyRemoved() {
  for (const [mapId, list] of Object.entries(STATE.removed || {})) {
    const m = MAPS[mapId];
    if (!m) continue;
    for (const key of list) {
      const [x, y] = key.split(',').map(Number);
      const o = m.objAt[y] && m.objAt[y][x];
      if (o) { o.dead = true; m.solid[y][x] = false; if (y > 0) m.solid[y - 1][x] = false; }
    }
  }
}

function markRemoved(mapId, x, y) {
  if (!STATE.removed[mapId]) STATE.removed[mapId] = [];
  const key = x + ',' + y;
  if (!STATE.removed[mapId].includes(key)) STATE.removed[mapId].push(key);
}


/* ===== 07_player.js ===== */
'use strict';

/* ============================================================
   输入、移动、工具动作、农事
   ============================================================ */
const Input = { down: {}, pressed: new Set() };

function bindInput() {
  window.addEventListener('keydown', (e) => {
    const code = e.code;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(code)) e.preventDefault();
    if (e.repeat) return;
    Input.down[code] = true;
    Input.pressed.add(code);
    if (STATE.screen === 'title') {
      if (UI.modalOpen) {
        if (code === 'Escape' || code === 'Enter' || code === 'NumpadEnter') UI.closeModal();
        return;
      }
      if (code === 'Enter' || code === 'NumpadEnter') {
        e.preventDefault();
        Audio.resume();
        if (hasSave()) continueGame(); else startNewGame();
        return;
      }
      if (code === 'KeyH') { UI.openHelp(); return; }
      if (code === 'Escape' && UI.modalOpen) { UI.closeModal(); return; }
    }
    if (UI.handleKey(code)) return;
    handleGameKey(code);
  });
  window.addEventListener('keyup', (e) => { Input.down[e.code] = false; });
  window.addEventListener('blur', () => { Input.down = {}; });
}

function handleGameKey(code) {
  if (STATE.screen !== 'play') return;
  if (STATE.paused || UI.modalOpen) return;
  if (code.startsWith('Digit')) {
    const n = Number(code.slice(5));
    if (n >= 1 && n <= 9) { STATE.hot = n - 1; UI.updateHUD(); Audio.sfx('tick'); }
    return;
  }
  if (code === 'KeyJ' || code === 'Space') doAction();
  else if (code === 'KeyE') interact();
  else if (code === 'KeyF') eatSelected();
  else if (code === 'Tab') { UI.openInventory(); }
  else if (code === 'KeyR') UI.openRelations();
  else if (code === 'Escape') UI.openPause();
  else if (code === 'KeyM') Audio.toggleMute();
  else if (code === 'KeyH') UI.openHelp();
}

/* ---------------- 地块辅助 ---------------- */
function playerTile() {
  const p = STATE.player;
  return { x: Math.floor(p.x / TS), y: Math.floor((p.y - 2) / TS) };
}

function facingTile() {
  const t = playerTile();
  const d = STATE.player.dir;
  return {
    x: t.x + (d === 'left' ? -1 : d === 'right' ? 1 : 0),
    y: t.y + (d === 'up' ? -1 : d === 'down' ? 1 : 0)
  };
}

function currentMap() { return MAPS[STATE.map]; }

function tileBlocked(px, py) {
  const m = currentMap();
  const tx = Math.floor(px / TS), ty = Math.floor(py / TS);
  if (tx < 0 || ty < 0 || tx >= m.w || ty >= m.h) return true;
  return m.solid[ty][tx];
}

function canWalk(x, y) {
  const m = currentMap();
  const x0 = Math.floor((x - 5) / TS), x1 = Math.floor((x + 4) / TS);
  const y0 = Math.floor((y - 7) / TS), y1 = Math.floor((y - 1) / TS);
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      if (tx < 0 || ty < 0 || tx >= m.w || ty >= m.h) return false;
      if (m.solid[ty][tx]) return false;
    }
  }
  return true;
}

/* ---------------- 移动 ---------------- */
function updatePlayer(dt) {
  const p = STATE.player;
  if (STATE.screen !== 'play' || UI.modalOpen || STATE.paused) { p.moving = false; return; }
  if (p.busy > 0) {
    p.busy -= dt;
    p.actT += dt;
    p.moving = false;
    if (p.busy <= 0) { p.busy = 0; p.actT = 0; }
  }
  let vx = 0, vy = 0;
  if (Input.down.KeyW || Input.down.ArrowUp) vy -= 1;
  if (Input.down.KeyS || Input.down.ArrowDown) vy += 1;
  if (Input.down.KeyA || Input.down.ArrowLeft) vx -= 1;
  if (Input.down.KeyD || Input.down.ArrowRight) vx += 1;
  if (p.busy > 0) { vx = 0; vy = 0; }
  if (vx || vy) {
    p.moving = true;
    if (Math.abs(vx) > Math.abs(vy)) p.dir = vx < 0 ? 'left' : 'right';
    else if (vy !== 0) p.dir = vy < 0 ? 'up' : 'down';
    if (vx && vy) { const k = Math.sqrt(2) / 2; vx *= k; vy *= k; }
    const sprint = Input.down.ShiftLeft || Input.down.ShiftRight;
    const spd = (sprint ? 104 : 66) * dt;
    const nx = p.x + vx * spd;
    if (canWalk(nx, p.y)) p.x = nx;
    const ny = p.y + vy * spd;
    if (canWalk(p.x, ny)) p.y = ny;
    p.animT += dt;
    if (p.animT > (sprint ? 0.12 : 0.16)) { p.animT = 0; p.frame = (p.frame + 1) % 4; }
  } else {
    p.moving = false;
    p.frame = 0;
    p.animT = 0;
  }
  // 相机
  const m = currentMap();
  const camTargetX = clamp(p.x - W / 2, 0, Math.max(0, m.w * TS - W));
  const camTargetY = clamp(p.y - H / 2 - 8, 0, Math.max(0, m.h * TS - H));
  STATE.camera.x = lerp(STATE.camera.x, camTargetX, Math.min(1, dt * 8));
  STATE.camera.y = lerp(STATE.camera.y, camTargetY, Math.min(1, dt * 8));
  if (m.w * TS < W) STATE.camera.x = (m.w * TS - W) / 2;
  if (m.h * TS < H) STATE.camera.y = (m.h * TS - H) / 2;
  // 出口
  const t = playerTile();
  for (const ex of m.exits) {
    if (t.x >= ex.x && t.x < ex.x + ex.w && t.y >= ex.y && t.y < ex.y + ex.h) {
      travelTo(ex.to, ex.tx, ex.ty);
      break;
    }
  }
}

/* ---------------- 场景切换 ---------------- */
function travelTo(mapId, tx, ty) {
  if (STATE.transition) return;
  STATE.transition = { phase: 'out', t: 0, mapId, tx, ty };
  Audio.sfx('door');
}

function applyTravel() {
  const tr = STATE.transition;
  STATE.map = tr.mapId;
  STATE.player.x = tr.tx * TS + 8;
  STATE.player.y = tr.ty * TS + 14;
  STATE.player.frame = 0;
  STATE.player.busy = 0;
  const m = currentMap();
  if (m.staticDirty) buildStatic(m);
  STATE.camera.x = clamp(STATE.player.x - W / 2, 0, Math.max(0, m.w * TS - W));
  STATE.camera.y = clamp(STATE.player.y - H / 2 - 8, 0, Math.max(0, m.h * TS - H));
  placeNPCs(true);
  UI.setArea(m.name);
  // 节日
  const f = festivalFor(STATE.season, STATE.day);
  if (f && (STATE.map === 'town') && !STATE.flags.festivalDone.includes(f.id + '-Y' + STATE.year)) {
    startFestival(f);
  }
}

/* ---------------- 当前动作 ---------------- */
function doAction() {
  const p = STATE.player;
  if (p.busy > 0 || STATE.paused || UI.modalOpen) return;
  const m = currentMap();
  const f = facingTile();
  if (f.x < 0 || f.y < 0 || f.x >= m.w || f.y >= m.h) return;
  const sel = selectedItem();
  const soil = STATE.soil[f.x + ',' + f.y];
  const obj = m.objAt[f.y] && m.objAt[f.y][f.x];
  const baseCh = m.base[f.y][f.x];

  // 收获优先
  if (soil && soil.crop && soil.crop.ready && !soil.crop.dead) {
    harvestCrop(f.x, f.y);
    return;
  }
  // 播种
  if (sel && ITEMS[sel.id] && ITEMS[sel.id].type === 'seed' && soil && soil.till && !soil.crop) {
    plantSeed(f, sel.id);
    return;
  }
  // 物件操作
  if (obj && !obj.dead) {
    if (obj.type === 'tree' && sel && sel.id === 'axe') return chopTree(obj, f, 4);
    if (obj.type === 'rock' && sel && sel.id === 'pick') return mineRock(obj, f, 4);
    if (obj.type === 'weed' && sel && sel.id === 'scythe') return cutWeed(obj, f, 1);
    if (obj.type === 'tree') return toast('要用斧头才能砍树。');
    if (obj.type === 'rock') return toast('要用镐才能敲碎石头。');
    if (obj.type === 'weed') return toast('用镰刀割掉杂草。');
    if (obj.solid) return toast('这里被挡住了。');
  }
  // 地块操作
  if (sel && (sel.id === 'hoe' || sel.id === 'can')) {
    if (sel.id === 'hoe') return useHoe(f, baseCh);
    if (sel.id === 'can') return useCan(f, soil);
  }
  if (sel && sel.id === 'scythe') {
    if (soil && soil.crop && !soil.crop.ready) return toast('作物还没成熟。');
    addParticles(f.x * TS + 8, f.y * TS + 12, '#8fb36a', 4, 6);
    return swing(1, f, f.x * TS + 8, f.y * TS + 12);
  }
  if (!sel) return toast('先选一个工具或种子（按 1~9）。');
}

function spendEnergy(n) {
  if (STATE.energy < n) {
    toast('体力不足，回屋睡一觉吧。');
    if (STATE.energy <= 0) forceSleep();
    return false;
  }
  STATE.energy -= n;
  UI.updateHUD();
  return true;
}

function swing(cost, f, worldX, worldY) {
  const p = STATE.player;
  p.busy = 0.32;
  p.actT = 0;
  if (!spendEnergy(cost)) return false;
  addMinutes(2);
  return true;
}

/* ---------------- 田地 ---------------- */
function useHoe(f, baseCh) {
  const soil = STATE.soil[f.x + ',' + f.y];
  if (STATE.map !== 'farm') return toast('这里不能开垦。');
  if (baseCh === 'w') return toast('水面没法开垦。');
  if (baseCh === 'p') return toast('小路上不能开垦。');
  if (soil && soil.till) return toast('这块地已经开垦过了。');
  if (!spendEnergy(2)) return;
  STATE.soil[f.x + ',' + f.y] = { till: true, wet: false, crop: null };
  STATE.player.busy = 0.32; STATE.player.actT = 0;
  addMinutes(2);
  Audio.sfx('hoe');
  addParticles(f.x * TS + 8, f.y * TS + 12, '#8a5c3d', 7, 7);
}

function useCan(f, soil) {
  if (!soil || !soil.till) return toast('先用锄头开垦，再浇水。');
  if (soil.wet) return toast('这里已经浇过水了。');
  if (!spendEnergy(2)) return;
  soil.wet = true;
  if (soil.crop) soil.crop.watered = true;
  STATE.player.busy = 0.32; STATE.player.actT = 0;
  addMinutes(2);
  Audio.sfx('water');
  addParticles(f.x * TS + 8, f.y * TS + 10, '#8cc6d9', 8, 8);
}

function plantSeed(f, seedId) {
  const def = ITEMS[seedId];
  const crop = CROPS[def.crop];
  if (crop.season !== STATE.season) return toast('这个季节种不了' + crop.name + '。');
  if (!spendEnergy(1)) return;
  invRemove(seedId, 1);
  const key = f.x + ',' + f.y;
  const soil = STATE.soil[key];
  soil.crop = { id: def.crop, g: 0, days: 0, watered: soil.wet, ready: false, dead: false };
  soil.till = true;
  STATE.stats.planted++;
  STATE.player.busy = 0.25; STATE.player.actT = 0;
  Audio.sfx('plant');
  addParticles(f.x * TS + 8, f.y * TS + 14, '#c9a05e', 5, 5);
  toast('种下了' + crop.name + '。');
  if (invCount(seedId) === 0) {
    // 自动切回锄头
    const idx = STATE.inv.findIndex(s => s && s.id === 'hoe');
    if (idx >= 0) STATE.hot = idx;
    UI.updateHUD();
  }
}

function harvestCrop(x, y) {
  const key = x + ',' + y;
  const soil = STATE.soil[key];
  const crop = soil.crop;
  const def = CROPS[crop.id];
  if (!spendEnergy(1)) return;
  let n = def.yield || 1;
  if (Math.random() < 0.18) n += 1;
  const left = invAdd(crop.id, n);
  if (left > 0) toast('背包满了，' + (n - left) + ' 个放不下。');
  STATE.stats.harvest += n;
  STATE.player.busy = 0.3; STATE.player.actT = 0;
  Audio.sfx('harvest');
  addParticles(x * TS + 8, y * TS + 6, def.style === 'berry' ? CROP_STYLE[crop.id].fruit : '#f2e05a', 8, 9);
  floatText(x * TS + 8, y * TS - 4, '+' + n + ' ' + def.name, '#f6f0e4');
  if (def.regrow > 0) {
    crop.g = Math.max(0, def.growth.reduce((a, b) => a + b, 0) - def.regrow);
    crop.ready = false;
  } else {
    soil.crop = null;
  }
  UI.updateHUD();
}

/* ---------------- 资源 ---------------- */
function chopTree(obj, f, cost) {
  if (!spendEnergy(cost)) return;
  STATE.player.busy = 0.34; STATE.player.actT = 0;
  addMinutes(3);
  obj.hp--;
  Audio.sfx('chop');
  addParticles(f.x * TS + 8, f.y * TS + 8, '#a9764c', 8, 8);
  if (obj.hp <= 0) {
    obj.dead = true;
    obj.type = 'stump';
    obj.solid = false;
    currentMap().solid[f.y][f.x] = false;
    if (f.y > 0) currentMap().solid[f.y - 1][f.x] = false;
    markRemoved(STATE.map, f.x, f.y);
    const wood = 3 + ri(0, 2);
    invAdd('wood', wood);
    if (Math.random() < 0.6) invAdd('sap', 1);
    floatText(f.x * TS + 8, f.y * TS - 8, '+' + wood + ' 木材', '#e8d5a8');
    rebuildStatic(currentMap());
    Audio.sfx('fall');
  }
}

function mineRock(obj, f, cost) {
  if (!spendEnergy(cost)) return;
  STATE.player.busy = 0.32; STATE.player.actT = 0;
  addMinutes(3);
  obj.hp--;
  Audio.sfx('pick');
  addParticles(f.x * TS + 8, f.y * TS + 6, '#9ba1a7', 7, 7);
  if (obj.hp <= 0) {
    obj.dead = true;
    currentMap().solid[f.y][f.x] = false;
    markRemoved(STATE.map, f.x, f.y);
    const st = 2 + ri(0, 2);
    invAdd('stone', st);
    floatText(f.x * TS + 8, f.y * TS - 6, '+' + st + ' 石料', '#e8e8e8');
    rebuildStatic(currentMap());
    Audio.sfx('fall');
  }
}

function cutWeed(obj, f, cost) {
  if (!spendEnergy(cost)) return;
  obj.dead = true;
  currentMap().solid[f.y][f.x] = false;
  markRemoved(STATE.map, f.x, f.y);
  const n = 1 + (Math.random() < 0.3 ? 1 : 0);
  invAdd('fiber', n);
  STATE.player.busy = 0.26; STATE.player.actT = 0;
  addMinutes(1);
  Audio.sfx('cut');
  addParticles(f.x * TS + 8, f.y * TS + 12, '#6b9a4a', 7, 7);
  floatText(f.x * TS + 8, f.y * TS - 4, '+' + n + ' 纤维', '#cfe8c0');
  rebuildStatic(currentMap());
}

/* ---------------- 交互 ---------------- */
function interact() {
  if (STATE.paused || UI.modalOpen || STATE.player.busy > 0) return;
  const m = currentMap();
  const f = facingTile();
  // 节日互动优先
  if (STATE.festival && festivalInteract(f.x, f.y)) return;
  // NPC
  const npc = npcAtTile(f.x, f.y);
  if (npc) { startDialogue(npc.id); return; }
  if (f.x < 0 || f.y < 0 || f.x >= m.w || f.y >= m.h) return;
  const objHere = m.objAt[f.y] && m.objAt[f.y][f.x];
  if (objHere && objHere.type === 'forage' && !objHere.dead) { pickupForage(objHere); return; }
  const act = m.acts[f.y][f.x];
  if (act) {
    if (act.kind === 'ship') { UI.openShipping(); return; }
    if (act.kind === 'door') {
      const d = act.door;
      if (d.locked) { toast(d.locked); return; }
      travelTo(d.to, d.tx, d.ty);
      return;
    }
    if (act.kind === 'sleep') { openSleepConfirm(); return; }
    if (act.kind === 'shop') { UI.openShop(); return; }
    if (act.kind === 'mail') { UI.openMailbox(); return; }
    if (act.kind === 'notice') { UI.openNotice(); return; }
  }
  // 附近家具/出货箱
  for (const o of m.objs) {
    if (o.dead) continue;
    const near = Math.abs(o.x - f.x) <= 1 && Math.abs(o.y - f.y) <= 1;
    if (o.act === 'ship' && near) { UI.openShipping(); return; }
    if (o.type === 'bed' && Math.abs(o.x - f.x) <= 2 && Math.abs(o.y - f.y) <= 2) { openSleepConfirm(); return; }
    if (o.type === 'counter' && STATE.map === 'shop' && Math.abs(o.x - f.x) <= 2 && Math.abs(o.y - f.y) <= 2) { UI.openShop(); return; }
  }
  // 篝火/节日物件
  if (STATE.festival && festivalInteract(f.x, f.y)) return;
  // 环境提示
  if (m.base[f.y][f.x] === 'w') return toast('水面一闪一闪的，好像有小鱼。');
  if (m.objs.some(o => !o.dead && o.type === 'fountain' && Math.abs(o.x + 1 - f.x) <= 2 && Math.abs(o.y - f.y) <= 2)) return toast('喷泉的水真凉。');
  toast('这里没什么可以互动的。');
}

function eatSelected() {
  const sel = selectedItem();
  if (!sel) return toast('没有选中的东西。');
  const def = ITEMS[sel.id];
  if (!def || !def.energy) return toast(def ? def.name + '不能吃。' : '这个不能吃。');
  if (STATE.energy >= STATE.maxEnergy) return toast('你现在一点也不饿。');
  invRemoveSlot(STATE.hot, 1);
  STATE.energy = Math.min(STATE.maxEnergy, STATE.energy + def.energy);
  UI.updateHUD();
  Audio.sfx('eat');
  floatText(STATE.player.x, STATE.player.y - 26, '+' + def.energy + ' 体力', '#a8e0a0');
  if (STATE.inv[STATE.hot] === null) UI.updateHUD();
}

/* ===== 08_time.js ===== */
'use strict';

/* ============================================================
   时间、天气、生长、睡觉结算
   ============================================================ */
const TIME_RATE = 0.55; // 现实秒 / 游戏分钟

function updateClock(dt) {
  if (STATE.screen !== 'play' || STATE.paused || UI.modalOpen) return;
  if (STATE.transition) { updateTransition(dt); return; }
  if (STATE.festival) return;
  STATE.timeAccum = (STATE.timeAccum || 0) + dt;
  while (STATE.timeAccum >= TIME_RATE) {
    STATE.timeAccum -= TIME_RATE;
    addMinutes(1);
    if (STATE.transition) break;
  }
  UI.updateClock();
}

function addMinutes(n) {
  for (let i = 0; i < n; i++) {
    STATE.minute++;
    if (STATE.minute >= 60) {
      STATE.minute = 0;
      STATE.hour++;
      if (STATE.hour >= 24) STATE.hour = 0;
      onHourChange();
    }
    if (STATE.hour >= 2 && STATE.hour < 6) {
      forceSleep('已经凌晨两点了，你累得睁不开眼……');
      return;
    }
  }
}

function onHourChange() {
  updateNPCs(false);
}

function forceSleep(msg) {
  if (STATE.transition) return;
  toast(msg);
  sleepNow(true);
}

function openSleepConfirm() {
  UI.openConfirm('睡觉', '现在睡下，结束今天吗？出货箱里的东西会在明早结算。', () => {
    UI.closeModal();
    sleepNow(false);
  });
}

function sleepNow(forced) {
  if (STATE.transition) return;
  STATE.transition = { phase: 'out', t: 0, sleep: true, forced: !!forced };
  Audio.sfx('sleep');
  UI.closeModal();
}

function updateTransition(dt) {
  const tr = STATE.transition;
  if (!tr) return;
  tr.t += dt;
  if (tr.phase === 'out') {
    STATE.fade = Math.min(1, tr.t / 0.28);
    if (tr.t >= 0.28) {
      if (tr.sleep) {
        advanceDay(tr.forced);
      } else {
        applyTravel();
      }
      tr.phase = 'in';
      tr.t = 0;
    }
  } else {
    STATE.fade = 1 - Math.min(1, tr.t / 0.28);
    if (tr.t >= 0.28) {
      STATE.fade = 0;
      STATE.transition = null;
      UI.updateHUD();
    }
  }
}

/* ---------------- 天气 ---------------- */
function rollWeather() {
  if (STATE.season === 3) {
    const r = Math.random();
    return r < 0.55 ? 'snow' : r < 0.8 ? 'cloud' : 'sun';
  }
  const r = Math.random();
  if (r < 0.22) return 'rain';
  if (r < 0.4) return 'cloud';
  return 'sun';
}

function weatherName(w) { return (WEATHER[w] || WEATHER.sun).name; }
function weatherIcon(w) { return (WEATHER[w] || WEATHER.sun).icon; }

/* ---------------- 睡觉 → 新的一天 ---------------- */
function advanceDay(forced) {
  // 1) 作物生长（按昨晚是否浇水）
  for (const key of Object.keys(STATE.soil)) {
    const soil = STATE.soil[key];
    if (!soil || !soil.till) continue;
    const crop = soil.crop;
    if (crop && !crop.dead) {
      const def = CROPS[crop.id];
      if (crop.ready) {
        // 已成熟保持
      } else if (crop.watered) {
        crop.g = (crop.g || 0) + 1;
        crop.days = (crop.days || 0) + 1;
        if (crop.g >= def.growth.reduce((a, b) => a + b, 0)) crop.ready = true;
      }
    }
    soil.wet = false;
    if (crop) crop.watered = false;
  }

  // 2) 出货结算
  let income = 0;
  for (const it of STATE.shipped) {
    const def = ITEMS[it.id];
    if (def) income += (def.sell || 0) * it.count;
  }
  if (income > 0) {
    STATE.money += income;
    STATE.stats.earned += income;
  }
  STATE.shipped = [];

  // 3) 日历
  STATE.totalDays++;
  STATE.day++;
  if (STATE.day > SEASONS[STATE.season].days) {
    STATE.day = 1;
    STATE.season++;
    if (STATE.season > 3) { STATE.season = 0; STATE.year++; }
    // 换季：非本季作物枯萎
    for (const key of Object.keys(STATE.soil)) {
      const soil = STATE.soil[key];
      if (soil.crop && CROPS[soil.crop.id].season !== STATE.season) {
        soil.crop.dead = true;
      }
    }
    rebuildAllStatic();
  }

  // 4) 起床
  STATE.hour = 6; STATE.minute = 0;
  STATE.energy = STATE.maxEnergy;

  // 5) 天气
  STATE.weather = rollWeather();
  if (STATE.weather === 'rain') {
    for (const key of Object.keys(STATE.soil)) {
      const soil = STATE.soil[key];
      if (soil.till) {
        soil.wet = true;
        if (soil.crop && !soil.crop.dead) soil.crop.watered = true;
      }
    }
  }

  // 6) NPC 重置
  for (const npc of NPC_DEFS) {
    const rel = ensureRel(npc.id);
    rel.talkedDay = '';
    rel.giftedDay = '';
  }
  updateNPCs(true);

  // 7) 野草与采集物
  if (STATE.totalDays % 2 === 0) respawnWeeds();
  spawnForage();

  // 8) 回到农舍
  STATE.map = 'house';
  STATE.player.x = 7 * TS + 8;
  STATE.player.y = 8 * TS + 14;
  STATE.player.dir = 'down';
  STATE.player.busy = 0;
  const m = currentMap();
  STATE.camera.x = clamp(STATE.player.x - W / 2, 0, Math.max(0, m.w * TS - W));
  STATE.camera.y = clamp(STATE.player.y - H / 2 - 8, 0, Math.max(0, m.h * TS - H));
  STATE.fade = 0;
  UI.setArea(m.name);
  UI.updateHUD();

  const msgs = [];
  msgs.push(`${SEASONS[STATE.season].name} ${STATE.day}日 · ${weatherName(STATE.weather)}`);
  if (income > 0) msgs.push(`出货收入 ${income}G`);
  const fest = festivalFor(STATE.season, STATE.day);
  if (fest && !STATE.flags.festivalDone.includes(fest.id + '-Y' + STATE.year)) msgs.push(`今天是${fest.name}，去小镇广场`);
  toast(msgs.join('　|　'), 3);
  saveGame();
  Audio.sfx('morning');
}

function respawnWeeds() {
  const m = MAPS.farm;
  let placed = 0;
  for (let tries = 0; tries < 40 && placed < 2; tries++) {
    const x = ri(2, m.w - 3), y = ri(3, m.h - 3);
    if (m.solid[y][x]) continue;
    if (m.objAt[y][x]) continue;
    if (m.base[y][x] === 'p' || m.base[y][x] === 'w') continue;
    if (STATE.soil[x + ',' + y] && STATE.soil[x + ',' + y].till) continue;
    addObj(m, 'weed', x, y, { solid: false });
    placed++;
  }
  if (placed) rebuildStatic(m);
}

/* ---------------- 光照 ---------------- */
function lightingInfo() {
  const h = STATE.hour;
  if (h >= 6 && h < 8) return { color: 'rgba(255,190,120,0.10)' };
  if (h >= 8 && h < 17) return { color: 'rgba(255,240,200,0.03)' };
  if (h >= 17 && h < 19) return { color: 'rgba(255,150,80,0.15)' };
  if (h >= 19 && h < 21) return { color: 'rgba(120,80,150,0.26)' };
  if (h >= 21 || h < 1) return { color: 'rgba(40,50,110,0.38)' };
  return { color: 'rgba(20,25,70,0.50)' };
}


/* ===== 09_npc.js ===== */
'use strict';

/* ============================================================
   NPC：日程、寻路、对话、送礼、好感
   ============================================================ */
const NPCS = [];

function dayKey() { return STATE.year + '-' + STATE.season + '-' + STATE.day; }

function ensureRel(id) {
  if (!STATE.npc[id]) STATE.npc[id] = { points: 0, talkedDay: '', giftedDay: '' };
  return STATE.npc[id];
}

function heartsOf(id) {
  const rel = STATE.npc[id];
  return rel ? Math.floor(rel.points / 100) : 0;
}

function heartsHTML(points) {
  const full = Math.min(10, Math.floor(points / 100));
  const half = points % 100 >= 50 && full < 10;
  const off = 10 - full - (half ? 1 : 0);
  return '♥'.repeat(full) + (half ? '<span class="half">♥</span>' : '') +
    '<span class="off">' + '♡'.repeat(off) + '</span>';
}

function initNPCs() {
  NPCS.length = 0;
  for (const def of NPC_DEFS) {
    NPCS.push({
      id: def.id, def, map: null, tx: 0, ty: 0, px: 0, py: 0,
      dir: 'down', path: [], moving: false, frame: 0, animT: 0, hidden: true, stepT: 0
    });
  }
}

function scheduleFor(def, hour) {
  let s = def.sched[0];
  for (const item of def.sched) if (hour >= item.h) s = item;
  return s;
}

function placeNPCs(force) {
  if (STATE.festival) return;
  for (const n of NPCS) {
    const s = scheduleFor(n.def, STATE.hour);
    if (s.map === 'home') { n.hidden = true; n.map = null; continue; }
    n.hidden = false;
    if (force || n.map !== s.map) {
      n.map = s.map;
      n.tx = s.x; n.ty = s.y;
      n.px = s.x * TS + 8; n.py = s.y * TS + 14;
      n.path = [];
      n.dir = s.dir || 'down';
      n.moving = false;
    } else if (n.tx !== s.x || n.ty !== s.y) {
      const m = MAPS[s.map];
      const path = bfsPath(m, { x: n.tx, y: n.ty }, { x: s.x, y: s.y });
      if (path && path.length) { n.path = path; n.tx = s.x; n.ty = s.y; }
      else { n.tx = s.x; n.ty = s.y; n.px = s.x * TS + 8; n.py = s.y * TS + 14; }
    }
  }
}

function updateNPCs(force) {
  if (!STATE) return;
  if (STATE.festival) return;
  placeNPCs(force);
}

function bfsPath(m, from, to) {
  if (from.x === to.x && from.y === to.y) return [];
  if (to.x < 0 || to.y < 0 || to.x >= m.w || to.y >= m.h || m.solid[to.y][to.x]) return null;
  const q = [from];
  const seen = new Set([from.x + ',' + from.y]);
  const prev = new Map();
  let head = 0;
  while (head < q.length) {
    const cur = q[head++];
    if (cur.x === to.x && cur.y === to.y) {
      const path = [];
      let c = cur;
      while (c.x !== from.x || c.y !== from.y) {
        path.push(c);
        c = prev.get(c.x + ',' + c.y);
        if (!c) return null;
      }
      return path.reverse();
    }
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (const [dx, dy] of dirs) {
      const nx = cur.x + dx, ny = cur.y + dy;
      if (nx < 0 || ny < 0 || nx >= m.w || ny >= m.h) continue;
      if (m.solid[ny][nx]) continue;
      const k = nx + ',' + ny;
      if (seen.has(k)) continue;
      seen.add(k);
      prev.set(k, cur);
      q.push({ x: nx, y: ny });
    }
  }
  return null;
}

/* ---------------- 每帧移动 ---------------- */
function updateNPCMovement(dt) {
  for (const n of NPCS) {
    if (n.hidden || n.map !== STATE.map || !n.path.length) continue;
    const target = n.path[0];
    const tx = target.x * TS + 8, ty = target.y * TS + 14;
    const dx = tx - n.px, dy = ty - n.py;
    const dist = Math.hypot(dx, dy);
    const spd = 42 * dt;
    if (dist <= spd) {
      n.px = tx; n.py = ty;
      n.path.shift();
      n.moving = false;
    } else {
      n.px += dx / dist * spd;
      n.py += dy / dist * spd;
      n.moving = true;
      if (Math.abs(dx) > Math.abs(dy)) n.dir = dx > 0 ? 'right' : 'left';
      else n.dir = dy > 0 ? 'down' : 'up';
      n.animT += dt;
      if (n.animT > 0.18) { n.animT = 0; n.frame = (n.frame + 1) % 4; }
    }
  }
}

function npcAtTile(tx, ty) {
  for (const n of NPCS) {
    if (n.hidden || n.map !== STATE.map) continue;
    const nx = Math.floor(n.px / TS), ny = Math.floor((n.py - 2) / TS);
    if (nx === tx && ny === ty) return n;
  }
  return null;
}

function npcOnCurrentMap() {
  return NPCS.filter(n => !n.hidden && n.map === STATE.map);
}

/* ---------------- 对话 ---------------- */
function startDialogue(id) {
  const n = NPCS.find(x => x.id === id);
  if (!n) return;
  const def = n.def;
  const rel = ensureRel(id);
  const first = rel.talkedDay !== dayKey();
  if (first) {
    rel.points = clamp(rel.points + 10, 0, 1000);
    rel.talkedDay = dayKey();
    STATE.stats.talks++;
  }
  const hearts = heartsOf(id);
  const tier = hearts >= 8 ? 3 : hearts >= 5 ? 2 : hearts >= 2 ? 1 : 0;
  const lineSet = def.greet[tier];
  const line = lineSet[(STATE.day + def.name.length) % lineSet.length];
  const gifted = rel.giftedDay === dayKey();
  UI.openDialogue(id, line, [
    { label: gifted ? '今天已送过礼物' : '送礼物', disabled: gifted, cb: () => UI.openGiftPicker(id) },
    { label: '再见', cb: () => UI.closeModal() }
  ], hearts);
}

function giftCategory(npcDef, itemId) {
  if (npcDef.loves.includes(itemId)) return 'love';
  if (npcDef.likes.includes(itemId)) return 'like';
  if (npcDef.hates.includes(itemId)) return 'hate';
  return 'neutral';
}

function giveGift(id, slot) {
  const n = NPCS.find(x => x.id === id);
  if (!n) return;
  const s = STATE.inv[slot];
  if (!s) return;
  const def = ITEMS[s.id];
  if (!def || def.type === 'tool') { toast('工具可不能送人。'); return; }
  const npcDef = n.def;
  const rel = ensureRel(id);
  if (rel.giftedDay === dayKey()) { toast('今天已经送过礼物了。'); return; }
  const cat = giftCategory(npcDef, s.id);
  const delta = cat === 'love' ? 80 : cat === 'like' ? 45 : cat === 'hate' ? -30 : 20;
  rel.points = clamp(rel.points + delta, 0, 1000);
  rel.giftedDay = dayKey();
  STATE.stats.gifts++;
  invRemoveSlot(slot, 1);
  Audio.sfx(cat === 'hate' ? 'bad' : 'gift');
  floatText(n.px, n.py - 30, (delta > 0 ? '+' : '') + delta + ' 好感', delta > 0 ? '#f0a0b0' : '#d0d0d0');
  if (delta > 0) addParticles(n.px, n.py - 14, '#f0a0b0', 6, 8);
  UI.openDialogue(id, npcDef.gift[cat], [{ label: '再见', cb: () => UI.closeModal() }], heartsOf(id));
  UI.updateHUD();
}

/* ---------------- 绘制 NPC ---------------- */
function drawNPC(ctx, n) {
  const spr = ART.chars.npc[n.id];
  let img;
  if (n.moving) img = spr.walk[n.dir][(n.frame % 3) + 1];
  else img = spr.walk[n.dir][0];
  shadowEllipse(ctx, n.px, n.py - 1, 6, 3);
  ctx.drawImage(img, Math.round(n.px - 8), Math.round(n.py - 24));
  // 头顶提示
  const pd = Math.hypot(n.px - STATE.player.x, n.py - STATE.player.y);
  if (pd < 44) {
    ctx.fillStyle = '#f6f0e4';
    ctx.fillRect(Math.round(n.px - 4), Math.round(n.py - 32), 8, 7);
    ctx.strokeStyle = '#3a2a1a';
    ctx.lineWidth = 1;
    ctx.strokeRect(Math.round(n.px - 4) + 0.5, Math.round(n.py - 32) + 0.5, 7, 6);
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(Math.round(n.px - 1), Math.round(n.py - 31), 2, 3);
    ctx.fillRect(Math.round(n.px - 1), Math.round(n.py - 27), 2, 1);
  }
}
