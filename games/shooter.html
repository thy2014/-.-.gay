<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞机大战</title>
<style>
:root{
  --bg:#0b0f0d; --line:#2c3a30; --ink:#e7eae4; --dim:#8b978d;
  --green:#7ef0a0; --gold:#e8c06a; --red:#e4645c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(120% 90% at 50% 0%, #101a22 0%, var(--bg) 62%);
  color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100%;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
#wrap{position:relative;width:min(94vw,460px)}
h1{font-size:18px;letter-spacing:.18em;text-align:center;margin-bottom:10px;color:var(--green);font-weight:600}
#hud{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-bottom:8px}
#hud b{color:var(--ink)}
canvas{width:100%;display:block;border-radius:10px;background:#0a1218;border:1px solid var(--line);touch-action:none}
#overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,12,16,.85);border-radius:10px;gap:14px;text-align:center;padding:20px;
}
#overlay.off{display:none}
#overlay h2{font-size:22px;letter-spacing:.1em}
#overlay p{font-size:13px;color:var(--dim);line-height:1.7}
#overlay button{
  min-width:130px;min-height:46px;padding:0 24px;border-radius:10px;cursor:pointer;
  background:var(--green);color:#0c1710;border:none;font-size:15px;font-weight:700;font-family:inherit;
}
#tip{margin-top:10px;font-size:12px;color:var(--dim);text-align:center;line-height:1.7}
</style>
</head>
<body>
<div id="wrap">
  <h1>飞 机 大 战</h1>
  <div id="hud">
    <span>分数 <b id="score">0</b></span>
    <span>血量 <b id="hp">100</b></span>
    <span>击落 <b id="kills">0</b></span>
  </div>
  <canvas id="cv" width="420" height="600"></canvas>
  <div id="overlay">
    <h2 id="ovTitle">飞机大战</h2>
    <p id="ovText">拖动飞机躲避敌机与子弹，机炮自动开火。击落敌机得分，血量归零就结束。</p>
    <button id="btn">开始游戏</button>
  </div>
  <div id="tip">方向键 / 鼠标 / 手指 移动，自动开火</div>
</div>
<script>
(function(){
  var cv=document.getElementById("cv"), cx=cv.getContext("2d");
  var W=cv.width,H=cv.height;
  var scoreEl=document.getElementById("score"),hpEl=document.getElementById("hp"),killsEl=document.getElementById("kills");
  var ov=document.getElementById("overlay"),ovTitle=document.getElementById("ovTitle"),ovText=document.getElementById("ovText"),btn=document.getElementById("btn");

  var player,bullets,foes,foeBullets,particles,stars,score,hp,kills,fireCd,spawnCd,running,keys,time;

  function reset(){
    player={x:W/2,y:H-80,w:34,h:40,spd:5};
    bullets=[];foes=[];foeBullets=[];particles=[];
    stars=[];
    for(var i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+.4,v:Math.random()*1.5+.5});
    score=0;hp=100;kills=0;fireCd=0;spawnCd=0;time=0;
    running=true;
    updateHud();
  }
  function updateHud(){scoreEl.textContent=score;hpEl.textContent=Math.max(0,hp);killsEl.textContent=kills;}

  function spawnFoe(){
    var big=Math.random()<.18;
    foes.push({
      x:20+Math.random()*(W-60), y:-40,
      w:big?46:30, h:big?42:28,
      hp:big?5:1, big:big,
      vy:big?1.1:1.6+Math.random()*1.4+time*.01,
      vx:(Math.random()-.5)*1.2,
      shootCd:big?60+Math.random()*40:9999
    });
  }
  function boom(x,y,color,n){
    for(var i=0;i<(n||12);i++){
      var a=Math.random()*Math.PI*2, sp=Math.random()*4+1;
      particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:24+Math.random()*10,color:color});
    }
  }
  function hit(a,b){
    return a.x<a2(b)&&a2(a)>b.x&&a.y<b2(b)&&b2(a)>b.y;
  }
  function a2(o){return o.x+(o.w||o.r||6);}
  function b2(o){return o.y+(o.h||o.r||6);}

  function update(){
    if(!running)return;
    time++;
    if(keys.left)player.x-=player.spd;
    if(keys.right)player.x+=player.spd;
    if(keys.up)player.y-=player.spd;
    if(keys.down)player.y+=player.spd;
    player.x=Math.max(4,Math.min(W-player.w-4,player.x));
    player.y=Math.max(H/2,Math.min(H-player.h-4,player.y));

    // 星空
    for(var s=0;s<stars.length;s++){
      var st=stars[s]; st.y+=st.v;
      if(st.y>H){st.y=0;st.x=Math.random()*W;}
    }

    // 开火
    fireCd--;
    if(fireCd<=0){
      bullets.push({x:player.x+player.w/2-3,y:player.y-6,w:6,h:14,vy:-9});
      fireCd=11;
    }
    for(var i=bullets.length-1;i>=0;i--){
      bullets[i].y+=bullets[i].vy;
      if(bullets[i].y<-20)bullets.splice(i,1);
    }

    // 敌机
    spawnCd--;
    if(spawnCd<=0){spawnFoe();spawnCd=Math.max(28,70-time*.15);}
    for(var f=foes.length-1;f>=0;f--){
      var foe=foes[f];
      foe.x+=foe.vx; foe.y+=foe.vy;
      if(foe.x<4||foe.x>W-foe.w-4)foe.vx=-foe.vx;
      if(foe.big){
        foe.shootCd--;
        if(foe.shootCd<=0){
          foeBullets.push({x:foe.x+foe.w/2-3,y:foe.y+foe.h,w:6,h:12,vy:4.2});
          foe.shootCd=70+Math.random()*40;
        }
      }
      if(foe.y>H+40){foes.splice(f,1);continue;}
      // 子弹击中
      for(var bi=bullets.length-1;bi>=0;bi--){
        if(hit(bullets[bi],foe)){
          bullets.splice(bi,1); foe.hp--;
          if(foe.hp<=0){
            boom(foe.x+foe.w/2,foe.y+foe.h/2,foe.big?"#e8c06a":"#e4645c",foe.big?18:10);
            score+=foe.big?50:10; kills++;
            foes.splice(f,1); updateHud();
            break;
          }
        }
      }
    }
    // 敌弹
    for(var fb=foeBullets.length-1;fb>=0;fb--){
      foeBullets[fb].y+=foeBullets[fb].vy;
      if(foeBullets[fb].y>H+10)foeBullets.splice(fb,1);
      else if(hit(foeBullets[fb],player)){
        foeBullets.splice(fb,1); hp-=10; updateHud();
        if(hp<=0)endGame();
      }
    }
    // 撞机
    for(var fi=foes.length-1;fi>=0;fi--){
      if(hit(foes[fi],player)){
        var hitFoe=foes[fi];
        boom(hitFoe.x+hitFoe.w/2,hitFoe.y+hitFoe.h/2,"#e8c06a",16);
        foes.splice(fi,1);
        hp-=hitFoe.big?34:22; updateHud();
        if(hp<=0)endGame();
      }
    }
    // 粒子
    for(var p=particles.length-1;p>=0;p--){
      var pt=particles[p];
      pt.x+=pt.vx;pt.y+=pt.vy;pt.vx*=.94;pt.vy*=.94;pt.life--;
      if(pt.life<=0)particles.splice(p,1);
    }
  }
  function endGame(){
    running=false;
    ov.className="";
    ovTitle.textContent="飞机坠毁";
    ovText.textContent="击落 "+kills+" 架，得分 "+score+"。";
    btn.textContent="再玩一次";
  }

  function drawShip(x,y,w,h,color){
    cx.fillStyle=color;
    cx.beginPath();
    cx.moveTo(x+w/2,y);
    cx.lineTo(x+w,y+h);
    cx.lineTo(x+w/2,y+h*.72);
    cx.lineTo(x,y+h);
    cx.closePath();cx.fill();
    cx.fillStyle="rgba(255,255,255,.25)";
    cx.fillRect(x+w/2-2,y+4,4,h*.5);
  }
  function draw(){
    cx.clearRect(0,0,W,H);
    cx.fillStyle="#bfe8d4";
    for(var i=0;i<stars.length;i++){
      cx.globalAlpha=.5+stars[i].s*.3;
      cx.fillRect(stars[i].x,stars[i].y,stars[i].s,stars[i].s);
    }
    cx.globalAlpha=1;

    cx.fillStyle="#7ef0a0";
    for(var b=0;b<bullets.length;b++){
      cx.fillRect(bullets[b].x,bullets[b].y,bullets[b].w,bullets[b].h);
    }
    cx.fillStyle="#e4645c";
    for(var f=0;f<foes.length;f++){
      var foe=foes[f];
      drawShip(foe.x,foe.y,foe.w,foe.h,foe.big?"#e8c06a":"#e4645c");
    }
    cx.fillStyle="#e89a6a";
    for(var fb2=0;fb2<foeBullets.length;fb2++){
      cx.fillRect(foeBullets[fb2].x,foeBullets[fb2].y,foeBullets[fb2].w,foeBullets[fb2].h);
    }
    drawShip(player.x,player.y,player.w,player.h,"#7ef0a0");
    // 尾焰
    cx.fillStyle="rgba(232,192,106,.8)";
    cx.beginPath();
    cx.moveTo(player.x+player.w/2-4,player.y+player.h);
    cx.lineTo(player.x+player.w/2,player.y+player.h+8+Math.random()*6);
    cx.lineTo(player.x+player.w/2+4,player.y+player.h);
    cx.closePath();cx.fill();

    for(var p=0;p<particles.length;p++){
      cx.globalAlpha=Math.max(0,particles[p].life/30);
      cx.fillStyle=particles[p].color;
      cx.fillRect(particles[p].x-2,particles[p].y-2,4,4);
    }
    cx.globalAlpha=1;
  }
  function loop(){update();draw();requestAnimationFrame(loop);}

  keys={left:false,right:false,up:false,down:false};
  document.addEventListener("keydown",function(e){
    if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
    if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
    if(e.key==="ArrowUp"||e.key==="w")keys.up=true;
    if(e.key==="ArrowDown"||e.key==="s")keys.down=true;
  });
  document.addEventListener("keyup",function(e){
    if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
    if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
    if(e.key==="ArrowUp"||e.key==="w")keys.up=false;
    if(e.key==="ArrowDown"||e.key==="s")keys.down=false;
  });
  function movePointer(clientX,clientY){
    var r=cv.getBoundingClientRect();
    var nx=(clientX-r.left)*(W/r.width), ny=(clientY-r.top)*(H/r.height);
    player.x=Math.max(4,Math.min(W-player.w-4,nx-player.w/2));
    player.y=Math.max(H/2,Math.min(H-player.h-4,ny-player.h/2));
  }
  cv.addEventListener("mousemove",function(e){if(running)movePointer(e.clientX,e.clientY);});
  cv.addEventListener("touchmove",function(e){
    e.preventDefault();
    if(running)movePointer(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:false});
  cv.addEventListener("touchstart",function(e){
    e.preventDefault();
    if(running)movePointer(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:false});

  btn.addEventListener("click",function(){ov.className="off";reset();});

  reset();running=false;
  loop();
})();
</script>
</body>
</html>
