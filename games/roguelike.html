<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>割草肉鸽</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%233ddc84'/%3E%3Crect x='10.5' y='1.5' width='3' height='9' fill='%23070b0a'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#05080a; --ink:#e2fff2; --dim:#7d9a8d;
    --gr:#3ddc84; --cy:#2bd4c0; --mg:#ff5d6c; --am:#ffc75f; --vi:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
  #cv{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}

  .hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
  .hud.on{display:block}
  .hp{position:absolute;top:14px;left:14px;width:min(240px,42vw)}
  .hp .track{height:12px;border-radius:6px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);overflow:hidden}
  .hp .fill{height:100%;width:100%;background:linear-gradient(90deg,#ff5d6c,#ff8a5c);transition:width .12s}
  .hp .txt{font-size:11px;color:var(--dim);margin-top:4px;letter-spacing:.5px}
  .mid{position:absolute;top:12px;left:50%;transform:translateX(-50%);text-align:center;font-size:12px;color:var(--dim);line-height:1.75}
  .mid b{color:var(--gr);font-weight:700;font-size:14px}
  .xp{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;width:min(430px,74vw)}
  .xp .track{height:10px;border-radius:6px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);overflow:hidden}
  .xp .fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gr),#8ef7c4);transition:width .1s}
  .xp .txt{font-size:11px;color:var(--dim);text-align:center;margin-top:5px;letter-spacing:.5px}
  .pause{position:absolute;top:14px;right:14px;pointer-events:auto;width:38px;height:38px;border-radius:9px;
    background:rgba(8,16,12,.72);border:1px solid rgba(255,255,255,.16);color:var(--ink);font-size:15px;cursor:pointer;display:none}
  .tips{position:absolute;left:14px;bottom:52px;font-size:10px;color:rgba(125,154,141,.55);line-height:1.6}

  .stick{position:fixed;pointer-events:none;z-index:6;display:none}
  .stick .ring{position:absolute;width:96px;height:96px;border-radius:50%;border:2px solid rgba(61,220,132,.35);background:radial-gradient(circle,rgba(61,220,132,.10),transparent 70%);transform:translate(-50%,-50%)}
  .stick .dot{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(61,220,132,.5);box-shadow:0 0 18px rgba(61,220,132,.6);transform:translate(-50%,-50%)}

  .ov{position:fixed;inset:0;z-index:20;background:rgba(3,6,8,.93);display:none;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
  .ov.show{display:flex}
  .panel{width:100%;max-width:540px;background:linear-gradient(180deg,#070d0c,#050a09);border:1px solid rgba(61,220,132,.22);border-radius:16px;padding:26px 22px}
  .panel h1{font-size:26px;letter-spacing:2px;text-align:center;font-weight:800}
  .panel h1 span{color:var(--gr)}
  .sub{text-align:center;color:var(--dim);font-size:12px;line-height:1.75;margin:8px 0 18px}
  .btn{display:block;width:100%;height:50px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;border:none}
  .btn.main{background:linear-gradient(90deg,#3ddc84,#7ef0b8);color:#04140c}
  .btn.g2{background:transparent;border:1px solid #1a2a23;color:var(--dim)}
  .btn.g2:hover{border-color:var(--gr);color:var(--gr)}
  .rec{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
  .rec div{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:9px 4px;text-align:center}
  .rec .k{font-size:10px;color:var(--dim)}
  .rec .v{font-size:16px;font-weight:700;color:var(--gr);margin-top:2px}
  .who{text-align:center;font-size:11px;color:#3d554b;margin-top:14px}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  @media(max-width:620px){.cards{grid-template-columns:1fr;max-width:330px;margin:0 auto}}
  .card{position:relative;background:linear-gradient(180deg,#0b1411,#070f0c);border:1px solid #17261f;border-radius:13px;
    padding:15px 13px;cursor:pointer;text-align:left;transition:transform .15s,border-color .15s}
  .card::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;border-radius:13px 13px 0 0}
  .card.a::after{background:var(--gr)} .card.b::after{background:var(--am)} .card.c::after{background:var(--vi)}
  .card:hover{transform:translateY(-3px);border-color:var(--gr)}
  .card .n{font-size:14px;font-weight:700;margin-bottom:5px}
  .card .d{font-size:11px;color:var(--dim);line-height:1.6;min-height:50px}
  .card .l{font-size:11px;margin-top:7px;color:var(--am)}
  .card .l.nw{color:var(--gr)}
  .lvh{text-align:center;font-size:16px;font-weight:800;color:var(--gr);letter-spacing:1px;margin-bottom:3px}
  .lvh2{text-align:center;font-size:11px;color:var(--dim);margin-bottom:14px}

  .go .row{display:flex;justify-content:space-between;font-size:13px;padding:9px 3px;border-bottom:1px dashed rgba(255,255,255,.07)}
  .go .row i{color:var(--dim);font-style:normal}
  .go .row b{color:var(--ink)}
  .go .best{text-align:center;color:var(--am);font-size:12px;margin-top:13px}

  /* ===== 移动端适配 ===== */
  @media (max-width:820px), (pointer:coarse){
    .hp{top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));width:40vw}
    .hp .track{height:10px}
    .hp .txt{font-size:10.5px}
    .mid{top:calc(44px + env(safe-area-inset-top));font-size:10.5px;line-height:1.6}
    .mid b{font-size:13px}
    .pause{width:44px;height:44px;font-size:14px;
      top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right))}
    .xp{bottom:calc(12px + env(safe-area-inset-bottom));width:min(430px,88vw)}
    .xp .txt{font-size:10.5px}
    .tips{display:none}
    .stick .ring{width:118px;height:118px}
    .stick .dot{width:52px;height:52px}
    .ov{padding:12px}
    .panel{padding:20px 16px;border-radius:14px}
    .btn{height:52px;font-size:16px}
    .cards{gap:9px}
    .card{padding:13px 12px}
    .card .n{font-size:13.5px}
    .card .d{font-size:11.5px;min-height:auto}
    .rec{grid-template-columns:repeat(2,1fr)}
    .rec .v{font-size:15px}
  }
  @media (max-height:560px) and (pointer:coarse){
    .panel{padding:12px 16px;border-radius:12px}
    .panel h1{font-size:17px;letter-spacing:1px}
    .sub{display:none}
    .btn{height:42px;margin-top:7px;font-size:14px}
    .rec{margin-top:8px;grid-template-columns:repeat(4,1fr);gap:6px}
    .rec div{padding:6px 3px;border-radius:7px}
    .rec .k{font-size:9px}
    .rec .v{font-size:13px}
    .who{display:none}
    .cards{gap:8px}
    .card{padding:10px 11px}
    .card .d{display:none}
  }
</style>
