<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>割草肉鸽</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%233ddc84'/%3E%3Crect x='10.5' y='1.5' width='3' height='9' fill='%23070b0a'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#05080a; --ink:#e2fff2; --dim:#7d9a8d;
    --gr:#3ddc84; --cy:#2bd4c0; --mg:#ff5d6c; --am:#ffc75f; --vi:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
  #cv{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}

  .hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
  .hud.on{display:block}
  .hp{position:absolute;top:14px;left:14px;width:min(240px,42vw)}
  .hp .track{height:12px;border-radius:6px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);overflow:hidden}
  .hp .fill{height:100%;width:100%;background:linear-gradient(90deg,#ff5d6c,#ff8a5c);transition:width .12s}
  .hp .txt{font-size:11px;color:var(--dim);margin-top:4px;letter-spacing:.5px}
  .mid{position:absolute;top:12px;left:50%;transform:translateX(-50%);text-align:center;font-size:12px;color:var(--dim);line-height:1.75}
  .mid b{color:var(--gr);font-weight:700;font-size:14px}
  .xp{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;width:min(430px,74vw)}
  .xp .track{height:10px;border-radius:6px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);overflow:hidden}
  .xp .fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gr),#8ef7c4);transition:width .1s}
  .xp .txt{font-size:11px;color:var(--dim);text-align:center;margin-top:5px;letter-spacing:.5px}
  .pause{position:absolute;top:14px;right:14px;pointer-events:auto;width:38px;height:38px;border-radius:9px;
    background:rgba(8,16,12,.72);border:1px solid rgba(255,255,255,.16);color:var(--ink);font-size:15px;cursor:pointer;display:none}
  .tips{position:absolute;left:14px;bottom:52px;font-size:10px;color:rgba(125,154,141,.55);line-height:1.6}

  .stick{position:fixed;pointer-events:none;z-index:6;display:none}
  .stick .ring{position:absolute;width:96px;height:96px;border-radius:50%;border:2px solid rgba(61,220,132,.35);background:radial-gradient(circle,rgba(61,220,132,.10),transparent 70%);transform:translate(-50%,-50%)}
  .stick .dot{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(61,220,132,.5);box-shadow:0 0 18px rgba(61,220,132,.6);transform:translate(-50%,-50%)}

  .ov{position:fixed;inset:0;z-index:20;background:rgba(3,6,8,.93);display:none;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
  .ov.show{display:flex}
  .panel{width:100%;max-width:540px;background:linear-gradient(180deg,#070d0c,#050a09);border:1px solid rgba(61,220,132,.22);border-radius:16px;padding:26px 22px}
  .panel h1{font-size:26px;letter-spacing:2px;text-align:center;font-weight:800}
  .panel h1 span{color:var(--gr)}
  .sub{text-align:center;color:var(--dim);font-size:12px;line-height:1.75;margin:8px 0 18px}
  .btn{display:block;width:100%;height:50px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;border:none}
  .btn.main{background:linear-gradient(90deg,#3ddc84,#7ef0b8);color:#04140c}
  .btn.g2{background:transparent;border:1px solid #1a2a23;color:var(--dim)}
  .btn.g2:hover{border-color:var(--gr);color:var(--gr)}
  .rec{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
  .rec div{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:9px 4px;text-align:center}
  .rec .k{font-size:10px;color:var(--dim)}
  .rec .v{font-size:16px;font-weight:700;color:var(--gr);margin-top:2px}
  .who{text-align:center;font-size:11px;color:#3d554b;margin-top:14px}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  @media(max-width:620px){.cards{grid-template-columns:1fr;max-width:330px;margin:0 auto}}
  .card{position:relative;background:linear-gradient(180deg,#0b1411,#070f0c);border:1px solid #17261f;border-radius:13px;
    padding:15px 13px;cursor:pointer;text-align:left;transition:transform .15s,border-color .15s}
  .card::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;border-radius:13px 13px 0 0}
  .card.a::after{background:var(--gr)} .card.b::after{background:var(--am)} .card.c::after{background:var(--vi)}
  .card:hover{transform:translateY(-3px);border-color:var(--gr)}
  .card .n{font-size:14px;font-weight:700;margin-bottom:5px}
  .card .d{font-size:11px;color:var(--dim);line-height:1.6;min-height:50px}
  .card .l{font-size:11px;margin-top:7px;color:var(--am)}
  .card .l.nw{color:var(--gr)}
  .lvh{text-align:center;font-size:16px;font-weight:800;color:var(--gr);letter-spacing:1px;margin-bottom:3px}
  .lvh2{text-align:center;font-size:11px;color:var(--dim);margin-bottom:14px}

  .go .row{display:flex;justify-content:space-between;font-size:13px;padding:9px 3px;border-bottom:1px dashed rgba(255,255,255,.07)}
  .go .row i{color:var(--dim);font-style:normal}
  .go .row b{color:var(--ink)}
  .go .best{text-align:center;color:var(--am);font-size:12px;margin-top:13px}

  /* ===== 移动端适配 ===== */
  @media (max-width:820px), (pointer:coarse){
    .hp{top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));width:40vw}
    .hp .track{height:10px}
    .hp .txt{font-size:10.5px}
    .mid{top:calc(44px + env(safe-area-inset-top));font-size:10.5px;line-height:1.6}
    .mid b{font-size:13px}
    .pause{width:44px;height:44px;font-size:14px;
      top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right))}
    .xp{bottom:calc(12px + env(safe-area-inset-bottom));width:min(430px,88vw)}
    .xp .txt{font-size:10.5px}
    .tips{display:none}
    .stick .ring{width:118px;height:118px}
    .stick .dot{width:52px;height:52px}
    .ov{padding:12px}
    .panel{padding:20px 16px;border-radius:14px}
    .btn{height:52px;font-size:16px}
    .cards{gap:9px}
    .card{padding:13px 12px}
    .card .n{font-size:13.5px}
    .card .d{font-size:11.5px;min-height:auto}
    .rec{grid-template-columns:repeat(2,1fr)}
    .rec .v{font-size:15px}
  }
  @media (max-height:560px) and (pointer:coarse){
    .panel{padding:12px 16px;border-radius:12px}
    .panel h1{font-size:17px;letter-spacing:1px}
    .sub{display:none}
    .btn{height:42px;margin-top:7px;font-size:14px}
    .rec{margin-top:8px;grid-template-columns:repeat(4,1fr);gap:6px}
    .rec div{padding:6px 3px;border-radius:7px}
    .rec .k{font-size:9px}
    .rec .v{font-size:13px}
    .who{display:none}
    .cards{gap:8px}
    .card{padding:10px 11px}
    .card .d{display:none}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud" id="hud">
  <div class="hp">
    <div class="track"><div class="fill" id="hpFill"></div></div>
    <div class="txt" id="hpText"></div>
  </div>
  <div class="mid" id="stat"></div>
  <button class="pause" id="pauseBtn">II</button>
  <div class="xp">
    <div class="track"><div class="fill" id="xpFill"></div></div>
    <div class="txt" id="xpText"></div>
  </div>
  <div class="tips">WASD / 方向键 移动 · 自动瞄准开火 · P 暂停 · 触屏任意位置拖动移动</div>
</div>

<div class="stick" id="stick"><div class="ring"></div><div class="dot"></div></div>

<div class="ov show" id="menu">
  <div class="panel">
    <h1>割草<span>肉鸽</span></h1>
    <div class="sub">无限大地图 · 镜头跟随 · 炮台自动瞄准<br>自动攻击、升级三选一卡牌强化，进度可存档</div>
    <div id="saveInfo" style="text-align:center;color:var(--am);font-size:12px;margin-bottom:6px"></div>
    <button class="btn main" id="newBtn">新游戏</button>
    <button class="btn g2" id="contBtn" style="display:none">继续上次存档</button>
    <div class="rec" id="recBox"></div>
    <button class="btn g2" id="backBtn" style="margin-top:16px">返回游戏站</button>
    <div class="who">进度自动存档 · 账号 <b id="whoLabel"></b></div>
  </div>
</div>

<div class="ov" id="levelup">
  <div class="panel" style="max-width:700px">
    <div class="lvh">升级 · 选择一个强化</div>
    <div class="lvh2">等级 <span id="lvCur">2</span></div>
    <div class="cards" id="cards"></div>
  </div>
</div>

<div class="ov" id="pause">
  <div class="panel" style="max-width:330px;text-align:center">
    <h1 style="font-size:20px">已暂停</h1>
    <button class="btn main" id="resumeBtn">继续</button>
    <button class="btn g2" id="quitBtn">结束本局</button>
  </div>
</div>

<div class="ov" id="gameover">
  <div class="panel go" style="max-width:400px">
    <h1 style="font-size:22px;color:var(--mg)">你倒下了</h1>
    <div class="sub">坚持了 <b id="goTime" style="color:var(--ink)"></b></div>
    <div class="row"><i>等级</i><b id="goLevel"></b></div>
    <div class="row"><i>击杀</i><b id="goKills"></b></div>
    <div class="row"><i>得分</i><b id="goScore"></b></div>
    <div class="best" id="goBest"></div>
    <button class="btn main" id="againBtn">再战一局</button>
    <button class="btn g2" id="goBackBtn">返回游戏站</button>
  </div>
</div>

<script>
(function(){
"use strict";

var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var W=0,H=0,DPR=1;
var MOBILE=(window.matchMedia&&window.matchMedia("(pointer:coarse)").matches)||Math.min(window.innerWidth,window.innerHeight)<700;
function resize(){
  var vv=window.visualViewport;
  W=(vv&&vv.width)?Math.round(vv.width):window.innerWidth;
  H=(vv&&vv.height)?Math.round(vv.height):window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1, MOBILE?1.5:2);
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",function(){setTimeout(resize,180);});
if(window.visualViewport) window.visualViewport.addEventListener("resize",function(){resize();});

function qs(n){var m=location.search.match(new RegExp("[?&]"+n+"=([^&]*)"));return m?decodeURIComponent(m[1]):"";}
var user=qs("user")||localStorage.getItem("gstation_session")||"guest";
document.getElementById("whoLabel").textContent=user;
var SAVE_KEY="gr_roguelike_save_"+user, REC_KEY="gr_roguelike_rec_"+user;
function lj(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function sj(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var rec=lj(REC_KEY)||{bestScore:0,bestLevel:0,bestKills:0,bestTime:0,runs:0};

var WORLD=5200;
var state="menu";
var time=0,score=0,kills=0,level=1,xp=0,xpNext=0;
var UP={};
var cam={x:WORLD/2,y:WORLD/2};
var shake=0,hitFlash=0;
var RND=Math.random;

var P={x:WORLD/2,y:WORLD/2,r:18,hp:120,maxHp:120,aim:-Math.PI/2,recoil:0,invul:0};
var enemies=[],bullets=[],gems=[],parts=[],beams=[],orbsDraw=[];
var fireCd=0,laserCd=0,spawnCd=1,saveT=0;

var POOL=[
  {id:"hp",    n:"生命上限",   d:"最大生命 +25，并立即回复 25 点",       max:8},
  {id:"regen", n:"再生",       d:"每秒回复生命 +0.5",                     max:5},
  {id:"speed", n:"移速提升",   d:"移动速度 +8%",                          max:6},
  {id:"dmg",   n:"火力提升",   d:"伤害 +22%",                             max:8},
  {id:"rate",  n:"攻速提升",   d:"攻击频率 +15%",                         max:8},
  {id:"count", n:"多重弹幕",   d:"每次发射的子弹 +1",                      max:5},
  {id:"pspeed",n:"弹速提升",   d:"子弹飞行速度 +18%",                     max:5},
  {id:"pierce",n:"穿透",       d:"子弹可多穿透 1 个敌人",                  max:4},
  {id:"crit",  n:"暴击",       d:"暴击率 +6%（暴击 ×2.2 伤害）",           max:6},
  {id:"xp",    n:"经验加成",   d:"获得的经验 +15%",                        max:6},
  {id:"pickup",n:"拾取范围",   d:"经验晶石拾取范围 +25%",                  max:5},
  {id:"turn",  n:"伺服瞄准",   d:"炮管转向速度 +30%",                      max:4},
  {id:"orbit", n:"环绕·新武器",d:"环绕护盾 +1（碰触造成伤害）",            max:4},
  {id:"laser", n:"激光·新武器",d:"穿透激光束 +1（贯穿整条直线）",            max:4},
  {id:"split", n:"散射",       d:"额外 +2 发斜向子弹",                     max:4}
];
function Lv(id){return UP[id]||0;}

function maxHpNow(){return 120+25*Lv("hp");}
function dmgMult(){return 1+0.22*Lv("dmg");}
function intervalNow(){return 0.42/Math.pow(1.15,Lv("rate"));}
function bulletSpeedNow(){return 470*(1+0.18*Lv("pspeed"));}
function shotCount(){return 1+Lv("count");}
function pierceNow(){return Lv("pierce");}
function critRate(){return 0.06*Lv("crit");}
function moveSpeed(){return 208*(1+0.08*Lv("speed"));}
function regenNow(){return 0.5*Lv("regen");}
function turnRate(){return 6.0*(1+0.30*Lv("turn"));}
function pickRange(){return 90*(1+0.25*Lv("pickup"));}
function xpMult(){return 1+0.15*Lv("xp");}
function xpFor(l){return Math.floor(6*Math.pow(l,1.2))+4;}

function saveNow(){
  if(state!=="play"&&state!=="pause"&&state!=="levelup")return;
  sj(SAVE_KEY,{level:level,xp:xp,xpNext:xpNext,hp:P.hp,maxHp:P.maxHp,px:P.x,py:P.y,
    up:UP,time:time,score:score,kills:kills});
}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function loadSave(){return lj(SAVE_KEY);}
function commitRec(){
  if(score>rec.bestScore)rec.bestScore=score;
  if(level>rec.bestLevel)rec.bestLevel=level;
  if(kills>rec.bestKills)rec.bestKills=kills;
  if(time>rec.bestTime)rec.bestTime=time;
  rec.runs++;
  sj(REC_KEY,rec);
}

function fmtTime(t){
  var m=Math.floor(t/60),s=Math.floor(t%60);
  return m+"分"+(s<10?"0":"")+s+"秒";
}

var UP_KEYS=[];
function nextXp(){xpNext=xpFor(level);}
nextXp();

function maxByType(t){var n=0;for(var i=0;i<enemies.length;i++)if(enemies[i].type===t)n++;return n;}

function spawnEnemy(){
  var t="square";
  var p=RND();
  if(time>25&&p<0.28)t="runner";
  if(time>50&&p>=0.28&&p<0.3)t="tank";
  if(time>60&&p>=0.3&&p<0.32)t="splitter";
  var cap=MOBILE?Math.min(80,34+Math.floor(time/6)):Math.min(140,45+Math.floor(time/5));
  if(enemies.length>=cap)return;
  if(t==="tank"&&maxByType("tank")>=4)return;
  var cfg=TYPES[t];
  var ang=RND()*Math.PI*2, dist=Math.max(W,H)*0.62+RND()*140;
  var x=P.x+Math.cos(ang)*dist, y=P.y+Math.sin(ang)*dist;
  x=Math.min(Math.max(x,40),WORLD-40); y=Math.min(Math.max(y,40),WORLD-40);
  enemies.push({x:x,y:y,r:cfg.r,hps:cfg.hps*(1+time/95),hp:cfg.hps*(1+time/95),
    sp:cfg.sp*(1+time/260),dmg:cfg.dmg,col:cfg.col,xp:cfg.xp,shape:cfg.shape,spin:cfg.spin||0,
    type:t,hit:0,val:0,split:0});
}

var TYPES={
  square:  {r:19,hps:18,sp:72, dmg:9,  col:"#ff5d6c", xp:1, shape:"p4", spin:0.45},
  runner:  {r:16,hps:10,sp:140,dmg:5,  col:"#ffb84d", xp:1, shape:"tri",spin:0.9},
  tank:    {r:35,hps:82,sp:42, dmg:19, col:"#a78bfa", xp:6, shape:"p6", spin:0.2},
  splitter:{r:18,hps:14,sp:84, dmg:7,  col:"#4dd0a4", xp:2, shape:"dia",spin:0.6}
};

function spark(x,y,col,n){
  if(MOBILE) n=Math.max(1,Math.round(n*0.6));
  for(var i=0;i<n;i++){
    var a=RND()*Math.PI*2, s=20+RND()*140;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.35+RND()*0.3,age:0,col:col,
      size:2+RND()*3});
  }
}

function fire(){
  if(fireCd>0)return;
  fireCd=intervalNow();
  var n=shotCount(), base=P.aim;
  for(var i=0;i<n;i++){
    var off=(n===1)?0:(i-(n-1)/2)*0.13;
    spawnBullet(base+off);
  }
  for(var j=0;j<Lv("split");j++){
    spawnBullet(base+0.34+j*0.11,1.05);
    spawnBullet(base-0.34-j*0.11,1.05);
  }
  P.recoil=0.55;
  P.aimWobble=1;
}

function spawnBullet(a,weak){
  var sp=bulletSpeedNow();
  bullets.push({x:P.x+Math.cos(a)*26,y:P.y+Math.sin(a)*26,
    vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
    dmg:10*dmgMult()*(weak?0.7:1),pierce:pierceNow(),hit:[],
    life:1.3,trail:[]});
}

function nearest(){
  var best=null,bd=1e9;
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i], d=(e.x-P.x)*(e.x-P.x)+(e.y-P.y)*(e.y-P.y);
    if(d<bd){bd=d;best=e;}
  }
  return best;
}

function angDiff(a,b){
  var d=a-b;
  while(d>Math.PI)d-=Math.PI*2;
  while(d<-Math.PI)d+=Math.PI*2;
  return d;
}

function updateTurret(dt){
  var t=nearest();
  if(t){
    var want=Math.atan2(t.y-P.y,t.x-P.x);
    P.aim+=angDiff(want,P.aim)*Math.min(1,turnRate()*dt);
  }
  fire();
}

var keys={};
window.addEventListener("keydown",function(e){
  var k=e.key.toLowerCase();
  keys[k]=true;
  if(k==="p"||k==="escape"){ if(state==="play"||state==="pause") togglePause(); }
  if([" ","arrowup","arrowdown","arrowleft","arrowright"].indexOf(k)>=0) e.preventDefault();
},{passive:false});
window.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});

var stick={on:false,ox:0,oy:0,dx:0,dy:0,id:-1};
cv.addEventListener("pointerdown",function(e){
  if(e.pointerType!=="touch"&&e.pointerType!=="pen") return;
  if(stick.on) return;
  {
    stick.on=true;stick.ox=e.clientX;stick.oy=e.clientY;stick.dx=0;stick.dy=0;stick.id=e.pointerId;
    try{cv.setPointerCapture(e.pointerId);}catch(_e){}
    var el=document.getElementById("stick");
    el.style.display="block";el.style.left=stick.ox+"px";el.style.top=stick.oy+"px";
    el.querySelector(".dot").style.left="0px";el.querySelector(".dot").style.top="0px";
  }
});
cv.addEventListener("pointermove",function(e){
  if(!stick.on||e.pointerId!==stick.id) return;
  var dx=e.clientX-stick.ox,dy=e.clientY-stick.oy,d=Math.hypot(dx,dy),m=(MOBILE?62:45);
  if(d>m){dx=dx/d*m;dy=dy/d*m;}
  stick.dx=dx/m;stick.dy=dy/m;
  var el=document.getElementById("stick");
  el.querySelector(".dot").style.left=dx+"px";el.querySelector(".dot").style.top=dy+"px";
});
function endStick(e){ if(e&&e.pointerId!==stick.id)return; stick.on=false;stick.dx=0;stick.dy=0;
  document.getElementById("stick").style.display="none"; }
cv.addEventListener("pointerup",endStick);
cv.addEventListener("pointercancel",endStick);
</script>
</body>
