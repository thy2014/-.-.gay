<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>割草肉鸽</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%233ddc84'/%3E%3Crect x='10.5' y='1.5' width='3' height='9' fill='%23070b0a'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#05080a; --ink:#e2fff2; --dim:#7d9a8d;
    --gr:#3ddc84; --cy:#2bd4c0; --mg:#ff5d6c; --am:#ffc75f; --vi:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
  #cv{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}

  .hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
  .hud.on{display:block}
  .hp{position:absolute;top:14px;left:14px;width:min(240px,42vw)}
  .hp .track{height:12px;border-radius:6px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);overflow:hidden}
  .hp .fill{height:100%;width:100%;background:linear-gradient(90deg,#ff5d6c,#ff8a5c);transition:width .12s}
  .hp .txt{font-size:11px;color:var(--dim);margin-top:4px;letter-spacing:.5px}
  .mid{position:absolute;top:12px;left:50%;transform:translateX(-50%);text-align:center;font-size:12px;color:var(--dim);line-height:1.75}
  .mid b{color:var(--gr);font-weight:700;font-size:14px}
  .xp{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;width:min(430px,74vw)}
  .xp .track{height:10px;border-radius:6px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);overflow:hidden}
  .xp .fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gr),#8ef7c4);transition:width .1s}
  .xp .txt{font-size:11px;color:var(--dim);text-align:center;margin-top:5px;letter-spacing:.5px}
  .pause{position:absolute;top:14px;right:14px;pointer-events:auto;width:38px;height:38px;border-radius:9px;
    background:rgba(8,16,12,.72);border:1px solid rgba(255,255,255,.16);color:var(--ink);font-size:15px;cursor:pointer;display:none}
  .tips{position:absolute;left:14px;bottom:52px;font-size:10px;color:rgba(125,154,141,.55);line-height:1.6}

  .stick{position:fixed;pointer-events:none;z-index:6;display:none}
  .stick .ring{position:absolute;width:96px;height:96px;border-radius:50%;border:2px solid rgba(61,220,132,.35);background:radial-gradient(circle,rgba(61,220,132,.10),transparent 70%);transform:translate(-50%,-50%)}
  .stick .dot{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(61,220,132,.5);box-shadow:0 0 18px rgba(61,220,132,.6);transform:translate(-50%,-50%)}

  .ov{position:fixed;inset:0;z-index:20;background:rgba(3,6,8,.93);display:none;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
  .ov.show{display:flex}
  .panel{width:100%;max-width:540px;background:linear-gradient(180deg,#070d0c,#050a09);border:1px solid rgba(61,220,132,.22);border-radius:16px;padding:26px 22px}
  .panel h1{font-size:26px;letter-spacing:2px;text-align:center;font-weight:800}
  .panel h1 span{color:var(--gr)}
  .sub{text-align:center;color:var(--dim);font-size:12px;line-height:1.75;margin:8px 0 18px}
  .btn{display:block;width:100%;height:50px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;border:none}
  .btn.main{background:linear-gradient(90deg,#3ddc84,#7ef0b8);color:#04140c}
  .btn.g2{background:transparent;border:1px solid #1a2a23;color:var(--dim)}
  .btn.g2:hover{border-color:var(--gr);color:var(--gr)}
  .rec{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
  .rec div{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:9px 4px;text-align:center}
  .rec .k{font-size:10px;color:var(--dim)}
  .rec .v{font-size:16px;font-weight:700;color:var(--gr);margin-top:2px}
  .who{text-align:center;font-size:11px;color:#3d554b;margin-top:14px}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  @media(max-width:620px){.cards{grid-template-columns:1fr;max-width:330px;margin:0 auto}}
  .card{position:relative;background:linear-gradient(180deg,#0b1411,#070f0c);border:1px solid #17261f;border-radius:13px;
    padding:15px 13px;cursor:pointer;text-align:left;transition:transform .15s,border-color .15s}
  .card::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;border-radius:13px 13px 0 0}
  .card.a::after{background:var(--gr)} .card.b::after{background:var(--am)} .card.c::after{background:var(--vi)}
  .card:hover{transform:translateY(-3px);border-color:var(--gr)}
  .card .n{font-size:14px;font-weight:700;margin-bottom:5px}
  .card .d{font-size:11px;color:var(--dim);line-height:1.6;min-height:50px}
  .card .l{font-size:11px;margin-top:7px;color:var(--am)}
  .card .l.nw{color:var(--gr)}
  .lvh{text-align:center;font-size:16px;font-weight:800;color:var(--gr);letter-spacing:1px;margin-bottom:3px}
  .lvh2{text-align:center;font-size:11px;color:var(--dim);margin-bottom:14px}

  .go .row{display:flex;justify-content:space-between;font-size:13px;padding:9px 3px;border-bottom:1px dashed rgba(255,255,255,.07)}
  .go .row i{color:var(--dim);font-style:normal}
  .go .row b{color:var(--ink)}
  .go .best{text-align:center;color:var(--am);font-size:12px;margin-top:13px}

  .intro{margin:0 0 12px;text-align:left;border:1px solid rgba(61,220,132,.14);border-radius:10px;
    padding:10px 12px;background:rgba(255,255,255,.02)}
  .intro .li{font-size:11.5px;color:var(--dim);line-height:1.75}
  .intro .li i{color:var(--gr);font-style:normal;margin-right:9px;font-weight:600}
  .aimbox{margin:14px 0 2px;text-align:left}
  .aimq{font-size:11px;color:var(--dim);margin-bottom:6px;letter-spacing:.5px}
  .aimbtns{display:flex;gap:6px}
  .aimbtn{flex:1;padding:10px 4px;border-radius:9px;border:1px solid #1a2a23;background:rgba(255,255,255,.02);
    color:var(--dim);font-size:11.5px;line-height:1.4;cursor:pointer;font-weight:600}
  .aimbtn.on{border-color:var(--gr);color:var(--gr);background:rgba(61,220,132,.09)}
  .aimhint{font-size:10.5px;color:#4a6a5c;margin-top:7px;line-height:1.55;min-height:16px}
  .stick .ring.am{border-color:rgba(255,199,95,.42);background:radial-gradient(circle,rgba(255,199,95,.10),transparent 70%)}
  .stick .dot.am{background:rgba(255,199,95,.5);box-shadow:0 0 18px rgba(255,199,95,.6)}
  /* ===== 移动端适配 ===== */
  @media (max-width:820px), (pointer:coarse){
    .hp{top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));width:40vw}
    .hp .track{height:10px}
    .hp .txt{font-size:10.5px}
    .mid{top:calc(44px + env(safe-area-inset-top));font-size:10.5px;line-height:1.6}
    .mid b{font-size:13px}
    .pause{width:44px;height:44px;font-size:14px;
      top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right))}
    .xp{bottom:calc(12px + env(safe-area-inset-bottom));width:min(430px,88vw)}
    .xp .txt{font-size:10.5px}
    .tips{display:none}
    .stick .ring{width:118px;height:118px}
    .stick .dot{width:52px;height:52px}
    .ov{padding:12px}
    .panel{padding:20px 16px;border-radius:14px}
    .btn{height:52px;font-size:16px}
    .cards{gap:9px}
    .card{padding:13px 12px}
    .card .n{font-size:13.5px}
    .card .d{font-size:11.5px;min-height:auto}
    .rec{grid-template-columns:repeat(2,1fr)}
    .rec .v{font-size:15px}
  }
  @media (max-height:560px) and (pointer:coarse){
    .panel{padding:12px 16px;border-radius:12px}
    .panel h1{font-size:17px;letter-spacing:1px}
    .sub{display:none}
    .intro{margin:4px 0 8px;padding:7px 9px}
    .intro .li{font-size:10px;line-height:1.55}
    .intro .li i{margin-right:6px}
    .btn{height:42px;margin-top:7px;font-size:14px}
    .rec{margin-top:8px;grid-template-columns:repeat(4,1fr);gap:6px}
    .rec div{padding:6px 3px;border-radius:7px}
    .rec .k{font-size:9px}
    .rec .v{font-size:13px}
    .who{display:none}
    .cards{gap:8px}
    .card{padding:10px 11px}
    .card .d{display:none}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud" id="hud">
  <div class="hp">
    <div class="track"><div class="fill" id="hpFill"></div></div>
    <div class="txt" id="hpText"></div>
  </div>
  <div class="mid" id="stat"></div>
  <button class="pause" id="pauseBtn">II</button>
  <div class="xp">
    <div class="track"><div class="fill" id="xpFill"></div></div>
    <div class="txt" id="xpText"></div>
  </div>
  <div class="tips">WASD / 方向键 移动 · 自动瞄准开火 · P 暂停 · 触屏任意位置拖动移动</div>
</div>

<div class="stick" id="stick"><div class="ring"></div><div class="dot"></div></div>
<div class="stick" id="stick2"><div class="ring am"></div><div class="dot am"></div></div>

<div class="ov show" id="menu">
  <div class="panel">
    <h1>割草<span>肉鸽</span></h1>
    <div class="sub">无限大地图 · 镜头跟随 · 自动开火<br>吃经验升级，三选一卡牌强化，进度自动存档</div>
    <div class="intro">
      <div class="li"><i>移动</i>电脑 WASD／方向键，手机左半屏拖动</div>
      <div class="li"><i>瞄准</i>暂停里可切：全自动／自己瞄／远距自动</div>
      <div class="li"><i>武器</i>主炮 + 回旋镖、追踪飞弹、冲击波、环绕、激光、闪电链、陨石、地雷</div>
      <div class="li"><i>领域</i>冰霜减速、毒雾腐蚀、灼烧灼伤，贴着身周的持续伤害圈</div>
      <div class="li"><i>卡牌</i>27 张强化池，含火力、穿透、暴击、护甲、吸血</div>
    </div>
    <div id="saveInfo" style="text-align:center;color:var(--am);font-size:12px;margin-bottom:6px"></div>
    <button class="btn main" id="newBtn">新游戏</button>
    <button class="btn g2" id="contBtn" style="display:none">继续上次存档</button>
    <div class="rec" id="recBox"></div>
    <button class="btn g2" id="backBtn" style="margin-top:16px">返回游戏站</button>
    <div class="who">进度自动存档 · 账号 <b id="whoLabel"></b></div>
  </div>
</div>

<div class="ov" id="levelup">
  <div class="panel" style="max-width:700px">
    <div class="lvh">升级 · 选择一个强化</div>
    <div class="lvh2">等级 <span id="lvCur">2</span></div>
    <div class="cards" id="cards"></div>
  </div>
</div>

<div class="ov" id="pause">
  <div class="panel" style="max-width:330px;text-align:center">
    <h1 style="font-size:20px">已暂停</h1>
    <div class="aimbox">
      <div class="aimq">瞄准方式</div>
      <div class="aimbtns" id="aimBtns"></div>
      <div class="aimhint" id="aimHint"></div>
    </div>
    <button class="btn main" id="resumeBtn">继续</button>
    <button class="btn g2" id="quitBtn">结束本局</button>
  </div>
</div>

<div class="ov" id="gameover">
  <div class="panel go" style="max-width:400px">
    <h1 style="font-size:22px;color:var(--mg)">你倒下了</h1>
    <div class="sub">坚持了 <b id="goTime" style="color:var(--ink)"></b></div>
    <div class="row"><i>等级</i><b id="goLevel"></b></div>
    <div class="row"><i>击杀</i><b id="goKills"></b></div>
    <div class="row"><i>得分</i><b id="goScore"></b></div>
    <div class="best" id="goBest"></div>
    <button class="btn main" id="againBtn">再战一局</button>
    <button class="btn g2" id="goBackBtn">返回游戏站</button>
  </div>
</div>

<script>
(function(){
"use strict";

var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var W=0,H=0,DPR=1;
var MOBILE=(window.matchMedia&&window.matchMedia("(pointer:coarse)").matches)||Math.min(window.innerWidth,window.innerHeight)<700;
function resize(){
  var vv=window.visualViewport;
  W=(vv&&vv.width)?Math.round(vv.width):window.innerWidth;
  H=(vv&&vv.height)?Math.round(vv.height):window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1, MOBILE?1.5:2);
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",function(){setTimeout(resize,180);});
if(window.visualViewport) window.visualViewport.addEventListener("resize",function(){resize();});

function qs(n){var m=location.search.match(new RegExp("[?&]"+n+"=([^&]*)"));return m?decodeURIComponent(m[1]):"";}
var user=qs("user")||localStorage.getItem("gstation_session")||"guest";
document.getElementById("whoLabel").textContent=user;
var SAVE_KEY="gr_roguelike_save_"+user, REC_KEY="gr_roguelike_rec_"+user;
function lj(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function sj(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var rec=lj(REC_KEY)||{bestScore:0,bestLevel:0,bestKills:0,bestTime:0,runs:0};

var AIM_MODES=[
  {id:"auto",  n:"全自动瞄准", d:"始终锁定最近的敌人，你只管跑位躲怪"},
  {id:"manual",n:"自己瞄准",   d:"电脑用鼠标指哪打哪；手机在右半屏拖动瞄准"},
  {id:"hybrid",n:"远距自动",   d:"近处自己瞄，超出 340 距离自动锁敌"}
];
var AIM_KEY="gr_roguelike_aim";
var aimMode=(function(){try{var v=localStorage.getItem(AIM_KEY);return v||"auto";}catch(e){return "auto";}})();
var AUTO_RANGE=340;
var aimLocked=false;
var moveDir=0,hasMove=false;
var mousePos=null;
function setAimMode(id){
  aimMode=id;
  try{localStorage.setItem(AIM_KEY,id);}catch(e){}
  renderAimUI();
}
function renderAimUI(){
  var box=document.getElementById("aimBtns"); if(!box) return;
  box.innerHTML="";
  for(var i=0;i<AIM_MODES.length;i++){
    (function(m){
      var b=document.createElement("button");
      b.className="aimbtn"+(aimMode===m.id?" on":"");
      b.textContent=m.n;
      b.onclick=function(){setAimMode(m.id);};
      box.appendChild(b);
    })(AIM_MODES[i]);
  }
  var hint=document.getElementById("aimHint");
  for(var j=0;j<AIM_MODES.length;j++) if(AIM_MODES[j].id===aimMode) hint.textContent=AIM_MODES[j].d;
}

// ================= 世界 =================
var WORLD=5200;
var TTL_FULL=26,FADE_T=2.2;   // 敌人存活时长 / 淡出时长
var aimTarget=null,bgGrad=null,bgW=0,bgH=0;
var state="menu";
var time=0,score=0,kills=0,level=1,xp=0,xpNext=0;
var UP={};
var cam={x:WORLD/2,y:WORLD/2};
var shake=0,hitFlash=0;
var RND=Math.random;

var P={x:WORLD/2,y:WORLD/2,r:18,hp:120,maxHp:120,aim:-Math.PI/2,recoil:0,invul:0};
var enemies=[],bullets=[],gems=[],parts=[],beams=[],orbsDraw=[];
var bms=[],missiles=[],novas=[],bolts=[],meteors=[],mines=[];
var fireCd=0,laserCd=0,spawnCd=1,saveT=0;
var boomCd=0,missileCd=0,novaCd=0,chainCd=0,meteorCd=0,mineCd=0;

// ================= 卡池 =================
var POOL=[
  {id:"hp",    n:"生命上限",   d:"最大生命 +25，并立即回复 25 点",       max:8},
  {id:"regen", n:"再生",       d:"每秒回复生命 +0.5",                     max:5},
  {id:"speed", n:"移速提升",   d:"移动速度 +8%",                          max:6},
  {id:"dmg",   n:"火力提升",   d:"伤害 +22%",                             max:8},
  {id:"rate",  n:"攻速提升",   d:"攻击频率 +15%",                         max:8},
  {id:"count", n:"多重弹幕",   d:"每次发射的子弹 +1",                      max:5},
  {id:"pspeed",n:"弹速提升",   d:"子弹飞行速度 +18%",                     max:5},
  {id:"pierce",n:"穿透",       d:"子弹可多穿透 1 个敌人",                  max:4},
  {id:"crit",  n:"暴击",       d:"暴击率 +6%（暴击 ×2.2 伤害）",           max:6},
  {id:"xp",    n:"经验加成",   d:"获得的经验 +15%",                        max:6},
  {id:"pickup",n:"拾取范围",   d:"经验晶石拾取范围 +25%",                  max:5},
  {id:"turn",  n:"伺服瞄准",   d:"炮管转向速度 +30%",                      max:4},
  {id:"orbit", n:"环绕·新武器",d:"环绕护盾 +1（碰触造成伤害）",            max:4},
  {id:"laser", n:"激光·新武器",d:"穿透激光束 +1（贯穿整条直线）",           max:4},
  {id:"split", n:"散射",       d:"额外 +2 发斜向子弹",                     max:4},
  {id:"boom",   n:"回旋镖",     d:"投出回旋镖，去程回程都割人",              max:5},
  {id:"missile",n:"追踪飞弹",   d:"定期发射自动追踪敌人的飞弹",              max:5},
  {id:"nova",   n:"震荡冲击波", d:"周期性扩散冲击环，清掉贴身怪",            max:5},
  {id:"armor",  n:"护甲",       d:"受到的伤害 -4.5%",                       max:5},
  {id:"leech",  n:"吸血",       d:"每次击杀回复生命 +1.2",                   max:4},
  {id:"chain",  n:"闪电链",     d:"击中后跳向附近敌人，连锁击中更多目标",       max:5},
  {id:"frost",  n:"冰霜领域",   d:"身周冰域，减速并持续冻伤敌人",               max:4},
  {id:"poison", n:"毒雾领域",   d:"身周毒雾持续腐蚀敌人",                      max:4},
  {id:"flame",  n:"灼烧领域",   d:"身周火焰持续灼烧敌人，伤害最高",            max:4},
  {id:"meteor", n:"陨石",       d:"陨石砸向敌群，落点范围爆炸",                max:4},
  {id:"mine",   n:"地雷",       d:"沿路布雷，敌人踩到就炸",                    max:4}
];
function Lv(id){return UP[id]||0;}

function maxHpNow(){return 120+25*Lv("hp");}
function dmgMult(){return 1+0.22*Lv("dmg");}
function intervalNow(){return 0.42/Math.pow(1.15,Lv("rate"));}
function bulletSpeedNow(){return 470*(1+0.18*Lv("pspeed"));}
function shotCount(){return 1+Lv("count");}
function pierceNow(){return Lv("pierce");}
function critRate(){return 0.06*Lv("crit");}
function moveSpeed(){return 208*(1+0.08*Lv("speed"));}
function regenNow(){return 0.5*Lv("regen");}
function turnRate(){return 6.0*(1+0.30*Lv("turn"));}
function pickRange(){return 90*(1+0.25*Lv("pickup"));}
function xpMult(){return 1+0.15*Lv("xp");}
function xpFor(l){return Math.floor(6*Math.pow(l,1.2))+4;}
function armorMult(){return Math.max(0.55,1-0.045*Lv("armor"));}

// ================= 存档 =================
function saveNow(){
  if(state!=="play"&&state!=="levelup"&&state!=="pause") return;
  sj(SAVE_KEY,{level:level,xp:xp,xpNext:xpNext,hp:P.hp,maxHp:P.maxHp,up:UP,

function angDiff(a,b){var d=a-b;while(d>Math.PI)d-=6.28318;while(d<-Math.PI)d+=6.28318;return d;}
function manualAim(){
  if(aimStick.on) return aimStick.ang;

function pickTarget(){

function updateTurret(dt){

  } else {

  }
  P.aim += angDiff(want,P.aim)*Math.min(1,turnRate()*dt);
  if(P.recoil>0) P.recoil=Math.max(0,P.recoil-dt*3.4);

        }
        spark(mi.x,mi.y,"#ffd166",14); shake=Math.max(shake,0.14);
        mines.splice(i,1); hitM=true;
      }
    }
  }
}
function segDist(pxx,pyy,x1,y1,x2,y2){
  var dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
  if(l2===0) return Math.hypot(pxx-x1,pyy-y1);
  var t=clamp(((pxx-x1)*dx+(pyy-y1)*dy)/l2,0,1);
  return Math.hypot(pxx-(x1+t*dx),pyy-(y1+t*dy));
}

// ================= 粒子 =================
function spark(x,y,col,n){
  if(MOBILE) n=Math.max(1,Math.round(n*0.6));
  for(var i=0;i<n;i++){
    var a=RND()*6.283,s=45+RND()*130;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:0.35+RND()*0.35,max:0.7,col:col,
      rot:RND()*6.283,vr:(RND()-.5)*8});
  }
  while(parts.length>240) parts.shift();
}

// ================= 升级 =================
function gainXp(v){ xp+=v*xpMult(); checkLevel(); }
function checkLevel(){
  if(state!=="play") return;
  if(xp>=xpNext){
    xp-=xpNext; level++; score+=100; xpNext=xpFor(level);
    showCards();
  }
}
function showCards(){
  state="levelup"; saveNow();
  if(MOBILE&&navigator.vibrate){try{navigator.vibrate([18,50,18]);}catch(_e){}}
  var avail=[];
  POOL.forEach(function(p){ if(Lv(p.id)<p.max) avail.push(p); });
  for(var i=avail.length-1;i>0;i--){var j=Math.floor(RND()*(i+1));var t=avail[i];avail[i]=avail[j];avail[j]=t;}
  var picks=avail.slice(0,Math.min(3,avail.length));
  document.getElementById("lvCur").textContent=level;
  var box=document.getElementById("cards"); box.innerHTML="";
  picks.forEach(function(p,i){
    var cur=Lv(p.id),nxt=cur+1;
    var d=document.createElement("div");
    d.className="card "+["a","b","c"][i];
    d.innerHTML='<div class="n">'+p.n+'</div><div class="d">'+p.d+'</div>'+
      (cur===0?'<div class="l nw">新解锁</div>':'<div class="l">等级 '+cur+' → '+nxt+'</div>');
    d.addEventListener("click",function(){
      UP[p.id]=nxt;
      if(p.id==="hp"){ P.maxHp=maxHpNow(); P.hp=Math.min(P.maxHp,P.hp+25); }
      if(xp>=xpNext){ showCards(); } else { hideAll(); state="play"; }
    });
    box.appendChild(d);
  });
  showOverlay("levelup");
}

// ================= 主循环 =================
var last=performance.now();
function loop(now){
  var dt=Math.min(0.033,(now-last)/1000); last=now;
  if(state==="play") update(dt);
  render();
  requestAnimationFrame(loop);
}

function update(dt){
  time+=dt;

  var mx=0,my=0;
  if(keys["w"]||keys["arrowup"])my-=1;
  if(keys["s"]||keys["arrowdown"])my+=1;
  if(keys["a"]||keys["arrowleft"])mx-=1;
  if(keys["d"]||keys["arrowright"])mx+=1;
  if(stick.on){mx+=stick.dx;my+=stick.dy;}
  if(mx||my){
    var ml=Math.hypot(mx,my);mx/=ml;my/=ml;
    moveDir=Math.atan2(my,mx);hasMove=true;
    var sp=moveSpeed();
    P.x+=mx*sp*dt;P.y+=my*sp*dt;
    P.x=clamp(P.x,P.r,WORLD-P.r);P.y=clamp(P.y,P.r,WORLD-P.r);
  } else { hasMove=false; }

  if(regenNow()>0&&P.hp<P.maxHp) P.hp=Math.min(P.maxHp,P.hp+regenNow()*dt);
  if(P.invul>0)P.invul-=dt;
  if(shake>0)shake-=dt;
  if(hitFlash>0)hitFlash-=dt;

  camFollow(dt);

  orbsDraw.length=0;
  updateTurret(dt);
  updateOrbit(dt);
  updateLaser(dt);
  updateBoom(dt);
  updateMissile(dt);
  updateNova(dt);
  updateDomains(dt);
  updateChain(dt);
  updateMeteor(dt);
  updateMine(dt);

  spawnCd-=dt;
  if(spawnCd<=0){ spawnWave(); spawnCd=Math.max(0.15,0.95-time*0.0045); }
  var cap=MOBILE?Math.min(80,34+Math.floor(time/6)):Math.min(140,45+Math.floor(time/5));
  if(enemies.length>cap) enemies.length=cap;

  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    if(e.flash>0)e.flash-=dt;
    if(e.orbCd>0)e.orbCd-=dt;
    if(e.weCd>0)e.weCd-=dt;
    if(e.fade>0){
      e.fade-=dt;
      if(e.fade<=0){ enemies.splice(i,1); continue; }
      e.rot+=e.spin*dt*0.35;
      continue;
    }
    if(e.ttl>0){ e.ttl-=dt; if(e.ttl<=0) e.fade=FADE_T; }
    if(e.slowT>0)e.slowT-=dt;
    if(e.domCd>0)e.domCd-=dt;
    e.rot+=e.spin*dt; e.pulse+=dt*4;
    var dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
    var spd=e.sp*(e.slowT>0?0.42:1);
    e.x+=dx/d*spd*dt;e.y+=dy/d*spd*dt;
    if(d<e.r+P.r&&P.invul<=0){
      P.hp-=e.dmg*armorMult();P.invul=0.55;shake=0.3;hitFlash=0.35;
      if(MOBILE&&navigator.vibrate){try{navigator.vibrate(35);}catch(_e){}}
      spark(P.x,P.y,"#ff5d6c",8);
      if(P.hp<=0){P.hp=0;gameOver();return;}
    }
  }

  var homeTg=nearestEnemy();
  for(var b=bullets.length-1;b>=0;b--){
    var bl=bullets[b];
    bl.life-=dt; bl.px=bl.x; bl.py=bl.y;
    if(homeTg){
      var ca=Math.atan2(bl.vy,bl.vx);
      ca+=Math.max(-1.8*dt,Math.min(1.8*dt,angDiff(Math.atan2(homeTg.y-bl.y,homeTg.x-bl.x),ca)));
      var s2=Math.hypot(bl.vx,bl.vy);
      bl.vx=Math.cos(ca)*s2;bl.vy=Math.sin(ca)*s2;
    }
    bl.x+=bl.vx*dt;bl.y+=bl.vy*dt;
    if(bl.life<=0||bl.x<-40||bl.x>WORLD+40||bl.y<-40||bl.y>WORLD+40){bullets.splice(b,1);continue;}
    for(var q=enemies.length-1;q>=0;q--){
      var en=enemies[q];
      if(Math.hypot(en.x-bl.x,en.y-bl.y)<en.r+bl.r){
        hurtEnemy(en,bl.dmg);
        if(bl.pierce>0){bl.pierce--;} else {bullets.splice(b,1);}
        break;
      }
    }
  }

  var pr=pickRange();
  for(var g=gems.length-1;g>=0;g--){
    var gm=gems[g];
    var gd=Math.hypot(gm.x-P.x,gm.y-P.y);
    if(gd<pr){
      gm.x+=(P.x-gm.x)/gd*340*dt;
      gm.y+=(P.y-gm.y)/gd*340*dt;
      if(Math.hypot(gm.x-P.x,gm.y-P.y)<P.r+gm.r){gainXp(gm.v);gems.splice(g,1);}
    } else if(gm.vx||gm.vy){
      gm.x+=gm.vx*dt;gm.y+=gm.vy*dt;gm.vx*=0.92;gm.vy*=0.92;
    }
  }

  for(var bm=beams.length-1;bm>=0;bm--){beams[bm].life-=dt;if(beams[bm].life<=0)beams.splice(bm,1);}
  for(var p=parts.length-1;p>=0;p--){
    var pt=parts[p];
    pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vx*=0.94;pt.vy*=0.94;pt.rot+=pt.vr*dt;pt.life-=dt;
    if(pt.life<=0)parts.splice(p,1);
  }
  saveT-=dt;
  if(saveT<=0){saveT=5;saveNow();}
}

// ================= 渲染 =================
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);

  if(!bgGrad||bgW!==W||bgH!==H){
    bgGrad=ctx.createLinearGradient(0,0,W,H);
    bgGrad.addColorStop(0,"#040a07"); bgGrad.addColorStop(.5,"#060e0b"); bgGrad.addColorStop(1,"#04080a");
    bgW=W; bgH=H;
  }
  ctx.fillStyle=bgGrad; ctx.fillRect(0,0,W,H);

  var gs=84;
  ctx.strokeStyle="rgba(61,220,132,0.055)"; ctx.lineWidth=1;
  ctx.beginPath();
  var ox=((W/2-cam.x)%gs+gs)%gs, oy=((H/2-cam.y)%gs+gs)%gs;
  for(var x=ox;x<W;x+=gs){ctx.moveTo(x,0);ctx.lineTo(x,H);}
  for(var y=oy;y<H;y+=gs){ctx.moveTo(0,y);ctx.lineTo(W,y);}
  ctx.stroke();

  ctx.strokeStyle="rgba(255,93,108,0.18)"; ctx.lineWidth=2;
  ctx.strokeRect(sx(0),sy(0),WORLD,WORLD);

  ctx.save();
  if(shake>0) ctx.translate((RND()-.5)*7,(RND()-.5)*7);

  for(var i=0;i<gems.length;i++){
    var gm=gems[i];
    if(!onScreen(gm.x,gm.y,20)) continue;
    var gx=sx(gm.x),gy=sy(gm.y);
    ctx.save();ctx.translate(gx,gy);ctx.rotate(Math.PI/4+time*0.5);
    ctx.shadowColor="#3ddc84";ctx.shadowBlur=12;
    ctx.fillStyle="#8ef7c4";ctx.fillRect(-gm.r,-gm.r,gm.r*2,gm.r*2);
    ctx.restore();
  }

  for(var dd=0;dd<DOMAINS.length;dd++){
    var dc=DOMAINS[dd], dn=Lv(dc.id);
    if(dn===0) continue;
    var dr=dc.rad(dn), dx0=sx(P.x), dy0=sy(P.y);
    ctx.beginPath();
    ctx.strokeStyle=dc.col;ctx.globalAlpha=0.45+0.22*Math.sin(time*3+dd);
    ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(dx0,dy0,dr,0,6.283);ctx.stroke();
    ctx.globalAlpha=0.25;ctx.lineWidth=1;ctx.setLineDash([10,14]);
    ctx.beginPath();ctx.arc(dx0,dy0,dr-12,time*1.2+dd,time*1.2+dd+6.283);ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;
  }

  for(var e=0;e<enemies.length;e++){
    if(!onScreen(enemies[e].x,enemies[e].y,60)) continue;
    drawEnemy(enemies[e],sx(enemies[e].x),sy(enemies[e].y));
  }

  for(var b=0;b<beams.length;b++){
    var B=beams[b],al=Math.max(0,B.life/0.16);
    ctx.strokeStyle="rgba(43,212,192,"+(al*0.9).toFixed(2)+")";ctx.lineWidth=7;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(sx(B.x1),sy(B.y1));ctx.lineTo(sx(B.x2),sy(B.y2));ctx.stroke();
    ctx.strokeStyle="rgba(255,255,255,"+(al*0.8).toFixed(2)+")";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(sx(B.x1),sy(B.y1));ctx.lineTo(sx(B.x2),sy(B.y2));ctx.stroke();
  }

  for(var o=0;o<orbsDraw.length;o++){
    var od=orbsDraw[o],odx=sx(od.x),ody=sy(od.y);
    ctx.shadowColor="#2bd4c0";ctx.shadowBlur=14;
    ctx.fillStyle="#7ef0e0";ctx.beginPath();ctx.arc(odx,ody,7,0,6.283);ctx.fill();
    ctx.shadowBlur=0;
  }
  if(Lv("orbit")>0){
    ctx.strokeStyle="rgba(126,240,224,0.10)";ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(sx(P.x),sy(P.y),54+Lv("orbit")*6,0,6.283);ctx.stroke();
  }

  for(var p=0;p<parts.length;p++){
    var pt=parts[p];
    if(!onScreen(pt.x,pt.y,30)) continue;
    var pa=Math.max(0,pt.life/pt.max);
    ctx.globalAlpha=pa;
    ctx.save();ctx.translate(sx(pt.x),sy(pt.y));ctx.rotate(pt.rot);
    ctx.fillStyle=pt.col;ctx.beginPath();
    ctx.moveTo(0,-pt.r*1.6);ctx.lineTo(pt.r,pt.r);ctx.lineTo(-pt.r,pt.r);ctx.closePath();ctx.fill();
    ctx.restore();
    ctx.globalAlpha=1;
  }

  for(var q=0;q<bullets.length;q++){
    var bl2=bullets[q];
    if(!onScreen(bl2.x,bl2.y,40)) continue;
    ctx.strokeStyle=bl2.crit?"rgba(255,199,95,0.55)":"rgba(142,247,196,0.45)";
    ctx.lineWidth=bl2.crit?4:3;
    ctx.beginPath();ctx.moveTo(sx(bl2.px),sy(bl2.py));ctx.lineTo(sx(bl2.x),sy(bl2.y));ctx.stroke();
    ctx.shadowColor=bl2.crit?"#ffc75f":"#8ef7c4";ctx.shadowBlur=10;
    ctx.fillStyle=bl2.crit?"#ffc75f":"#e6fff5";
    ctx.beginPath();ctx.arc(sx(bl2.x),sy(bl2.y),bl2.r,0,6.283);ctx.fill();
    ctx.shadowBlur=0;
  }

  for(var mb=0;mb<bms.length;mb++){
    var bb=bms[mb];
    ctx.save();ctx.translate(sx(bb.x),sy(bb.y));ctx.rotate(bb.spin);
    ctx.strokeStyle="#7ef0e0";ctx.shadowColor="#2bd4c0";ctx.shadowBlur=16;ctx.lineWidth=3.5;
    ctx.beginPath();ctx.moveTo(14,-9);ctx.lineTo(3.5,-2.5);ctx.lineTo(8,10);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-14,9);ctx.lineTo(-3.5,2.5);ctx.lineTo(-8,-10);ctx.stroke();
    ctx.shadowBlur=0;ctx.fillStyle="rgba(126,240,224,.85)";
    ctx.beginPath();ctx.arc(0,0,2.6,0,6.283);ctx.fill();
    ctx.restore();
  }
  for(var mi2=0;mi2<missiles.length;mi2++){
    var ms=missiles[mi2],mAng=Math.atan2(ms.vy,ms.vx);
    ctx.save();ctx.translate(sx(ms.x),sy(ms.y));ctx.rotate(mAng);
    ctx.fillStyle="#ffc75f";ctx.shadowColor="#ffc75f";ctx.shadowBlur=12;
    ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-7,-5);ctx.lineTo(-7,5);ctx.closePath();ctx.fill();
    ctx.restore();ctx.shadowBlur=0;
  }
  for(var bt=0;bt<bolts.length;bt++){
    var bolt=bolts[bt],bal=Math.max(0,bolt.life/0.22);
    ctx.strokeStyle="rgba(180,214,255,"+(bal*0.95).toFixed(2)+")";
    ctx.lineWidth=3;ctx.lineCap="round";
    for(var si=1;si<bolt.pts.length;si++){
      var p0=bolt.pts[si-1],p1=bolt.pts[si];
      ctx.beginPath();
      ctx.moveTo(sx(p0.x),sy(p0.y));
      var seg=4;
      for(var ss=1;ss<seg;ss++){
        var tt=ss/seg;
        var jx=(RND()-.5)*16, jy=(RND()-.5)*16;
        ctx.lineTo(sx(p0.x+(p1.x-p0.x)*tt)+jx,sy(p0.y+(p1.y-p0.y)*tt)+jy);
      }
      ctx.lineTo(sx(p1.x),sy(p1.y));
      ctx.strokeStyle="rgba(180,214,255,"+(bal*0.9).toFixed(2)+")";ctx.lineWidth=3.5;ctx.stroke();
      ctx.strokeStyle="rgba(255,255,255,"+bal.toFixed(2)+")";ctx.lineWidth=1.4;ctx.stroke();
    }
  }
  for(var mt=0;mt<meteors.length;mt++){
    var me2=meteors[mt],prog=Math.min(1,me2.t/me2.dur);
    var mx0=sx(me2.x),my0=sy(me2.y);
    ctx.strokeStyle="rgba(255,176,102,0.55)";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(mx0,my0,me2.r,0,6.283);ctx.stroke();
    ctx.fillStyle="rgba(255,176,102,"+(0.25*prog).toFixed(2)+")";
    ctx.beginPath();ctx.arc(mx0,my0,me2.r*prog,0,6.283);ctx.fill();
    ctx.fillStyle="#ffd7a0";ctx.shadowColor="#ff9a5f";ctx.shadowBlur=14;
    ctx.beginPath();ctx.arc(mx0-prog*40,my0-prog*150,9+6*prog,0,6.283);ctx.fill();
    ctx.shadowBlur=0;
  }
  for(var mn=0;mn<mines.length;mn++){
    var mi2=mines[mn],mxp=sx(mi2.x),myp=sy(mi2.y);
    ctx.fillStyle=mi2.arm>0?"rgba(255,209,102,0.45)":"#ffd166";
    ctx.beginPath();ctx.arc(mxp,myp,6,0,6.283);ctx.fill();
    ctx.strokeStyle="rgba(255,209,102,0.6)";ctx.lineWidth=1.6;
    ctx.beginPath();ctx.arc(mxp,myp,10+2*Math.sin(time*4),0,6.283);ctx.stroke();
  }
  for(var nv2=0;nv2<novas.length;nv2++){
    var nvr=novas[nv2],nva=Math.max(0,nvr.life/0.42);
    ctx.strokeStyle="rgba(126,240,224,"+(nva*0.75).toFixed(2)+")";ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(sx(P.x),sy(P.y),nvr.r,0,6.283);ctx.stroke();
  }

  if(state==="play" && aimMode!=="auto" && !aimLocked){
    var aA=P.aim, aPx=sx(P.x), aPy=sy(P.y);
    ctx.strokeStyle="rgba(61,220,132,0.26)";ctx.lineWidth=1.5;ctx.setLineDash([6,7]);
    ctx.beginPath();
    ctx.moveTo(aPx+Math.cos(aA)*26,aPy+Math.sin(aA)*26);
    ctx.lineTo(aPx+Math.cos(aA)*150,aPy+Math.sin(aA)*150);
    ctx.stroke();ctx.setLineDash([]);
  }
  drawPlayer();
  ctx.restore();

  if(hitFlash>0){ctx.fillStyle="rgba(255,93,108,"+(hitFlash*0.20).toFixed(3)+")";ctx.fillRect(0,0,W,H);}

  drawMinimap();
  syncHud();
}

function poly(ctx,n,r,phase){
  ctx.beginPath();
  for(var i=0;i<n;i++){
    var a=phase+i*Math.PI*2/n;
    var x=Math.cos(a)*r,y=Math.sin(a)*r;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();
}
function drawEnemy(en,gx,gy){
  var r=en.r,col=en.col,flash=en.flash>0;
  var fa=en.fade>0?Math.max(0.12,Math.min(1,en.fade/FADE_T)):1;
  ctx.save();
  ctx.globalAlpha=fa;
  ctx.translate(gx,gy);ctx.rotate(en.rot);
  ctx.lineWidth=2.4;
  ctx.strokeStyle=flash?"#ffffff":col;
  ctx.fillStyle="rgba(2,8,6,0.62)";
  if(en.shape==="p4")poly(ctx,4,r,Math.PI/4);
  else if(en.shape==="p6")poly(ctx,6,r,0);
  else if(en.shape==="tri")poly(ctx,3,r,-Math.PI/2);
  else if(en.shape==="dia")poly(ctx,4,r*0.92,0);
  else {ctx.beginPath();ctx.arc(0,0,r,0,6.283);}
  ctx.fill();ctx.stroke();

  var pulse=1+Math.sin(en.pulse)*0.12;
  ctx.globalAlpha=fa*0.32;
  ctx.fillStyle=flash?"#ffffff":col;
  ctx.beginPath();ctx.arc(0,0,r*0.60*pulse,0,6.283);ctx.fill();
  ctx.globalAlpha=fa*0.95;
  ctx.beginPath();ctx.arc(0,0,r*0.24*pulse,0,6.283);ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();

  if(en.hp<en.maxHp&&en.fade<=0){
    var w=r*2.1,ratio=Math.max(0,en.hp/en.maxHp);
    ctx.fillStyle="rgba(255,255,255,0.10)";ctx.fillRect(gx-w/2,gy-r-11,w,3.5);
    ctx.fillStyle=col;ctx.fillRect(gx-w/2,gy-r-11,w*ratio,3.5);
  }
}

function drawPlayer(){
  var gx=sx(P.x),gy=sy(P.y),r=P.r;
  var invul=P.invul>0&&Math.floor(time*20)%2===0;
  ctx.save();ctx.translate(gx,gy);

  ctx.save();ctx.rotate(time*0.9);
  ctx.strokeStyle="rgba(61,220,132,0.5)";ctx.lineWidth=2;
  poly(ctx,3,r+9,0);ctx.stroke();
  ctx.restore();

  ctx.save();ctx.rotate(P.aim);
  var rec=6*P.recoil;
  ctx.fillStyle=invul?"rgba(61,220,132,0.45)":"#3ddc84";
  ctx.shadowColor="#3ddc84";ctx.shadowBlur=12;
  ctx.beginPath();
  ctx.moveTo(0-rec,-4.5);ctx.lineTo(30-rec,-4.5);ctx.lineTo(30-rec,4.5);ctx.lineTo(0-rec,4.5);
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#e6fff5";ctx.fillRect(30-rec,-5.5,4,11);
  ctx.restore();

  if(!invul){
    var rg=ctx.createRadialGradient(0,0,2,0,0,r);
    rg.addColorStop(0,"#e6fff5");rg.addColorStop(.55,"#3ddc84");rg.addColorStop(1,"#0a5c3b");
    ctx.shadowColor="#3ddc84";ctx.shadowBlur=20;
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle="rgba(230,255,245,0.9)";ctx.lineWidth=1.6;
    ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.stroke();
  } else {
    ctx.strokeStyle="rgba(61,220,132,0.5)";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.stroke();
  }
  ctx.restore();
}

// ================= 小地图 =================
function drawMinimap(){
  if(state!=="play"&&state!=="levelup"&&state!=="pause") return;
  var size=Math.min(96,W*0.20),pad=12;
  var mx=W-size-pad,my=pad+(MOBILE?58:50);
  ctx.save();
  ctx.fillStyle="rgba(3,8,6,0.72)";
  ctx.strokeStyle="rgba(61,220,132,0.25)";ctx.lineWidth=1;
  ctx.beginPath();ctx.rect(mx,my,size,size);ctx.fill();ctx.stroke();
  var k=size/WORLD;
  ctx.strokeStyle="rgba(255,255,255,0.16)";
  ctx.strokeRect(mx+(cam.x-W/2)*k,my+(cam.y-H/2)*k,W*k,H*k);
  var step=enemies.length>120?2:1;
  for(var i=0;i<enemies.length;i+=step){
    var e=enemies[i];
    if(e.fade>0) continue;
    ctx.fillStyle=e.col;
    ctx.fillRect(mx+e.x*k-1,my+e.y*k-1,2,2);
  }
  ctx.fillStyle="#e6fff5";
  ctx.beginPath();ctx.arc(mx+P.x*k,my+P.y*k,2.6,0,6.283);ctx.fill();
  ctx.restore();
}

// ================= HUD =================
function syncHud(){
  document.getElementById("hpFill").style.width=(Math.max(0,P.hp/P.maxHp)*100)+"%";
  document.getElementById("hpText").textContent="生命 "+Math.ceil(P.hp)+" / "+P.maxHp;
  document.getElementById("xpFill").style.width=(Math.min(1,xp/xpNext)*100)+"%";
  document.getElementById("xpText").textContent="Lv."+level+" · 经验 "+Math.floor(xp)+" / "+xpNext;
  document.getElementById("stat").innerHTML="<b>"+fmtTime(time)+"</b><br>击杀 "+kills+" · 得分 "+score;
}
function fmtTime(s){var m=Math.floor(s/60),ss=Math.floor(s%60);return m+"分"+ss+"秒";}

// ================= 结算 =================
function gameOver(){
  state="over";
  rec.runs=(rec.runs||0)+1;
  if(score>rec.bestScore)rec.bestScore=score;
  if(level>rec.bestLevel)rec.bestLevel=level;
  if(kills>rec.bestKills)rec.bestKills=kills;
  if(time>rec.bestTime)rec.bestTime=time;
  sj(REC_KEY,rec);
  localStorage.removeItem(SAVE_KEY);
  document.getElementById("hud").classList.remove("on");
  document.getElementById("goTime").textContent=fmtTime(time);
  document.getElementById("goLevel").textContent=level;
  document.getElementById("goKills").textContent=kills;
  document.getElementById("goScore").textContent=score;
  document.getElementById("goBest").textContent="最佳：得分 "+rec.bestScore+" · 等级 "+rec.bestLevel+" · 击杀 "+rec.bestKills;
  showOverlay("gameover");
}

// ================= 遮罩 & 按钮 =================
var OV=["menu","levelup","pause","gameover"];
function hideAll(){OV.forEach(function(id){document.getElementById(id).classList.remove("show");});}
function showOverlay(id){hideAll();document.getElementById(id).classList.add("show");if(id==="pause")renderAimUI();}
function togglePause(){
  if(state==="play"){state="pause";showOverlay("pause");saveNow();}
  else if(state==="pause"){hideAll();state="play";}
}
document.getElementById("newBtn").addEventListener("click",function(){hideAll();newRun();});
document.getElementById("contBtn").addEventListener("click",function(){hideAll();contRun();});
document.getElementById("againBtn").addEventListener("click",function(){hideAll();newRun();});
document.getElementById("pauseBtn").addEventListener("click",togglePause);
renderAimUI();
document.getElementById("resumeBtn").addEventListener("click",function(){hideAll();state="play";});
document.getElementById("quitBtn").addEventListener("click",function(){hideAll();gameOver();});
document.getElementById("backBtn").addEventListener("click",goHome);
document.getElementById("goBackBtn").addEventListener("click",goHome);
function goHome(){location.href="../index.html";}
window.addEventListener("beforeunload",function(){if(state==="play"||state==="levelup")saveNow();});
document.addEventListener("visibilitychange",function(){
  if(!document.hidden) return;
  if(state==="play"||state==="levelup") saveNow();
  if(state==="play"){ state="pause"; showOverlay("pause"); }
});

// ================= 启动 =================
resize();
xpNext=xpFor(1);
(function(){
  var box=document.getElementById("recBox");
  box.innerHTML=
    '<div><div class="k">最佳得分</div><div class="v">'+rec.bestScore+'</div></div>'+
    '<div><div class="k">最高等级</div><div class="v">'+rec.bestLevel+'</div></div>'+
    '<div><div class="k">最多击杀</div><div class="v">'+rec.bestKills+'</div></div>'+
    '<div><div class="k">总场次</div><div class="v">'+rec.runs+'</div></div>';
  var s=lj(SAVE_KEY);
  if(s){
    document.getElementById("saveInfo").textContent="有存档：等级 "+s.level+" · 存活 "+fmtTime(s.time||0);
    document.getElementById("contBtn").style.display="block";
  }
})();
requestAnimationFrame(loop);
})();
</script>
