<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>请出示你的证件 · 城关检查站</title>
<style>
:root{
  --ink:#141110; --ink2:#1c1917;
  --wood:#3b3128; --wood-l:#514536; --wood-d:#241d17;
  --paper:#e9dfc9; --paper2:#ded3ba; --paper-d:#c4b69a;
  --text:#3d3128; --text-l:#7d7060; --text-xl:#a29682;
  --red:#b0372c; --red-d:#82221b; --green:#4f7745; --green-d:#37552f;
  --gold:#c9a96b; --lamp:#f0cf94;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; min-height:100%;
  background:
    radial-gradient(1100px 700px at 50% -10%, rgba(240,207,148,.10), transparent 60%),
    radial-gradient(900px 600px at 50% 120%, rgba(176,55,44,.06), transparent 65%),
    #0f0d0c;
  color:#e7dfd0;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  display:flex; align-items:center; justify-content:center;
  padding:18px;
}
.screen{width:100%; max-width:900px;}

.game{
  position:relative;
  background:linear-gradient(#1a1614,#120f0e);
  border:1px solid #3a3028;
  border-radius:6px;
  box-shadow:0 24px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
  overflow:hidden;
}

/* ============ HUD ============ */
.hud{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:11px 16px; border-bottom:1px solid #322a24;
  background:linear-gradient(#221c18,#191411);
}
.hud .cell{font-size:13px; color:#9c8f7d; letter-spacing:.5px;}
.hud .cell b{color:#f0e4cf; font-weight:600; margin-left:5px; font-variant-numeric:tabular-nums;}
.hud .cell b.hot{color:#e6a05a;}
.hud .spacer{flex:1;}
.hud .file{font-size:11px; color:#6f6355; letter-spacing:1.5px;}

/* ============ 场景 ============ */
.booth{
  display:grid; grid-template-columns:minmax(0,1fr) minmax(0,320px);
  gap:0; min-height:330px;
  background:
    radial-gradient(120% 90% at 30% 0%, rgba(240,207,148,.13), transparent 55%),
    linear-gradient(#171b1c,#101313);
}
.win{
  position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  padding:18px 12px 0; overflow:hidden;
  border-right:1px solid #2c2620;
}
/* 窗口：玻璃 + 木框 */
.glass{
  position:absolute; left:26px; right:26px; top:18px; bottom:64px;
  border:10px solid #2e2620;
  border-radius:4px 4px 0 0;
  background:
    linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0) 42%),
    radial-gradient(85% 65% at 22% 12%, rgba(240,207,148,.22), transparent 62%),
    radial-gradient(60% 45% at 85% 90%, rgba(80,120,140,.10), transparent 70%),
    linear-gradient(#2b3637,#171d1e);
  box-shadow:inset 0 0 40px rgba(0,0,0,.55), 0 0 0 1px #463a2c;
  overflow:hidden;
}
.glass:before{
  content:""; position:absolute; inset:0;
  background:
    linear-gradient(90deg,
      transparent 0 22%, rgba(38,31,26,.55) 22% 22.6%, transparent 22.6% 77.2%,
      rgba(38,31,26,.55) 77.2% 77.8%, transparent 77.8% 100%),
    linear-gradient(115deg, rgba(255,255,255,.05) 0 14%, transparent 26% 100%);
  pointer-events:none;
}
.who{
  position:relative; z-index:2; display:flex; align-items:flex-end; justify-content:center;
  height:100%; padding-bottom:2px;
}
canvas.face{display:block; width:100%; max-width:272px; height:auto; filter:drop-shadow(0 8px 18px rgba(0,0,0,.45));}
.nametag{
  position:relative; z-index:3; margin-top:-6px; margin-bottom:14px;
  font-size:12px; letter-spacing:.6px; color:#cfc3ad;
  background:rgba(15,13,12,.72); border:1px solid #3d3329; border-radius:3px;
  padding:3px 9px; backdrop-filter:blur(3px);
}
/* 柜台 */
.counter{
  position:relative; z-index:4; width:100%; height:56px; margin-bottom:0;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 2px, transparent 2px 26px),
    linear-gradient(#75634c,#4c3f31 45%,#332a21);
  border-top:3px solid #7d6b52;
  box-shadow:0 -6px 18px rgba(0,0,0,.45), inset 0 -8px 14px rgba(0,0,0,.35);
}
.counter:after{
  content:""; position:absolute; left:0; right:0; top:0; height:2px;
  background:linear-gradient(90deg, transparent, rgba(240,207,148,.5), transparent);
}

/* ============ 右侧：证件 + 守则 ============ */
.side{padding:14px 14px 16px; display:flex; flex-direction:column; gap:12px;}
.doc{
  position:relative;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.022) 0 1px, transparent 1px 3px),
    linear-gradient(150deg,var(--paper),var(--paper2));
  border:1px solid var(--paper-d);
  border-radius:2px;
  box-shadow:0 8px 22px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.35);
  padding:11px 12px 9px;
  color:var(--text);
  font-family:Georgia,"Songti SC","SimSun",serif;
  transform:rotate(-.7deg);
}
.doc.bad{border-color:#c98f86; box-shadow:0 8px 22px rgba(120,30,25,.35);}
.docTop{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:10px; letter-spacing:2px; color:var(--text-l);
  border-bottom:1px solid rgba(120,100,70,.35); padding-bottom:5px;
}
.docTop b{font-size:12px; letter-spacing:3px; color:var(--text); font-weight:600;}
.docBody{display:flex; gap:10px; margin-top:9px;}
.photo{
  flex:0 0 auto; width:62px; padding:3px; background:#e3d9c2;
  border:1px solid #b9ab90; box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);
}
.photo canvas{display:block; width:100%; height:auto;}
.fields{flex:1; min-width:0; font-size:12px;}
.fields .row{display:flex; gap:8px; padding:2.5px 0; border-bottom:1px dotted rgba(120,100,70,.3);}
.fields .row:last-child{border-bottom:none;}
.fields .row i{flex:0 0 42px; color:var(--text-l); font-style:normal; font-size:11px;}
.fields .row b{color:#2b231b; font-weight:600; word-break:break-all;}
.fields .row b.warn{color:var(--red-d);}
.mrz{
  margin-top:8px; padding-top:5px; border-top:1px dashed rgba(120,100,70,.4);
  font-family:"Courier New",monospace; font-size:9.5px; letter-spacing:1px; color:var(--text-l);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.seal{
  position:absolute; right:14px; bottom:34px;
  width:74px; height:74px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:17px; font-weight:700; letter-spacing:2px;
  border:3px double currentColor; opacity:0; transform:scale(1.9) rotate(8deg);
  pointer-events:none;
}
.seal.ok{color:var(--green)}
.seal.no{color:var(--red)}
.seal.show{animation:stampIn .28s ease-out forwards;}
@keyframes stampIn{
  0%{opacity:0; transform:scale(1.9) rotate(8deg);}
  60%{opacity:.95; transform:scale(.94) rotate(-7deg);}
  100%{opacity:.85; transform:scale(1) rotate(-6deg);}
}

/* 守则 */
.law{
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.02) 0 1px, transparent 1px 3px),
    linear-gradient(160deg,#ded3ba,#cdc0a4);
  border:1px solid #b6a889; border-radius:2px;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
  padding:9px 11px 10px; color:var(--text);
  transform:rotate(.5deg);
}
.lawHead{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:11px; letter-spacing:2px; color:var(--text-l);
  border-bottom:1px solid rgba(120,100,70,.45); padding-bottom:5px;
}
.lawHead span{font-family:"Courier New",monospace; font-size:10px; color:#8a7c66;}
.law ul{list-style:none; margin:7px 0 0; padding:0;}
.law li{
  position:relative; font-size:12.5px; line-height:1.55; padding:3px 0 3px 16px;
  color:#33291f;
}
.law li em{font-style:normal; color:var(--red-d); font-weight:600;}
.law li:before{
  content:""; position:absolute; left:4px; top:8px;
  width:5px; height:5px; border-radius:50%; background:#8a7c66;
}
.law li.new:before{background:var(--red);}
.law li .newTag{
  display:inline-block; margin-left:6px; padding:0 5px; border-radius:2px;
  background:var(--red); color:#f4ece0; font-size:9px; letter-spacing:1px; vertical-align:1px;
}

/* ============ 桌面：守卫 + 按钮 ============ */
.desk{
  display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center;
  padding:12px 16px 14px; border-top:1px solid #322a24;
  background:
    radial-gradient(70% 60% at 50% 0%, rgba(240,207,148,.06), transparent 70%),
    linear-gradient(#1d1815,#151210);
}
.me{display:flex; align-items:center; gap:9px;}
.me canvas{display:block; width:58px; height:auto; border-radius:4px; background:#201b17; box-shadow:inset 0 0 0 1px #3a3028;}
.me span{font-size:10px; color:#6f6355; letter-spacing:2px; writing-mode:vertical-rl;}
.acts{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.stampBtn{
  position:relative; min-height:58px; border-radius:4px; cursor:pointer;
  font-family:inherit; font-size:17px; font-weight:600; letter-spacing:4px;
  border:1px solid transparent; transition:transform .08s, filter .12s;
  color:#f1e9db;
}
.stampBtn.ok{background:linear-gradient(#5b8650,#3f6338); border-color:#6d9a5f; box-shadow:inset 0 -4px 0 rgba(0,0,0,.28);}
.stampBtn.no{background:linear-gradient(#bd4336,#8e2a22); border-color:#cf5a4c; box-shadow:inset 0 -4px 0 rgba(0,0,0,.28);}
.stampBtn:after{
  content:""; position:absolute; left:12px; right:12px; bottom:-5px; height:4px; border-radius:2px;
  background:rgba(0,0,0,.3);
}
.stampBtn:active{transform:translateY(2px);}
.stampBtn:disabled{filter:grayscale(.65) brightness(.8); cursor:default; transform:none;}

/* 提示 */
.toast{
  position:absolute; left:50%; top:58px; transform:translate(-50%,-8px);
  padding:8px 18px; border-radius:3px; font-size:14px; letter-spacing:.5px;
  background:rgba(20,17,15,.92); border:1px solid #57493a; color:#f0e4cf;
  opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
  z-index:30; white-space:nowrap;
}
.toast.on{opacity:1; transform:translate(-50%,0);}
.toast.bad{border-color:#8e2a22; color:#f4c9c2;}

/* 覆盖层 */
.ov{
  position:absolute; inset:0; z-index:40; display:none;
  align-items:center; justify-content:center; padding:20px;
  background:rgba(10,8,7,.86); backdrop-filter:blur(3px);
}
.ov.on{display:flex; animation:fadeIn .22s ease-out;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.ovcard{
  width:100%; max-width:400px; padding:20px 22px 18px; border-radius:4px; text-align:center;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.02) 0 1px, transparent 1px 3px),
    linear-gradient(150deg,var(--paper),var(--paper2));
  border:1px solid #b6a889; color:var(--text);
  box-shadow:0 26px 60px rgba(0,0,0,.6);
  font-family:Georgia,"Songti SC","SimSun",serif;
}
.ovcard h2{margin:0 0 4px; font-size:21px; letter-spacing:3px; color:#2b231b; font-weight:700;}
.ovcard .sub{font-size:11px; letter-spacing:2px; color:var(--text-l); margin-bottom:12px;}
.ovcard p{margin:7px 0; font-size:13.5px; line-height:1.7; color:#3d3128;}
.ovcard p b{color:#241c14;}
.ovcard .big{font-size:26px; font-weight:700; color:#241c14; margin:6px 0 2px; font-variant-numeric:tabular-nums;}
.ovbtn{
  width:100%; margin-top:14px; min-height:50px; cursor:pointer;
  font-family:inherit; font-size:16px; font-weight:600; letter-spacing:3px;
  border:1px solid #7d6f57; border-radius:3px; color:#f1e9db;
  background:linear-gradient(#5b8650,#3f6338);
}
.ovbtn.red{background:linear-gradient(#bd4336,#8e2a22); border-color:#cf5a4c;}
.ovbtn:active{transform:translateY(2px);}

/* ============ 响应式 ============ */
@media (max-width:820px){
  .booth{grid-template-columns:1fr; min-height:0;}
  .win{border-right:none; border-bottom:1px solid #2c2620; padding-top:14px;}
  .glass{left:16px; right:16px; top:14px; bottom:56px;}
  .who{min-height:210px;}
  canvas.face{max-width:180px;}
  .counter{height:44px;}
  .side{padding:12px;}
  .desk{grid-template-columns:auto 1fr; padding:10px 12px 12px; gap:10px;}
  .acts{grid-template-columns:1fr; gap:8px;}
  .stampBtn{min-height:50px; font-size:15px; letter-spacing:3px;}
}
@media (max-width:520px){
  body{padding:0;}
  .game{border-radius:0; border:none;}
  .hud{padding:8px 12px; gap:10px;}
  .hud .cell{font-size:11.5px;}
  .hud .file{display:none;}
  .win{padding:10px 8px 0;}
  .glass{left:10px; right:10px; top:10px; bottom:48px;}
  .who{min-height:170px;}
  canvas.face{max-width:136px;}
  .doc{padding:9px 10px 8px; transform:none;}
  .photo{width:52px;}
  .fields{font-size:11.5px;}
  .law li{font-size:12px;}
  .me canvas{width:40px;}
}
@media (max-height:520px) and (min-width:700px){
  body{padding:6px;}
  .booth{grid-template-columns:1fr 250px; min-height:0;}
  .win{padding-top:8px;}
  .glass{top:8px; bottom:40px; left:14px; right:14px;}
  .who{min-height:150px;}
  canvas.face{max-width:150px;}
  .counter{height:36px;}
  .side{padding:8px 10px; gap:8px;}
  .doc{padding:8px 9px 7px;}
  .law{padding:7px 9px 8px;}
  .law li{font-size:11px; line-height:1.45; padding:1px 0 1px 14px;}
  .hud{padding:7px 12px;}
  .desk{padding:8px 12px 10px;}
  .stampBtn{min-height:44px; font-size:14px;}
}
</style>
</head>
<body>
<div class="screen">
  <div class="game" id="app">

    <div class="hud">
      <div class="cell">第 <b id="dayTag">1</b> 天</div>
      <div class="cell">得分 <b id="scoreTag">0</b></div>
      <div class="cell">失误 <b id="failTag" class="hot">0</b>/3</div>
      <div class="cell">待检 <b id="leftTag">6</b> 人</div>
      <div class="spacer"></div>
      <div class="file">CHECKPOINT · EAST GATE</div>
    </div>

    <div class="booth">
      <div class="win">
        <div class="glass"></div>
        <div class="who"><canvas class="face" id="visCv" width="420" height="500"></canvas></div>
        <div class="nametag" id="visName">访客</div>
        <div class="counter"></div>
      </div>

      <div class="side">
        <div class="doc" id="card">
          <div class="docTop"><span>TRAVEL PERMIT</span><b>通关证件</b><span>DAY <i id="docDay">1</i></span></div>
          <div class="docBody">
            <div class="photo"><canvas id="phCv" width="120" height="150"></canvas></div>
            <div class="fields" id="fields"></div>
          </div>
          <div class="mrz" id="mrz">MZ&lt;&lt;OAK&lt;&lt;NO.0000&lt;&lt;0000000000&lt;&lt;1</div>
          <div class="seal" id="seal">准 许</div>
        </div>

        <div class="law">
          <div class="lawHead"><span>通行守则</span><span id="lawCode">§1—§2</span></div>
          <ul id="ruleList"></ul>
        </div>
      </div>
    </div>

    <div class="desk">
      <div class="me"><canvas id="guardCv" width="120" height="140"></canvas><span>你</span></div>
      <div class="acts">
        <button class="stampBtn ok" id="passBtn">准许通行</button>
        <button class="stampBtn no" id="denyBtn">拒绝入内</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="ov" id="ov"><div class="ovcard" id="ovCard"></div></div>
  </div>
</div>

<script>
var visCv=document.getElementById("visCv"),vctx=visCv.getContext("2d");
var phCv=document.getElementById("phCv"),pctx=phCv.getContext("2d");
var gdCv=document.getElementById("guardCv"),gctx=gdCv.getContext("2d");

var DAYS=3, VIS_PER_DAY=6, MAX_FAIL=3;

var JOBS=["村民","铁傀儡","僵尸","苦力怕","末影人","流浪商人"];
var ZONES=["橡木村","沙漠村","下界","末地"];
var NAMES=["Steve","Alex","Herobrine","Notch","Jeb","Dinnerbone","Grumm","Toast","Ari","Sunny","Makenna","Zuri"];
var DATES=["今天","昨天","三天前"];
var WEARS=["无","草帽","铁头盔","破斗篷"];

/* 规则：逐日累加，新条款标 NEW */
var RULES=[
 {day:1,no:1,text:"只放行【村民】，其他职业一律<em>拒绝</em>",allow:function(v){return v.job==="村民";}},
 {day:1,no:2,text:"证件日期必须是<em>今天</em>",allow:function(v){return v.date==="今天";}},
 {day:2,no:3,text:"【铁傀儡】也可放行，凭编号验明",allow:function(v){return v.job==="铁傀儡";},opt:true},
 {day:2,no:4,text:"敌对生物（僵尸、苦力怕、末影人）一律<em>拒绝</em>",allow:function(v){return ["僵尸","苦力怕","末影人"].indexOf(v.job)<0;}},
 {day:3,no:5,text:"区域必须是【橡木村】，外来证件不放行",allow:function(v){return v.zone==="橡木村";}}
];
function rulesForDay(d){ return RULES.filter(function(r){return r.day<=d;}); }
function allowVisitor(v,d){
  return rulesForDay(d).every(function(r){ return r.opt || r.allow(v); });
}

var state={day:1,idx:0,score:0,fail:0,locked:false};
var cur=null, best=0;
try{best=parseInt(localStorage.getItem("mc_id_best")||"0",10)||0;}catch(e){}

/* ================= 人像绘制（非像素 · 平滑） ================= */
var PRO={
  "Steve":   {skin:"#d9aa80",skinD:"#b08056",cloth:"#417f83",clothD:"#2a5a5e",hair:"#3a2a1e",style:"guard",hat:"cap"},
  "村民":     {skin:"#d7a478",skinD:"#ad7c53",cloth:"#8c6d40",clothD:"#5e4827",hair:"#553f29",style:"villager",hat:"straw"},
  "铁傀儡":   {skin:"#cdcdc6",skinD:"#96968d",cloth:"#9c9c93",clothD:"#74746a",hair:null,style:"golem"},
  "僵尸":     {skin:"#94ad80",skinD:"#6d8959",cloth:"#424e3b",clothD:"#2b3527",hair:"#2c3729",style:"zombie"},
  "苦力怕":   {skin:"#89c366",skinD:"#5f9844",cloth:"#6aaa4e",clothD:"#4b8a35",hair:null,style:"creeper"},
  "末影人":   {skin:"#2c2c3e",skinD:"#13131d",cloth:"#22222f",clothD:"#0d0d16",hair:null,style:"enderman"},
  "流浪商人": {skin:"#c99b6d",skinD:"#9b7448",cloth:"#40609f",clothD:"#28406e",hair:"#453122",style:"wanderer"}
};

function rrPath(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y);
  g.closePath();
}
function roundRect(g,x,y,w,h,r,fill){ rrPath(g,x,y,w,h,r); g.fillStyle=fill; g.fill(); }
function ellipse(g,x,y,rx,ry,fill){
  g.beginPath(); g.ellipse(x,y,Math.max(0.4,rx),Math.max(0.4,ry),0,0,Math.PI*2); g.fillStyle=fill; g.fill();
}
function lighten(hex,amt){
  var n=parseInt(hex.slice(1),16), r=(n>>16)+amt, gg=((n>>8)&255)+amt, b=(n&255)+amt;
  return "rgb("+Math.min(255,r)+","+Math.min(255,gg)+","+Math.min(255,b)+")";
}
function darken(hex,amt){
  var n=parseInt(hex.slice(1),16), r=(n>>16)-amt, gg=((n>>8)&255)-amt, b=(n&255)-amt;
  return "rgb("+Math.max(0,r)+","+Math.max(0,gg)+","+Math.max(0,b)+")";
}

/* 统一光照：只作用在已绘制像素上（source-atop），左上打光、右下落影、底部融入柜台 */
function finishLight(g,W,H){
  g.save();
  g.globalCompositeOperation="source-atop";
  var lg=g.createLinearGradient(W*0.10,H*0.02,W*0.92,H*0.95);
  lg.addColorStop(0,"rgba(255,242,210,.26)");
  lg.addColorStop(.34,"rgba(255,242,210,.05)");
  lg.addColorStop(.60,"rgba(255,242,210,0)");
  lg.addColorStop(1,"rgba(10,8,6,.34)");
  g.fillStyle=lg; g.fillRect(0,0,W,H);
  var bg=g.createLinearGradient(0,H*0.74,0,H);
  bg.addColorStop(0,"rgba(0,0,0,0)");
  bg.addColorStop(1,"rgba(0,0,0,.5)");
  g.fillStyle=bg; g.fillRect(0,H*0.74,W,H*0.26);
  g.restore();
}

/* 脸型：上圆下收，带下巴 */
function facePath(g,cx,hy,rx,ry){
  g.beginPath();
  g.moveTo(cx,hy-ry);
  g.bezierCurveTo(cx+rx*0.62,hy-ry*0.98,cx+rx*0.99,hy-ry*0.52,cx+rx*0.94,hy-ry*0.02);
  g.bezierCurveTo(cx+rx*0.88,hy+ry*0.56,cx+rx*0.50,hy+ry*0.99,cx,hy+ry);
  g.bezierCurveTo(cx-rx*0.50,hy+ry*0.99,cx-rx*0.88,hy+ry*0.56,cx-rx*0.94,hy-ry*0.02);
  g.bezierCurveTo(cx-rx*0.99,hy-ry*0.52,cx-rx*0.62,hy-ry*0.98,cx,hy-ry);
  g.closePath();
}

function portrait(g, job, W, H){
  g.clearRect(0,0,W,H);
  var p=PRO[job]||PRO["村民"];
  var cx=W*0.5, base=H*1.02;

  var hy=H*(p.style==="golem"?0.335:(p.style==="enderman"?0.30:0.325));
  var rx=W*(p.style==="enderman"?0.128:0.168);
  var ry=W*(p.style==="enderman"?0.248:0.212);

  if(p.style==="creeper"){ drawCreeper(g,p,cx,W,H,base); return finishLight(g,W,H); }
  if(p.style==="golem"){ drawGolem(g,p,cx,W,H,base); return finishLight(g,W,H); }
  if(p.style==="enderman"){ drawEnderman(g,p,cx,W,H,base); return finishLight(g,W,H); }

  /* —— 躯干：带肩点，不再是圆锥斗篷 —— */
  var sw=W*(p.style==="wanderer"?0.78:0.72);
  var ty=H*0.585, dy=base-ty;
  var tg=g.createLinearGradient(cx-sw*0.54,ty,cx+sw*0.56,base);
  tg.addColorStop(0,darken(p.cloth,14));
  tg.addColorStop(.26,p.cloth);
  tg.addColorStop(.66,p.cloth);
  tg.addColorStop(1,darken(p.cloth,24));
  g.beginPath();
  g.moveTo(cx-sw*0.54,base);
  g.lineTo(cx-sw*0.54,ty+dy*0.30);
  g.quadraticCurveTo(cx-sw*0.53,ty+dy*0.10,cx-sw*0.34,ty+dy*0.035);
  g.quadraticCurveTo(cx-sw*0.15,ty-dy*0.02,cx,ty-dy*0.026);
  g.quadraticCurveTo(cx+sw*0.15,ty-dy*0.02,cx+sw*0.34,ty+dy*0.035);
  g.quadraticCurveTo(cx+sw*0.53,ty+dy*0.10,cx+sw*0.54,ty+dy*0.30);
  g.lineTo(cx+sw*0.54,base);
  g.closePath(); g.fillStyle=tg; g.fill();

  /* 肩部亮带 + 腋下暗部 */
  g.strokeStyle="rgba(255,255,255,.11)"; g.lineWidth=Math.max(1,W*0.006);
  g.beginPath(); g.moveTo(cx-sw*0.30,ty+dy*0.05); g.quadraticCurveTo(cx-sw*0.27,ty+dy*0.24,cx-sw*0.30,base*0.98); g.stroke();
  g.strokeStyle="rgba(0,0,0,.22)";
  g.beginPath(); g.moveTo(cx+sw*0.31,ty+dy*0.05); g.quadraticCurveTo(cx+sw*0.29,ty+dy*0.26,cx+sw*0.32,base*0.98); g.stroke();
  g.strokeStyle="rgba(0,0,0,.14)";
  g.beginPath(); g.moveTo(cx-sw*0.34,ty+dy*0.035); g.lineTo(cx-sw*0.54,ty+dy*0.30); g.stroke();
  g.beginPath(); g.moveTo(cx+sw*0.34,ty+dy*0.035); g.lineTo(cx+sw*0.54,ty+dy*0.30); g.stroke();

  /* —— 脖子（含斜方肌过渡） —— */
  var neckW=W*0.182, nTop=hy+ry*0.70, nBot=ty+H*0.026;
  var ng=g.createLinearGradient(cx-neckW/2,nTop,cx+neckW/2,nTop);
  ng.addColorStop(0,p.skinD); ng.addColorStop(.32,darken(p.skin,4)); ng.addColorStop(.62,p.skin); ng.addColorStop(1,p.skinD);
  g.beginPath();
  g.moveTo(cx-neckW*0.40,nTop);
  g.bezierCurveTo(cx-neckW*0.58,hy+ry*0.92,cx-neckW*0.72,nBot-H*0.05,cx-neckW*0.86,nBot);
  g.lineTo(cx+neckW*0.86,nBot);
  g.bezierCurveTo(cx+neckW*0.72,nBot-H*0.05,cx+neckW*0.58,hy+ry*0.92,cx+neckW*0.40,nTop);
  g.closePath(); g.fillStyle=ng; g.fill();
  /* 颈部侧影 */
  g.fillStyle="rgba(70,36,24,.20)";
  g.beginPath(); g.moveTo(cx-neckW*0.62,nTop); g.bezierCurveTo(cx-neckW*0.78,hy+ry*0.95,cx-neckW*0.86,nBot-H*0.04,cx-neckW*0.92,nBot); g.lineTo(cx-neckW*0.72,nBot); g.bezierCurveTo(cx-neckW*0.66,hy+ry*0.98,cx-neckW*0.54,nTop+H*0.01,cx-neckW*0.42,nTop); g.closePath(); g.fill();
  /* 下巴投影 */
  var sh=g.createLinearGradient(0,nTop,0,nTop+H*0.075);
  sh.addColorStop(0,"rgba(58,28,18,.46)"); sh.addColorStop(1,"rgba(58,28,18,0)");
  g.fillStyle=sh; g.fillRect(cx-neckW*0.9,nTop,neckW*1.8,H*0.075);

  /* —— 衣领（盖住脖子根部） —— */
  drawCollar(g,p,cx,sw,ty,base,H,W,nBot);

  /* —— 头 —— */
  drawHead(g,p,cx,hy,rx,ry,W,H);
  finishLight(g,W,H);
}

/* 衣领：一圈包住脖子根部的布，按职业给不同质感 */
function drawCollar(g,p,cx,sw,ty,base,H,W,nBot){
  var y0=Math.min(ty+H*0.004, nBot-H*0.022);
  var w0=W*0.104;
  var dark=darken(p.cloth,36), mid=darken(p.cloth,22), lite=lighten(p.cloth,10);

  /* 领圈主体 */
  g.beginPath();
  g.moveTo(cx-w0*1.34,y0-H*0.026);
  g.quadraticCurveTo(cx,y0+H*0.028,cx+w0*1.34,y0-H*0.026);
  g.lineTo(cx+w0*1.40,y0+H*0.004);
  g.quadraticCurveTo(cx,y0+H*0.078,cx-w0*1.40,y0+H*0.004);
  g.closePath();
  var cg=g.createLinearGradient(cx-w0*1.6,y0, cx+w0*1.6,y0+H*0.09);
  cg.addColorStop(0,lite); cg.addColorStop(.35,mid); cg.addColorStop(1,dark);
  g.fillStyle=cg; g.fill();

  /* 领口内阴影（布与脖子之间） */
  g.beginPath();
  g.moveTo(cx-w0*0.92,y0-H*0.020);
  g.quadraticCurveTo(cx,y0+H*0.012,cx+w0*0.92,y0-H*0.020);
  g.quadraticCurveTo(cx,y0+H*0.022,cx-w0*0.92,y0-H*0.020);
  g.fillStyle="rgba(0,0,0,.28)"; g.fill();

  /* 领缘高光 */
  g.strokeStyle="rgba(255,255,255,.16)"; g.lineWidth=Math.max(1,W*0.004);
  g.beginPath();
  g.moveTo(cx-w0*1.34,y0-H*0.024);
  g.quadraticCurveTo(cx,y0+H*0.028,cx+w0*1.34,y0-H*0.024);
  g.stroke();

  if(p.style==="guard"){
    /* 领花 */
    g.fillStyle="#c9a96b";
    [-1,1].forEach(function(sgn){
      g.beginPath();
      g.moveTo(cx+sgn*w0*1.16,y0-H*0.024);
      g.lineTo(cx+sgn*w0*0.90,y0+H*0.002);
      g.lineTo(cx+sgn*w0*1.04,y0+H*0.030);
      g.closePath(); g.fill();
    });
    /* 纽扣 */
    g.fillStyle="rgba(255,255,255,.26)";
    for(var i=0;i<3;i++){
      g.beginPath(); g.arc(cx-W*0.012,y0+H*(0.085+i*0.055),W*0.0065,0,Math.PI*2); g.fill();
    }
  }else if(p.style==="wanderer"){
    /* 围巾 */
    g.beginPath();
    g.moveTo(cx-w0*1.75,y0-H*0.010);
    g.quadraticCurveTo(cx,y0+H*0.052,cx+w0*1.75,y0-H*0.010);
    g.lineTo(cx+w0*1.70,y0+H*0.030);
    g.quadraticCurveTo(cx,y0+H*0.095,cx-w0*1.70,y0+H*0.030);
    g.closePath(); g.fillStyle="rgba(176,142,96,.72)"; g.fill();
    g.strokeStyle="rgba(255,255,255,.14)"; g.lineWidth=1.2;
    g.beginPath(); g.moveTo(cx-w0*1.5,y0+H*0.012); g.quadraticCurveTo(cx,y0+H*0.062,cx+w0*1.5,y0+H*0.012); g.stroke();
  }else if(p.style==="zombie"){
    /* 破口 */
    g.fillStyle=darken(p.cloth,46);
    for(var k=0;k<4;k++){
      g.beginPath();
      g.moveTo(cx-w0*1.2+k*w0*0.62,y0+H*0.012);
      g.lineTo(cx-w0*1.1+k*w0*0.62,y0+H*0.062);
      g.lineTo(cx-w0*1.0+k*w0*0.62,y0+H*0.012);
      g.fill();
    }
  }else{
    /* 村民：麻绳与木扣 */
    g.strokeStyle="rgba(120,92,52,.55)"; g.lineWidth=Math.max(1.6,W*0.006);
    g.beginPath();
    g.moveTo(cx-w0*1.48,y0+H*0.010);
    g.quadraticCurveTo(cx,y0+H*0.066,cx+w0*1.48,y0+H*0.010);
    g.stroke();
    g.fillStyle="#6d5330";
    g.beginPath(); g.arc(cx, y0+H*0.052, W*0.014,0,Math.PI*2); g.fill();
    g.fillStyle="rgba(255,255,255,.22)";
    g.beginPath(); g.arc(cx-W*0.005, y0+H*0.046, W*0.005,0,Math.PI*2); g.fill();
  }
}

function drawHead(g,p,cx,hy,rx,ry,W,H){

  /* 耳朵 */
  if(p.style!=="zombie"){
    [-1,1].forEach(function(sgn){
      var ex=cx+sgn*rx*0.93, ey=hy+ry*0.03;
      ellipse(g,ex,ey,rx*0.145,ry*0.175,darken(p.skin,10));
      ellipse(g,ex+sgn*rx*0.02,ey,rx*0.075,ry*0.10,p.skinD);
    });
  }else{
    [-1,1].forEach(function(sgn){
      var ex=cx+sgn*rx*0.92, ey=hy+ry*0.05;
      ellipse(g,ex,ey,rx*0.13,ry*0.15,p.skinD);
    });
  }

  /* 脸 */
  var fg=g.createRadialGradient(cx-rx*0.38,hy-ry*0.42,rx*0.18,cx,hy,rx*1.55);
  fg.addColorStop(0,lighten(p.skin,26));
  fg.addColorStop(.55,p.skin);
  fg.addColorStop(1,darken(p.skin,20));
  facePath(g,cx,hy,rx,ry); g.fillStyle=fg; g.fill();

  /* 下颌阴影 */
  var jaw=g.createLinearGradient(0,hy+ry*0.55,0,hy+ry*0.98);
  jaw.addColorStop(0,"rgba(0,0,0,0)"); jaw.addColorStop(1,"rgba(60,30,25,.22)");
  g.save(); facePath(g,cx,hy,rx,ry); g.clip();
  g.fillStyle=jaw; g.fillRect(cx-rx,hy+ry*0.55,rx*2,ry*0.5);
  g.restore();

  /* 头发 / 帽子 */
  drawHair(g,p,cx,hy,rx,ry,W,H);

  /* 眉 */
  g.strokeStyle=p.style==="zombie"?"rgba(35,48,28,.72)":"rgba(64,45,32,.55)";
  g.lineWidth=Math.max(1.3,W*0.0042);
  [-1,1].forEach(function(sgn){
    g.beginPath();
    g.moveTo(cx+sgn*rx*0.66,hy-ry*0.185);
    g.quadraticCurveTo(cx+sgn*rx*0.40,hy-ry*0.265,cx+sgn*rx*0.16,hy-ry*0.205);
    g.stroke();
  });

  /* 眼 */
  drawEyes(g,p,cx,hy,rx,ry,W);

  /* 鼻 */
  drawNose(g,p,cx,hy,rx,ry,W);

  /* 嘴 */
  drawMouth(g,p,cx,hy,rx,ry,W);
}

function drawEyes(g,p,cx,hy,rx,ry,W){
  [-1,1].forEach(function(sgn){
    var ex=cx+sgn*rx*0.37, ey=hy+ry*0.025;
    if(p.style==="zombie"){
      g.fillStyle="rgba(30,42,28,.55)";
      g.beginPath(); g.ellipse(ex,ey,rx*0.26,ry*0.13,0,0,Math.PI*2); g.fill();
      g.fillStyle="rgba(230,230,215,.55)";
      g.beginPath(); g.ellipse(ex,ey,rx*0.13,ry*0.055,0,0,Math.PI*2); g.fill();
      g.fillStyle="#1a221a";
      g.beginPath(); g.arc(ex+sgn*rx*0.02,ey,rx*0.045,0,Math.PI*2); g.fill();
      return;
    }
    /* 眼窝 */
    g.fillStyle="rgba(110,70,55,.10)";
    g.beginPath(); g.ellipse(ex,ey-ry*0.075,rx*0.26,ry*0.145,0,0,Math.PI*2); g.fill();
    /* 眼白 */
    g.fillStyle="#f8f4ea";
    g.beginPath(); g.ellipse(ex,ey,rx*0.195,ry*0.080,0,0,Math.PI*2); g.fill();
    /* 虹膜 */
    g.fillStyle="#4a3527";
    g.beginPath(); g.ellipse(ex+sgn*rx*0.008,ey,rx*0.090,ry*0.070,0,0,Math.PI*2); g.fill();
    /* 瞳孔 */
    g.fillStyle="#1e1813";
    g.beginPath(); g.arc(ex+sgn*rx*0.008,ey+ry*0.004,rx*0.040,0,Math.PI*2); g.fill();
    /* 高光 */
    g.fillStyle="rgba(255,255,255,.85)";
    g.beginPath(); g.arc(ex-rx*0.032,ey-ry*0.027,rx*0.024,0,Math.PI*2); g.fill();
    /* 上眼睑 */
    g.strokeStyle="rgba(88,58,42,.55)"; g.lineWidth=Math.max(1.3,W*0.0042);
    g.beginPath();
    g.moveTo(ex-rx*0.200,ey-ry*0.008);
    g.quadraticCurveTo(ex,ey-ry*0.092,ex+rx*0.200,ey-ry*0.008);
    g.stroke();
    /* 下眼睑淡影 */
    g.strokeStyle="rgba(120,80,60,.20)"; g.lineWidth=1;
    g.beginPath();
    g.moveTo(ex-rx*0.17,ey+ry*0.062);
    g.quadraticCurveTo(ex,ey+ry*0.092,ex+rx*0.17,ey+ry*0.062);
    g.stroke();
  });
}

function drawNose(g,p,cx,hy,rx,ry,W){
  if(p.style==="villager"){
    /* 大鼻头 */
    var nrx=rx*0.19, nry=ry*0.20, ny=hy+ry*0.28;
    ellipse(g,cx,ny,nrx,nry,darken(p.skin,16));
    ellipse(g,cx-rx*0.02,ny-nry*0.22,nrx*0.82,nry*0.70,p.skin);
    ellipse(g,cx-rx*0.06,ny-nry*0.40,nrx*0.34,nry*0.26,"rgba(255,240,220,.45)");
    ellipse(g,cx,ny+nry*0.78,nrx*0.70,nry*0.20,"rgba(90,50,40,.22)");
    /* 法令纹 */
    g.strokeStyle="rgba(120,75,55,.22)"; g.lineWidth=1.4;
    g.beginPath(); g.moveTo(cx-nrx*0.9,ny+nry*0.8); g.quadraticCurveTo(cx-nrx*1.5,hy+ry*0.55,cx-nrx*1.2,hy+ry*0.42); g.stroke();
    g.beginPath(); g.moveTo(cx+nrx*0.9,ny+nry*0.8); g.quadraticCurveTo(cx+nrx*1.5,hy+ry*0.55,cx+nrx*1.2,hy+ry*0.42); g.stroke();
    return;
  }
  /* 普通鼻梁 */
  g.strokeStyle="rgba(140,95,70,.30)"; g.lineWidth=Math.max(1.2,W*0.004);
  g.beginPath();
  g.moveTo(cx-rx*0.05,hy-ry*0.14);
  g.quadraticCurveTo(cx-rx*0.11,hy+ry*0.14,cx-rx*0.10,hy+ry*0.26);
  g.stroke();
  /* 鼻头 */
  ellipse(g,cx-rx*0.02,hy+ry*0.275,rx*0.115,ry*0.075,lighten(p.skin,10));
  ellipse(g,cx-rx*0.02,hy+ry*0.305,rx*0.095,ry*0.045,"rgba(90,50,40,.22)");
}

function drawMouth(g,p,cx,hy,rx,ry,W){
  var my=hy+ry*0.60;
  if(p.style==="zombie"){
    g.fillStyle="rgba(40,52,36,.85)";
    rrPath(g,cx-rx*0.26,my-rx*0.01,rx*0.52,ry*0.16,4); g.fill();
    g.strokeStyle="rgba(200,210,180,.30)"; g.lineWidth=1.4;
    for(var i=0;i<4;i++){ g.beginPath(); g.moveTo(cx-rx*0.16+i*rx*0.10,my+ry*0.01); g.lineTo(cx-rx*0.16+i*rx*0.10,my+ry*0.10); g.stroke(); }
    return;
  }
  if(p.style==="wanderer"){
    /* 胡子下的嘴 */
    g.strokeStyle="rgba(120,70,60,.45)"; g.lineWidth=Math.max(1.2,W*0.004);
    g.beginPath(); g.moveTo(cx-rx*0.15,my); g.quadraticCurveTo(cx,my+ry*0.06,cx+rx*0.15,my); g.stroke();
    return;
  }
  /* 上唇线 */
  g.strokeStyle="rgba(150,90,72,.55)"; g.lineWidth=Math.max(1.4,W*0.0045);
  g.beginPath();
  g.moveTo(cx-rx*0.155,my-ry*0.008);
  g.quadraticCurveTo(cx,my-ry*0.062,cx+rx*0.155,my-ry*0.008);
  g.stroke();
  /* 下唇 */
  g.fillStyle="rgba(198,126,110,.34)";
  g.beginPath();
  g.ellipse(cx,my+ry*0.030,rx*0.115,ry*0.040,0,0,Math.PI*2); g.fill();
  /* 嘴角 */
  g.strokeStyle="rgba(120,70,55,.30)"; g.lineWidth=1.1;
  g.beginPath(); g.moveTo(cx-rx*0.155,my-ry*0.008); g.lineTo(cx-rx*0.17,my-ry*0.028); g.stroke();
  g.beginPath(); g.moveTo(cx+rx*0.155,my-ry*0.008); g.lineTo(cx+rx*0.17,my-ry*0.028); g.stroke();
}

function drawHair(g,p,cx,hy,rx,ry,W,H){
  if(p.hat==="straw"){
    /* 草帽：帽檐 + 帽顶 + 帽带 */
    var brimY=hy-ry*0.56;
    /* 帽下头发 */
    if(p.hair){
      g.fillStyle=p.hair;
      g.beginPath();
      g.ellipse(cx,hy-ry*0.30,rx*0.98,ry*0.52,0,Math.PI,Math.PI*2);
      g.fill();
      g.beginPath(); g.ellipse(cx,hy-ry*0.30,rx*0.98,ry*0.30,0,Math.PI,Math.PI*2); g.fill();
    }
    ellipse(g,cx,brimY,rx*1.72,ry*0.27,"#c7a768");
    ellipse(g,cx,brimY-ry*0.03,rx*1.66,ry*0.24,lighten("#c7a768",14));
    /* 帽顶 */
    var topW=rx*0.92, topH=ry*0.60;
    var tg=g.createLinearGradient(cx-topW,brimY-topH,cx+topW,brimY);
    tg.addColorStop(0,lighten("#cfae6c",16)); tg.addColorStop(.6,"#cfae6c"); tg.addColorStop(1,"#a98a4f");
    g.beginPath();
    g.moveTo(cx-topW,brimY);
    g.quadraticCurveTo(cx-topW*0.92,brimY-topH,cx,brimY-topH*0.92);
    g.quadraticCurveTo(cx+topW*0.92,brimY-topH,cx+topW,brimY);
    g.closePath(); g.fillStyle=tg; g.fill();
    /* 帽带 */
    g.fillStyle="rgba(120,88,48,.55)";
    rrPath(g,cx-topW*0.96,brimY-topH*0.30,topW*1.92,topH*0.24,3); g.fill();
    /* 帽檐暗面 */
    g.fillStyle="rgba(90,66,34,.20)";
    g.beginPath(); g.ellipse(cx,brimY+ry*0.10,rx*1.60,ry*0.10,0,0,Math.PI*2); g.fill();
    /* 帽下阴影 */
    g.fillStyle="rgba(60,40,24,.22)";
    g.beginPath(); g.ellipse(cx,hy-ry*0.30,rx*0.92,ry*0.20,0,0,Math.PI*2); g.fill();
    return;
  }
  if(p.hat==="cap"){
    /* 制服帽：帽体 + 帽檐 + 帽徽 */
    var capW=rx*0.99, capH=ry*0.56, cy0=hy-ry*0.46;
    var cg=g.createLinearGradient(cx-capW,cy0-capH,cx+capW,cy0);
    cg.addColorStop(0,"#34455f"); cg.addColorStop(.55,"#26334a"); cg.addColorStop(1,"#1a2436");
    g.beginPath();
    g.moveTo(cx-capW,cy0);
    g.quadraticCurveTo(cx-capW*0.94,cy0-capH*1.08,cx,cy0-capH*1.02);
    g.quadraticCurveTo(cx+capW*0.94,cy0-capH*1.08,cx+capW,cy0);
    g.closePath(); g.fillStyle=cg; g.fill();
    /* 帽檐 */
    var brg=g.createLinearGradient(cx,cy0,cx,cy0+ry*0.22);
    brg.addColorStop(0,"#16202f"); brg.addColorStop(1,"#0d141f");
    g.beginPath();
    g.ellipse(cx,cy0+ry*0.02,capW*1.16,ry*0.10,0,0,Math.PI);
    g.fillStyle=brg; g.fill();
    /* 帽檐前沿高光 */
    g.strokeStyle="rgba(255,255,255,.16)"; g.lineWidth=1.6;
    g.beginPath(); g.ellipse(cx,cy0+ry*0.02,capW*1.10,ry*0.085,0,0.10,Math.PI-0.10); g.stroke();
    /* 帽徽 */
    g.fillStyle="#c9a96b";
    g.beginPath(); g.arc(cx,cy0-capH*0.56,rx*0.085,0,Math.PI*2); g.fill();
    g.fillStyle="#8b713d";
    g.beginPath(); g.arc(cx,cy0-capH*0.56,rx*0.045,0,Math.PI*2); g.fill();
    /* 帽顶高光 */
    g.fillStyle="rgba(255,255,255,.14)";
    g.beginPath(); g.ellipse(cx-capW*0.38,cy0-capH*0.52,capW*0.28,capH*0.16,-0.25,0,Math.PI*2); g.fill();
    /* 鬓角（贴脸颊的弧） */
    g.fillStyle=p.hair;
    g.beginPath();
    g.moveTo(cx-rx*0.97,hy-ry*0.34);
    g.quadraticCurveTo(cx-rx*0.99,hy-ry*0.06,cx-rx*0.88,hy+ry*0.06);
    g.quadraticCurveTo(cx-rx*0.86,hy-ry*0.14,cx-rx*0.85,hy-ry*0.32);
    g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(cx+rx*0.97,hy-ry*0.34);
    g.quadraticCurveTo(cx+rx*0.99,hy-ry*0.06,cx+rx*0.88,hy+ry*0.06);
    g.quadraticCurveTo(cx+rx*0.86,hy-ry*0.14,cx+rx*0.85,hy-ry*0.32);
    g.closePath(); g.fill();
    return;
  }
  if(p.style==="wanderer"){
    /* 兜帽 */
    var hg=g.createLinearGradient(cx-rx*1.2,hy-ry*1.2,cx+rx*1.2,hy+ry*0.6);
    hg.addColorStop(0,"#33507f"); hg.addColorStop(.7,"#28406e"); hg.addColorStop(1,"#1d2f52");
    g.beginPath();
    g.moveTo(cx-rx*1.12,hy+ry*0.42);
    g.quadraticCurveTo(cx-rx*1.30,hy-ry*0.62,cx,hy-ry*1.18);
    g.quadraticCurveTo(cx+rx*1.30,hy-ry*0.62,cx+rx*1.12,hy+ry*0.42);
    g.quadraticCurveTo(cx+rx*0.95,hy-ry*0.10,cx+rx*0.86,hy-ry*0.26);
    g.quadraticCurveTo(cx,hy-ry*0.52,cx-rx*0.86,hy-ry*0.26);
    g.quadraticCurveTo(cx-rx*0.95,hy-ry*0.10,cx-rx*1.12,hy+ry*0.42);
    g.closePath(); g.fillStyle=hg; g.fill();
    /* 兜帽内阴影 */
    g.fillStyle="rgba(0,0,0,.26)";
    g.beginPath(); g.ellipse(cx,hy-ry*0.34,rx*0.92,ry*0.30,0,0,Math.PI*2); g.fill();
    /* 胡子 */
    g.fillStyle="rgba(96,74,52,.62)";
    g.beginPath();
    g.moveTo(cx-rx*0.42,hy+ry*0.32);
    g.quadraticCurveTo(cx,hy+ry*1.18,cx+rx*0.42,hy+ry*0.32);
    g.lineTo(cx+rx*0.26,hy+ry*0.20);
    g.quadraticCurveTo(cx,hy+ry*0.34,cx-rx*0.26,hy+ry*0.20);
    g.closePath(); g.fill();
    return;
  }
  if(p.hair){
    /* 普通头发 */
    var hgrad=g.createLinearGradient(cx-rx,hy-ry*1.1,cx+rx,hy-ry*0.1);
    hgrad.addColorStop(0,lighten(p.hair,14)); hgrad.addColorStop(.6,p.hair); hgrad.addColorStop(1,darken(p.hair,10));
    g.beginPath();
    g.moveTo(cx-rx*1.0,hy-ry*0.02);
    g.quadraticCurveTo(cx-rx*1.04,hy-ry*1.12,cx,hy-ry*1.10);
    g.quadraticCurveTo(cx+rx*1.04,hy-ry*1.12,cx+rx*1.0,hy-ry*0.02);
    g.lineTo(cx+rx*0.82,hy-ry*0.02);
    g.quadraticCurveTo(cx+rx*0.72,hy-ry*0.46,cx,hy-ry*0.52);
    g.quadraticCurveTo(cx-rx*0.72,hy-ry*0.46,cx-rx*0.82,hy-ry*0.02);
    g.closePath(); g.fillStyle=hgrad; g.fill();
    /* 发丝 */
    g.strokeStyle="rgba(255,255,255,.10)"; g.lineWidth=1.2;
    g.beginPath(); g.moveTo(cx-rx*0.55,hy-ry*0.86); g.quadraticCurveTo(cx-rx*0.30,hy-ry*1.02,cx-rx*0.10,hy-ry*1.04); g.stroke();
    /* 鬓角 */
    g.fillStyle=p.hair;
    rrPath(g,cx-rx*0.98,hy-ry*0.30,rx*0.14,ry*0.36,4); g.fill();
    rrPath(g,cx+rx*0.84,hy-ry*0.30,rx*0.14,ry*0.36,4); g.fill();
  }
}

  /* 红眼 */

  rrPath(g,cx+gw*0.08,ey-3,gw*0.22,gh*0.15,4); g.fill();

/* —— 末影人 —— */

  g.beginPath();
  g.moveTo(cx-sw*0.46,base);
  g.quadraticCurveTo(cx-sw*0.42,ty+(base-ty)*0.28,cx-sw*0.26,ty+(base-ty)*0.04);
  g.quadraticCurveTo(cx,ty-(base-ty)*0.05,cx+sw*0.26,ty+(base-ty)*0.04);
  g.quadraticCurveTo(cx+sw*0.42,ty+(base-ty)*0.28,cx+sw*0.46,base);
  g.closePath(); g.fillStyle=tg; g.fill();
  /* 细长手臂（垂到画外） */

    g.lineTo(ax+W*0.026,H*1.02);
    g.quadraticCurveTo(ax+sgn*W*0.05,ty+H*0.22,ax+W*0.026,ty+H*0.03);
    g.closePath(); g.fillStyle=armG; g.fill();
  });
  /* 头（长椭圆） */
  var hy=H*0.315, rx=W*0.128, ry=W*0.248;

  g.beginPath(); g.moveTo(cx-rx*0.20,hy+ry*0.40); g.lineTo(cx+rx*0.20,hy+ry*0.40); g.stroke();
  /* 轮廓光 */
  g.strokeStyle="rgba(150,120,220,.28)"; g.lineWidth=2;
  g.beginPath(); g.ellipse(cx,hy,rx,ry,0,Math.PI*0.96,Math.PI*1.5); g.stroke();
}


/* ================= 声音 ================= */
var ac=null;
function tone(freq,dur,type,gain){
  try{
    if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(),g=ac.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    g.gain.value=gain===undefined?0.06:gain;
    o.connect(g); g.connect(ac.destination);
    var t0=ac.currentTime;
    g.gain.setValueAtTime(g.gain.value,t0);
    g.gain.exponentialRampToValueAtTime(0.0008,t0+dur/1000);
    o.start(t0); o.stop(t0+dur/1000+0.02);
  }catch(e){}
}
function paper(){ tone(320,60,"triangle",0.02); setTimeout(function(){tone(240,70,"triangle",0.015);},40); }
function stampSnd(ok){
  tone(ok?150:110,140,"sine",0.10);
  setTimeout(function(){ tone(ok?520:180,90,"triangle",0.05); },30);
}

/* ================= 逻辑 ================= */
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function makeVisitor(){
  return {
    job:rnd(JOBS), name:rnd(NAMES), zone:rnd(ZONES),
    date:Math.random()<0.62?"今天":rnd(DATES),
    wear:rnd(WEARS),
    idNo:"NO."+(1000+Math.floor(Math.random()*8999))
  };
}
function refreshHud(){
  document.getElementById("dayTag").textContent=state.day;
  document.getElementById("scoreTag").textContent=state.score;
  document.getElementById("failTag").textContent=state.fail;
  document.getElementById("leftTag").textContent=(VIS_PER_DAY-state.idx);
  document.getElementById("docDay").textContent=state.day;
}
function renderRules(){
  var list=rulesForDay(state.day);
  document.getElementById("lawCode").textContent="§1—§"+list[list.length-1].no;
  var ul=document.getElementById("ruleList"); ul.innerHTML="";
  list.forEach(function(r){
    var li=document.createElement("li");
    li.className=r.day===state.day?"new":"";
    var t=document.createElement("span");
    t.innerHTML="§"+r.no+" "+r.text+(r.day===state.day?'<span class="newTag">NEW</span>':"");
    li.appendChild(t); ul.appendChild(li);
  });
}
function renderVisitor(){
  portrait(vctx,cur.job,visCv.width,visCv.height);
  pctx.save();
  pctx.clearRect(0,0,phCv.width,phCv.height);
  pctx.scale(1.34,1.34);
  pctx.translate(-phCv.width*0.13,-phCv.height*0.20);
  portrait(pctx,cur.job,phCv.width,phCv.height);
  pctx.restore();
  document.getElementById("visName").textContent=cur.name+" · "+cur.job;
  var warnDate=cur.date!=="今天";
  var warnZone=cur.zone!=="橡木村";
  document.getElementById("fields").innerHTML=
    row("姓名",cur.name,false)+
    row("职业",cur.job,false)+
    row("区域",cur.zone,state.day>=3&&warnZone)+
    row("日期",cur.date,warnDate)+
    row("头戴",cur.wear,false);
  document.getElementById("mrz").textContent=
    "MZ<<OAK<<<"+cur.idNo.replace(/\./g,"")+"<<"+cur.date.replace(/[^\u4e00-\u9fa5]/g,"")+"<<1";
  document.getElementById("card").className="doc";
  clearSeal();
}
function row(k,v,warn){
  return '<div class="row"><i>'+k+'</i><b class="'+(warn?"warn":"")+'">'+v+'</b></div>';
}
function showSeal(ok){
  var s=document.getElementById("seal");
  s.className="seal "+(ok?"ok":"no")+" show";
  s.textContent=ok?"准 许":"拒 绝";
}
function clearSeal(){
  var s=document.getElementById("seal");
  s.className="seal"; s.textContent="";
}
function toast(text,bad){
  var t=document.getElementById("toast");
  t.textContent=text; t.className="toast on"+(bad?" bad":"");
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){t.className="toast"+(bad?" bad":"");},1100);
}
function nextVisitor(){
  if(state.idx>=VIS_PER_DAY){ endDay(); return; }
  state.idx++;
  cur=makeVisitor();
  state.locked=false;
  refreshHud(); renderRules(); renderVisitor();
  document.getElementById("passBtn").disabled=false;
  document.getElementById("denyBtn").disabled=false;
  paper();
}
function judge(allow){
  if(state.locked||!cur) return;
  state.locked=true;
  document.getElementById("passBtn").disabled=true;
  document.getElementById("denyBtn").disabled=true;
  var should=allowVisitor(cur,state.day);
  var right=(allow===should);
  showSeal(allow);
  if(right){
    state.score+=100; stampSnd(true);
    toast("核对无误 · +100",false);
  }else{
    state.fail++; stampSnd(false);
    document.getElementById("card").className="doc bad";
    toast(should?"错了 · 他的证件是合格的":"错了 · 他证件不合格",true);
  }
  refreshHud();
  setTimeout(function(){
    if(state.fail>=MAX_FAIL){ gameOver(); return; }
    nextVisitor();
  },1150);
}
function endDay(){
  state.locked=true;
  if(state.day>=DAYS){ win(); return; }
  var ov=document.getElementById("ov");
  document.getElementById("ovCard").innerHTML=
    '<h2>第 '+state.day+' 天结束</h2><div class="sub">END OF DAY '+state.day+'</div>'+
    '<div class="big">'+state.score+'</div>'+
    '<p>今日累计得分，失误 '+state.fail+' / 3</p>'+
    '<p>明天守则会增补条款，先读再放人。</p>'+
    '<button class="ovbtn" id="nextDay">开始第 '+(state.day+1)+' 天</button>';
  ov.classList.add("on");
  paper();
  document.getElementById("nextDay").onclick=function(){
    ov.classList.remove("on");
    state.day++; state.idx=0;
    refreshHud(); renderRules(); nextVisitor();
  };
}
function saveBest(){
  if(state.score>best){ best=state.score; try{localStorage.setItem("mc_id_best",String(best));}catch(e){} }
}
function win(){
  saveBest();
  tone(520,120,"sine",0.06); setTimeout(function(){tone(760,220,"sine",0.06);},200);
  var ov=document.getElementById("ov");
  document.getElementById("ovCard").innerHTML=
    '<h2>你守住了城关</h2><div class="sub">THREE DAYS · CLEARED</div>'+
    '<div class="big">'+state.score+'</div>'+
    '<p>三天全部通过 · 最高纪录 '+best+'</p>'+
    '<button class="ovbtn" id="again">再来一局</button>';
  ov.classList.add("on");
  document.getElementById("again").onclick=function(){ov.classList.remove("on"); newGame();};
}
function gameOver(){
  saveBest();
  tone(140,420,"sawtooth",0.07);
  var ov=document.getElementById("ov");
  document.getElementById("ovCard").innerHTML=
    '<h2>你被撤职了</h2><div class="sub">RELEVED OF DUTY</div>'+
    '<div class="big">'+state.score+'</div>'+
    '<p>失误累计 3 次 · 最高纪录 '+best+'</p>'+
    '<button class="ovbtn red" id="restart">重新上岗</button>';
  ov.classList.add("on");
  document.getElementById("restart").onclick=function(){ov.classList.remove("on"); newGame();};
}
function newGame(){
  state={day:1,idx:0,score:0,fail:0,locked:false};
  refreshHud(); renderRules(); nextVisitor();
}

portrait(gctx,"Steve",gdCv.width,gdCv.height);
document.getElementById("passBtn").onclick=function(){judge(true);};
document.getElementById("denyBtn").onclick=function(){judge(false);};
document.addEventListener("keydown",function(e){
  if(e.key==="a"||e.key==="A"||e.key==="ArrowLeft") judge(true);
  if(e.key==="d"||e.key==="D"||e.key==="ArrowRight") judge(false);
});
newGame();
</script>
</body>
