<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='4' y='4' width='7' height='7' rx='1.5' fill='%233ddc84'/%3E%3Crect x='13' y='4' width='7' height='7' rx='1.5' fill='%232bd4c0'/%3E%3Crect x='4' y='13' width='7' height='7' rx='1.5' fill='%232bd4c0'/%3E%3Crect x='13' y='13' width='7' height='7' rx='1.5' fill='%23a78bfa'/%3E%3C/svg%3E">
<style>
  :root{--bg:#070b0a;--panel:#0d1412;--line:#1c2a24;--green:#3ddc84;--teal:#2bd4c0;--text:#d7f5e4;--muted:#7f9a8d;--amber:#ffc75f}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .top{width:100%;max-width:400px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .top h1{font-size:26px;letter-spacing:1px;background:linear-gradient(90deg,var(--green),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
  .scores{display:flex;gap:10px}
  .score-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;text-align:center}
  .score-box .k{font-size:10px;color:var(--muted)}
  .score-box .v{font-size:16px;font-weight:700;color:var(--green)}
  .board{position:relative;width:100%;max-width:400px;aspect-ratio:1;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px;height:100%}
  .cell{background:rgba(255,255,255,.04);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,8vw,40px);font-weight:800}
  .cell.t0{background:rgba(255,255,255,.03)}
  .t2{background:#1b2a22 !important;color:#c8f5da}.t4{background:#234333 !important;color:#c8f5da}
  .t8{background:#2d6a3c !important}.t16{background:#248a4f !important}.t32{background:#1aa86a !important;color:#06231a}
  .t64{background:#0fcf8a !important;color:#06231a}.t128{background:#2bd4c0 !important;color:#06231a}
  .t256{background:#2f9fdd !important;color:#06231a}.t512{background:#6a7ff0 !important}.t1024{background:#a78bfa !important}
  .t2048{background:#ffc75f !important;color:#3a2800}
  .msg{position:absolute;inset:0;background:rgba(5,9,8,.78);border-radius:16px;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:5}
  .msg.show{display:flex}
  .msg h2{font-size:30px}.msg .win{color:var(--green)}.msg .over{color:var(--amber)}
  .msg button{height:46px;padding:0 26px;border:none;border-radius:10px;background:var(--green);color:#06231a;font-size:15px;font-weight:700;cursor:pointer}
  .hint{color:var(--muted);font-size:12px;margin-top:14px}
  .hint b{color:var(--teal)}
</style>
</head>
<body>
  <div class="top">
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box"><div class="k">分数</div><div class="v" id="score">0</div></div>
      <div class="score-box"><div class="k">最佳</div><div class="v" id="best">0</div></div>
    </div>
  </div>
  <div class="board">
    <div class="grid" id="grid"></div>
    <div class="msg" id="msg"><h2 class="win" id="msgTitle">你赢了！</h2><button id="again">再来一局</button></div>
  </div>
  <div class="hint">方向键 / WASD 移动 · 手机上下左右滑动</div>

<script>
(function(){
var cells=[]; // 一维 16
var score=0;
var user = (location.search.match(/user=([^&]*)/)||[])[1] ? decodeURIComponent(location.search.match(/user=([^&]*)/)[1]) : (localStorage.getItem("gstation_session")||"guest");
var HS_KEY = "g2048_hs_"+user;
var best = parseInt(localStorage.getItem(HS_KEY)||"0",10);
var WON=false, gridEl=document.getElementById("grid");
function newCell(){ var d=document.createElement("div"); d.className="cell"; gridEl.appendChild(d); return d; }
for(var i=0;i<16;i++){ var c=newCell(); cells.push({el:c,val:0}); }
function render(){
  for(var i=0;i<16;i++){
    var c=cells[i];
    c.el.textContent = c.val?c.val:"";
    c.el.className="cell"+(c.val?(" t"+c.val):" t0");
  }
  document.getElementById("score").textContent=score;
  document.getElementById("best").textContent=Math.max(best,score);
}
function emptyIdx(){ var a=[]; for(var i=0;i<16;i++) if(!cells[i].val) a.push(i); return a; }
function addTile(){
  var e=emptyIdx(); if(!e.length) return;
  var idx=e[Math.floor(Math.random()*e.length)];
  cells[idx].val = Math.random()<0.9?2:4;
}
function move(dir){
  // dir: 0左 1上 2右 3下
  var moved=false, gained=0;
  var order = [0,1,2,3];
  // 按行/列处理
  for(var line=0;line<4;line++){
    // 取一行/一列的值，按移动方向重排
    var vals=[];
    for(var i=0;i<4;i++){
      var idx = (dir===0||dir===2)? line*4+i : (dir===1||dir===3)? i*4+line : 0;
      vals.push(cells[idx].val);
    }
    if(dir===2||dir===3) vals.reverse(); // 右/下
    // 压缩+合并
    var out=[], merged=[];
    for(var v=0;v<4;v++){
      if(!vals[v]) continue;
      if(out.length && out[out.length-1]===vals[v] && !merged[merged.length-1]){
        out[out.length-1]=vals[v]*2; merged[merged.length-1]=1; gained+=vals[v]*2;
      } else out.push(vals[v]), merged.push(0);
    }
    while(out.length<4) out.push(0), merged.push(0);
    if(dir===2||dir===3) out.reverse(), merged.reverse();
    for(var j=0;j<4;j++){
      var pos=(dir===0||dir===2)? line*4+j : j*4+line;
      if(cells[pos].val!==out[j]) moved=true;
      cells[pos].val=out[j];
    }
  }
  score+=gained;
  if(gained){ if(score>best){best=score; localStorage.setItem(HS_KEY,String(score));} }
  if(moved){
    addTile(); render();
    if(checkWin()){ showMsg("你赢了！",true); }
    else if(!movesLeft()){ showMsg("游戏结束",false); }
  }
}
function checkWin(){ for(var i=0;i<16;i++) if(cells[i].val===2048) return true; return false; }
function movesLeft(){
  for(var i=0;i<16;i++){
    if(!cells[i].val) return true;
    var r=Math.floor(i/4), c=i%4;
    if(c<3 && cells[i].val===cells[i+1].val) return true;
    if(r<3 && cells[i].val===cells[i+4].val) return true;
  }
  return false;
}
function showMsg(t,won){
  document.getElementById("msgTitle").textContent=t;
  document.getElementById("msgTitle").className=won?"win":"over";
  document.getElementById("msg").classList.add("show");
}
function reset(){ WON=false; score=0; for(var i=0;i<16;i++)cells[i].val=0; addTile(); addTile(); document.getElementById("msg").classList.remove("show"); render(); }

document.addEventListener("keydown",function(e){
  var m={ArrowLeft:0,ArrowUp:1,ArrowRight:2,ArrowDown:3,a:0,w:1,d:2,s:3};
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k in m){ e.preventDefault(); move(m[k]); }
});
// 触屏滑动
var sx=0,sy=0,on=false;
var b=document.querySelector(".board");
b.addEventListener("touchstart",function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; on=true; },{passive:true});
b.addEventListener("touchmove",function(e){ e.preventDefault(); },{passive:false});
b.addEventListener("touchend",function(e){
  if(!on) return; on=false;
  var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)<24 && Math.abs(dy)<24) return;
  if(Math.abs(dx)>Math.abs(dy)) move(dx>0?2:0); else move(dy>0?3:1);
});
document.getElementById("again").addEventListener("click",reset);

addTile(); addTile(); render();
})();
</script>
</body>
</html>
