<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='32' height='32' rx='7' fill='%230d1412'/%3E%3Crect x='7' y='8' width='18' height='7' rx='2' fill='%233ddc84'/%3E%3Crect x='7' y='17' width='8' height='8' rx='2' fill='%232bd4c0'/%3E%3Crect x='17' y='17' width='8' height='8' rx='2' fill='%23e8c06a'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#070b0a; --panel:#0d1412; --panel2:#111a17; --line:#1c2a24;
    --green:#3ddc84; --teal:#2bd4c0; --text:#d7f5e4; --muted:#7f9a8d;
    --danger:#ff5d6c; --amber:#ffc75f; --gold:#ffd76a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    overflow:hidden;
  }
  .bg-grid{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(61,220,132,.10), transparent 60%),
      radial-gradient(700px 420px at 10% 110%, rgba(43,212,192,.08), transparent 60%),
      var(--bg);
  }
  .bg-grid::before{
    content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(61,220,132,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(61,220,132,.05) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(circle at 50% 40%, #000 30%, transparent 80%);
  }
  .app{position:relative; z-index:1; height:100vh; display:flex; flex-direction:column}

  /* ============ 登录遮罩 ============ */
  .login-mask{
    position:fixed; inset:0; z-index:50;
    background:rgba(5,9,8,.92); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-box{
    width:100%; max-width:360px; background:var(--panel);
    border:1px solid var(--line); border-radius:16px; padding:28px 26px;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
  }
  .login-box .logo{display:flex; align-items:center; gap:10px; margin-bottom:4px}
  .login-box .logo svg{width:34px;height:34px}
  .login-box h1{font-size:22px; letter-spacing:.5px}
  .login-box .sub{color:var(--muted); font-size:13px; margin-bottom:20px}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px}
  .field input{
    width:100%; height:44px; padding:0 14px; font-size:16px; color:var(--text);
    background:var(--panel2); border:1px solid var(--line); border-radius:10px; outline:none;
  }
  .field input:focus{border-color:var(--green); box-shadow:0 0 0 3px rgba(61,220,132,.15)}
  .btn-link{
    width:100%; height:36px; margin-top:12px; background:transparent; border:none;
    cursor:pointer; color:var(--muted); font-size:13px; font-family:inherit;
  }
  .btn-link:hover{color:var(--green)}
  .btn{
    width:100%; height:44px; border:none; border-radius:10px; cursor:pointer; font-size:15px; font-weight:600;
  }
  .btn-primary{background:var(--green); color:#06231a}
  .btn-primary:hover{background:#4cf094}
  .login-err{color:var(--danger); font-size:13px; min-height:18px; margin-top:10px}

  /* ============ 顶部栏 ============ */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    padding:12px 22px; border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px; font-size:18px; font-weight:700; letter-spacing:.5px}
  .brand svg{width:26px;height:26px}
  .brand span{background:linear-gradient(90deg,var(--green),var(--teal)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .userbox{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .who{font-size:14px; color:var(--text)}
  .who b{color:var(--green)}
  .coin-chip{
    display:inline-flex; align-items:center; gap:5px; font-size:13px;
    background:var(--panel2); border:1px solid var(--line); border-radius:20px; padding:5px 11px;
  }
  .coin-chip .ic{font-size:13px}
  .coin-chip.gold{color:var(--gold)}
  .coin-chip.teal{color:var(--teal)}
  .title-badge{
    display:inline-flex; align-items:center; font-size:12px; font-weight:700;
    border:1px solid currentColor; border-radius:20px; padding:3px 10px;
  }
  .btn-mini{
    height:34px; padding:0 14px; font-size:13px; border-radius:8px; cursor:pointer;
    background:transparent; border:1px solid var(--line); color:var(--muted); font-family:inherit;
  }
  .btn-mini:hover{border-color:var(--green); color:var(--green)}
  .btn-mini.danger:hover{border-color:var(--danger); color:var(--danger)}
  .btn-mini:disabled{opacity:.4; cursor:not-allowed}

  /* ============ 主体 ============ */
  .main{flex:1; overflow-y:auto; padding:26px 22px 40px}
  .main::-webkit-scrollbar{width:10px}
  .main::-webkit-scrollbar-thumb{background:#1c2a24; border-radius:5px}
  .section-title{font-size:15px; color:var(--muted); margin-bottom:14px; display:flex; align-items:center; gap:8px}
  .section-title::before{content:""; width:3px; height:14px; background:var(--green); border-radius:2px}
  .games{display:grid; grid-template-columns:repeat(1,1fr); gap:16px}
  @media(min-width:500px){.games{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:820px){.games{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:1200px){.games{grid-template-columns:repeat(4,1fr)}}
  .game-card{
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    display:flex; flex-direction:column;
  }
  .game-card:hover{transform:translateY(-4px); border-color:var(--green); box-shadow:0 14px 34px rgba(0,0,0,.45)}
  .game-thumb{
    height:120px; display:flex; align-items:center; justify-content:center; position:relative;
    background:
      radial-gradient(220px 120px at 30% 20%, rgba(61,220,132,.22), transparent 70%),
      radial-gradient(220px 120px at 80% 90%, rgba(43,212,192,.18), transparent 70%),
      #0a120e;
  }
  .game-thumb .play{
    position:absolute; width:46px;height:46px; border-radius:50%;
    background:rgba(61,220,132,.9); display:flex;align-items:center;justify-content:center;
    color:#06231a; opacity:0; transform:scale(.7); transition:.18s;
  }
  .game-card:hover .play{opacity:1; transform:scale(1)}
  .game-thumb svg.badge{width:52px;height:52px; opacity:.9}
  .game-info{padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1}
  .game-title{font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px}
  .tag{font-size:11px; padding:2px 8px; border-radius:20px; background:rgba(255,199,95,.12); color:var(--amber); border:1px solid rgba(255,199,95,.25)}
  .game-desc{font-size:13px; color:var(--muted); line-height:1.6; flex:1}
  .empty{color:var(--muted); text-align:center; padding:60px 0; font-size:14px}
  footer{padding:12px 22px; border-top:1px solid var(--line); color:#4c6157; font-size:12px; text-align:center}

  /* ============ 弹窗 ============ */
  .modal{position:fixed; inset:0; z-index:45; background:rgba(4,8,6,.72); display:flex; align-items:center; justify-content:center; padding:14px}
  .modal.hidden{display:none}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; max-width:560px; width:100%; max-height:90vh; overflow:auto}
  .panel h2{font-size:16px; letter-spacing:.08em; color:var(--green); margin-bottom:12px}
  .panel-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
  .panel-head h2{margin-bottom:0}
  .x-btn{background:transparent; border:none; color:var(--muted); font-size:20px; cursor:pointer; font-family:inherit}
  .x-btn:hover{color:var(--text)}
  .shop-bal{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px}
  .ex-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:14px}
  .ex-row .spacer{flex:1}
  .ex-btn{height:38px; padding:0 14px; border-radius:9px; border:1px solid var(--line); background:var(--panel2); color:var(--text); cursor:pointer; font-size:13px; font-family:inherit}
  .ex-btn:hover{border-color:var(--teal); color:var(--teal)}
  .ex-btn:disabled{opacity:.4; cursor:not-allowed}
  .prod-list{display:flex; flex-direction:column; gap:10px}
  .prod{display:flex; align-items:center; gap:12px; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px}
  .prod .p-ic{width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; flex:none}
  .prod .p-info{flex:1; min-width:0}
  .prod .p-name{font-size:14px; font-weight:700}
  .prod .p-desc{font-size:12px; color:var(--muted); line-height:1.5; margin-top:2px}
  .prod .p-cost{font-size:13px; color:var(--teal); white-space:nowrap}
  .prod .p-btn{height:36px; padding:0 14px; border-radius:9px; border:none; background:var(--green); color:#06231a; font-weight:700; cursor:pointer; font-size:13px; font-family:inherit; white-space:nowrap}
  .prod .p-btn:disabled{background:#223028; color:var(--muted); cursor:not-allowed}
  .prod .p-owned{font-size:12px; color:var(--muted); white-space:nowrap}
  .pet-box{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
  .pet-avatar{
    width:84px; height:84px; flex:none; border-radius:22px;
    background:linear-gradient(160deg,rgba(61,220,132,.18),rgba(43,212,192,.14));
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
  }
  .pet-avatar svg{width:58px;height:58px}
  .pet-meta{flex:1; min-width:180px}
  .pet-name{font-size:18px; font-weight:700}
  .pet-sub{font-size:12px; color:var(--muted); margin-top:3px}
  .pet-lv{color:var(--green); font-weight:700}
  .exp-row{margin:14px 0 6px}
  .exp-label{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:6px}
  .exp-bar{height:10px; border-radius:6px; background:var(--panel2); border:1px solid var(--line); overflow:hidden}
  .exp-fill{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--green),var(--teal)); transition:width .25s ease}
  .pet-bonus{font-size:13px; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px; margin:12px 0}
  .pet-bonus b{color:var(--teal)}
  .feed-row{display:flex; gap:10px; flex-wrap:wrap}
  .feed-btn{height:40px; padding:0 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); color:var(--text); cursor:pointer; font-size:13px; font-family:inherit}
  .feed-btn:hover{border-color:var(--green); color:var(--green)}
  .feed-btn:disabled{opacity:.4; cursor:not-allowed}
  .title-row{display:flex; align-items:center; gap:12px; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px}
  .title-row .t-name{font-size:14px; font-weight:700}
  .title-row .t-desc{font-size:12px; color:var(--muted); margin-top:2px}
  .title-row .t-info{flex:1}
  .t-btn{height:36px; padding:0 14px; border-radius:9px; border:1px solid var(--line); background:transparent; color:var(--text); cursor:pointer; font-size:13px; font-family:inherit}
  .t-btn.active{background:var(--green); color:#06231a; border-color:var(--green)}
  .t-btn:disabled{opacity:.4; cursor:not-allowed}
  .toast{position:fixed; top:64px; left:50%; transform:translateX(-50%); z-index:60; background:rgba(10,16,13,.92); border:1px solid var(--line); border-radius:10px; padding:10px 16px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none}
  .toast.show{opacity:1}
  @media (max-width:520px){
    .topbar{padding:10px 14px}
    .main{padding:18px 14px 30px}
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="app">
  <!-- 顶部栏 -->
  <header class="topbar" id="topbar" style="display:none">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 6h10a4 4 0 0 1 4 4v5a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4v-5a4 4 0 0 1 4-4z"/><circle cx="9" cy="12.5" r="1.5" fill="#070b0a"/><circle cx="15" cy="12.5" r="1.5" fill="#070b0a"/><rect x="8.3" y="8" width="1.5" height="2" rx=".75" fill="#070b0a"/><rect x="14.2" y="8" width="1.5" height="2" rx=".75" fill="#070b0a"/></svg>
      <span>游戏站</span>
    </div>
    <div class="userbox">
      <span class="coin-chip gold"><span class="ic">🪙</span><span id="coinVal">0</span> gay币</span>
      <span class="coin-chip teal"><span class="ic">💎</span><span id="pointVal">0</span> gay值</span>
      <span class="title-badge" id="titleBadge"></span>
      <div class="who">已登录：<b id="who"></b></div>
      <button class="btn-mini" id="checkinBtn">签到</button>
      <button class="btn-mini" id="titleBtn">称号</button>
      <button class="btn-mini" id="petBtn">宠物</button>
      <button class="btn-mini" id="shopBtn">商城</button>
      <button class="btn-mini danger" id="logoutBtn">退出</button>
    </div>
  </header>

  <!-- 主体 -->
  <main class="main" id="main" style="display:none">
    <div class="section-title">游戏库</div>
    <div class="games" id="games"></div>
  </main>

  <footer>本地游戏站 · 进度与币值保存在本机浏览器</footer>
</div>

<!-- 称号弹窗 -->
<div class="modal hidden" id="titleModal">
  <div class="panel">
    <div class="panel-head"><h2>我的称号</h2><button class="x-btn" data-close="titleModal">×</button></div>
    <div id="titleList"></div>
  </div>
</div>

<!-- 宠物弹窗 -->
<div class="modal hidden" id="petModal">
  <div class="panel">
    <div class="panel-head"><h2>我的宠物</h2><button class="x-btn" data-close="petModal">×</button></div>
    <div class="pet-box">
      <div class="pet-avatar">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="18" cy="18" r="7" fill="#3ddc84"/>
          <circle cx="46" cy="18" r="7" fill="#3ddc84"/>
          <circle cx="32" cy="36" r="20" fill="#3ddc84"/>
          <circle cx="25" cy="34" r="2.6" fill="#06231a"/>
          <circle cx="39" cy="34" r="2.6" fill="#06231a"/>
          <path d="M28 41q4 3 8 0" stroke="#06231a" stroke-width="2" fill="none" stroke-linecap="round"/>
          <circle cx="21" cy="39" r="2.4" fill="#7ce8b0" opacity=".7"/>
          <circle cx="43" cy="39" r="2.4" fill="#7ce8b0" opacity=".7"/>
        </svg>
      </div>
      <div class="pet-meta">
        <div class="pet-name" id="petName">徐杨洋</div>
        <div class="pet-sub">全站共同的小宠物 · gay 的程度 <span class="pet-lv" id="petLv"></span></div>
      </div>
    </div>
    <div class="exp-row">
      <div class="exp-label"><span>成长值</span><span id="expText"></span></div>
      <div class="exp-bar"><div class="exp-fill" id="expFill"></div></div>
    </div>
    <div class="pet-bonus" id="petBonus"></div>
    <div class="feed-row">
      <button class="feed-btn" id="feedCoin">投喂 10 gay币（+12 经验）</button>
      <button class="feed-btn" id="feedPoint">投喂 1 gay值（+30 经验）</button>
    </div>
  </div>
</div>

<!-- 商城弹窗 -->
<div class="modal hidden" id="shopModal">
  <div class="panel">
    <div class="panel-head"><h2>兑换商城</h2><button class="x-btn" data-close="shopModal">×</button></div>
    <div class="shop-bal">
      <span class="coin-chip gold">🪙 <span id="shopCoins">0</span> gay币</span>
      <span class="coin-chip teal">💎 <span id="shopPoints">0</span> gay值</span>
    </div>
    <div class="ex-row">
      <span style="font-size:13px;color:var(--muted)">gay币 10 枚 = 1 gay值</span>
      <span class="spacer"></span>
      <button class="ex-btn" id="ex1">换 1 值（10币）</button>
      <button class="ex-btn" id="ex5">换 5 值（50币）</button>
    </div>
    <div class="prod-list" id="prodList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 登录遮罩 -->
<div class="login-mask" id="loginMask">
  <div class="login-box">
    <div class="logo">
      <svg viewBox="0 0 24 24" style="color:var(--green)"><path fill="currentColor" d="M7 6h10a4 4 0 0 1 4 4v5a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4v-5a4 4 0 0 1 4-4z"/><circle cx="9" cy="12.5" r="1.5" fill="#06231a"/><circle cx="15" cy="12.5" r="1.5" fill="#06231a"/><rect x="8.3" y="8" width="1.5" height="2" rx=".75" fill="#06231a"/><rect x="14.2" y="8" width="1.5" height="2" rx=".75" fill="#06231a"/></svg>
      <h1>游戏站</h1>
    </div>
    <div class="field"><label>账号</label><input id="inUser" autocomplete="off" autofocus></div>
    <div class="field"><label>密码</label><input id="inPass" type="password"></div>
    <div class="field" id="inviteField" style="display:none"><label>邀请码</label><input id="inInvite" autocomplete="off"></div>
    <button class="btn btn-primary" id="mainBtn">登录</button>
    <div class="login-err" id="loginErr"></div>
    <button class="btn-link" id="switchBtn">注册</button>
  </div>
</div>

var ACCOUNTS = {

var DEFAULT_GAMES = [

  { id:"earth-three-body", title:"ETO · 地球三体运动", desc:"三体主题策略游戏：三种信念、三条行动路线，在联合调查完成前推进你的派系目标。", file:"games/earth-three-body/index.html", tag:"策略" },
  { id:"ip-please", title:"请出示你的 IP", desc:"Papers, Please 画风的像素剧情检查站：六天剧情、两个结局，拖拽证件审查旅客，揪出伪装者，每天自动存档，支持中英文。", file:"games/ip-please/index.html", tag:"剧情" },
  { id:"night-survivors", title:"暗夜幸存者", desc:"顶视角生存射击：只有一条命，敌人从四面涌来，每升一级从三个随机升级里挑一个，生存时间、击杀数和等级本地保存。", file:"games/night-survivors/index.html", tag:"幸存者" },
  { id:"paper-hero", title:"纸片勇者", desc:"手绘纸片风横版闯关：8 个关卡、两场 BOSS、限时挑战与双人竞速，角色全是手绘剪贴画，音乐音效由 WebAudio 实时合成。", file:"games/paper-hero/index.html", tag:"闯关" },

var SESSION_KEY = "gstation_session";
var PROFILE_KEY = "gstation_profiles";
var PENDING_KEY = "gstation_pending_session";
var user = localStorage.getItem(SESSION_KEY) || "";

// ===== GitHub 仓库配置 =====
var GH = {
  owner: "thy2014",
  repo:  "-.-.gay",
  api:   "https://api.github.com"
};

var $ = function(id){ return document.getElementById(id); };

var USERS_KEY = "gstation_users";
var INVITE_CODE = "#include <bits/stdc++.h>";
var mode = "login";

/* ============ 账号档案（币值 / 称号 / 商城）============ */
var TITLES = {
  newbie: {name:"新手玩家", color:"#3ddc84", desc:"登录即可领取的默认称号"},
  cool:   {name:"我最帅",   color:"#ffd76a", gold:true, only:"thy2014", desc:"专属金色称号"},

};

  {id:"double", kind:"perk",  name:"双倍收益卡", cost:12, tint:"#ffc75f", icon:"⚡", desc:"24 小时内游戏时长获得的 gay币翻倍"},
  {id:"nitro",  kind:"perk",  name:"卡丁车氮气", cost:15, tint:"#2bd4c0", icon:"🔥", desc:"卡丁车开局自带满氮气"},
  {id:"racer-title", kind:"title", name:"称号·极速车手", cost:20, tint:"#3ddc84", icon:"🏁", desc:"解锁称号「极速车手」"},
  {id:"skin-rainbow", kind:"perk", name:"彩虹涂装", cost:25, tint:"#e88bd0", icon:"🎨", desc:"卡丁车专属彩虹车身"},
  {id:"hidden", kind:"game",  name:"隐藏小游戏礼包", cost:30, tint:"#8a9adf", icon:"🎁", desc:"兑换后解锁一个隐藏玩法（占位）"}
];

function defaultProfile(){
  return { coins:0, points:0, titles:["newbie"], activeTitle:"newbie",
           lastCheckin:"", redeemed:[], perks:{}, playMin:0,
           pet:{ level:1, exp:0 } };
}
var PET_NAME = "徐杨洋";
var PET_MAX_LEVEL = 20;
var PET_FEED_COINS = 10;   // 每次投喂消耗 gay币
var PET_FEED_EXP_COIN = 12; // 币投喂经验
var PET_FEED_POINTS = 1;   // 每次投喂消耗 gay值
var PET_FEED_EXP_POINT = 30; // 值投喂经验
function petNeed(level){ return 60 * level; }
function petBonus(level){
  var lv = Math.max(1, level);
  return {
    speed: Math.round((lv - 1) * 1.5),   // 极速 +%
    accel: Math.round((lv - 1) * 1.2),   // 加速 +%
    nitro: Math.min(100, 50 + 6 * (lv - 1)) // 开局氮气
  };
}
function loadProfiles(){
  try { return JSON.parse(localStorage.getItem(PROFILE_KEY) || "{}"); }
  catch(e){ return {}; }
}
function saveProfiles(o){ localStorage.setItem(PROFILE_KEY, JSON.stringify(o)); }
function getProfile(u){
  var all = loadProfiles();
  if(!all[u]){ all[u]=defaultProfile(); saveProfiles(all); }
  if(!Array.isArray(all[u].titles)) all[u].titles=["newbie"];
  if(!all[u].perks) all[u].perks={};
  if(!all[u].redeemed) all[u].redeemed=[];
  if(!all[u].pet || typeof all[u].pet.level!=="number") all[u].pet={level:1,exp:0};
  return all[u];
}
function saveProfile(u, prof){ var all=loadProfiles(); all[u]=prof; saveProfiles(all); }
function bumpProfile(u, fn){ var all=loadProfiles(); if(!all[u])all[u]=defaultProfile(); fn(all[u]); saveProfiles(all); }

function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

function grantSpecialTitles(u, prof){
  if(u==="thy2014"){
    if(prof.titles.indexOf("cool")<0) prof.titles.push("cool");
    if(prof.activeTitle==="newbie") prof.activeTitle="cool";
  }
}

function toast(msg){
  var t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("show");},1600);
}

function loadUsers(){
  try { return JSON.parse(localStorage.getItem(USERS_KEY) || "{}"); }
  catch(e){ return {}; }
}
function saveUsers(o){ localStorage.setItem(USERS_KEY, JSON.stringify(o)); }

function switchMode(m){
  mode = m;
  if(m === "register"){
    $("inviteField").style.display = "block";
    $("mainBtn").textContent = "注册";
    $("switchBtn").textContent = "登录";
  } else {
    $("inviteField").style.display = "none";
    $("mainBtn").textContent = "登录";
    $("switchBtn").textContent = "注册";
  }
  $("loginErr").textContent = "";
}

function mainAction(){
  var u = $("inUser").value.trim();
  var p = $("inPass").value;
  $("loginErr").textContent = "";
  if(!u || !p){ $("loginErr").textContent = "请输入账号和密码"; return; }
  if(mode === "login") doLogin(u, p);
  else doRegister(u, p);
}

function doLogin(u, p){
  var users = loadUsers();
  var exists = (u in ACCOUNTS) || (u in users);
  if(!exists){ $("loginErr").textContent = "账号不存在"; return; }
  var realPw = (u in ACCOUNTS) ? ACCOUNTS[u] : users[u];
  if(realPw !== p){ $("loginErr").textContent = "密码错误"; return; }
  user = u;
  localStorage.setItem(SESSION_KEY, u);
  var prof=getProfile(u);
  grantSpecialTitles(u, prof);
  saveProfile(u, prof);
  settlePendingSession();
  enterSite();
}

function doRegister(u, p){
  var inv = $("inInvite").value.trim();
  if(inv !== INVITE_CODE){ $("loginErr").textContent = "邀请码错误"; return; }
  var users = loadUsers();
  if((u in ACCOUNTS) || (u in users)){ $("loginErr").textContent = "账号已存在"; return; }
  users[u] = p;
  saveUsers(users);
  // 注册奖励：50 gay币
  bumpProfile(u, function(prof){ prof.coins += 50; });
  user = u;
  localStorage.setItem(SESSION_KEY, u);
  var prof=getProfile(u);
  grantSpecialTitles(u, prof);
  saveProfile(u, prof);
  enterSite();
  toast("注册成功，赠送 50 gay币");
}

$("mainBtn").addEventListener("click", mainAction);
$("switchBtn").addEventListener("click", function(){
  switchMode(mode === "login" ? "register" : "login");
});
$("inUser").addEventListener("keydown", function(e){ if(e.key==="Enter") $("inPass").focus(); });
$("inPass").addEventListener("keydown", function(e){
  if(e.key !== "Enter") return;
  if(mode === "register") $("inInvite").focus();
  else mainAction();
});
$("inInvite").addEventListener("keydown", function(e){ if(e.key==="Enter") mainAction(); });

$("logoutBtn").addEventListener("click", function(){
  localStorage.removeItem(SESSION_KEY);
  user = "";

  $("loginMask").style.display = "flex";
  $("topbar").style.display = "none";
  $("main").style.display = "none";

});

function enterSite(){
  $("loginMask").style.display = "none";

  $("main").style.display = "block";
  $("who").textContent = user;
  refreshProfileUI();
  loadGames();

/* ============ 时长计币：开局记录，回站结算 ============ */
function settlePendingSession(){
  var s=null;
  try{ s=JSON.parse(localStorage.getItem(PENDING_KEY)||"null"); }catch(e){}
  if(!s || !s.start) return;
  var mins=Math.max(0,(Date.now()-s.start)/60000);
  var prof=getProfile(user);
  var coins=Math.min(30, Math.floor(mins));
  if(prof.perks.doubleUntil && Date.now() < prof.perks.doubleUntil) coins*=2;
  if(coins>0){ prof.coins+=coins; prof.playMin+=Math.floor(mins); saveProfile(user, prof); }
  localStorage.removeItem(PENDING_KEY);
}
function startSession(g){
  localStorage.setItem(PENDING_KEY, JSON.stringify({id:g.id, start:Date.now()}));
}

/* ============ 档案 UI ============ */
function refreshProfileUI(){
  var prof=getProfile(user);
  $("coinVal").textContent=prof.coins;
  $("pointVal").textContent=prof.points;
  var t=TITLES[prof.activeTitle]||TITLES.newbie;
  var badge=$("titleBadge");
  badge.textContent=t.name; badge.style.color=t.color;
  // 签到状态
  var done=prof.lastCheckin===todayStr();
  var btn=$("checkinBtn");
  btn.disabled=done;
  btn.textContent=done?"已签到":"签到";
}

function doCheckin(){
  var prof=getProfile(user);
  if(prof.lastCheckin===todayStr()){ toast("今天已经签到过了"); return; }
  prof.lastCheckin=todayStr();
  prof.coins+=10;
  saveProfile(user, prof);
  refreshProfileUI();
  toast("签到成功 +10 gay币");
}
$("checkinBtn").addEventListener("click", doCheckin);

/* ============ 称号弹窗 ============ */
function renderTitles(){
  var prof=getProfile(user);
  var box=$("titleList"); box.innerHTML="";
  Object.keys(TITLES).forEach(function(id){
    var t=TITLES[id];
    var owned=prof.titles.indexOf(id)>=0;

      prof.activeTitle=id; saveProfile(user, prof); refreshProfileUI(); renderTitles();
    }); }
    else { btn.textContent="未拥有"; btn.disabled=true; }

    box.appendChild(row);
  });
}
$("titleBtn").addEventListener("click", function(){ renderTitles(); $("titleModal").classList.remove("hidden"); });

/* ============ 商城弹窗 ============ */
function renderShop(){
  var prof=getProfile(user);
  $("shopCoins").textContent=prof.coins;
  $("shopPoints").textContent=prof.points;
  var list=$("prodList"); list.innerHTML="";
  SHOP.forEach(function(p){
    var owned=prof.redeemed.indexOf(p.id)>=0;
    var row=document.createElement("div"); row.className="prod";
    var ic=document.createElement("div"); ic.className="p-ic"; ic.style.background=p.tint+"22"; ic.textContent=p.icon;
    var info=document.createElement("div"); info.className="p-info";
    var nm=document.createElement("div"); nm.className="p-name"; nm.textContent=p.name;

function exchangePoints(n){
  var prof=getProfile(user);
  if(prof.coins<n*10){ toast("gay币不足"); return; }
  prof.coins-=n*10; prof.points+=n;
  saveProfile(user, prof); refreshProfileUI(); renderShop();
  toast("兑换成功 +"+n+" gay值");
}
$("ex1").addEventListener("click", function(){ exchangePoints(1); });
$("ex5").addEventListener("click", function(){ exchangePoints(5); });

function redeemProduct(p){
  var prof=getProfile(user);
  if(prof.points<p.cost){ toast("gay值不足"); return; }
  prof.points-=p.cost;
  prof.redeemed.push(p.id);
  if(p.kind==="title" && p.id==="racer-title"){
    if(prof.titles.indexOf("racer")<0) prof.titles.push("racer");
  }
  if(p.id==="double") prof.perks.doubleUntil=Date.now()+24*3600*1000;
  if(p.id==="nitro") prof.perks.nitro=true;
  if(p.id==="skin-rainbow") prof.perks.skinRainbow=true;
  saveProfile(user, prof);
  refreshProfileUI(); renderShop();
  toast("已兑换："+p.name);
}
$("shopBtn").addEventListener("click", function(){ renderShop(); $("shopModal").classList.remove("hidden"); });

/* ============ 宠物系统 ============ */
function renderPet(){
  var prof=getProfile(user);
  var pet=prof.pet;
  var need=petNeed(pet.level);
  var maxed=pet.level>=PET_MAX_LEVEL;
  $("petLv").textContent="Lv."+pet.level;
  $("petName").textContent=PET_NAME;
  var pct=maxed?100:Math.min(100,Math.round(pet.exp/need*100));
  $("expFill").style.width=pct+"%";
  $("expText").textContent=maxed?"已满级":pet.exp+" / "+need;
  var b=petBonus(pet.level);
  $("petBonus").innerHTML="当前加成：极速 <b>+"+b.speed+"%</b> · 加速 <b>+"+b.accel+"%</b> · 开局氮气 <b>"+b.nitro+"%</b>（卡丁车等游戏开局生效）";
  $("feedCoin").disabled=maxed||prof.coins<PET_FEED_COINS;
  $("feedPoint").disabled=maxed||prof.points<PET_FEED_POINTS;
}
function feedPet(kind){
  var prof=getProfile(user); var pet=prof.pet;
  if(pet.level>=PET_MAX_LEVEL){ toast("已经满级啦"); return; }
  if(kind==="coin"){
    if(prof.coins<PET_FEED_COINS){ toast("gay币不足"); return; }
    prof.coins-=PET_FEED_COINS; pet.exp+=PET_FEED_EXP_COIN;
  } else {
    if(prof.points<PET_FEED_POINTS){ toast("gay值不足"); return; }
    prof.points-=PET_FEED_POINTS; pet.exp+=PET_FEED_EXP_POINT;
  }
  var up=0;
  while(pet.level<PET_MAX_LEVEL && pet.exp>=petNeed(pet.level)){
    pet.exp-=petNeed(pet.level); pet.level++; up++;
  }
  if(pet.level>=PET_MAX_LEVEL) pet.exp=0;
  saveProfile(user, prof); refreshProfileUI(); renderPet();
  toast(up>0?("投喂成功，升到 Lv."+pet.level):"投喂成功，成长值 +"+(kind==="coin"?PET_FEED_EXP_COIN:PET_FEED_EXP_POINT));
}
$("petBtn").addEventListener("click", function(){ renderPet(); $("petModal").classList.remove("hidden"); });
$("feedCoin").addEventListener("click", function(){ feedPet("coin"); });
$("feedPoint").addEventListener("click", function(){ feedPet("point"); });

// 渲染游戏卡片
function renderGames(list){
  var box = $("games");
  box.innerHTML = "";
  if(!list.length){
    box.innerHTML = '<div class="empty">还没有游戏，往 games/ 文件夹添加 HTML 后即可显示</div>';
    return;
  }
  list.forEach(function(g){
    var card = document.createElement("div");
    card.className = "game-card";
    card.innerHTML =
      '<div class="game-thumb">' + thumbSVG(g) +
      '<div class="play">' + playSVG() + '</div></div>' +
      '<div class="game-info">' +
      '<div class="game-title">' + esc(g.title) + (g.tag?'<span class="tag">'+esc(g.tag)+'</span>':'') + '</div>' +
      '<div class="game-desc">' + esc(g.desc||"") + '</div></div>';
    card.addEventListener("click", function(){
      startSession(g);
      window.open(g.file + (g.file.indexOf("?")>=0?"&":"?") + "user=" + encodeURIComponent(user), "_self");
    });
    box.appendChild(card);
  });
}

function thumbSVG(g){
  return '<svg class="badge" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/><path fill="#070b0a" d="M12 3.2a8.8 8.8 0 1 1 0 17.6 8.8 8.8 0 0 1 0-17.6z"/><path fill="currentColor" d="M8 9l6-3-2 5 3 1-6 3 2-5z"/></svg>';
}
function playSVG(){
  return '<svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>';
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

// 加载游戏：先内嵌兜底，再拉取 games/games.json 和 GitHub 自动扫描
var CURRENT = DEFAULT_GAMES.slice();

function loadGames(){
  CURRENT = DEFAULT_GAMES.slice();
  renderGames(CURRENT);
  if(location.protocol === "file:") return;
  fetch("games/games.json", {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(data){
      var merged = mergeGames(data ? data.games : []);
      renderGames(merged);
      autoScanGitHub();
    })
    .catch(function(){ autoScanGitHub(); });
}

function mergeGames(extra){
  var seen = {};
  CURRENT.forEach(function(g){ seen[String(g.file||"").toLowerCase()]=1; seen[String(g.id||"").toLowerCase()]=1; });
  var merged = CURRENT.slice();
  (extra||[]).forEach(function(g){
    if(!g || !g.file) return;
    var k = String(g.file).toLowerCase();
    if(seen[k]) return;
    seen[k]=1;
    if(g.id) seen[String(g.id).toLowerCase()]=1;
    merged.push(g);
  });
  CURRENT = merged;
  return merged;
}

function autoScanGitHub(){
  if(!GH || !GH.owner || !GH.repo) return;
  var url = GH.api.replace(/\/$/,"") + "/repos/" + encodeURIComponent(GH.owner) + "/" + encodeURIComponent(GH.repo) + "/contents/games";
  fetch(url, {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(list){
      if(!Array.isArray(list)) return;
      var extra = list.filter(function(f){ return /\.html$/i.test(f.name) && f.name.toLowerCase()!=="index.html"; })
        .map(function(f){
          var name = f.name.replace(/\.html$/i,"");
          return { id:name, title:name, desc:"从 games/ 文件夹自动发现", file:"games/"+f.name, tag:"html" };
        });
      if(!extra.length) return;
      renderGames(mergeGames(extra));
    })
    .catch(function(){});
}
